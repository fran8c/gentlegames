  RUNTIME.settings.lang = RUNTIME.lang;
  sharedSet('lang', RUNTIME.lang);
  try { document.documentElement.lang = RUNTIME.lang; } catch (e) {}
}

/* A string in a given language (falls back to the other language, then the key) */
function tIn(lang, key) {
  const primary = lang === 'en' ? STRINGS_EN : STRINGS_ZH;
  const other = lang === 'en' ? STRINGS_ZH : STRINGS_EN;
  if (primary[key] !== undefined) return primary[key];
  if (other[key] !== undefined) return other[key];
  return key;
}

function t(key) { return tIn(currentLang(), key); }

function tf(key, vars) {
  let s = t(key);
  for (const k of Object.keys(vars || {})) s = s.split('{' + k + '}').join(String(vars[k]));
  return s;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

/* For speaking and labels: drop the [key word] brackets */
function plain(s) { return String(s).replace(/[\[\]]/g, ''); }

/* For screen captions: [key word] becomes an emphasised span */
function rich(s) {
  return escapeHtml(s).replace(/\[([^\]]+)\]/g, '<span class="key">$1</span>');
}

function fillI18nNodes() {
  const nodes = document.querySelectorAll('[data-i18n]');
  for (let i = 0; i < nodes.length; i++) {
    const key = nodes[i].getAttribute('data-i18n');
    if (key) nodes[i].textContent = plain(t(key));
  }
}

function updateLangButtons() {
  const lang = currentLang();
  const btns = document.querySelectorAll('[data-lang]');
  for (let i = 0; i < btns.length; i++) {
    btns[i].setAttribute('aria-pressed', btns[i].getAttribute('data-lang') === lang ? 'true' : 'false');
  }
}

function updateContrast() {
  try { document.body.classList.toggle('hc', !!RUNTIME.settings.contrast); document.documentElement.classList.toggle('hc', !!RUNTIME.settings.contrast); } catch (e) {}
}

/* Redraw every piece of text after a language change */
function applyLanguage() {
  try { document.documentElement.lang = currentLang(); } catch (e) {}
  fillI18nNodes();
  updateLangButtons();
  if (typeof updateMuteButtons === 'function') updateMuteButtons();

  const s = RUNTIME.screen;
  try {
    if (s === 'start') renderStart();
    else if (s === 'howto') renderHowTo(RUNTIME.howtoStep || 0, true);
    else if (s === 'care') renderCaregivers();
    else if (s === 'settings') renderSettings();
    else if (s === 'session') renderMoods();
    else if (s === 'rest') renderRestButtons();
    else if (s === 'language') renderLanguagePick();
    else if (s === 'game') {
      if (RUNTIME.jobId) { renderPlayArea(); promptCurrentStep(false); }
      else renderJobMenu(true);
    }
  } catch (e) { if (window.console) console.error(e); }
}

/* ---------------------------------------------------------------
   SPEECH. Every spoken line is also shown as a caption.
---------------------------------------------------------------- */
function isCantonese(v) {
  return /zh[-_](HK|MO)|yue|cantonese|粤|廣東|广东/i.test((v.lang || '') + ' ' + (v.name || ''));
}

function voiceCandidates(lang) {
  if (!window.speechSynthesis) return [];
  let voices = [];
  try { voices = window.speechSynthesis.getVoices() || []; } catch (e) { return []; }
  if (lang === 'en') {
    return voices.filter(function (v) { return /^en/i.test(v.lang || ''); });
  }
  const mandarin = voices.filter(function (v) {
    return /^(zh|cmn)/i.test(v.lang || '') && !isCantonese(v);
  });
  const mainland = mandarin.filter(function (v) { return /(zh|cmn)[-_](CN|Hans)/i.test(v.lang || ''); });
  return mainland.length ? mainland.concat(mandarin.filter(function (v) { return mainland.indexOf(v) < 0; })) : mandarin;
}

function pickVoice(lang) {
  const c = voiceCandidates(lang);
  const local = c.filter(function (v) { return v.localService === true; });
  if (local.length) return local[0];
  return RUNTIME.settings.onlineVoice ? (c[0] || null) : null;
}

/* 'ok', 'onlineOnly' (voices exist but the toggle is off), 'none', or 'unknown' */
function voiceStatus() {
  if (!window.speechSynthesis) return 'none';
  let all = [];
  try { all = window.speechSynthesis.getVoices() || []; } catch (e) { return 'none'; }
  if (!all.length) return 'unknown';
  if (pickVoice(currentLang())) return 'ok';
  return voiceCandidates(currentLang()).length ? 'onlineOnly' : 'none';
}


function showCaption(text) {
  RUNTIME.lastLine = text;            /* the 'hear again' button repeats this */
  const cap = document.getElementById('game-caption');
  if (cap) cap.innerHTML = rich(text);
  const rep = document.getElementById('caption-replay');
  if (rep) rep.hidden = !text;
}


function speak(text, opts) {
  opts = opts || {};
  if (!text) return;
  if (!opts.noCaption) showCaption(text);

  const finish = function () { if (typeof opts.onEnd === 'function') { try { opts.onEnd(); } catch (e) {} } };
  const vol = Number(RUNTIME.settings.speechVolume);
  if (!window.speechSynthesis || RUNTIME.settings.muteAll || !(vol > 0)) { setTimeout(finish, 0); return; }

  try { window.speechSynthesis.cancel(); } catch (e) {}

  /* Edge and Chrome load their voices a moment after the page opens.
     If none are ready yet, wait (up to 2 s) and then say the line. */
  let all = [];
  try { all = window.speechSynthesis.getVoices() || []; } catch (e) {}
  if (!all.length && !opts.waited) {
    const myTurn = (RUNTIME.speakTicket = (RUNTIME.speakTicket || 0) + 1);
    const go = function () {
      if (myTurn !== RUNTIME.speakTicket) return;      /* a newer line came along */
      RUNTIME.speakTicket++;
      speak(text, Object.assign({}, opts, { waited: true, noCaption: true }));
    };
    try { window.speechSynthesis.addEventListener('voiceschanged', go, { once: true }); } catch (e) {}
    setTimeout(go, 2000);
    return;
  }
  RUNTIME.speakTicket = (RUNTIME.speakTicket || 0) + 1;

  const voice = pickVoice(currentLang());
  if (!voice) { setTimeout(finish, 0); return; }   /* captions only */

  const u = new SpeechSynthesisUtterance(plain(text));
  u.lang = currentLang() === 'en' ? (voice.lang || 'en-GB') : 'zh-CN';
  u.voice = voice;
  u.rate = CONFIG.TIMING.SPEECH_RATE;
  u.volume = Math.min(1, vol);

  duckMusic(true);
  let finished = false;
  const done = function () {
    if (finished) return;
    finished = true;
    duckMusic(false);
    finish();
  };
  u.onend = done;
  u.onerror = done;
  /* safety net: some phones never report the end of speech, which would leave the music quiet */
  setTimeout(done, 2500 + plain(text).length * 260);
  try { window.speechSynthesis.speak(u); } catch (e) { done(); }
}

function stopSpeech() {
  try { window.speechSynthesis && window.speechSynthesis.cancel(); } catch (e) {}
  duckMusic(false);
}

/* ---------------------------------------------------------------
   MUSIC (Web Audio, from jianpu)
---------------------------------------------------------------- */
const NOTE_HZ = {
  C: 261.63, 'C#': 277.18, Db: 277.18, D: 293.66, 'D#': 311.13, Eb: 311.13,
  E: 329.63, F: 349.23, 'F#': 369.99, Gb: 369.99, G: 392.00, 'G#': 415.30,
  Ab: 415.30, A: 440.00, 'A#': 466.16, Bb: 466.16, B: 493.88
};
const MAJOR_SEMITONES = [0, 2, 4, 5, 7, 9, 11];

function parseRootNote(keyStr) {
  const m = /([A-G][#b]?)/.exec(String(keyStr || 'C'));
  return m ? m[1] : 'C';
}

function degreeToFreq(degree, octaveOffset, root) {
  if (!(degree >= 1 && degree <= 7)) return 0;
  const base = NOTE_HZ[root] || NOTE_HZ.C;
  return base * Math.pow(2, MAJOR_SEMITONES[degree - 1] / 12 + (octaveOffset || 0));
}

/* "5 -" holds; "6(half)" is half a beat; 1' is high, 5, is low; 0 is a rest */
function parseJianpu(src) {
  const tokens = (Array.isArray(src) ? src.join(' ') : String(src || '')).split(/\s+/);
  const out = [];
  for (const rawTok of tokens) {
    const raw = rawTok.trim();
    if (!raw || raw === '|') continue;
    if (raw === '-') { if (out.length) out[out.length - 1].beats += 1; continue; }
    let beats = 1, token = raw;
    if (/\(half\)$/i.test(token)) { beats = 0.5; token = token.replace(/\(half\)$/i, ''); }
    if (/^0$/.test(token)) { out.push({ rest: true, beats: beats }); continue; }
    const m = /^([1-7])(['.,]*)$/.exec(token);
    if (!m) continue;
    let oct = 0;
    for (const c of m[2]) oct += (c === "'") ? 1 : -1;
    out.push({ degree: parseInt(m[1], 10), octave: oct, beats: beats });
  }
  return out;
}

function audioInit() {
  if (RUNTIME.audioCtx) return;
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    RUNTIME.audioCtx = new Ctx();
    try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
  } catch (e) {}
}

function ensureAudio() {
  audioInit();
  const ctx = RUNTIME.audioCtx;
  if (ctx && ctx.state !== 'running') {
    try { const p = ctx.resume(); if (p && p.catch) p.catch(function () {}); } catch (e) {}
  }
}

function applyMusicVolume() {
  if (!RUNTIME.musicGain || !RUNTIME.audioCtx) return;
  let base = RUNTIME.settings.muteAll ? 0 : Math.max(0, Math.min(1, Number(RUNTIME.settings.musicVolume) || 0));
  if (RUNTIME.screen === 'game') base *= 0.6;      /* 'soft' during play, so the spoken prompts stay clear */
  const target = base * (RUNTIME.isDucked ? 0.35 : 1);
  try {
    const now = RUNTIME.audioCtx.currentTime;
    const g = RUNTIME.musicGain.gain;
    g.cancelScheduledValues(now);
    g.setValueAtTime(g.value, now);
    g.linearRampToValueAtTime(target, now + 0.25);
  } catch (e) {
    try { RUNTIME.musicGain.gain.value = target; } catch (_) {}
  }
}

function _stopMusicInternal() {
  if (RUNTIME.musicLoopTimer) { clearTimeout(RUNTIME.musicLoopTimer); RUNTIME.musicLoopTimer = null; }
  RUNTIME.currentMelody = null;
  RUNTIME.currentMelodyOpts = null;
  for (const n of RUNTIME.activeNotes) { try { n.stop(); } catch (e) {} }
  RUNTIME.activeNotes = [];
  if (RUNTIME.musicGain) {
    try { RUNTIME.musicGain.disconnect(); } catch (e) {}
    RUNTIME.musicGain = null;
  }
}

function stopMusic() {
  _stopMusicInternal();
  RUNTIME.isDucked = false;
}

/* Fade the music out gently, then stop it */
function fadeOutMusic(ms) {
  if (!RUNTIME.musicGain || !RUNTIME.audioCtx) { stopMusic(); return; }
  const name = RUNTIME.currentMelody;
  try {
    const now = RUNTIME.audioCtx.currentTime;
    const g = RUNTIME.musicGain.gain;
    g.cancelScheduledValues(now);
    g.setValueAtTime(g.value, now);
    g.linearRampToValueAtTime(0, now + ms / 1000);
  } catch (e) {}
  RUNTIME.fadingOut = true;
  setTimeout(function () {
    RUNTIME.fadingOut = false;
    if (RUNTIME.currentMelody === name) stopMusic();
  }, ms + 50);
}

/* One soft, warm note: a flute-like triangle with a sine an octave up */
function scheduleNote(ctx, out, freq, start, dur) {
  const env = ctx.createGain();
  env.connect(out);
  const attack = Math.min(0.08, dur * 0.3);
  const release = Math.min(0.18, dur * 0.4);
  env.gain.setValueAtTime(0, start);
  env.gain.linearRampToValueAtTime(0.2, start + attack);
  env.gain.setValueAtTime(0.2, start + Math.max(attack, dur - release));
  env.gain.linearRampToValueAtTime(0, start + dur);

  const parts = [['triangle', 1, 1], ['sine', 2, 0.18]];
  for (const p of parts) {
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.type = p[0];
    osc.frequency.value = freq * p[1];
    g.gain.value = p[2];
    osc.connect(g); g.connect(env);
    osc.start(start);
    osc.stop(start + dur + 0.05);
    RUNTIME.activeNotes.push(osc);
    osc.onended = function () {
      RUNTIME.activeNotes = RUNTIME.activeNotes.filter(function (o) { return o !== osc; });
    };
  }
}

function playMelody(name, opts) {
  opts = opts || {};
  const def = (typeof CONTENT_MELODIES !== 'undefined') ? CONTENT_MELODIES[name] : null;
  if (!def) return;
  ensureAudio();
  const ctx = RUNTIME.audioCtx;
  if (!ctx) return;

  if (!opts.continueLoop) _stopMusicInternal();
  if (!RUNTIME.musicGain) {
    RUNTIME.musicGain = ctx.createGain();
    RUNTIME.musicGain.gain.value = 0;
    RUNTIME.musicGain.connect(ctx.destination);
  }
  applyMusicVolume();

  const notes = parseJianpu(def.jianpu);
  if (!notes.length) return;
  const beatSec = 60 / (Number(def.tempo) || 85);
  const root = parseRootNote(def.key);
  const startTime = (opts.startAt && opts.startAt > ctx.currentTime) ? opts.startAt : ctx.currentTime + 0.15;
  let cursor = 0;

  for (const n of notes) {
    const dur = n.beats * beatSec;
    if (!n.rest) {
      const f = degreeToFreq(n.degree, n.octave, root);
      if (f > 0) scheduleNote(ctx, RUNTIME.musicGain, f, startTime + cursor, dur * 0.97);
    }
    cursor += dur;
  }

  RUNTIME.currentMelody = name;
  RUNTIME.currentMelodyOpts = opts;

  /* loop: schedule the next pass a little before this one ends, so there is no gap */
  if (RUNTIME.musicLoopTimer) clearTimeout(RUNTIME.musicLoopTimer);
  const nextAt = startTime + cursor + beatSec;      /* one soft beat of breath between loops */
  RUNTIME.musicLoopTimer = setTimeout(function () {
    if (RUNTIME.currentMelody === name) {
      playMelody(name, Object.assign({}, opts, { continueLoop: true, startAt: nextAt }));
    }
  }, Math.max(500, (nextAt - ctx.currentTime - 1) * 1000));
}

function duckMusic(on) {
  RUNTIME.isDucked = !!on;
  applyMusicVolume();
}

function muteAll() {
  settingSet('muteAll', true);
  stopSpeech();
}

function unmuteAll() {
  settingSet('muteAll', false);
  ensureAudio();
  if (typeof musicForScreen === 'function') musicForScreen();
}

/* A soft wooden 'tock'. The SAME sound for every move, right spot or not. */
function playSoftClick() {
  if (RUNTIME.settings.muteAll) return;
  ensureAudio();
  const ctx = RUNTIME.audioCtx;
  if (!ctx) return;
  const now = ctx.currentTime;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(420, now);
  osc.frequency.exponentialRampToValueAtTime(300, now + 0.14);
  gain.gain.setValueAtTime(0, now);
  gain.gain.linearRampToValueAtTime(0.16, now + 0.015);
  gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
  osc.connect(gain); gain.connect(ctx.destination);
  osc.start(now); osc.stop(now + 0.2);
}

/* ---------------------------------------------------------------
   SCREEN WAKE LOCK, and pausing when the phone is locked
---------------------------------------------------------------- */
function requestWakeLock() {
  try {
    if (!('wakeLock' in navigator) || RUNTIME.wakeLock || document.hidden) return;
    navigator.wakeLock.request('screen').then(function (lock) {
      RUNTIME.wakeLock = lock;
      lock.addEventListener('release', function () { RUNTIME.wakeLock = null; });
    }).catch(function () {});
  } catch (e) {}
}

function releaseWakeLock() {
  try { if (RUNTIME.wakeLock) { RUNTIME.wakeLock.release(); RUNTIME.wakeLock = null; } } catch (e) {}
}

function pauseEverything() {
  if (RUNTIME.currentMelody) RUNTIME.pausedMelody = RUNTIME.currentMelody;
  _stopMusicInternal();
  stopSpeech();
  releaseWakeLock();
  if (typeof pauseGameTimers === 'function') pauseGameTimers();
}

function resumeEverything() {
  ensureAudio();
  requestWakeLock();
  if (RUNTIME.pausedMelody) {
    const name = RUNTIME.pausedMelody;
    RUNTIME.pausedMelody = null;
    setTimeout(function () { if (!RUNTIME.currentMelody) playMelody(name); }, 300);
  }
  if (typeof resumeGameTimers === 'function') resumeGameTimers();
}

document.addEventListener('visibilitychange', function () {
  try { if (document.hidden) pauseEverything(); else resumeEverything(); } catch (e) {}
});

(function setupVoicesListener() {
  try {
    if (!window.speechSynthesis) return;
    window.speechSynthesis.onvoiceschanged = function () { window.speechSynthesis.getVoices(); };
    window.speechSynthesis.getVoices();
  } catch (e) {}
})();

/* ---------------------------------------------------------------
   HOME SCREEN FILES, built inside this one file.
   The icon pictures live in CONTENT_ILLUSTRATIONS (HOME_ICON_192/512).
---------------------------------------------------------------- */
function installHomeScreenFiles() {
  try {
    const icon192 = CONTENT_ILLUSTRATIONS.HOME_ICON_192;
    const icon512 = CONTENT_ILLUSTRATIONS.HOME_ICON_512;
    const here = location.href.split('#')[0].split('?')[0];

    /* iPhone uses this picture for the Home Screen icon */
    let apple = document.querySelector('link[rel="apple-touch-icon"]');
    if (!apple) { apple = document.createElement('link'); apple.rel = 'apple-touch-icon'; document.head.appendChild(apple); }
    apple.href = icon192;
    let fav = document.querySelector('link[rel="icon"]');
    if (!fav) { fav = document.createElement('link'); fav.rel = 'icon'; document.head.appendChild(fav); }
    fav.href = icon192;

    /* Android reads the web manifest. Only works when served over https. */
    if (!/^https?:/.test(location.protocol)) return;
    const manifest = {
      id: here,
      name: CONFIG.GAME_NAME.en,
      short_name: CONFIG.GAME_NAME.en,
      description: 'Calm household jobs that can always be finished. Settings and records stay on this phone.',
      lang: 'en',
      dir: 'ltr',
      start_url: here,
      scope: here,
      display: 'standalone',
      orientation: 'portrait',
      background_color: '#F1F7E7',
      theme_color: '#3F6B2B',
      icons: [
        { src: icon192, sizes: '192x192', type: 'image/png', purpose: 'any' },
        { src: icon512, sizes: '512x512', type: 'image/png', purpose: 'any' },
        { src: icon512, sizes: '512x512', type: 'image/png', purpose: 'maskable' }
      ],
      categories: ['health', 'lifestyle'],
      prefer_related_applications: false
    };
    let link = document.querySelector('link[rel="manifest"]');
    if (!link) { link = document.createElement('link'); link.rel = 'manifest'; document.head.appendChild(link); }
    link.href = 'data:application/manifest+json;charset=utf-8,' + encodeURIComponent(JSON.stringify(manifest));
  } catch (e) {}
}

/* ==== SECTION: SCREENS ==== */

function bootGame() {
  loadSettings();
  KIT.init({
    lang: currentLang,
    getState: function (k, d) { return storeGet(gameKey(k), d); },
    setState: function (k, v) { storeSet(gameKey(k), v); }
  });
  installHomeScreenFiles();
  bindAllButtons();
  bindGlobalGestures();
  fillI18nNodes();
  updateMuteButtons();

  const storedLang = sharedGet('lang', null);
  if (storedLang === null || storedLang === undefined || storedLang === '') {
    renderLanguagePick();
    showScreen('language');           /* first launch only */
  } else {
    requestPersistence();
    showScreen('start');
    renderStart();
  }
}

function hideAllScreens() {
  const all = document.querySelectorAll('.screen');
  for (let i = 0; i < all.length; i++) all[i].hidden = true;
}

function showScreen(name) {
  const leaving = RUNTIME.screen;
  hideAllScreens();
  const el = document.getElementById('screen-' + name);
  if (el) { el.hidden = false; el.scrollTop = 0; }
  const sc = el && el.querySelector('.scroll');
  if (sc) sc.scrollTop = 0;
  RUNTIME.screen = name;
  const mb = document.getElementById('muteBtn');
  if (mb) mb.hidden = (name === 'game' || name === 'settings' || name === 'care');

  /* Leaving the game: stop every game timer so nothing happens off-screen */
  if (leaving === 'game' && name !== 'game') pauseGameTimers();
  if (name === 'game') resumeSessionTimer();

  musicForScreen();
}

/* Theme on the start and session-end screens; in game only if the caregiver chose Soft */
function musicForScreen() {
  const s = RUNTIME.screen;
  const wantTheme = s === 'start' || s === 'session' || s === 'language' ||
                    (s === 'game' && RUNTIME.settings.bgMusic === 'soft');
  if (wantTheme) { _maybePlayTheme(); applyMusicVolume(); }   /* softer during play */
  else if (!RUNTIME.fadingOut) stopMusic();
}

function _maybePlayTheme() {
  if (typeof CONTENT_MELODIES === 'undefined' || !CONTENT_MELODIES.theme) return;
  if (RUNTIME.settings.muteAll) return;
  if (!RUNTIME.audioCtx || RUNTIME.audioCtx.state !== 'running') return;   /* waits for the first tap */
  if (RUNTIME.currentMelody === 'theme' && !RUNTIME.fadingOut) return;
  RUNTIME.fadingOut = false;
  playMelody('theme');
}

function goToStart() {
  RUNTIME.jobId = null;
  stopSessionTimer();
  stopSpeech();
  showScreen('start');
  renderStart();
}

function renderStart() {
  renderIllustration(document.getElementById('start-art'), 'start');
  const other = currentLang() === 'en' ? 'zh-CN' : 'en';
  const title = document.getElementById('start-title');
  if (title) title.innerHTML = escapeHtml(CONFIG.GAME_NAME[currentLang()]) + '<small lang="' + other + '">' + escapeHtml(CONFIG.GAME_NAME[other]) + '</small>';
  const lang = document.getElementById('start-lang');
  if (lang) lang.innerHTML = KIT.langSegHTML(currentLang());
  const play = document.getElementById('btn-play');
  if (play) play.innerHTML = '<span class="dgs-btn__disc">' + KIT.icon('play') + '</span><span>' + escapeHtml(KIT.s('btn_play')) + '</span>';
  const how = document.getElementById('btn-howto');
  if (how) how.innerHTML = KIT.btn('help', KIT.s('btn_howto'));
  const care = document.getElementById('btn-care');
  if (care) care.innerHTML = KIT.btn('care', KIT.s('btn_care'));
  updateMuteButtons();
}

/* Draws an inline SVG, or an embedded picture (data: URI) if one has been added */
function renderIllustration(el, key) {
  if (!el) return;
  const art = (typeof CONTENT_ILLUSTRATIONS !== 'undefined') ? CONTENT_ILLUSTRATIONS[key] : null;
  if (!art) { el.innerHTML = ''; return; }
  if (typeof art === 'string' && art.indexOf('data:') === 0) {
    el.innerHTML = '<img src="' + art + '" alt="" style="width:100%;height:100%;object-fit:contain" draggable="false">';
  } else {
    /* the same picture can be on the page more than once: give its ids a unique ending */
    RUNTIME.artCount = (RUNTIME.artCount || 0) + 1;
    el.innerHTML = art.indexOf('lc-') >= 0 ? art.replace(/lc-([a-z0-9-]+)/g, 'lc-$1-' + RUNTIME.artCount) : art;
  }
}

/* ---------------------------------------------------------------
   BUTTONS
---------------------------------------------------------------- */
function bindAllButtons() {
  document.addEventListener('click', function (e) {
    /* first-launch language choice: always moves on to the start screen */
    const pick = e.target.closest('[data-kit-pick]');
    if (pick) {
      setLang(pick.getAttribute('data-kit-pick'));
      requestPersistence();
      fillI18nNodes();
      showScreen('start');
      renderStart();
      return;
    }
    /* the language switch on the start screen */
    const sw = e.target.closest('[data-kit-lang]');
    if (sw) {
      const lang = sw.getAttribute('data-kit-lang');
      if (lang !== currentLang()) { setLang(lang); applyLanguage(); }
      return;
    }
    /* sound buttons */
    if (e.target.closest('.mutebtn')) {
      if (RUNTIME.settings.muteAll) unmuteAll(); else muteAll();
      updateMuteButtons();
    }
  });

  bindStaticButton('btn-play', function () {
    ensureAudio();
    startSession();
    showScreen('game');
    renderJobMenu();

/* ---------------------------------------------------------------
   HOW TO PLAY (the in-game '?' pauses the game and comes back to it)
---------------------------------------------------------------- */
function openHowTo(returnTo) {
  RUNTIME.howtoReturnTo = returnTo || 'start';
  showScreen('howto');
  if (returnTo === 'game') pauseSessionTimer();
  renderHowTo(0);
}

function closeHowTo() {
  stopSpeech();
  if (RUNTIME.howtoReturnTo === 'game') {
    showScreen('game');
    if (RUNTIME.jobId) { renderPlayArea(); promptCurrentStep(); }
    else renderJobMenu();
  } else {
    showScreen('start');
    renderStart();
  }
}

function advanceHowTo() {
  const next = (RUNTIME.howtoStep || 0) + 1;
  if (next >= 4) {
    /* "Let's play": from the start screen this starts the game */
    if (RUNTIME.howtoReturnTo === 'start') {
      stopSpeech();
      ensureAudio();
      startSession();
      showScreen('game');
      renderJobMenu();
    } else {
      closeHowTo();
    }
  } else {
    renderHowTo(next);
  }
}

function renderHowTo(step, quiet) {
  RUNTIME.howtoStep = step;
  renderIllustration(document.getElementById('howto-art'), 'howto-' + (step + 1));
  const key = 'howto.step' + (step + 1);
  const txt = document.getElementById('howto-text');
  if (txt) txt.innerHTML = rich(t(key));

  const last = step === 3;
  const back = document.getElementById('howto-back');
  if (back) back.innerHTML = KIT.btn('back', KIT.s('btn_back'));
  const nextBtn = document.getElementById('howto-next');
  if (nextBtn) nextBtn.innerHTML = last ? KIT.btn('play', KIT.s('btn_letsplay')) : KIT.btn('next', KIT.s('btn_next'));
  const skip = document.getElementById('howto-skip');
  if (skip) {
    skip.innerHTML = '<span>' + escapeHtml(KIT.s('btn_skip_howto')) + '</span>';
    skip.hidden = last || RUNTIME.howtoReturnTo === 'game';
  }
  const dots = document.getElementById('howto-dots');
  if (dots) {
    let h = '';
    for (let i = 0; i < 4; i++) h += '<i class="' + (i === step ? 'on' : '') + '"></i>';
    dots.innerHTML = h;
  }
  if (!quiet) speak(t(key), { noCaption: true });
}

function isStandalone() {
  try {
    return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
  } catch (e) { return false; }
}

function formatDate(d) {
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function formatTime(d) {
  return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
}

function jobName(jobId) {

/* ---------------------------------------------------------------
   SESSION: gentle end after the caregiver's time
---------------------------------------------------------------- */
function effectiveSessionMs() {
  const rule = CONFIG.LEVEL_RULES[RUNTIME.settings.level] || CONFIG.LEVEL_RULES.standard;
  const mins = Math.max(4, Math.round((Number(RUNTIME.settings.sessionMinutes) || 12) * rule.sessionScale));
  return mins * 60 * 1000;
}

function startSession() {
  stopSessionTimer();          /* never leave an old timer running */
  RUNTIME.sessionId = 's' + Date.now();
  RUNTIME.sessionStart = Date.now();
  RUNTIME.sessionStats = { jobsChosen: [], jobsFinished: [], longestPause: null, logged: false };
  RUNTIME.difficultyShift = 0;
  RUNTIME.cleanStreak = 0;
  RUNTIME.sessionRemainingMs = effectiveSessionMs();
  requestWakeLock();
}

/* The session timer only runs while the game screen is showing */
function resumeSessionTimer() {
  if (!RUNTIME.sessionId || RUNTIME.sessionTimerId || !(RUNTIME.sessionRemainingMs > 0)) return;
  RUNTIME.sessionTimerStartedAt = Date.now();
  RUNTIME.sessionTimerId = setTimeout(function () {
    RUNTIME.sessionTimerId = null;
    RUNTIME.sessionRemainingMs = 0;
    endSession();
  }, RUNTIME.sessionRemainingMs);
}

function pauseSessionTimer() {
  if (!RUNTIME.sessionTimerId) return;
  clearTimeout(RUNTIME.sessionTimerId);
  RUNTIME.sessionTimerId = null;
  RUNTIME.sessionRemainingMs = Math.max(1000, RUNTIME.sessionRemainingMs - (Date.now() - RUNTIME.sessionTimerStartedAt));
}

function stopSessionTimer() {
  if (RUNTIME.sessionTimerId) clearTimeout(RUNTIME.sessionTimerId);
  RUNTIME.sessionTimerId = null;
  RUNTIME.sessionRemainingMs = 0;
}

/* Write this session into the caregiver's list (updated as it goes) */
function saveSession(extra) {
  if (!RUNTIME.sessionId) return;
  const st = RUNTIME.sessionStats || {};
  const hasSomething = (st.jobsChosen && st.jobsChosen.length) || (extra && (extra.mood || extra.reachedEnd));
  if (!hasSomething && !findSessionLog(RUNTIME.sessionId)) return;   /* nothing happened: no entry */
  upsertSessionLog(Object.assign({
    id: RUNTIME.sessionId,
    ts: RUNTIME.sessionStart,
    minutes: Math.max(0, Math.round((Date.now() - RUNTIME.sessionStart) / 60000)),
    jobsChosen: st.jobsChosen || [],
    jobsFinished: st.jobsFinished || [],
    longestPause: st.longestPause || null
  }, extra || {}));
}

function endSession() {
  stopSessionTimer();
  stopSpeech();
  saveSession({ endedEarly: false, reachedEnd: true });
  showScreen('session');
  renderSessionEnd();
}

/* Block pinch zoom and long-press menus. (Double-tap zoom is already
   off through touch-action, so quick second taps still work.) */
function bindGlobalGestures() {
  document.addEventListener('gesturestart', function (e) { if (e.cancelable) e.preventDefault(); });
  document.addEventListener('touchmove', function (e) {
    if (e.touches && e.touches.length > 1 && e.cancelable) e.preventDefault();
  }, { passive: false });
  document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  document.addEventListener('dragstart', function (e) { e.preventDefault(); });

  /* The theme starts softly after the first tap anywhere (browsers block autoplay) */
  const unlock = function () {
    ensureAudio();
    setTimeout(musicForScreen, 120);
  };
  document.addEventListener('pointerdown', unlock, { passive: true, capture: true });
  /* some iPhones only allow sound to start when the finger lifts */
  document.addEventListener('touchend', unlock, { passive: true, capture: true });
  document.addEventListener('click', unlock, { passive: true, capture: true });

  window.addEventListener('resize', function () { if (typeof fitStage === 'function') fitStage(); });
}

function onRestoreFile() {
  const fileInput = document.getElementById('in-restore');
  const file = fileInput.files && fileInput.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function () {
    fileInput.value = '';
    const preview = readBackup(String(reader.result || ''));
    if (!preview.ok) {
      KIT.dialog({ title: preview.error === 'otherGame' ? t('restore.otherGame') : KIT.s('restore_bad') });
      return;
    }
    const d = preview.summary.exportedAt ? new Date(preview.summary.exportedAt) : null;
    const dateStr = d && !isNaN(d) ? formatDate(d) + ' ' + formatTime(d) : '—';
    KIT.dialog({
      title: KIT.s('restore_title'),
      html: KIT.ul([tf('restore.date', { date: dateStr }), tf('restore.count', { n: preview.summary.logCount })]) + KIT.p(KIT.s('restore_warning')),
      buttons: [
        { label: KIT.s('btn_cancel'), primary: true },
        { label: KIT.s('btn_restore_yes'), onClick: function () {
          if (commitBackup(preview.data)) {
            applyLanguage();
            updateMuteButtons();
            KIT.toast(KIT.s('restore_done'));
          } else {
            KIT.dialog({ title: t('restore.failed') });
          }
        } }
      ]
    });
  };
  reader.readAsText(file);
}

/* ==== END SECTION: SCREENS ==== */

/* ==== SECTION: GAME ==== */

/*
  How a job works
  - The tray holds the items still to place. Each item belongs on a spot.
  - In most jobs, any item can go to its own spot, in any order.
    Make the tea is the exception: one step at a time, one item in the tray.
  - Dropping anywhere else floats the item back with the same soft sound.
    There is no wrong answer and nothing signals one.
  - Help escalates: the item gently pulses, then its spot glows, then the
    game moves the item together with the player.
*/

function getJob(jobId) {
  return CONFIG.JOBS.find(function (j) { return j.id === jobId; }) || null;
}

function stepsForJob(job) {
  if (job.variants) return job.variants[RUNTIME.settings.tableStyle] || job.variants.chinese;
  return job.steps;
}

function levelRule() {
  return CONFIG.LEVEL_RULES[RUNTIME.settings.level] || CONFIG.LEVEL_RULES.standard;
}

/* The level's rules, nudged by self-adjusting difficulty (-1, 0 or +1) */
function getDifficulty() {
  const base = levelRule();
  const d = Object.assign({}, base);
  const shift = RUNTIME.difficultyShift || 0;
  if (shift > 0) d.glowAlways = false;                     /* spot glows only as a hint */
  if (shift !== 0) {
    d.hintDelays = base.hintDelays.map(function (x) {
      return Math.max(3000, Math.round(x * (shift > 0 ? 1.3 : 0.7)));
    });
  }
  return d;
}

function adjustDifficulty(neededHelp) {
  if (neededHelp) {
    RUNTIME.difficultyShift = Math.max(-1, (RUNTIME.difficultyShift || 0) - 1);
    RUNTIME.cleanStreak = 0;
  } else {
    RUNTIME.cleanStreak = (RUNTIME.cleanStreak || 0) + 1;
    if (RUNTIME.cleanStreak >= 4) {
      RUNTIME.difficultyShift = Math.min(1, (RUNTIME.difficultyShift || 0) + 1);
      RUNTIME.cleanStreak = 0;
    }
  }
}

/* How many steps this job gets, inside the level's range */
function stepCountFor(job) {
  const all = stepsForJob(job).length;
  const rule = levelRule();
  let n = Math.min(all, rule.maxSteps);
  if (RUNTIME.difficultyShift < 0) n = Math.max(Math.min(rule.minSteps, all), n - 1);
  return n;
}

/* The jobs the caregiver ticked, in CONFIG order, up to what the level shows */
function menuJobs() {
  const shown = RUNTIME.settings.jobsShown || CONFIG.DEFAULTS.jobsShown;
  return CONFIG.JOBS.filter(function (j) { return shown.indexOf(j.id) >= 0; })
    .slice(0, levelRule().jobsVisible);
}

/* ---- Which steps are left, and which item/spot pairs are allowed now ---- */
function remainingSteps() {
  const out = [];
  for (let i = 0; i < RUNTIME.jobSteps.length; i++) if (RUNTIME.doneSteps.indexOf(i) < 0) out.push(i);
  return out;
}

function currentJob() { return getJob(RUNTIME.jobId); }

function isOrdered() {
  const job = currentJob();
  return !!(job && job.ordered);
}

function onlyOneAtATime() {
  return isOrdered() || RUNTIME.settings.level === 'simplest';
}

/* The step the game suggests next (named in the spoken prompt) */
function suggestedStep() {
  const r = remainingSteps();
  return r.length ? r[0] : -1;
}

/* Steps that may be done right now */
function openSteps() {
  const r = remainingSteps();
  return onlyOneAtATime() ? r.slice(0, 1) : r;
}

function slotsAccepting(itemId) {
  return openSteps().filter(function (i) { return RUNTIME.jobSteps[i].item === itemId; })
    .map(function (i) { return RUNTIME.jobSteps[i].slot; });
}

function stepFor(itemId, slotId) {
  const open = openSteps();
  for (const i of open) {
    const s = RUNTIME.jobSteps[i];
    if (s.item === itemId && s.slot === slotId) return i;
  }
  return -1;
}

/* ---------------------------------------------------------------
   JOB MENU
---------------------------------------------------------------- */
function renderJobMenu(quiet) {
  const menuEl = document.getElementById('job-menu');
  const playEl = document.getElementById('play-area');
  menuEl.hidden = false;
  playEl.hidden = true;
  playEl.parentNode.classList.remove('playing');
  setMenuButton(false);

  const jobs = menuJobs();
  menuEl.className = 'jobgrid' + (jobs.length <= 2 ? ' two' : '') + (jobs.length > 4 ? ' many' : '') + (jobs.length > 6 ? ' lots' : '');
  menuEl.innerHTML = '';
  for (const job of jobs) {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'jobtile';
    btn.setAttribute('data-job', job.id);
    const art = document.createElement('div');
    art.className = 'tileart';
    renderIllustration(art, job.art);
    btn.appendChild(art);
    const label = document.createElement('span');
    label.textContent = jobName(job.id);
    btn.appendChild(label);
    btn.addEventListener('click', function () { startJob(job.id); });
    menuEl.appendChild(btn);
  }
  const line = RUNTIME.justFinished ? t('game.another') : t('game.chooseJob');
  if (quiet) showCaption(line); else speak(line);
}

/* The top-left button: 'Other jobs' inside a job, 'Home' on the job pictures */
function setMenuButton(inJob) {
  const btn = document.getElementById('game-menu');
  if (!btn) return;
  btn.innerHTML = KIT.btn(inJob ? 'grid' : 'home', t(inJob ? 'game.jobs' : 'game.home'));
}

/* ---------------------------------------------------------------
   START / LEAVE A JOB
---------------------------------------------------------------- */
function startJob(jobId) {
  const job = getJob(jobId);
  if (!job) return;
  leaveJob();
  RUNTIME.justFinished = false;
  RUNTIME.jobId = jobId;
  RUNTIME.jobSteps = stepsForJob(job).slice(0, stepCountFor(job));
  RUNTIME.doneSteps = [];

  /* Resume a half-finished job, if it still fits the current level and table setting */
  const saved = storeGet(gameKey('gameState'), null);
  if (saved && saved.jobId === jobId && saved.tableStyle === RUNTIME.settings.tableStyle &&
      Array.isArray(saved.done)) {
    const valid = saved.done.filter(function (i) { return i >= 0 && i < RUNTIME.jobSteps.length; });
    if (valid.length > 0 && valid.length < RUNTIME.jobSteps.length) RUNTIME.doneSteps = valid;
  }

  const st = RUNTIME.sessionStats;
  if (st) st.jobsChosen.push(jobId);
  saveSession();

  document.getElementById('job-menu').hidden = true;
  document.getElementById('play-area').hidden = false;
  setMenuButton(true);
  RUNTIME.screenShownAt = Date.now();
  renderPlayArea();
  saveGameState();
  promptCurrentStep(false, true);
}

/* Stop everything belonging to the job on screen */
function leaveJob() {
  clearJobTimers();      /* the session timer keeps running */
  if (RUNTIME.rewardTimerId) { clearTimeout(RUNTIME.rewardTimerId); RUNTIME.rewardTimerId = null; }
  const reward = document.getElementById('reward');
  if (reward) reward.hidden = true;
  const stage = document.getElementById('stage');
  if (stage) stage.classList.remove('is-done');
  RUNTIME.jobId = null;
  RUNTIME.selectedItem = null;
  RUNTIME.dragging = false;
  document.querySelectorAll('.dragclone').forEach(function (c) { c.remove(); });
}

/* ---------------------------------------------------------------
   DRAWING THE STAGE AND TRAY
---------------------------------------------------------------- */
function renderPlayArea() {
  document.getElementById('job-menu').hidden = true;
  document.getElementById('play-area').hidden = false;
  document.getElementById('play-area').parentNode.classList.add('playing');
  setMenuButton(true);
  renderStage();
  renderTray();
  fitStage();
  requestAnimationFrame(fitStage);
}

/* Keep the stage at 3:4 so the spots always sit on the picture */
function fitStage() {
  const wrap = document.getElementById('stagewrap');
  const stage = document.getElementById('stage');
  const play = document.getElementById('play-area');
  if (!wrap || !stage || !play || play.hidden) return;
  const r = wrap.getBoundingClientRect();
  if (!r.width || !r.height) return;
  const w = Math.floor(Math.min(r.width, r.height * 0.75));
  stage.style.width = w + 'px';
  stage.style.height = Math.floor(w / 0.75) + 'px';

  /* tray items: as large as the level asks, but always fitting on one row */
  const tray = document.getElementById('tray');
  const n = Math.max(1, tray ? tray.children.length : 1);
  let want = (window.innerWidth >= 700 ? 104 : 84) * levelRule().itemScale;
  /* phone held sideways: keep every item on one row */
  if (window.matchMedia && window.matchMedia('(orientation: landscape) and (max-height:560px)').matches) want = Math.min(want, 64);
  const trayW = tray ? tray.getBoundingClientRect().width : play.getBoundingClientRect().width;
  const gap = parseFloat(getComputedStyle(tray || play).columnGap) || 12;
  const fit = (trayW - 16 - (n - 1) * gap) / n;
  play.style.setProperty('--item', Math.round(Math.max(64, Math.min(want, fit))) + 'px');
}

/* Work out what each spot shows from the finished steps */
function slotStates() {
  const fill = {}, cleared = {}, layers = {};
  const doneInOrder = RUNTIME.doneSteps.slice().sort(function (a, b) { return a - b; });
  for (const i of doneInOrder) {
    const s = RUNTIME.jobSteps[i];
    fill[s.slot] = s.fill || ('item-' + s.item);
    (layers[s.slot] = layers[s.slot] || []).push(fill[s.slot]);   /* a basket keeps every item */
    delete cleared[s.slot];
    if (s.clears) { delete fill[s.clears]; cleared[s.clears] = true; }
  }
  return { fill: fill, cleared: cleared, layers: layers };
}

function renderStage() {
  const stage = document.getElementById('stage');
  const slotsEl = document.getElementById('stage-slots');
  const job = currentJob();
  if (!job) { slotsEl.innerHTML = ''; return; }

  let bg = stage.querySelector('.scene-bg');
  if (!bg) { bg = document.createElement('div'); bg.className = 'scene-bg'; stage.insertBefore(bg, slotsEl); }
  renderIllustration(bg, 'scene-' + job.id);

  slotsEl.innerHTML = '';
  const states = slotStates();
  const used = {};
  RUNTIME.jobSteps.forEach(function (s) { used[s.slot] = true; });
  const open = openSteps().map(function (i) { return RUNTIME.jobSteps[i].slot; });
  const pending = {};
  remainingSteps().forEach(function (i) { pending[RUNTIME.jobSteps[i].slot] = true; });
  /* which item lands as itself in each spot (those get a faint shape of the item) */
  const shapeFor = {};
  RUNTIME.jobSteps.forEach(function (s, i) {
    if (!s.fill && RUNTIME.doneSteps.indexOf(i) < 0) shapeFor[s.slot] = s.item;
  });

  for (const slotId of Object.keys(job.slots)) {
    if (!used[slotId] || states.cleared[slotId]) continue;
    const slot = job.slots[slotId];
    const multi = !!slot.multi;
    const layers = multi ? (states.layers[slotId] || []) : [];
    /* a basket is 'filled' only when everything for it is in */
    const filled = multi ? (!pending[slotId] && layers.length > 0) : states.fill[slotId];
    /* Simplest shows only the spot in use, plus the finished ones */
    if (RUNTIME.settings.level === 'simplest' && !filled && !layers.length && open.indexOf(slotId) < 0) continue;

    const el = document.createElement('div');
    el.className = 'slot';
    el.setAttribute('data-slot', slotId);
    el.style.left = slot.x + '%';
    el.style.top = slot.y + '%';
    el.style.width = slot.w + '%';

    if (shapeFor[slotId] && !filled && !slot.base && !multi) {
      const shape = document.createElement('div');
      shape.className = 'shape';
      renderIllustration(shape, 'item-' + shapeFor[slotId]);
      el.appendChild(shape);
      el.classList.add('has-shape');
    }
    if (slot.base && !filled) {
      const base = document.createElement('div');
      base.className = 'base';
      renderIllustration(base, slot.base);
      el.appendChild(base);
    }
    if (multi) {
      layers.forEach(function (art, j) {
        const pos = slot.multi[j % slot.multi.length];
        const f = document.createElement('div');
        f.className = 'fill layer';
        f.style.left = pos[0] + '%';
        f.style.top = pos[1] + '%';
        renderIllustration(f, art);
        el.appendChild(f);
      });
      if (filled) el.classList.add('is-filled');
      else { const ring = document.createElement('div'); ring.className = 'ring'; el.insertBefore(ring, el.firstChild); }
    } else if (filled) {
      el.classList.add('is-filled');
      const f = document.createElement('div');
      f.className = 'fill';
      renderIllustration(f, filled);
      el.appendChild(f);
    } else {
      const ring = document.createElement('div');
      ring.className = 'ring';
      el.appendChild(ring);
    }
    slotsEl.appendChild(el);
  }
  updateGlow();
}

/* Which spots glow: the selected item's spots, or the suggested next spot */
function updateGlow(forceSlots) {
  const all = document.querySelectorAll('.slot');
  all.forEach(function (s) { s.classList.remove('is-glow'); });
  let targets = forceSlots || [];
  if (!forceSlots && getDifficulty().glowAlways) {
    if (RUNTIME.selectedItem) targets = slotsAccepting(RUNTIME.selectedItem);
    else {
      const i = suggestedStep();
      if (i >= 0) targets = [RUNTIME.jobSteps[i].slot];
    }
  }
  targets.forEach(function (id) {
    const el = document.querySelector('.slot[data-slot="' + id + '"]');
    if (el && !el.classList.contains('is-filled')) el.classList.add('is-glow');
  });
}

function renderTray() {
  const tray = document.getElementById('tray');
  tray.innerHTML = '';
  tray.className = 'tray ' + (RUNTIME.settings.handedness === 'left' ? 'left' : 'right');
  if (!currentJob()) return;

  const items = [];
  for (const i of openSteps()) {
    const id = RUNTIME.jobSteps[i].item;
    if (items.indexOf(id) < 0) items.push(id);
  }
  for (const itemId of items) {
    const el = document.createElement('div');
    el.className = 'item' + (RUNTIME.selectedItem === itemId ? ' is-selected' : '');
    el.setAttribute('data-item', itemId);
    el.setAttribute('role', 'button');
    el.setAttribute('aria-label', t('item.' + itemId));
    renderIllustration(el, 'item-' + itemId);
    el.addEventListener('pointerdown', onItemPointerDown);
    /* keyboard and switch users: Enter or Space picks the item up, then Tab to a spot */
    el.tabIndex = 0;
    el.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); selectItem(itemId); }
    });
    tray.appendChild(el);
  }
}

/* ---------------------------------------------------------------
   SPOKEN PROMPTS (key word emphasised on screen)
---------------------------------------------------------------- */
function promptCurrentStep(withGood, first) {
  const i = suggestedStep();
  if (i < 0) return;
  const step = RUNTIME.jobSteps[i];
  const joiner = currentLang() === 'en' ? ' ' : '';
  const line = (withGood ? t('common.good') + joiner : '') + t(step.say);
  speak(line);
  RUNTIME.stepPromptAt = Date.now();
  RUNTIME.hintUsedThisStep = false;
  if (first) RUNTIME.screenShownAt = Date.now();
  scheduleHints();
  armIdle();
}

/* ---------------------------------------------------------------
   TOUCH: drag and drop, or tap the item then tap its spot
---------------------------------------------------------------- */
function onItemPointerDown(ev) {
  const itemEl = ev.currentTarget;
  if (!RUNTIME.jobId || !itemEl) return;
  ev.preventDefault();
  const itemId = itemEl.getAttribute('data-item');
  const startX = ev.clientX, startY = ev.clientY;
  let moved = false, clone = null;
  try { itemEl.setPointerCapture(ev.pointerId); } catch (e) {}
  ghostHide();
  scheduleHints();          /* they are trying: give them more time */

  function onMove(e) {
    if (!moved && Math.hypot(e.clientX - startX, e.clientY - startY) > 10) {
      moved = true;
      RUNTIME.dragging = true;
      clone = document.createElement('div');
      clone.className = 'dragclone';
      clone.style.setProperty('--item', itemEl.offsetWidth + 'px');
      clone.innerHTML = itemEl.innerHTML;
      document.body.appendChild(clone);
      itemEl.classList.add('is-drag');
      if (getDifficulty().glowAlways) updateGlow(slotsAccepting(itemId));
    }
    if (clone) clone.style.transform = 'translate(' + e.clientX + 'px,' + e.clientY + 'px) scale(1.08)';
  }

  function onUp(e) {
    itemEl.removeEventListener('pointermove', onMove);
    itemEl.removeEventListener('pointerup', onUp);
    itemEl.removeEventListener('pointercancel', onUp);
    RUNTIME.dragging = false;
    if (!RUNTIME.jobId || RUNTIME.screen !== 'game') { if (clone) clone.remove(); itemEl.classList.remove('is-drag'); return; }

    if (!moved) {                                     /* a tap: select this item */
      if (RUNTIME.selectedItem === itemId) deselectItem();
      else selectItem(itemId);
      return;
    }
    /* dropped right on another item's spot: float back rather than jump to a neighbouring spot */
    const onOther = otherSlotUnder(itemId, e.clientX, e.clientY);
    const slotId = onOther ? null : nearestAcceptingSlot(itemId, e.clientX, e.clientY);
    if (slotId) {
      clone.remove();
      itemEl.classList.remove('is-drag');
      placeStep(stepFor(itemId, slotId), false);
    } else {
      floatBack(clone, itemEl);
    }
  }

  itemEl.addEventListener('pointermove', onMove);
  itemEl.addEventListener('pointerup', onUp);
  itemEl.addEventListener('pointercancel', onUp);
}

/* Is the point inside an empty spot that belongs to a different item? */
function otherSlotUnder(itemId, x, y) {
  const accepting = slotsAccepting(itemId);
  const slots = document.querySelectorAll('.slot:not(.is-filled)');
  for (const el of slots) {
    const id = el.getAttribute('data-slot');
    if (accepting.indexOf(id) >= 0) continue;
    const r = el.getBoundingClientRect();
    if (x >= r.left && x <= r.right && y >= r.top && y <= r.bottom) return id;
  }
  return null;
}

/* The nearest spot that takes this item, within a generous distance (tremor-friendly) */
function nearestAcceptingSlot(itemId, x, y, extra) {
  let best = null, bestD = Infinity;
  for (const id of slotsAccepting(itemId)) {
    const el = document.querySelector('.slot[data-slot="' + id + '"]');
    if (!el) continue;
    const r = el.getBoundingClientRect();
    const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    const d = Math.hypot(x - cx, y - cy);
    const reach = r.width / 2 + (extra || CONFIG.TIMING.SNAP_RADIUS_PX);
    if (d <= reach && d < bestD) { best = id; bestD = d; }
  }
  return best;
}

/* Tapping on the picture: place the chosen item on its nearest spot */
function onStageTap(ev) {
  if (!RUNTIME.jobId || RUNTIME.dragging) return;
  if (!document.getElementById('reward').hidden) { nextJobOrMenu(); return; }   /* tap the finished scene to go on */
  let itemId = RUNTIME.selectedItem;
  /* only one item in the tray? tapping its spot is enough */
  if (!itemId) {
    const items = document.querySelectorAll('#tray .item');
    if (items.length === 1) itemId = items[0].getAttribute('data-item');
  }
  if (!itemId) return;
  const slotId = otherSlotUnder(itemId, ev.clientX, ev.clientY) ? null : nearestAcceptingSlot(itemId, ev.clientX, ev.clientY, 40);
  if (slotId) placeStep(stepFor(itemId, slotId), false);
  else if (RUNTIME.selectedItem) { playSoftClick(); deselectItem(); }
}

function selectItem(itemId) {
  RUNTIME.selectedItem = itemId;
  document.querySelectorAll('#tray .item').forEach(function (el) {
    el.classList.toggle('is-selected', el.getAttribute('data-item') === itemId);
  });
  playSoftClick();
  updateGlow();
}

function deselectItem() {
  RUNTIME.selectedItem = null;
  document.querySelectorAll('#tray .item.is-selected').forEach(function (el) { el.classList.remove('is-selected'); });
  updateGlow();
}

/* A drop somewhere else: the item drifts gently home, same soft sound as any move */
function floatBack(clone, itemEl) {
  playSoftClick();
  const r = itemEl.getBoundingClientRect();
  const x = r.left + r.width / 2, y = r.top + r.height / 2;
  const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce || !clone.animate) { clone.remove(); itemEl.classList.remove('is-drag'); updateGlow(); return; }
  const anim = clone.animate([
    { transform: clone.style.transform },
    { transform: 'translate(' + x + 'px,' + y + 'px) scale(1)' }
  ], { duration: 450, easing: 'ease-out', fill: 'forwards' });
  anim.onfinish = function () { clone.remove(); itemEl.classList.remove('is-drag'); updateGlow(); };
}

/* ---------------------------------------------------------------
   A STEP IS DONE (by the player, or together with the game)
---------------------------------------------------------------- */
function placeStep(stepIdx, withHelp) {
  if (stepIdx < 0 || !RUNTIME.jobId || RUNTIME.doneSteps.indexOf(stepIdx) >= 0) return;
  const step = RUNTIME.jobSteps[stepIdx];
  playSoftClick();
  clearHints();
  ghostHide();

  /* note how long this step took, for the caregiver list (never shown to the player) */
  const sec = Math.round((Date.now() - (RUNTIME.stepPromptAt || Date.now())) / 1000);
  const st = RUNTIME.sessionStats;
  if (st && (!st.longestPause || sec > st.longestPause.sec)) {
    st.longestPause = { job: RUNTIME.jobId, item: step.item, sec: sec };
  }

  RUNTIME.doneSteps.push(stepIdx);
  RUNTIME.selectedItem = null;
  adjustDifficulty(withHelp || RUNTIME.hintUsedThisStep);
  saveGameState();
  renderStage();
  renderTray();
  fitStage();

  const el = document.querySelector('.slot[data-slot="' + step.slot + '"]');
  if (el) el.classList.add('softpop');

  if (remainingSteps().length === 0) completeJob();
  else promptCurrentStep(true);
}

function completeJob() {
  clearHints();
  ghostHide();
  storeSet(gameKey('firstJobDone'), true);   /* from now on the ghost hand waits the usual time */
  const st = RUNTIME.sessionStats;
  if (st) st.jobsFinished.push(RUNTIME.jobId);
  storeRemove(gameKey('gameState'));
  saveSession();
  RUNTIME.rewardTimerId = setTimeout(showReward, 700);
}

function showReward() {
  const job = currentJob();
  const reward = document.getElementById('reward');
  if (!job || !reward || RUNTIME.screen !== 'game') return;

  /* the finished scene itself is the reward: it glows; the banner says what was done */
  reward.innerHTML = '';
  document.getElementById('stage').classList.add('is-done');
  ghostHide();
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'dgs-btn dgs-btn--primary';
  btn.innerHTML = KIT.btn('grid', t('game.anotherBtn'));
  reward.appendChild(btn);
  reward.hidden = false;
  reward.onclick = function (e) { e.stopPropagation(); nextJobOrMenu(); };
  speak(t(job.reward.text));

  /* Standard and Gentler move on by themselves after a while; Simplest waits for a tap */
  const hold = levelRule().rewardHoldMs;
  if (hold > 0) RUNTIME.rewardTimerId = setTimeout(nextJobOrMenu, hold);
}

function nextJobOrMenu() {
  if (RUNTIME.screen !== 'game') return;
  leaveJob();
  RUNTIME.justFinished = true;
  renderJobMenu();
}

/* ---------------------------------------------------------------
   HINTS: pause -> pulse the item -> glow the spot -> do it together
   Only ever run while the game screen is showing.
---------------------------------------------------------------- */
function scheduleHints() {
  clearHints();
  if (!RUNTIME.jobId || RUNTIME.screen !== 'game') return;
  const delays = getDifficulty().hintDelays;
  delays.forEach(function (ms, i) {
    RUNTIME.hintTimerIds.push(setTimeout(function () { escalateHint(i + 1); }, ms));
  });
}

function clearHints() {
  for (const id of RUNTIME.hintTimerIds) clearTimeout(id);
  RUNTIME.hintTimerIds = [];
  document.querySelectorAll('.slot.is-pulse').forEach(function (s) { s.classList.remove('is-pulse'); });
}

function escalateHint(level) {
  if (!RUNTIME.jobId || RUNTIME.screen !== 'game' || document.hidden) return;
  if (!document.getElementById('reward').hidden) return;
  const i = suggestedStep();
  if (i < 0) return;
  const step = RUNTIME.jobSteps[i];
  const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  if (level === 1) {
    const itemEl = document.querySelector('#tray .item[data-item="' + step.item + '"]');
    if (itemEl && itemEl.animate && !reduce) {
      itemEl.animate([{ transform: 'scale(1)' }, { transform: 'scale(1.08)' }, { transform: 'scale(1)' }],
        { duration: 900, iterations: 2, easing: 'ease-in-out' });
    }
  } else if (level === 2) {
    RUNTIME.hintUsedThisStep = true;
    updateGlow([step.slot]);
    const el = document.querySelector('.slot[data-slot="' + step.slot + '"]');
    if (el) el.classList.add('is-pulse');
  } else if (level === 3) {
    if (RUNTIME.dragging) {           /* busy dragging: wait a little longer */
      RUNTIME.hintTimerIds.push(setTimeout(function () { escalateHint(3); }, 4000));
      return;
    }
    doTogether(i);
  }
}

/* The game moves the item to its spot, gently, as if guiding the hand */
function doTogether(stepIdx) {
  const step = RUNTIME.jobSteps[stepIdx];
  const itemEl = document.querySelector('#tray .item[data-item="' + step.item + '"]');
  const slotEl = document.querySelector('.slot[data-slot="' + step.slot + '"]');
  const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!itemEl || !slotEl || reduce || !document.body.animate) { placeStep(stepIdx, true); return; }

  const a = itemEl.getBoundingClientRect(), b = slotEl.getBoundingClientRect();
  const clone = document.createElement('div');
  clone.className = 'dragclone';
  clone.style.setProperty('--item', a.width + 'px');
  clone.innerHTML = itemEl.innerHTML;
  document.body.appendChild(clone);
  itemEl.classList.add('is-drag');
  const anim = clone.animate([
    { transform: 'translate(' + (a.left + a.width / 2) + 'px,' + (a.top + a.height / 2) + 'px)' },
    { transform: 'translate(' + (b.left + b.width / 2) + 'px,' + (b.top + b.height / 2) + 'px)' }
  ], { duration: 1400, easing: 'ease-in-out', fill: 'forwards' });
  anim.onfinish = function () {
    clone.remove();
    if (RUNTIME.jobId && RUNTIME.screen === 'game') placeStep(stepIdx, true);
  };
}

/* ---------------------------------------------------------------
   GHOST HAND: appears after 10 s idle, never in the first 2 s,
   any tap dismisses it, never blocks touch.
   Reduced motion: a still arrow at the spot, and the spot pulses.
---------------------------------------------------------------- */
const GHOST_HAND_SVG =
  '<svg viewBox="0 0 64 64" aria-hidden="true">' +
    '<circle cx="24" cy="14" r="11" fill="#D9A441" opacity="0.35"/>' +
    '<path d="M22 34V12a4 4 0 0 1 8 0v16l2-.5V24a4 4 0 0 1 8 0v4.5l1.5-.3V26a4 4 0 0 1 7.5 1.5v4l.5-.1a4 4 0 0 1 4.5 4V44c0 9-6 15-15 15h-3c-6 0-9-3-12-7l-8-11a4 4 0 0 1 6-5.2z" ' +
      'fill="#FFFFFF" stroke="#3F6B2B" stroke-width="3" stroke-linejoin="round"/>' +
  '</svg>';

const GHOST_ARROW_SVG =
  '<svg viewBox="0 0 64 64" aria-hidden="true">' +
    '<path d="M32 6v36" stroke="#3F6B2B" stroke-width="6" stroke-linecap="round"/>' +
    '<path d="M18 30l14 14 14-14" fill="none" stroke="#3F6B2B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>' +
  '</svg>';

function armIdle() {
  if (RUNTIME.idleTimerId) clearTimeout(RUNTIME.idleTimerId);
  RUNTIME.idleTimerId = null;
  if (!RUNTIME.jobId || RUNTIME.screen !== 'game') return;
  const since = Date.now() - (RUNTIME.screenShownAt || 0);
  const firstEver = !storeGet(gameKey('firstJobDone'), false);
  const idle = firstEver ? CONFIG.TIMING.GHOST_FIRST_JOB_MS : CONFIG.TIMING.GHOST_HAND_IDLE_MS;
  const wait = Math.max(idle, CONFIG.TIMING.GHOST_NEVER_BEFORE_MS - since);
  RUNTIME.idleTimerId = setTimeout(ghostShow, wait);
}

function ghostShow() {
  if (!RUNTIME.jobId || RUNTIME.screen !== 'game' || RUNTIME.dragging) return;
  if (!document.getElementById('reward').hidden) return;
  const i = suggestedStep();
  if (i < 0) return;
  const step = RUNTIME.jobSteps[i];
  const ghost = document.getElementById('stage-ghost');
  const play = document.getElementById('play-area');
  const itemEl = document.querySelector('#tray .item[data-item="' + step.item + '"]');
  const slotEl = document.querySelector('.slot[data-slot="' + step.slot + '"]');
  if (!ghost || !play || !slotEl) return;

  const base = (ghost.offsetParent || play).getBoundingClientRect();   /* where the ghost is positioned from */
  const centre = function (el, dy) {
    const r = el.getBoundingClientRect();
    return { x: r.left - base.left + r.width / 2 - 24, y: r.top - base.top + r.height / 2 - 12 + (dy || 0) };
  };
  const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  if (reduce || !itemEl) {
    const p = centre(slotEl, -70);
    ghost.innerHTML = GHOST_ARROW_SVG;
    ghost.classList.remove('is-moving');
    ghost.style.transform = 'translate(' + (p.x - 14) + 'px,' + p.y + 'px)';
    ghost.classList.add('is-on');
    slotEl.classList.add('is-pulse');
    return;
  }

  const p1 = centre(itemEl), p2 = centre(slotEl);
  ghost.innerHTML = GHOST_HAND_SVG;
  ghost.classList.remove('is-moving');
  ghost.style.transform = 'translate(' + p1.x + 'px,' + p1.y + 'px)';
  ghost.classList.add('is-on');
  RUNTIME.ghostLoop = true;
  const loop = function () {
    if (!RUNTIME.ghostLoop) return;
    ghost.classList.add('is-moving');
    ghost.style.transform = 'translate(' + p2.x + 'px,' + p2.y + 'px)';
    RUNTIME.ghostT1 = setTimeout(function () {
      if (!RUNTIME.ghostLoop) return;
      ghost.classList.remove('is-moving');
      ghost.style.transform = 'translate(' + p1.x + 'px,' + p1.y + 'px)';
      RUNTIME.ghostT2 = setTimeout(loop, 700);
    }, 1700);
  };
  RUNTIME.ghostT0 = setTimeout(loop, 400);
}

function ghostHide() {
  RUNTIME.ghostLoop = false;
  clearTimeout(RUNTIME.ghostT0); clearTimeout(RUNTIME.ghostT1); clearTimeout(RUNTIME.ghostT2);
  const ghost = document.getElementById('stage-ghost');
  if (ghost) ghost.classList.remove('is-on', 'is-moving');
}

/* ---------------------------------------------------------------
   PAUSE / RESUME (leaving the game screen, or the phone locking)
---------------------------------------------------------------- */
function clearJobTimers() {
  clearHints();
  ghostHide();
  if (RUNTIME.idleTimerId) { clearTimeout(RUNTIME.idleTimerId); RUNTIME.idleTimerId = null; }
}

function pauseGameTimers() {
  clearJobTimers();
  pauseSessionTimer();
}

function resumeGameTimers() {
  if (RUNTIME.screen !== 'game') return;
  resumeSessionTimer();
  if (RUNTIME.jobId && document.getElementById('reward').hidden) {
    RUNTIME.screenShownAt = Date.now();
    scheduleHints();
    armIdle();
  }
}

/* Any touch in the play area hides the ghost and restarts the idle wait */
document.addEventListener('pointerdown', function (e) {
  if (RUNTIME.screen !== 'game' || !RUNTIME.jobId) return;
  ghostHide();
  document.querySelectorAll('.slot.is-pulse').forEach(function (s) {
    if (!RUNTIME.hintUsedThisStep) s.classList.remove('is-pulse');
  });
  armIdle();
}, { passive: true, capture: true });

/* ---------------------------------------------------------------
   AUTOSAVE: a half-finished job is picked up where it was left
---------------------------------------------------------------- */
function saveGameState() {
  if (!RUNTIME.jobId) return;
  storeSet(gameKey('gameState'), {
    jobId: RUNTIME.jobId,
    tableStyle: RUNTIME.settings.tableStyle,
    done: RUNTIME.doneSteps.slice()
  });
}
