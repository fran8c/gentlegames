<script>

/*

  Version 5.0 (kit v1, 4 November 2026)

    grouped settings, quote card, English first with polite Mandarin second.
  - Everything is in this ONE file: the Home Screen icon and the web
    manifest are built inside it, so no side files are needed.

*/

  GAME_ID: 'littlechores',

    tableStyle: 'chinese',

        { item: 'wateringcan', slot: 'plant-pandan',   say: 'say.pandan',   fill: 'fill-bloom' },

      reward: { text: 'reward.plants' }

    {
      id: 'tea',
      art: 'job-tea',

        { item: 'teapot', slot: 'tea-cup',   say: 'say.pourCup', fill: 'fill-cup' },

      ],
      reward: { text: 'reward.tea' }
    },
    {
      id: 'hang',
      art: 'job-hang',
      ordered: false,
      slots: {
        'pole-left':  { x: 23.3, y: 48, w: 24 },
        'pole-mid':   { x: 50,   y: 48, w: 24 },
        'pole-right': { x: 76.7, y: 48, w: 24 }
      },
      steps: [
        { item: 'hangshirt', slot: 'pole-left',  say: 'say.hangshirt' },
        { item: 'hangtowel', slot: 'pole-mid',   say: 'say.hangtowel' },
        { item: 'sarong',    slot: 'pole-right', say: 'say.sarong' }
      ],
      reward: { text: 'reward.hang' }
    },
    {
      id: 'dishes',
      art: 'job-dishes',
      ordered: false,
      slots: {
        'rack-plate':  { x: 26.7, y: 54,   w: 24 },
        'rack-bowl':   { x: 50,   y: 56,   w: 24 },
        'rack-cup':    { x: 73.3, y: 54,   w: 22 },
        'rack-sticks': { x: 50,   y: 82.5, w: 22 }
      },
      steps: [
        { item: 'plate',      slot: 'rack-plate',  say: 'say.rackPlate' },
        { item: 'washbowl',   slot: 'rack-bowl',   say: 'say.rackBowl' },
        { item: 'teacup',     slot: 'rack-cup',    say: 'say.rackCup' },
        { item: 'chopsticks', slot: 'rack-sticks', say: 'say.rackSticks' }
      ],
      reward: { text: 'reward.dishes' }
    },
    {
      id: 'groceries',
      art: 'job-groceries',
      ordered: false,
      /* a basket takes several items: 'multi' lists where each one sits inside it (% of the spot) */
      slots: {
        'basket-veg':   { x: 28.3, y: 64, w: 38, multi: [[34, 44], [66, 44]] },
        'basket-fruit': { x: 71.7, y: 64, w: 38, multi: [[34, 44], [66, 44]] }
      },
      steps: [
        { item: 'choysum',   slot: 'basket-veg',   say: 'say.choysum' },
        { item: 'banana',    slot: 'basket-fruit', say: 'say.banana' },
        { item: 'cabbage',   slot: 'basket-veg',   say: 'say.cabbage' },
        { item: 'tangerine', slot: 'basket-fruit', say: 'say.tangerine' }
      ],
      reward: { text: 'reward.groceries' }
    },
    {
      id: 'slippers',
      art: 'job-slippers',
      ordered: false,
      slots: {
        'pair-1': { x: 60, y: 41.25, w: 22 },
        'pair-2': { x: 60, y: 63.75, w: 22 },
        'pair-3': { x: 60, y: 86.25, w: 22 }
      },
      steps: [
        { item: 'flipflop', slot: 'pair-1', say: 'say.flipflop' },
        { item: 'clog',     slot: 'pair-2', say: 'say.clog' },
        { item: 'cloth',    slot: 'pair-3', say: 'say.cloth' }
      ],
      reward: { text: 'reward.slippers' }
    },
    {
      id: 'flowers',
      art: 'job-flowers',
      ordered: false,
      slots: {
        'vase-left':  { x: 26.7, y: 49,   w: 23 },
        'vase-mid':   { x: 50,   y: 42.5, w: 23 },
        'vase-right': { x: 73.3, y: 49,   w: 23 }
      },
      steps: [
        { item: 'orchid', slot: 'vase-left',  say: 'say.orchid2', fill: 'fill-orchid' },
        { item: 'fern',   slot: 'vase-mid',   say: 'say.fern',    fill: 'fill-fern' },
        { item: 'daisy',  slot: 'vase-right', say: 'say.daisy',   fill: 'fill-daisy' }
      ],
      reward: { text: 'reward.flowers' }
    },
    {
      id: 'buttons',
      art: 'job-buttons',
      ordered: false,
      slots: {
        'btn-1': { x: 50, y: 40,    w: 18 },
        'btn-2': { x: 50, y: 61.25, w: 18 },
        'btn-3': { x: 50, y: 82.5,  w: 18 }
      },
      steps: [
        { item: 'button', slot: 'btn-1', say: 'say.button' },
        { item: 'button', slot: 'btn-2', say: 'say.button' },
        { item: 'button', slot: 'btn-3', say: 'say.button' }
      ],
      reward: { text: 'reward.buttons' }
    }
  ],

  /* Familiar objects used in this game (swap here if needed) */
  CULTURAL_OBJECTS: ['rice bowl', 'chopsticks', 'soup spoon', 'teacup', 'kaya toast',
    'soft-boiled eggs', 'kopi cup', 'orchid', 'pandan', 'hibiscus', 'kettle', 'teapot'],

  TABLE_STYLES: ['chinese', 'kopitiam', 'western'],
  HANDEDNESS: ['right', 'left'],

  MOODS: ['happy', 'okay', 'notgreat']   /* the kit's mood ids, the same in every game */
};

/* ==== END SECTION: CONFIG ==== */
</script>

<style>
/* ==== SECTION: STYLES ==== */
/* MOO Dementia Games kit v1 (DGS_KIT_VERSION). Part 1 is identical in every game except the palette
   values; part 2 is the shared components (kit bundle.css); part 3 is Little Chores only. */

/* ---------- 1. Tokens: Little Chores palette ---------- */
:root{
  --bg:#f1f7e7; --surface:#ffffff; --surface-sunk:#e7eddd; --text:#23301a; --text-muted:#54604b;
  --primary:#3f6b2b; --primary-ink:#365c25; --primary-strong:#315322; --primary-soft:#e8ede6; --on-primary:#ffffff;
  --accent:#d9a441; --accent-soft:#f7ebd5; --border:#86907c; --divider:#d8dfce; --focus-ring:#3f6b2b;
  --art-ink:#3a2f2a;
  --space-1:8px; --space-2:12px; --space-3:16px; --space-4:24px; --space-5:32px; --space-6:48px;
  --radius-sm:12px; --radius-md:20px; --radius-lg:28px; --radius-pill:999px;
  --tap-min:72px; --tap-play:104px; --icon:32px; --icon-lg:44px; --content-max:560px;
  --shadow-card:0 1px 2px rgba(0,0,0,.06),0 6px 18px rgba(0,0,0,.07);
  --shadow-lift:0 2px 4px rgba(0,0,0,.08),0 12px 28px rgba(0,0,0,.10);
  --font-sans:"PingFang SC","Noto Sans SC","Microsoft YaHei","Hiragino Sans GB",system-ui,-apple-system,"Segoe UI",sans-serif;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px); --safe-r:env(safe-area-inset-right,0px);
  /* Little Chores game-screen names (mapped to the kit tokens) */
  --primary-dark:var(--primary-strong); --muted:var(--text-muted); --line:var(--divider);
  --leaf-soft:#e2edd3; --honey-soft:#f6e3b4; --wood:#ecd9ae; --wood-edge:#b98552;
  --tap:72px; --lift:0 3px 0 rgba(35,48,26,.08); --soft:0 6px 18px rgba(35,48,26,.08);
  --f-body:clamp(22px, 5.4vw, 25px); --f-small:18px; --f-title:clamp(30px, 8vw, 40px); --f-prompt:clamp(24px, 6.6vw, 30px);
  --item:84px;
}
@media (min-width:700px) and (min-height:560px){ :root{ --tap-min:88px; } }
/* High contrast (caregiver switch): the kit's high-contrast theme */
html.hc, body.hc{
  --bg:#ffffff; --surface:#ffffff; --surface-sunk:#f0f0f0; --text:#000000; --text-muted:#2b2b2b;
  --primary:#0f2a0a; --primary-ink:#0f2a0a; --primary-strong:#000000; --primary-soft:#e8efe0;
  --accent:#b07d00; --accent-soft:#f6ead0; --border:#000000; --divider:#5c5c5c; --focus-ring:#000000;
  --leaf-soft:#e8efe0;
}

/* ==== MOO Dementia Games kit v1: shared components (identical in every game) ==== */
/* ---------- 2. Shared components (kit) ---------- */
*,*::before,*::after{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{
  margin:0; height:100%; background:var(--bg); color:var(--text);
  font-family:var(--font-sans); font-size:22px; line-height:1.55;
  overscroll-behavior:none; overflow:hidden;
  -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
  touch-action:manipulation; -webkit-text-size-adjust:100%;
}
img,svg{ -webkit-user-drag:none; user-select:none; }
[hidden]{ display:none !important; }
h1,h2,h3,h4,p{ margin:0; }
button{ font:inherit; color:inherit; }
.dgs-icon{ width:var(--icon); height:var(--icon); flex:none; display:block; }

.screen{
  position:fixed; inset:0; display:flex; flex-direction:column; gap:var(--space-3);
  background:var(--bg);
  padding:calc(var(--safe-t) + 12px) calc(var(--safe-r) + 16px) calc(var(--safe-b) + 12px) calc(var(--safe-l) + 16px);
}
.screen > .col{ width:100%; max-width:var(--content-max); margin:0 auto; display:flex; flex-direction:column; gap:var(--space-3); min-height:0; flex:1 1 auto; }
.dgs-topbar{ display:flex; align-items:center; justify-content:space-between; gap:var(--space-2); flex:0 0 auto; min-height:60px; }
.dgs-topbar .grow{ flex:1; }
.scroll{ overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain; touch-action:pan-y; flex:1 1 auto; min-height:0; margin:0 -16px; padding:4px 16px 40px; }
.scroll::-webkit-scrollbar{ width:0; }
.scroll > .col{ max-width:var(--content-max); margin:0 auto; display:flex; flex-direction:column; gap:var(--space-3); }

/* Buttons */
.dgs-btn{
  appearance:none; border:0; margin:0; cursor:pointer;
  display:flex; align-items:center; justify-content:center; gap:var(--space-2);
  min-height:var(--tap-min); width:100%; padding:0 var(--space-4);
  border-radius:var(--radius-lg); font-size:26px; line-height:32px; font-weight:700; letter-spacing:.01em; text-align:center;
  transition:transform .12s ease, box-shadow .12s ease; touch-action:manipulation;
}
.dgs-btn:focus-visible,.dgs-guide:focus-visible,.dgs-round:focus-visible,.dgs-lang button:focus-visible,.dgs-hold:focus-visible,.dgs-level:focus-visible,.dgs-mood:focus-visible,.dgs-seg button:focus-visible,.dgs-switch:focus-visible{ outline:3px solid var(--focus-ring); outline-offset:3px; }
.dgs-btn:active{ transform:scale(.96); }
/* Every button gives a smooth, slight press so a tap clearly registers */
.dgs-round,.dgs-guide,.dgs-level,.dgs-hold,.dgs-mood,.dgs-seg button,.dgs-lang button{ transition:transform .12s ease, box-shadow .12s ease, background-color .12s ease; }
.dgs-round:active,.dgs-guide:active,.dgs-level:active,.dgs-hold:active,.dgs-mood:active,.dgs-seg button:active,.dgs-lang button:active{ transform:scale(.96); }
@media (prefers-reduced-motion:reduce){
  .dgs-btn:active,.dgs-round:active,.dgs-guide:active,.dgs-level:active,.dgs-hold:active,.dgs-mood:active,.dgs-seg button:active,.dgs-lang button:active{ transform:none; filter:brightness(.92); }
}
.dgs-btn--primary{ background:var(--primary); color:var(--on-primary); box-shadow:0 4px 0 var(--primary-strong); }
.dgs-btn--primary:active{ box-shadow:0 2px 0 var(--primary-strong); }
.dgs-btn--secondary{ background:var(--surface); color:var(--text); box-shadow:inset 0 0 0 2px var(--border),var(--shadow-card); }
.dgs-btn--quiet{ background:transparent; color:var(--primary-ink); min-height:56px; font-size:20px; font-weight:600; text-decoration:underline; text-underline-offset:5px; }
.dgs-btn--small{ min-height:64px; font-size:21px; }
.dgs-btn--play{ min-height:var(--tap-play); font-size:34px; line-height:40px; font-weight:800; box-shadow:0 5px 0 var(--primary-strong),var(--shadow-lift); }
.dgs-btn__disc{ width:56px; height:56px; border-radius:50%; background:var(--on-primary); color:var(--primary); display:grid; place-items:center; flex:none; }
.dgs-btn__disc .dgs-icon{ width:28px; height:28px; margin-left:4px; }

/* Language switch and round buttons */
.dgs-lang{ display:inline-flex; padding:4px; border-radius:var(--radius-pill); background:var(--surface-sunk); box-shadow:inset 0 0 0 1.5px var(--divider); }

/* Guide buttons */
.dgs-guides{ display:grid; grid-template-columns:1fr 1fr; gap:var(--space-2); }
.dgs-guide{ appearance:none; border:0; cursor:pointer; min-height:104px; padding:var(--space-2); border-radius:var(--radius-lg); background:var(--surface); color:var(--text); box-shadow:inset 0 0 0 2px var(--border),var(--shadow-card); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; font-size:21px; line-height:26px; font-weight:700; text-align:center; }
.dgs-guide .dgs-icon{ width:var(--icon-lg); height:var(--icon-lg); color:var(--primary); }

/* Dots */
.dgs-dots{ display:flex; justify-content:center; gap:10px; }
.dgs-dots i{ width:12px; height:12px; border-radius:50%; background:var(--divider); display:block; }
.dgs-dots i.on{ background:var(--primary); width:32px; border-radius:var(--radius-pill); }

/* Quote (kit Quote): caregiver page top, and the player's Rest screen */
.dgs-quote{ margin:0; padding:18px 20px 16px; border-radius:var(--radius-md); background:var(--accent-soft); display:flex; flex-direction:column; gap:10px; }
.dgs-quote blockquote{ margin:0; font-size:19px; line-height:30px; font-weight:500; color:var(--text); }
.dgs-quote blockquote::before{ content:"“"; } .dgs-quote blockquote::after{ content:"”"; }
html[lang="zh-CN"] .dgs-quote blockquote::before{ content:"“"; }
.dgs-quote figcaption{ font-size:16px; line-height:22px; color:var(--text-muted); }
.dgs-quote cite{ font-style:italic; }
.dgs-quote.tip small{ font-size:15px; line-height:20px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:var(--primary-ink); }
.dgs-quote.tip p{ margin:0; font-size:19px; line-height:30px; font-weight:600; }
.dgs-quote.player{ background:transparent; padding:0 4px; text-align:center; }
.dgs-quote.player blockquote{ font-size:24px; line-height:34px; }
/* Caregiver page */
.dgs-kind{ display:grid; grid-template-columns:auto 1fr; gap:14px; align-items:center; padding:18px 20px; border-radius:var(--radius-md); background:var(--accent-soft); }
.dgs-kind .dgs-icon{ width:40px; height:40px; color:var(--primary); }
.dgs-kind small{ display:block; font-size:16px; line-height:22px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:var(--primary-ink); }
.dgs-kind b{ display:block; font-size:22px; line-height:31px; font-weight:700; }
.dgs-disclaimer{ margin:0; padding:var(--space-3) var(--space-4); border-radius:var(--radius-md); background:var(--surface-sunk); font-size:19px; line-height:28px; font-weight:600; }
.dgs-quick{ display:grid; grid-template-columns:repeat(3,1fr); gap:var(--space-2); padding:var(--space-3); border-radius:var(--radius-md); background:var(--surface); box-shadow:var(--shadow-card); }
.dgs-quick > div{ display:flex; flex-direction:column; align-items:center; gap:8px; text-align:center; }
.dgs-quick__icon{ width:64px; height:64px; border-radius:50%; background:var(--primary-soft); color:var(--primary); display:grid; place-items:center; }
.dgs-quick b{ font-size:19px; line-height:25px; font-weight:700; }
.dgs-quick span.other{ font-size:16px; line-height:21px; color:var(--text-muted); }
.dgs-section{ border-radius:var(--radius-md); background:var(--surface); box-shadow:var(--shadow-card); overflow:hidden; }
.dgs-section > summary{ list-style:none; cursor:pointer; display:flex; align-items:center; gap:var(--space-2); min-height:var(--tap-min); padding:var(--space-2) var(--space-4); font-size:24px; line-height:32px; font-weight:700; }
.dgs-section > summary::-webkit-details-marker{ display:none; }
.dgs-section > summary .dgs-icon{ color:var(--primary); }
.dgs-section > summary::after{ content:""; margin-left:auto; flex:none; width:14px; height:14px; border-right:3px solid var(--text); border-bottom:3px solid var(--text); transform:rotate(45deg) translate(-3px,-3px); transition:transform .2s; }
.dgs-section[open] > summary::after{ transform:rotate(-135deg) translate(-3px,-3px); }
.dgs-section > summary:focus-visible{ outline:3px solid var(--focus-ring); outline-offset:-3px; }
.dgs-section__body{ padding:0 var(--space-4) var(--space-4); font-size:19px; line-height:30px; display:flex; flex-direction:column; gap:12px; }
.dgs-section__body h4{ margin:8px 0 0; font-size:19px; line-height:26px; color:var(--primary-ink); }
.dgs-section__body ul{ margin:0; padding-left:1.1em; }
.dgs-section__body li{ margin:4px 0; }
.dgs-bda{ display:grid; gap:10px; }
.dgs-bda div{ padding:12px 16px; border-radius:var(--radius-sm); background:var(--surface-sunk); }
.dgs-bda b{ display:block; color:var(--primary-ink); font-size:16px; letter-spacing:.05em; text-transform:uppercase; }
.dgs-part{ display:grid; gap:4px; padding:14px 16px; border-radius:var(--radius-sm); background:var(--surface-sunk); }
.dgs-part b{ font-size:20px; line-height:27px; }
.dgs-part p{ margin:0; font-size:18px; line-height:27px; }
.dgs-part .why{ display:grid; grid-template-columns:auto 1fr; gap:8px; align-items:start; margin-top:4px; padding-top:8px; border-top:1.5px solid var(--divider); }
.dgs-part .why .dgs-icon{ width:22px; height:22px; color:var(--primary); margin-top:3px; }
.dgs-part .why em{ font-style:normal; font-weight:700; color:var(--primary-ink); }
.dgs-sub{ font-size:17px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:var(--primary-ink); margin:6px 4px 0; }
.dgs-card{ padding:18px 20px; border-radius:var(--radius-md); background:var(--surface); box-shadow:var(--shadow-card); display:flex; flex-direction:column; gap:10px; }
.dgs-card h3{ font-size:22px; line-height:30px; }

/* Level picker */
.dgs-levels{ display:grid; gap:var(--space-2); }
.dgs-level{ appearance:none; border:0; cursor:pointer; text-align:left; display:grid; grid-template-columns:36px 1fr; gap:4px 14px; align-items:center; min-height:var(--tap-min); padding:14px 18px; border-radius:var(--radius-md); background:var(--surface); color:var(--text); box-shadow:inset 0 0 0 2px var(--border); }
.dgs-level b{ grid-column:2; font-size:22px; line-height:28px; }
.dgs-level > span:not(.dgs-radio){ grid-column:2; font-size:17px; line-height:24px; color:var(--text-muted); }
.dgs-level .dgs-radio{ grid-column:1; grid-row:1/3; width:30px; height:30px; border-radius:50%; box-shadow:inset 0 0 0 2.5px var(--border); display:grid; place-items:center; }
.dgs-level[aria-checked="true"]{ background:var(--primary-soft); box-shadow:inset 0 0 0 3px var(--primary); }
.dgs-level[aria-checked="true"] b{ color:var(--primary-ink); }
.dgs-level[aria-checked="true"] .dgs-radio{ box-shadow:inset 0 0 0 2.5px var(--primary); }
.dgs-level[aria-checked="true"] .dgs-radio::after{ content:""; width:16px; height:16px; border-radius:50%; background:var(--primary); }

/* Hold button */
.dgs-hold{ appearance:none; border:0; cursor:pointer; width:100%; display:flex; align-items:center; gap:var(--space-3); min-height:88px; padding:12px 20px; border-radius:var(--radius-lg); background:var(--surface); color:var(--text); box-shadow:inset 0 0 0 2px var(--border),var(--shadow-card); text-align:left; touch-action:none; }
.dgs-hold__ring{ --p:0; flex:none; width:60px; height:60px; border-radius:50%; display:grid; place-items:center; background:conic-gradient(var(--accent) calc(var(--p) * 1turn), var(--surface-sunk) 0); }
.dgs-hold__ring > span{ width:46px; height:46px; border-radius:50%; background:var(--surface); display:grid; place-items:center; }
.dgs-hold__ring .dgs-icon{ width:26px; height:26px; }
.dgs-hold b{ display:block; font-size:22px; line-height:28px; }
.dgs-hold small{ display:block; font-size:17px; line-height:22px; color:var(--text-muted); }

/* Settings */
.dgs-group{ display:flex; flex-direction:column; gap:6px; scroll-margin-top:12px; }
.dgs-group > h3{ margin:0 4px 4px; font-size:17px; line-height:22px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:var(--primary-ink); display:flex; align-items:center; gap:8px; }
.dgs-group > h3 .dgs-icon{ width:22px; height:22px; }
.dgs-group__rows{ border-radius:var(--radius-md); background:var(--surface); box-shadow:var(--shadow-card); }
.dgs-row{ display:grid; grid-template-columns:1fr auto; align-items:center; gap:8px 16px; padding:16px 20px; min-height:var(--tap-min); border-top:1.5px solid var(--divider); scroll-margin-top:12px; }
.dgs-row:first-child{ border-top:0; }
.dgs-row > .lbl,.dgs-row > label{ font-size:19px; line-height:26px; font-weight:600; min-width:0; }
.dgs-row > .note,.dgs-row > p{ grid-column:1 / -1; }
.dgs-row--stack{ grid-template-columns:1fr; }
.dgs-row--stack > *{ grid-column:1 / -1; }
.dgs-switch{ appearance:none; margin:0; cursor:pointer; width:68px; height:40px; border-radius:var(--radius-pill); background:var(--surface-sunk); box-shadow:inset 0 0 0 2px var(--border); position:relative; border:0; flex:none; transition:background-color .15s; }
.dgs-switch::after{ content:""; position:absolute; top:5px; left:5px; width:30px; height:30px; border-radius:50%; background:var(--surface); box-shadow:0 0 0 2px var(--border); transition:transform .15s; }
.dgs-switch[aria-checked="true"]{ background:var(--primary); box-shadow:none; }
.dgs-switch[aria-checked="true"]::after{ transform:translateX(28px); box-shadow:none; }
.dgs-seg{ display:flex; flex-wrap:wrap; padding:4px; border-radius:var(--radius-sm); background:var(--surface-sunk); gap:4px; }
.dgs-seg button{ appearance:none; border:0; cursor:pointer; flex:1 1 0; min-width:64px; min-height:52px; border-radius:9px; background:transparent; color:var(--text); font-size:18px; font-weight:600; padding:4px 10px; line-height:1.25; }
.dgs-seg.many{ display:grid; grid-template-columns:repeat(auto-fit,minmax(118px,1fr)); }
.dgs-seg.many.short{ grid-template-columns:repeat(4,1fr); }
.dgs-seg button[aria-pressed="true"]{ background:var(--surface); color:var(--primary-ink); font-weight:800; box-shadow:inset 0 0 0 2.5px var(--primary); }
input[type=range]{ -webkit-appearance:none; appearance:none; width:100%; height:48px; background:transparent; margin:0; touch-action:none; }
input[type=range]::-webkit-slider-runnable-track{ height:10px; border-radius:999px; background:var(--surface-sunk); box-shadow:inset 0 0 0 1.5px var(--border); }
input[type=range]::-webkit-slider-thumb{ -webkit-appearance:none; width:36px; height:36px; margin-top:-13px; border-radius:50%; background:var(--primary); border:4px solid var(--surface); box-shadow:0 0 0 2px var(--primary); }
input[type=range]::-moz-range-track{ height:10px; border-radius:999px; background:var(--surface-sunk); }
input[type=range]::-moz-range-thumb{ width:30px; height:30px; border-radius:50%; background:var(--primary); border:4px solid var(--surface); }
.dgs-progress{ height:12px; border-radius:999px; background:var(--surface-sunk); overflow:hidden; }
.dgs-progress i{ display:block; height:100%; background:var(--primary); border-radius:inherit; transition:width .4s ease; }
.dgs-checklist{ list-style:none; padding:0; margin:0; display:grid; gap:6px; }
.dgs-check{ appearance:none; border:0; background:transparent; cursor:pointer; width:100%; display:flex; align-items:center; gap:12px; min-height:56px; padding:4px 0; text-align:left; font-size:19px; color:var(--text); }
.dgs-tick{ width:30px; height:30px; border-radius:8px; box-shadow:inset 0 0 0 2px var(--border); display:grid; place-items:center; flex:none; }
.dgs-tick .dgs-icon{ width:20px; height:20px; }
.dgs-check.is-done .dgs-tick{ background:var(--primary); color:var(--on-primary); box-shadow:none; }
.dgs-check.is-done span:last-child{ color:var(--text-muted); text-decoration:line-through; }

/* Notice */
.dgs-notice{ display:grid; grid-template-columns:auto 1fr; gap:12px; align-items:start; padding:14px 18px; border-radius:var(--radius-md); background:var(--accent-soft); font-size:18px; line-height:27px; }
.dgs-notice .dgs-icon{ width:28px; height:28px; }
.dgs-notice b{ display:block; }

/* Mood faces */
.dgs-moods{ display:grid; grid-template-columns:repeat(3,1fr); gap:var(--space-2); width:100%; }
.dgs-mood{ appearance:none; border:0; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:6px; padding:12px 4px; min-height:var(--tap-min); border-radius:var(--radius-md); background:var(--surface); color:var(--text); box-shadow:inset 0 0 0 2px var(--border); }
.dgs-mood svg{ width:min(18vw,72px); height:min(18vw,72px); }
.dgs-mood b{ font-size:22px; line-height:26px; }
.dgs-mood span{ font-size:16px; line-height:20px; color:var(--text-muted); }
.dgs-moods.small .dgs-mood svg{ width:52px; height:52px; }
.dgs-moods.small .dgs-mood b{ font-size:19px; }

/* Rest card */
#restCard{ position:fixed; z-index:45; left:50%; bottom:calc(var(--safe-b) + 24px); width:min(94vw,520px); transform:translate(-50%,140%); opacity:0;
  display:flex; flex-direction:column; gap:var(--space-2); padding:var(--space-4); border-radius:var(--radius-lg) var(--radius-lg) var(--radius-md) var(--radius-md); background:var(--surface); box-shadow:var(--shadow-lift); transition:transform .9s ease, opacity 1.2s ease; }
#restCard.show{ transform:translate(-50%,0); opacity:1; }
#restCard h3{ text-align:center; font-size:26px; line-height:34px; }
#restCard .row{ display:grid; grid-template-columns:1fr 1fr; gap:var(--space-2); }

/* Dialog (never alert()) and toast */
#dialog{ position:fixed; inset:0; z-index:80; background:rgba(0,0,0,.45); display:flex; align-items:center; justify-content:center; padding:16px; }
#dialog .box{ background:var(--surface); border-radius:var(--radius-lg); padding:var(--space-4); width:min(100%,480px); max-height:90vh; overflow:auto; display:flex; flex-direction:column; gap:var(--space-3); text-align:center; box-shadow:var(--shadow-lift); }
#dialog .box h3{ font-size:28px; line-height:36px; }
#dialog .box p,#dialog .box li{ font-size:19px; line-height:28px; text-align:left; }
#dialog .box ul{ margin:0; padding-left:1.1em; }
#dialog .btns{ display:flex; flex-direction:column; gap:var(--space-2); }
.dgs-btn--plain{ background:var(--surface); color:var(--text); box-shadow:inset 0 0 0 2px var(--border); min-height:64px; font-size:20px; font-weight:600; }
#toast{ position:fixed; z-index:90; left:50%; top:calc(var(--safe-t) + 90px); transform:translateX(-50%); background:var(--text); color:var(--surface); border-radius:var(--radius-sm); padding:12px 20px; font-size:18px; font-weight:700; opacity:0; transition:opacity .4s; pointer-events:none; max-width:90vw; text-align:center; }
#toast.show{ opacity:1; }

/* Ghost hand */
#ghost{ position:fixed; z-index:50; left:0; top:0; width:84px; height:84px; pointer-events:none; opacity:0; transition:opacity .5s ease; }
#ghost.show{ opacity:.95; }
#ghost svg{ width:100%; height:100%; filter:drop-shadow(0 4px 8px rgba(0,0,0,.22)); }
#ghostTarget{ position:fixed; z-index:49; width:110px; height:110px; margin:-55px 0 0 -55px; border-radius:50%; border:5px solid var(--accent); box-shadow:0 0 0 8px var(--accent-soft); pointer-events:none; opacity:0; }
#ghostTarget.show{ opacity:1; animation:pulse 2.4s ease-in-out infinite; }
@keyframes pulse{ 0%,100%{ transform:scale(.88); opacity:.6; } 50%{ transform:scale(1.04); opacity:1; } }

/* Captions (every spoken line is shown) */
#caption{
  position:fixed; z-index:40; left:16px; right:16px; margin:0 auto; width:fit-content; transform:translateY(12px); bottom:calc(var(--safe-b) + 130px);
  max-width:min(calc(100vw - 32px),640px); background:var(--surface); color:var(--text);
  border-radius:var(--radius-md); padding:12px 22px; font-size:28px; font-weight:600; text-align:center; line-height:1.4;
  box-shadow:var(--shadow-lift); opacity:0; pointer-events:none; transition:opacity .6s ease, transform .6s ease;
}
#caption.show{ opacity:1; transform:none; }


/* Hero picture on start / end / rest */
.dgs-hero{ flex:1 1 auto; min-height:100px; display:flex; justify-content:center; align-items:center; }
.dgs-hero > .dgs-art{ height:100%; max-height:40vh; aspect-ratio:var(--hero-ratio,1/1); max-width:100%; }
.dgs-col{ width:100%; max-width:var(--content-max); margin:0 auto; display:flex; flex-direction:column; gap:var(--space-3); min-height:0; flex:1 1 auto; }
.dgs-center{ justify-content:center; }
.dgs-btns{ display:flex; flex-direction:column; gap:var(--space-2); }
@media (max-height:640px){ .dgs-title{ font-size:34px; line-height:40px; } .dgs-btn--play{ min-height:88px; } }
@media (prefers-reduced-motion:reduce){ *,*::before,*::after{ animation-duration:.001s !important; animation-iteration-count:1 !important; transition-duration:.001s !important; } }

/* Little Chores game screen (kept from v4, on kit tokens) */
/* ---- Game screen ---- */
.gamebody{position:relative;flex:1;display:flex;flex-direction:column;gap:10px;padding:4px 16px calc(14px + env(safe-area-inset-bottom));min-height:0}

/* the spoken line: a soft banner with a 'hear again' button */
.caption{flex:0 0 auto;display:flex;align-items:center;gap:6px;min-height:80px;padding:4px 16px 4px 4px;border-radius:26px;background:var(--surface);box-shadow:var(--lift)}
.caption .replay{position:relative;flex:0 0 auto;width:var(--tap);height:var(--tap);border:none;border-radius:50%;background:transparent;display:grid;place-items:center;cursor:pointer}
.caption .replay::before{content:"";position:absolute;inset:8px;border-radius:50%;background:var(--primary)}
.caption .replay svg{position:relative}
.caption .replay svg{width:28px;height:28px;stroke:#FFFFFF;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.caption .replay svg .solid{fill:#FFFFFF}
.caption .text{font-size:var(--f-prompt);line-height:1.3;font-weight:500;min-width:0}

.jobgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:4px 0;overflow-y:auto;flex:1;align-content:start}
.jobtile{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:6px;padding:0 0 14px;border:none;border-radius:28px;background:var(--surface);color:var(--text);font:inherit;font-size:var(--f-body);font-weight:800;cursor:pointer;overflow:hidden;box-shadow:var(--lift)}
.jobtile .tileart{width:100%;aspect-ratio:4/3;pointer-events:none;overflow:hidden;min-height:0}
.jobtile .tileart svg{display:block;width:100%;height:100%}
.jobtile .tileart svg{width:100%;height:100%;display:block}
.jobtile:active{transform:translateY(2px)}
.jobgrid.two .jobtile{font-size:var(--f-title)}

#play-area{flex:1;display:flex;flex-direction:column;gap:6px;min-height:0;position:relative}
.stagewrap{flex:1;min-height:0;position:relative}
.stage{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:300px;height:400px;border-radius:28px;background:var(--leaf-soft);overflow:hidden;touch-action:none;transition:box-shadow .6s ease}
.stage.is-done{box-shadow:0 0 0 6px rgba(217,169,65,.55),0 0 36px 8px rgba(217,169,65,.35)}
.scene-bg{position:absolute;inset:0}
.scene-bg svg,.scene-bg img{width:100%;height:100%;display:block}

/* a spot on the table: a faint shape of what goes there, or a soft ring */
.slot{position:absolute;transform:translate(-50%,-50%);display:grid;place-items:center;min-width:var(--tap);min-height:var(--tap);aspect-ratio:1/1;border-radius:50%;}
.slot .ring{position:absolute;inset:4%;border-radius:50%;border:3px solid rgba(63,107,43,.16)}
.slot .shape{position:absolute;inset:4%;opacity:.17;filter:brightness(0)}
.slot .shape svg{width:100%;height:100%}
.slot.has-shape .ring{border-color:transparent}
.slot .base{position:absolute;inset:4%}
.slot .base svg,.slot .fill svg{width:100%;height:100%}
.slot.is-glow .ring{border-color:var(--accent);background:rgba(217,169,65,.22);box-shadow:0 0 0 6px rgba(217,169,65,.18),0 0 22px 6px rgba(217,169,65,.35)}
.slot.is-glow .shape{opacity:.26}
.slot.is-filled .ring,.slot.is-filled .shape{display:none}
.slot .fill{position:absolute;inset:0;filter:drop-shadow(0 5px 3px rgba(35,48,26,.16))}
.slot .fill svg{overflow:visible}
.slot .fill.layer{inset:auto;width:58%;height:58%;transform:translate(-50%,-50%)}
.jobgrid{grid-auto-rows:max-content}
.jobtile{min-height:max-content}
.jobgrid.many .jobtile .tileart{aspect-ratio:16/9}
.jobgrid.many .jobtile{font-size:var(--f-body);padding-bottom:10px}
/* seven or more jobs: three across on a phone so they all fit on one screen */
.jobgrid.lots{grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.jobgrid.lots .jobtile{border-radius:22px;gap:4px;padding:0 4px 8px;line-height:1.25;min-height:var(--tap)}
.jobgrid.lots .jobtile .tileart{aspect-ratio:4/3}
.jobgrid.lots .jobtile:last-child:nth-child(3n+1){grid-column:2}   /* a single last job sits in the middle */
@media (min-width:700px){.jobgrid.lots .jobtile:last-child:nth-child(3n+1){grid-column:auto}}
@media (min-width:700px){.jobgrid.lots{grid-template-columns:repeat(5,minmax(0,1fr))}}
.jobpick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}
.jobpick label{display:flex;align-items:center;gap:10px;min-height:60px;padding:6px 12px;border-radius:16px;background:var(--leaf-soft);font-size:var(--f-small)}
.jobpick input{width:28px;height:28px;accent-color:var(--primary);flex:0 0 auto}
.slot.is-pulse .ring{animation:lcpulse 1.6s ease-in-out infinite}
@keyframes lcpulse{0%,100%{opacity:1}50%{opacity:.45}}

/* steam rising from tea, a flower opening: small signs that a job worked */
@keyframes steam{0%{opacity:0;transform:translateY(5px)}40%{opacity:.95}100%{opacity:0;transform:translateY(-9px)}}
.steam{animation:steam 3.2s ease-in-out infinite}
.steam.s2{animation-delay:1.1s}
.steam.s3{animation-delay:2.2s}
@keyframes bloom{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
.bloom{transform-origin:50% 50%;transform-box:fill-box;animation:bloom .9s ease-out both}

/* the tray: a wooden shelf the items rest on */
.tray{position:relative;flex:0 0 auto;display:flex;align-items:flex-end;justify-content:center;gap:8px;min-height:calc(var(--item) + 24px);padding:0 8px 24px;flex-wrap:nowrap}
.tray::before{content:"";position:absolute;left:0;right:0;bottom:16px;height:22px;background:var(--wood);clip-path:polygon(3% 0,97% 0,100% 100%,0 100%);z-index:0}
.tray::after{content:"";position:absolute;left:0;right:0;bottom:0;height:16px;background:var(--wood-edge);border-radius:6px;z-index:0}
.tray.left{justify-content:flex-start}
.tray.right{justify-content:flex-end}

.item{position:relative;z-index:1;width:var(--item);height:var(--item);flex:0 0 auto;border-radius:50%;display:grid;place-items:center;touch-action:none;cursor:grab;filter:drop-shadow(0 6px 3px rgba(35,48,26,.16))}
.item svg{width:100%;height:100%;pointer-events:none}
.item:active{transform:scale(1.06)}
.item.is-drag{opacity:.25}
.item.is-selected{background:radial-gradient(circle,rgba(217,169,65,.35) 0 58%,transparent 60%);transform:translateY(-8px)}

.dragclone{position:fixed;left:0;top:0;width:var(--item);height:var(--item);display:grid;place-items:center;pointer-events:none;z-index:60;margin:calc(var(--item) / -2) 0 0 calc(var(--item) / -2);filter:drop-shadow(0 14px 8px rgba(35,48,26,.22))}
.dragclone svg{width:100%;height:100%}

@keyframes settle{0%{transform:translate(-50%,-50%) scale(1.15)}60%{transform:translate(-50%,-50%) scale(.96)}100%{transform:translate(-50%,-50%) scale(1)}}
.slot.softpop{animation:settle .42s ease-out}

/* Ghost hand: sits over the whole play area so it can travel from tray to stage */
.ghost{position:absolute;left:0;top:0;width:76px;height:76px;pointer-events:none;z-index:40;opacity:0;transition:opacity .3s ease;filter:drop-shadow(0 4px 4px rgba(35,48,26,.2))}
.ghost.is-on{opacity:.96}
.ghost.is-moving{transition:opacity .3s ease, transform 1.2s ease-in-out}
.ghost svg{width:100%;height:100%}

/* Finished: the completed scene stays in view and glows; the 'Another job'
   button rises where the empty tray was, and the banner says what was done */
.reward{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;min-height:calc(var(--item) + 24px);z-index:30;animation:rise .5s ease-out both}
.reward .dgs-btn{max-width:420px}
@keyframes rise{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}

/* Rest stays visible but quiet */
#game-rest{flex:0 0 auto;width:auto;min-width:210px;align-self:center;padding:0 32px;min-height:64px}


/* A soft light in the room, and a gentle bloom behind each item as it is put in place */
.scene-bg::after{ content:""; position:absolute; inset:0; pointer-events:none;
  background:radial-gradient(ellipse 70% 55% at 50% 32%, rgba(255,251,235,.42), transparent 70%), radial-gradient(ellipse 90% 80% at 50% 50%, transparent 62%, rgba(40,55,25,.10)); }
.slot.softpop::before{ content:""; position:absolute; inset:-22%; border-radius:50%; pointer-events:none;
  background:radial-gradient(circle, rgba(255,224,140,.6), rgba(255,224,140,0) 68%); animation:lcbloom 1.6s ease-out forwards; }
@keyframes lcbloom{ 0%{ opacity:0; transform:scale(.6); } 35%{ opacity:1; } 100%{ opacity:0; transform:scale(1.15); } }
.stage.is-done::after{ content:""; position:absolute; inset:0; pointer-events:none; border-radius:inherit;
  background:radial-gradient(ellipse 60% 50% at 50% 50%, rgba(255,230,160,.35), transparent 70%); animation:lcfade 1.2s ease-out; }
@keyframes lcfade{ from{ opacity:0; } to{ opacity:1; } }
@media (prefers-reduced-motion:reduce){ .slot.softpop::before{ animation:none; opacity:0; } .stage.is-done::after{ animation:none; } }

/* ---------- 3. Little Chores only ---------- */
#screen-language{ justify-content:center; }
#screen-language .col{ flex:0 0 auto; gap:var(--space-4); }
#screen-language .dgs-hero{ flex:0 0 auto; height:28vh; }
#screen-language .dgs-btn--primary,#screen-language .dgs-btn--secondary{ min-height:96px; font-size:30px; }
#screen-start .col{ gap:var(--space-2); }
#screen-start .dgs-hero > .dgs-art,#screen-session .dgs-hero > .dgs-art,#screen-rest .dgs-hero > .dgs-art{ border-radius:var(--radius-lg); overflow:hidden; }
#screen-howto .pic{ flex:1 1 auto; min-height:0; display:flex; align-items:center; justify-content:center; }
#screen-howto .pic .dgs-art{ height:100%; max-height:44vh; aspect-ratio:1/1; max-width:100%; display:grid; place-items:center; padding:8px; }
#screen-howto .pic svg{ width:100%; height:100%; }
#screen-howto .dgs-caption{ min-height:2.9em; display:block; }
#screen-howto .dgs-btns{ gap:4px; }
#screen-session .col,#screen-rest .col{ justify-content:center; }
#screen-session .dgs-hero{ flex:0 1 auto; max-height:24vh; }
#screen-session #mood-block .dgs-caption{ font-size:24px; line-height:32px; }
#screen-rest .dgs-hero{ max-height:36vh; }
@media (max-height:700px){ #screen-session .dgs-hero{ display:none; } #screen-rest .dgs-hero{ max-height:28vh; } }

/* Play screen */
#screen-game{ gap:var(--space-2); }
#screen-game .gamebody{ padding:0; width:100%; max-width:820px; margin:0 auto; }
.caption .replay::before{ background:var(--primary); }
.jobtile{ box-shadow:inset 0 0 0 2px var(--divider),var(--shadow-card); color:var(--text); }
.jobtile:focus-visible{ outline:3px solid var(--focus-ring); outline-offset:3px; }
.caption{ box-shadow:var(--shadow-card); }
.jobpick{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; margin-top:4px; }
.jobpick label{ display:flex; align-items:center; gap:10px; min-height:60px; padding:6px 12px; border-radius:var(--radius-sm); background:var(--surface-sunk); font-size:18px; line-height:1.3; }
.jobpick input{ width:28px; height:28px; accent-color:var(--primary); flex:0 0 auto; }
html.hc .jobtile,html.hc .caption,body.hc .jobtile,body.hc .caption{ box-shadow:inset 0 0 0 3px #000; }
body.hc .slot .ring{ border-color:#0f2a0a; }
body.hc .slot .shape{ opacity:.35; }
@media (prefers-reduced-motion: reduce){
  .steam{ opacity:.9; }
  /* the one exception: a slow, gentle pulse on the target spot */
  .slot.is-pulse .ring{ animation:lcpulse 2s ease-in-out infinite !important; }
}
@media (min-width:700px){
  :root{ --tap:88px; --item:104px; }
  .jobgrid{ grid-template-columns:repeat(4,1fr); }
  .jobgrid.two{ grid-template-columns:1fr 1fr; }
}
@media (min-aspect-ratio:1/1) and (max-width:699px){ .jobgrid{ grid-template-columns:repeat(4,1fr); } }
/* Phone held sideways: picture on the left; prompt, items and Rest on the right */
@media (orientation: landscape) and (max-height:560px){
  :root{ --tap:64px; }
  .caption{ min-height:60px; }
}
@media (orientation: landscape) and (max-height:900px){
  .gamebody{ max-width:none; display:grid; grid-template-columns:minmax(0,1fr) minmax(220px,42%); grid-template-rows:auto 1fr auto; column-gap:16px; position:relative; }
  .gamebody > .caption{ grid-column:1 / -1; grid-row:1; }
  .gamebody.playing > .caption{ grid-column:2; grid-row:1; }
  #job-menu{ grid-column:1 / -1; grid-row:2 / 4; }
  #play-area{ display:contents; }
  .stagewrap{ grid-column:1; grid-row:1 / 4; }
  .tray{ grid-column:2; grid-row:2; flex-wrap:wrap; align-content:center; align-self:center; }
  #game-rest{ grid-column:2; grid-row:3; }
  .reward{ position:static; grid-column:2; grid-row:2; }
  .tray,.tray.left,.tray.right{ min-height:0; padding:8px 6px; gap:6px; background:var(--wood); border-radius:20px; justify-content:center; align-items:center; }
  .tray::before,.tray::after{ display:none; }
  .gamebody:not(.playing) #game-rest{ grid-column:1 / -1; }
}
/* Design refinement from Joyce's design partner, 5 Nov 2026 (folded into the build; speed fixes marked). */
/* 2026 visual refinement — shared accessibility guardrails. */
.dgs-btn:focus-visible,.dgs-round:focus-visible,.dgs-back:focus-visible,
button:focus-visible,[role="button"]:focus-visible{outline:4px solid var(--focus-ring);outline-offset:4px;}
.dgs-btn--primary{background-image:linear-gradient(160deg,rgba(255,255,255,.13),transparent 54%);}
.dgs-btn--secondary{background-image:linear-gradient(180deg,rgba(255,255,255,.9),rgba(255,255,255,.14));}
.dgs-notice{border:1px solid var(--divider);}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;}}

/* Chores: stronger object-to-slot affordance, quiet dimensional room. */
.stage{background:linear-gradient(145deg,#e6f0dc,#f6f0da);box-shadow:inset 0 0 0 3px rgba(63,107,43,.2),0 16px 34px rgba(45,65,32,.13);}
.scene-bg svg{filter:saturate(1.04) contrast(1.035);}
.slot .ring{border:3px dashed rgba(47,82,32,.52);background:rgba(255,255,255,.10);}
.slot.has-shape .shape{opacity:.26;}
.slot.is-glow .ring{border:4px solid #8a5b0b;background:rgba(255,227,143,.42);box-shadow:0 0 0 7px rgba(255,240,181,.42),0 0 22px rgba(97,70,20,.24);}
.slot.is-selected .ring{border-style:solid;}
.item{filter:drop-shadow(0 7px 5px rgba(35,48,26,.23));}
.item.is-selected{background:radial-gradient(circle,rgba(255,222,130,.48) 0 58%,transparent 61%);outline:3px solid var(--primary);outline-offset:0;}
.slot.is-filled .fill{filter:drop-shadow(0 5px 3px rgba(35,48,26,.25));}
.jobtile .tileart{background:linear-gradient(145deg,#f8f8ed,#e8f2df);}
.jobtile{transition:transform .15s ease,box-shadow .15s ease;}
.jobtile:focus-visible{outline:4px solid var(--focus-ring);outline-offset:3px;}
@media(prefers-reduced-motion:reduce){.jobtile,.slot,.item{transition:none!important;}}

/* "All games": back to the Gentle Games landing page, top corner of the start screen */
.dgs-allgames{ display:inline-flex; align-items:center; gap:6px; min-height:48px; padding:0 14px; border-radius:999px; background:var(--surface); color:var(--primary-ink, var(--primary)); text-decoration:none; font-size:17px; font-weight:700; box-shadow:inset 0 0 0 2px var(--border); flex:none; white-space:nowrap; }
.dgs-allgames .dgs-icon{ width:22px; height:22px; }
.dgs-allgames:active{ transform:scale(.96); }
.dgs-allgames:focus-visible{ outline:3px solid var(--focus-ring); outline-offset:3px; }
.dgs-topbar.has-allgames{ justify-content:flex-start; gap:10px; padding-right:68px; }
/* Narrow phones: "All games" on the first row (beside the sound button), the language switch on the row below */
@media (max-width:520px){
  .dgs-topbar.has-allgames{ flex-wrap:wrap; row-gap:8px; padding-right:0; }
  .dgs-topbar.has-allgames .dgs-allgames{ margin-right:100%; }
}
/* Very short screens: drop the tablet tip under the buttons so the start screen still fits without scrolling */
@media (max-width:520px) and (max-height:700px){ .dgs-topbar.has-allgames ~ .dgs-footnote{ display:none; } }
/* ==== END SECTION: STYLES ==== */
</style>

<body>

<!-- ==== SECTION: MARKUP ==== -->
<!-- Screens follow the MOO Dementia Games kit. SCREENS fills the words from STRINGS and KIT.STR, so every word can switch language. -->

<!-- Sound button, top right on the start, how-to, end and rest screens (the game screen has its own) -->
<button id="muteBtn" class="dgs-round mutebtn" type="button" aria-pressed="false"></button>

<!-- First launch only: language for the person playing -->
<section class="screen" id="screen-language" hidden><div class="col dgs-center" id="lang-body"></div></section>

<!-- Start: language at the top, name, picture, Play, then the two guide buttons -->
<section class="screen" id="screen-start" hidden>
  <div class="col">
    <div class="dgs-topbar has-allgames"><a class="dgs-allgames" href="../"><svg class="dgs-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg><span>All games</span></a><div class="dgs-lang" id="start-lang" role="group" aria-label="Language / 语言"></div></div>
    <h1 class="dgs-title" id="start-title"></h1>
    <div class="dgs-hero" style="--hero-ratio:354/286"><div class="dgs-art" id="start-art"></div></div>
    <div class="dgs-btns">
      <button id="btn-play" class="dgs-btn dgs-btn--primary dgs-btn--play" type="button"></button>
      <div class="dgs-guides">
        <button id="btn-howto" class="dgs-guide" type="button"></button>
        <button id="btn-care" class="dgs-guide" type="button"></button>
      </div>
    </div>
    <p class="dgs-footnote" data-i18n="start.tablet"></p>
  </div>
</section>

<!-- How to play: 4 steps -->
<section class="screen" id="screen-howto" hidden>
  <div class="col">
    <div class="dgs-topbar"><button id="howto-back" class="dgs-back" type="button"></button></div>
    <div class="pic"><div class="dgs-art" id="howto-art"></div></div>
    <p class="dgs-caption" id="howto-text"></p>
    <div class="dgs-dots" id="howto-dots" aria-hidden="true"></div>
    <div class="dgs-btns">
      <button id="howto-next" class="dgs-btn dgs-btn--primary" type="button"></button>
      <button id="howto-skip" class="dgs-btn dgs-btn--quiet" type="button"></button>
    </div>
  </div>
</section>

<!-- For Caregivers (open to everyone) -->
<section class="screen" id="screen-care" hidden>
  <div class="col">
    <div class="dgs-topbar"><button id="care-back" class="dgs-back" type="button"></button></div>
    <div class="scroll" id="care-body"></div>
  </div>
</section>

<!-- Caregiver settings (opened by holding the button) -->
<section class="screen" id="screen-settings" hidden>
  <div class="col">
    <div class="dgs-topbar"><button id="settings-close" class="dgs-back" type="button"></button></div>
    <div class="scroll" id="settings-body"></div>
  </div>
  <input type="file" id="in-restore" accept="application/json,.json" hidden>
</section>

<!-- Play: job pictures, then the job itself -->
<section class="screen" id="screen-game" hidden>
  <div class="dgs-topbar">
    <button class="dgs-back" id="game-menu" type="button"></button>
    <span class="grow"></span>
    <button class="dgs-round" id="game-help" type="button"></button>
    <button class="dgs-round mutebtn" id="game-mute" type="button"></button>
  </div>

  <div class="gamebody">
    <div class="caption">
      <button class="replay" id="caption-replay" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="solid" d="M4 10v4h4l5 4V6L8 10H4z"/><path d="M16.5 9.2a4 4 0 0 1 0 5.6"/></svg></button>
      <div class="text" id="game-caption" aria-live="polite"></div>
    </div>
    <div id="job-menu" class="jobgrid"></div>

    <div id="play-area" hidden>
      <div class="stagewrap" id="stagewrap">
        <div class="stage" id="stage">
          <div id="stage-slots"></div>
        </div>
      </div>
      <div class="tray" id="tray"></div>
      <div class="reward" id="reward" hidden></div>
      <div id="stage-ghost" class="ghost" aria-hidden="true"></div>
    </div>

    <button class="dgs-btn dgs-btn--secondary" id="game-rest" type="button"></button>
  </div>
</section>

<!-- That was lovely: rest or keep playing, then an optional mood face -->
<section class="screen" id="screen-session" hidden>
  <div class="col">
    <div class="dgs-hero" style="--hero-ratio:354/286"><div class="dgs-art" id="session-art"></div></div>
    <h2 class="dgs-screen-title" data-i18n="session.title"></h2>
    <div class="dgs-btns">
      <button class="dgs-btn dgs-btn--primary dgs-btn--play" id="btn-session-rest" type="button"></button>
      <button class="dgs-btn dgs-btn--secondary" id="btn-session-keep" type="button"></button>
    </div>
    <div id="mood-block" class="dgs-btns" hidden>
      <p class="dgs-caption" data-i18n="session.moodTitle"></p>
      <div class="dgs-moods" id="moods"></div>
      <button class="dgs-btn dgs-btn--quiet" id="btn-mood-skip" type="button"></button>
    </div>
  </div>
</section>

<!-- Rest well -->
<section class="screen" id="screen-rest" hidden>
  <div class="col">
    <div class="dgs-hero" style="--hero-ratio:354/286"><div class="dgs-art" id="rest-art"></div></div>
    <h2 class="dgs-title" data-i18n="rest.title"></h2>
    <div id="rest-quote"></div>
    <div class="dgs-btns">
      <button class="dgs-btn dgs-btn--primary dgs-btn--play" id="btn-rest-play" type="button"></button>
      <button class="dgs-btn dgs-btn--quiet" id="btn-rest-home" type="button"></button>
    </div>
  </div>
</section>

<!-- Overlays -->
<div id="dialog" hidden><div class="box" id="dialogBox"></div></div>
<div id="toast" aria-live="polite"></div>

<noscript>
  <p style="padding:24px">This game needs JavaScript. / 这个游戏需要开启 JavaScript。</p>
</noscript>

    { id: 'i30', type: 'ikeda', for: 'care', en: 'Let’s encourage our friends who are dedicating themselves to childrearing, caring for the elderly and nursing the sick.', zh: '让我们鼓励正在养育孩子、照顾长辈、护理病人的朋友。', src: '“To My Friends”, Seikyo Shimbun (World Tribune translation, 28 Dec 2022)', zhFrom: 'ours' },

    { id: 'i23', type: 'ikeda', for: 'care', en: 'Recognizing and treasuring the contributions of older people is essential to the long-term flourishing of any society.', zh: '树立真心尊敬高龄人士的风气，无疑是为社会的持续繁荣打稳基础。', src: JT, srcZh: JTZ, zhFrom: 'official' },
    { id: 'i1', type: 'ikeda', for: 'care', en: 'There is a saying, ‘The foolish regard old age as winter; the wise regard it as a golden time.’ Everything depends upon our attitude, how we approach life.', zh: '有句话说：“愚者视老年为冬天，智者视老年为黄金时期。”一切都取决于我们的心态，取决于我们怎样面对人生。', src: 'The Wisdom for Creating Happiness and Peace, Part 1, 9.1 (from A Discussion on the Third Stage of Life, 1998)', zhFrom: 'ours' },
    { id: 'i11', type: 'ikeda', for: 'player', en: 'I believe youth can last a lifetime.', zh: '我相信青春可以持续一生。', src: JT, srcZh: JTZ, zhFrom: 'ours' },
    { id: 'i12', type: 'ikeda', for: 'player', en: 'Inner youthfulness is not a matter of our physical age.', zh: '其实心境年轻与否是不能以实际年龄来下定论的。', src: JT, srcZh: JTZ, zhFrom: 'official' },
    { id: 'i28', type: 'ikeda', for: 'player', en: 'The wisdom and experience of older people is a resource of inestimable worth.', zh: '高龄人士的智慧与经验，是丰富现在未来的宝贵财产。', src: JT, srcZh: JTZ, zhFrom: 'official' },
    { id: 'i5', type: 'ikeda', for: 'player', en: 'The ideal old age might be likened to a magnificent sunset.', zh: '但愿晚年能如承诺翌日亦是晴天的无限夕阳一般，灿烂尽显，光辉四射，向未来的世代送上希望的光明。', src: JT, srcZh: JTZ, zhFrom: 'official' },
    { id: 's2', type: 'saying', for: 'care', en: 'Dementia changes the map, not the worth of the traveler.', zh: '失智症改变的是地图，不是旅人的价值。' },
    { id: 's6', type: 'saying', for: 'care', en: 'The person is still here, even when the story is scattered.', zh: '即使故事零散了，这个人依然在这里。' },
    { id: 's12', type: 'saying', for: 'care', en: 'A diagnosis explains changes; it does not erase a life.', zh: '诊断解释了变化，但抹不去一个人的一生。' },
    { id: 's20', type: 'saying', for: 'care', en: 'Confusion is not stubbornness.', zh: '糊涂不是固执。' },
    { id: 's30', type: 'saying', for: 'care', en: 'Repetition is not failure; it is a need for reassurance.', zh: '反复问同一件事不是失败，而是需要安心。' },
    { id: 's43', type: 'saying', for: 'care', en: 'Behavior is communication when language falters.', zh: '当语言跟不上时，行为就是在表达。' },
    { id: 's44', type: 'saying', for: 'care', en: 'Look for the need behind the noise.', zh: '留意吵闹背后的需要。' },
    { id: 's54', type: 'saying', for: 'care', en: 'People remember how they were made to feel.', zh: '人们会记得别人带给自己的感受。' },
    { id: 's76', type: 'saying', for: 'care', en: 'Validation is not agreement; it is acknowledgment.', zh: '认同感受不等于同意，而是表示“我明白”。' },
    { id: 's29', type: 'saying', for: 'care', en: 'Familiar rituals are memory’s handrails.', zh: '熟悉的日常习惯，是记忆的扶手。' },
    { id: 's72', type: 'saying', for: 'care', en: 'Dementia is a condition, not an identity.', zh: '失智症是一种病况，不是一个人的身份。' },
    { id: 's28', type: 'saying', for: 'care', en: 'Music can reach where explanation cannot.', zh: '音乐能到达解释到不了的地方。' },
    { id: 'e34', type: 'encourage', for: 'care', en: 'Rest is part of care, not a break from it.', zh: '休息是照顾的一部分，不是中断。' },
    { id: 'e63', type: 'encourage', for: 'care', en: 'You can love someone and still need respite.', zh: '您可以爱一个人，同时也需要喘息。' },
    { id: 'e33', type: 'encourage', for: 'care', en: 'Caregiver guilt is common; it is not a reliable judge.', zh: '照顾者的内疚很常见，但它不是可靠的判官。' },
    { id: 'e86', type: 'encourage', for: 'care', en: 'Burnout is a signal, not a verdict.', zh: '累垮是一个信号，不是一个判决。' },
    { id: 'e97', type: 'encourage', for: 'care', en: 'You do not need a cure to offer care.', zh: '不需要治愈，也能给予照顾。' },
    { id: 'e98', type: 'encourage', for: 'care', en: 'You do not need perfect words to offer presence.', zh: '不需要完美的话语，也能陪伴在旁。' },
    { id: 'e90', type: 'encourage', for: 'care', en: 'No one should have to improvise dementia care alone.', zh: '没有人应该独自摸索怎样照顾失智的家人。' },
    { id: 'e83', type: 'encourage', for: 'care', en: 'Love can be practical: a pill box, a nightlight, a labeled drawer.', zh: '爱可以很实际：一个药盒、一盏小夜灯、一个贴了标签的抽屉。' },
    { id: 'e4', type: 'encourage', for: 'player', en: 'A good day can be small: warm light, familiar music, a hand nearby.', zh: '美好的一天可以很简单：温暖的光、熟悉的音乐、身边有一只手。' },
    { id: 'e95', type: 'encourage', for: 'player', en: 'A good moment is not a small thing.', zh: '美好的片刻，不是小事。' },
    { id: 'e91', type: 'encourage', for: 'player', en: 'Aging can still include wonder.', zh: '年纪大了，依然可以有惊喜。' },
    { id: 'e96', type: 'encourage', for: 'player', en: 'The present is where connection lives.', zh: '当下，就是我们相连的地方。' },
    { id: 't4', type: 'tip', for: 'care', en: 'Communicate face-to-face, one idea at a time, with short sentences and time to respond.', zh: '面对面说话，一次只说一件事，句子简短，给对方时间回应。' },
    { id: 't6', type: 'tip', for: 'care', en: 'Use names and reminders; avoid quizzing with “Do you remember?”', zh: '多叫名字、多提示；不要用“您还记得吗？”来考他们。' },
    { id: 't7', type: 'tip', for: 'care', en: 'Offer two clear choices rather than open-ended questions.', zh: '给两个清楚的选择，而不是开放式的问题。' },
    { id: 't8', type: 'tip', for: 'care', en: 'Reduce noise, clutter and background TV during conversation and meals.', zh: '说话和吃饭时，减少噪音、杂物和开着的电视。' },
    { id: 't20', type: 'tip', for: 'care', en: 'Check hearing and vision; use glasses and hearing aids, because poor senses worsen confusion.', zh: '检查听力和视力；戴好眼镜和助听器，感官不好会让人更糊涂。' },
    { id: 't37', type: 'tip', for: 'care', en: 'Offer familiar music from their youth; use it to calm and connect.', zh: '放他们年轻时熟悉的音乐，用来安抚和交流。' },
    { id: 't48', type: 'tip', for: 'care', en: 'Stop activities when frustration rises; redirect to something easier.', zh: '一开始烦躁，就停下活动，换一件更容易的事。' },
    { id: 't50', type: 'tip', for: 'care', en: 'Respond to emotion first, facts second.', zh: '先回应情绪，再谈事实。' },
    { id: 't52', type: 'tip', for: 'care', en: 'Look for unmet needs behind agitation: pain, hunger, the toilet, noise or tiredness.', zh: '找出烦躁背后没被满足的需要：疼痛、饥饿、要上厕所、太吵或太累。' },
    { id: 't60', type: 'tip', for: 'care', en: 'Plan for late-afternoon restlessness: an earlier dinner, a calm evening, lights on.', zh: '为傍晚的不安做准备：早点吃晚饭，晚上保持安静，把灯打开。' },
    { id: 't72', type: 'tip', for: 'care', en: 'Take scheduled breaks; respite is maintenance, not luxury.', zh: '安排固定的休息时间；喘息是保养，不是奢侈。' },
    { id: 't71', type: 'tip', for: 'care', en: 'Accept help specifically; keep a list of tasks others can do.', zh: '有人说要帮忙时，具体地接受；准备一张别人可以帮忙做的事的清单。' }
  ];

/* ---------------------------------------------------------------
   STORAGE: localStorage, with an in-memory copy if the phone refuses
---------------------------------------------------------------- */
const __memStore = new Map();

(function checkStorage() {
  try {
    const k = 'dgs.__test';
    localStorage.setItem(k, '1');
    localStorage.removeItem(k);
  } catch (e) {
    RUNTIME.storageOK = false;
  }
})();

function storeGet(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    if (raw === null) return __memStore.has(key) ? __memStore.get(key) : fallback;
    try { return JSON.parse(raw); }
    catch (e) { return raw; }       /* another game may have saved a plain string */
  } catch (e) {
    return __memStore.has(key) ? __memStore.get(key) : fallback;
  }
}

function storeSet(key, value) {
  __memStore.set(key, value);
  try { localStorage.setItem(key, JSON.stringify(value)); }
  catch (e) { RUNTIME.storageOK = false; }
}

function storeRemove(key) {
  __memStore.delete(key);
  try { localStorage.removeItem(key); } catch (e) {}
}

function gameKey(name) {
  return CONFIG.STORAGE_PREFIX + CONFIG.GAME_ID + '.' + name;
}

function sharedGet(name, fallback) {
  return storeGet(CONFIG.SHARED[name], fallback);
}

/* Shared keys are read by all six games: text is saved plain ("en"), never JSON-quoted. */
function sharedSet(name, value) {
  const key = CONFIG.SHARED[name];
  __memStore.set(key, value);
  if (!KIT.sharedWrite(key, value)) RUNTIME.storageOK = false;
}

function settingGet(name, fallback) {
  if (name in CONFIG.SHARED) return sharedGet(name, fallback);
  return storeGet(gameKey(name), fallback);
}

/* Save a setting and apply it straight away */
function settingSet(name, value) {
  if (name in CONFIG.SHARED) sharedSet(name, value);
  else storeSet(gameKey(name), value);
  RUNTIME.settings[name] = value;

  switch (name) {
    case 'musicVolume': applyMusicVolume(); break;
    case 'contrast':    updateContrast();   break;
    case 'muteAll':
      applyMusicVolume();
      if (value) stopSpeech();
      break;
  }
}

/* Make sure a stored value is one we understand; otherwise use the default */
function cleanSetting(name, v) {
  const d = CONFIG.DEFAULTS[name];
  switch (name) {
    case 'lang':        return v === 'zh-CN' ? 'zh-CN' : 'en';
    case 'level':       return CONFIG.LEVELS.indexOf(v) >= 0 ? v : d;
    case 'tableStyle':  return CONFIG.TABLE_STYLES.indexOf(v) >= 0 ? v : d;
    case 'handedness':  return CONFIG.HANDEDNESS.indexOf(v) >= 0 ? v : d;
    case 'bgMusic':     return v === 'soft' ? 'soft' : 'off';
    case 'sessionMinutes': return CONFIG.SESSION_MINUTES_CHOICES.indexOf(Number(v)) >= 0 ? Number(v) : d;
    case 'musicVolume':
    case 'speechVolume': {
      const n = Number(v);
      return (isFinite(n) && n >= 0 && n <= 1) ? n : d;
    }
    case 'onlineVoice':
    case 'contrast':
    case 'muteAll':     return typeof v === 'boolean' ? v : (v === 'true' ? true : v === 'false' ? false : d);
    case 'jobsShown': {
      const ids = CONFIG.JOBS.map(function (j) { return j.id; });
      const ok = Array.isArray(v) ? v.filter(function (x) { return ids.indexOf(x) >= 0; }) : [];
      return ok.length ? ok : d.slice();
    }
    default:            return v;
  }
}

function loadSettings() {
  const s = {};
  for (const name of Object.keys(CONFIG.DEFAULTS)) {
    s[name] = cleanSetting(name, settingGet(name, CONFIG.DEFAULTS[name]));
  }
  /* earlier test builds saved six jobs as the default list: show all ten instead */
  if (s.jobsShown.join(',') === 'table,laundry,plants,tea,hang,dishes') s.jobsShown = CONFIG.DEFAULTS.jobsShown.slice();
  RUNTIME.settings = s;
  RUNTIME.lang = s.lang;
  try { document.documentElement.lang = RUNTIME.lang; } catch (e) {}
  updateContrast();
}

function requestPersistence() {
  try {
    if (navigator.storage && typeof navigator.storage.persist === 'function') {
      navigator.storage.persist().catch(function () {});
    }
  } catch (e) {}
}

/* ---------------------------------------------------------------
   SESSION LIST (for the caregiver). Never a score.
   One entry per session, updated as the session goes on.
---------------------------------------------------------------- */
function getSessionLog() {
  const v = storeGet(gameKey('sessionLog'), []);
  return Array.isArray(v) ? v : [];
}

function upsertSessionLog(entry) {
  const log = getSessionLog();
  const i = log.findIndex(function (e) { return e && e.id === entry.id; });
  if (i >= 0) log[i] = Object.assign({}, log[i], entry);
  else log.push(entry);
  while (log.length > 200) log.shift();
  storeSet(gameKey('sessionLog'), log);
}

function findSessionLog(id) {
  return getSessionLog().find(function (e) { return e && e.id === id; }) || null;
}

/* ---------------------------------------------------------------
   BACK UP / RESTORE / CLEAR
---------------------------------------------------------------- */
function buildBackup() {
  const backup = {
    version: 4,
    game: CONFIG.GAME_ID,
    exportedAt: new Date().toISOString(),
    shared: {},
    settings: {},
    state: {
      setupHome: !!storeGet(gameKey('setupHome'), false),
      setupGuide: !!storeGet(gameKey('setupGuide'), false)
    },
    log: getSessionLog()
  };
  for (const name of Object.keys(CONFIG.SHARED)) backup.shared[name] = sharedGet(name, null);
  for (const name of Object.keys(CONFIG.DEFAULTS)) {
    if (!(name in CONFIG.SHARED)) backup.settings[name] = settingGet(name, CONFIG.DEFAULTS[name]);
  }
  return backup;
}

async function exportBackup() {
  const json = JSON.stringify(buildBackup(), null, 2);
  const filename = 'littlechores-backup-' + new Date().toISOString().slice(0, 10) + '.json';

  /* 1. the phone's share sheet (save to Files, or send to yourself) */
  try {
    if (navigator.share && navigator.canShare && typeof File === 'function') {
      const file = new File([json], filename, { type: 'application/json' });
      if (navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: 'Little Chores backup' });
        return true;
      }
    }
  } catch (e) {
    if (e && e.name === 'AbortError') return true;   /* the caregiver closed the sheet */
  }

  /* 2. a normal download */
  try {
    const blob = new Blob([json], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a);
    a.click();
    setTimeout(function () {
      try { document.body.removeChild(a); } catch (e) {}
      URL.revokeObjectURL(url);
    }, 1000);
    return true;
  } catch (e) {
    return false;
  }
}

/* Read a backup file. Returns a preview; nothing changes until commitBackup. */
function readBackup(text) {
  let data;
  try { data = JSON.parse(text); }
  catch (e) { return { ok: false, error: 'notValid' }; }
  if (!data || typeof data !== 'object' || !data.settings) return { ok: false, error: 'notValid' };
  if (data.game !== CONFIG.GAME_ID) return { ok: false, error: 'otherGame' };
  return {
    ok: true,
    data: data,
    summary: {
      exportedAt: data.exportedAt || null,
      logCount: Array.isArray(data.log) ? data.log.length : 0
    }
  };
}

function commitBackup(data) {
  try {
    for (const k of Object.keys(data.settings || {})) {
      if (k in CONFIG.DEFAULTS && !(k in CONFIG.SHARED)) {
        settingSet(k, cleanSetting(k, data.settings[k]));
      }
    }
    for (const k of Object.keys(data.shared || {})) {
      if (k in CONFIG.SHARED && data.shared[k] !== null && data.shared[k] !== undefined) {
        sharedSet(k, cleanSetting(k, data.shared[k]));
      }
    }
    if (data.state) {
      storeSet(gameKey('setupHome'), !!data.state.setupHome);
      storeSet(gameKey('setupGuide'), !!data.state.setupGuide);
    }
    if (Array.isArray(data.log)) storeSet(gameKey('sessionLog'), data.log.slice(-200));
    loadSettings();
    return true;
  } catch (e) {
    return false;
  }
}

/* Clears THIS game only. Shared language and level are left alone. */
function clearAllData() {
  const prefix = CONFIG.STORAGE_PREFIX + CONFIG.GAME_ID + '.';
  const toRemove = [];
  try {
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.indexOf(prefix) === 0) toRemove.push(k);
    }
  } catch (e) {}
  for (const k of Array.from(__memStore.keys())) {
    if (k.indexOf(prefix) === 0) toRemove.push(k);
  }
  for (const k of toRemove) storeRemove(k);
  loadSettings();
}

function setLang(lang) {
