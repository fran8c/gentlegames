/* ==== SECTION: STYLES ==== */
/* MOO Dementia Games kit v1 (DGS_KIT_VERSION). Part 1 is identical in every game except the palette

/* ---------- 1. Tokens: Photo Album palette ---------- */
:root{
  --bg:#fff4e0; --surface:#ffffff; --surface-sunk:#fbe9cc; --text:#3b2a1a; --text-muted:#6b5644;
  --primary:#b45309; --primary-ink:#9a4708; --primary-strong:#8a3d06; --primary-soft:#fde7c2; --on-primary:#ffffff;

  --tap-min:72px; --tap-play:104px; --icon:32px; --icon-lg:44px; --content-max:560px;

  --font-sans:"PingFang SC","Noto Sans SC","Microsoft YaHei","Hiragino Sans GB",system-ui,-apple-system,"Segoe UI",sans-serif;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px); --safe-r:env(safe-area-inset-right,0px);
}
@media (min-width:700px) and (min-height:560px){ :root{ --tap-min:88px; } }
html.hc{
  --bg:#ffffff; --surface:#ffffff; --surface-sunk:#f0f0f0; --text:#000000; --text-muted:#2b2b2b;
  --primary:#733606; --primary-ink:#733606; --primary-strong:#4a2203; --primary-soft:#f6dfb4;
  --accent:#c87800; --accent-soft:#f6ead0; --border:#000000; --divider:#5c5c5c; --focus-ring:#000000;
}

/* ==== MOO Dementia Games kit v1: shared components (identical in every game) ==== */
/* ---------- 2. Shared components (kit) ---------- */
*,*::before,*::after{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

.dgs-icon{ width:var(--icon); height:var(--icon); flex:none; display:block; }

.screen{

}

.scroll::-webkit-scrollbar{ width:0; }
.scroll > .col{ max-width:var(--content-max); margin:0 auto; display:flex; flex-direction:column; gap:var(--space-3); }

/* Buttons */
.dgs-btn{
  appearance:none; border:0; margin:0; cursor:pointer;
  display:flex; align-items:center; justify-content:center; gap:var(--space-2);

.dgs-btn:focus-visible,.dgs-guide:focus-visible,.dgs-round:focus-visible,.dgs-lang button:focus-visible,.dgs-hold:focus-visible,.dgs-level:focus-visible,.dgs-mood:focus-visible,.dgs-seg button:focus-visible,.dgs-switch:focus-visible{ outline:3px solid var(--focus-ring); outline-offset:3px; }

.dgs-round:active,.dgs-guide:active,.dgs-level:active,.dgs-hold:active,.dgs-mood:active,.dgs-seg button:active,.dgs-lang button:active{ transform:scale(.96); }

}

.dgs-title small{ display:block; font-size:20px; line-height:28px; font-weight:600; color:var(--text-muted); letter-spacing:.02em; margin-top:2px; }

/* Picture frame */
.dgs-art{ border-radius:var(--radius-md); background:var(--surface); box-shadow:var(--shadow-card); overflow:hidden; display:block; }
.dgs-art img,.dgs-art svg{ width:100%; height:100%; display:block; object-fit:cover; }

/* Guide buttons */
.dgs-guides{ display:grid; grid-template-columns:1fr 1fr; gap:var(--space-2); }
.dgs-guide{ appearance:none; border:0; cursor:pointer; min-height:104px; padding:var(--space-2); border-radius:var(--radius-lg); background:var(--surface); color:var(--text); box-shadow:inset 0 0 0 2px var(--border),var(--shadow-card); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; font-size:21px; line-height:26px; font-weight:700; text-align:center; }

/* Quote (kit Quote): caregiver page top, and the player's Rest screen */
.dgs-quote{ margin:0; padding:18px 20px 16px; border-radius:var(--radius-md); background:var(--accent-soft); display:flex; flex-direction:column; gap:10px; }

.dgs-quote blockquote::before{ content:"“"; } .dgs-quote blockquote::after{ content:"”"; }

.dgs-quick{ display:grid; grid-template-columns:repeat(3,1fr); gap:var(--space-2); padding:var(--space-3); border-radius:var(--radius-md); background:var(--surface); box-shadow:var(--shadow-card); }
.dgs-quick > div{ display:flex; flex-direction:column; align-items:center; gap:8px; text-align:center; }

.dgs-section{ border-radius:var(--radius-md); background:var(--surface); box-shadow:var(--shadow-card); overflow:hidden; }
.dgs-section > summary{ list-style:none; cursor:pointer; display:flex; align-items:center; gap:var(--space-2); min-height:var(--tap-min); padding:var(--space-2) var(--space-4); font-size:24px; line-height:32px; font-weight:700; }

.dgs-section[open] > summary::after{ transform:rotate(-135deg) translate(-3px,-3px); }

.dgs-section__body{ padding:0 var(--space-4) var(--space-4); font-size:19px; line-height:30px; display:flex; flex-direction:column; gap:12px; }

.dgs-seg.many{ display:grid; grid-template-columns:repeat(auto-fit,minmax(118px,1fr)); }
.dgs-seg.many.short{ grid-template-columns:repeat(4,1fr); }

input[type=range]{ -webkit-appearance:none; appearance:none; width:100%; height:48px; background:transparent; margin:0; touch-action:none; }

input[type=range]::-moz-range-thumb{ width:30px; height:30px; border-radius:50%; background:var(--primary); border:4px solid var(--surface); }
.dgs-progress{ height:12px; border-radius:999px; background:var(--surface-sunk); overflow:hidden; }
.dgs-progress i{ display:block; height:100%; background:var(--primary); border-radius:inherit; transition:width .4s ease; }

.dgs-tick{ width:30px; height:30px; border-radius:8px; box-shadow:inset 0 0 0 2px var(--border); display:grid; place-items:center; flex:none; }

.dgs-check.is-done span:last-child{ color:var(--text-muted); text-decoration:line-through; }

/* Notice */
.dgs-notice{ display:grid; grid-template-columns:auto 1fr; gap:12px; align-items:start; padding:14px 18px; border-radius:var(--radius-md); background:var(--accent-soft); font-size:18px; line-height:27px; }
.dgs-notice .dgs-icon{ width:28px; height:28px; }
.dgs-notice b{ display:block; }

/* Mood faces */
.dgs-moods{ display:grid; grid-template-columns:repeat(3,1fr); gap:var(--space-2); width:100%; }
.dgs-mood{ appearance:none; border:0; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:6px; padding:12px 4px; min-height:var(--tap-min); border-radius:var(--radius-md); background:var(--surface); color:var(--text); box-shadow:inset 0 0 0 2px var(--border); }
.dgs-mood svg{ width:min(18vw,72px); height:min(18vw,72px); }
.dgs-mood b{ font-size:22px; line-height:26px; }
.dgs-mood span{ font-size:16px; line-height:20px; color:var(--text-muted); }
.dgs-moods.small .dgs-mood svg{ width:52px; height:52px; }
.dgs-moods.small .dgs-mood b{ font-size:19px; }

/* Rest card */
#restCard{ position:fixed; z-index:45; left:50%; bottom:calc(var(--safe-b) + 24px); width:min(94vw,520px); transform:translate(-50%,140%); opacity:0;
  display:flex; flex-direction:column; gap:var(--space-2); padding:var(--space-4); border-radius:var(--radius-lg) var(--radius-lg) var(--radius-md) var(--radius-md); background:var(--surface); box-shadow:var(--shadow-lift); transition:transform .9s ease, opacity 1.2s ease; }
#restCard.show{ transform:translate(-50%,0); opacity:1; }
#restCard h3{ text-align:center; font-size:26px; line-height:34px; }
#restCard .row{ display:grid; grid-template-columns:1fr 1fr; gap:var(--space-2); }

/* Dialog (never alert()) and toast */
#dialog{ position:fixed; inset:0; z-index:80; background:rgba(0,0,0,.45); display:flex; align-items:center; justify-content:center; padding:16px; }
#dialog .box{ background:var(--surface); border-radius:var(--radius-lg); padding:var(--space-4); width:min(100%,480px); max-height:90vh; overflow:auto; display:flex; flex-direction:column; gap:var(--space-3); text-align:center; box-shadow:var(--shadow-lift); }
#dialog .box h3{ font-size:28px; line-height:36px; }
#dialog .box p,#dialog .box li{ font-size:19px; line-height:28px; text-align:left; }
#dialog .box ul{ margin:0; padding-left:1.1em; }
#dialog .btns{ display:flex; flex-direction:column; gap:var(--space-2); }
.dgs-btn--plain{ background:var(--surface); color:var(--text); box-shadow:inset 0 0 0 2px var(--border); min-height:64px; font-size:20px; font-weight:600; }
#toast{ position:fixed; z-index:90; left:50%; top:calc(var(--safe-t) + 90px); transform:translateX(-50%); background:var(--text); color:var(--surface); border-radius:var(--radius-sm); padding:12px 20px; font-size:18px; font-weight:700; opacity:0; transition:opacity .4s; pointer-events:none; max-width:90vw; text-align:center; }
#toast.show{ opacity:1; }

/* Ghost hand */
#ghost{ position:fixed; z-index:50; left:0; top:0; width:84px; height:84px; pointer-events:none; opacity:0; transition:opacity .5s ease; }
#ghost.show{ opacity:.95; }
#ghost svg{ width:100%; height:100%; filter:drop-shadow(0 4px 8px rgba(0,0,0,.22)); }
#ghostTarget{ position:fixed; z-index:49; width:110px; height:110px; margin:-55px 0 0 -55px; border-radius:50%; border:5px solid var(--accent); box-shadow:0 0 0 8px var(--accent-soft); pointer-events:none; opacity:0; }
#ghostTarget.show{ opacity:1; animation:pulse 2.4s ease-in-out infinite; }
@keyframes pulse{ 0%,100%{ transform:scale(.88); opacity:.6; } 50%{ transform:scale(1.04); opacity:1; } }

/* Captions (every spoken line is shown) */
#caption{
  position:fixed; z-index:40; left:16px; right:16px; margin:0 auto; width:fit-content; transform:translateY(12px); bottom:calc(var(--safe-b) + 130px);
  max-width:min(calc(100vw - 32px),640px); background:var(--surface); color:var(--text);
  border-radius:var(--radius-md); padding:12px 22px; font-size:28px; font-weight:600; text-align:center; line-height:1.4;
  box-shadow:var(--shadow-lift); opacity:0; pointer-events:none; transition:opacity .6s ease, transform .6s ease;
}
#caption.show{ opacity:1; transform:none; }


/* Hero picture on start / end / rest */
.dgs-hero{ flex:1 1 auto; min-height:100px; display:flex; justify-content:center; align-items:center; }
.dgs-hero > .dgs-art{ height:100%; max-height:40vh; aspect-ratio:var(--hero-ratio,1/1); max-width:100%; }
.dgs-col{ width:100%; max-width:var(--content-max); margin:0 auto; display:flex; flex-direction:column; gap:var(--space-3); min-height:0; flex:1 1 auto; }
.dgs-center{ justify-content:center; }
.dgs-btns{ display:flex; flex-direction:column; gap:var(--space-2); }
@media (max-height:640px){ .dgs-title{ font-size:34px; line-height:40px; } .dgs-btn--play{ min-height:88px; } }
@media (prefers-reduced-motion:reduce){ *,*::before,*::after{ animation-duration:.001s !important; animation-iteration-count:1 !important; transition-duration:.001s !important; } }

/* ---------- 3. Photo Album only ---------- */
.screen:not(.active){ display:none !important; }
.hidden{ display:none !important; }
.small{ font-size:16px; color:var(--text-muted); line-height:1.4; }
.ic{ display:inline-flex; }
.row2{ display:flex; gap:12px; width:100%; }
.row2 > *{ flex:1; }
#screen-lang{ justify-content:center; }
#screen-lang .col{ flex:0 0 auto; gap:var(--space-4); }
#screen-lang .dgs-hero{ flex:0 0 auto; height:28vh; }
#screen-lang .dgs-btn--primary,#screen-lang .dgs-btn--secondary{ min-height:96px; font-size:30px; }
#screen-start .col{ gap:var(--space-2); }
.startart,.restart{ border-radius:var(--radius-lg); overflow:hidden; box-shadow:var(--shadow-card); }
.startart img,.restart img{ width:100%; height:100%; object-fit:cover; display:block; }
#screen-howto .pic{ flex:1 1 auto; min-height:0; display:flex; align-items:center; justify-content:center; }
.howto-art{ position:relative; width:min(80vw,340px); aspect-ratio:4/3; }
.howto-art img{ width:100%; height:100%; object-fit:cover; border-radius:18px; box-shadow:var(--shadow-card); }
.howto-badge{ position:absolute; right:-10px; bottom:-14px; width:84px; height:84px; border-radius:50%; background:var(--primary); color:var(--on-primary); display:flex; align-items:center; justify-content:center; font-size:44px; box-shadow:var(--shadow-lift); }
#screen-howto .dgs-caption{ min-height:2.9em; display:block; }
#screen-howto .dgs-btns{ gap:4px; }
#screen-rest .col{ justify-content:safe center; overflow-y:auto; }
#screen-rest .dgs-hero{ max-height:30vh; }
@media (max-height:700px){ #screen-rest .dgs-hero{ display:none; } }

/* Photo screen */
#screen-game{ gap:var(--space-2); }
#screen-game > *{ width:100%; max-width:820px; margin-left:auto; margin-right:auto; }
.game-top{ display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:nowrap; }
.game-top .dgs-btn{ width:auto; min-height:60px; font-size:21px; padding:0 18px; }
.game-top .ic svg,#btn-g-mute svg{ width:30px; height:30px; }
.stagewrap{ flex:1; display:flex; align-items:center; justify-content:center; min-height:0; }
.stage{ width:100%; max-width:720px; height:100%; display:flex; align-items:center; justify-content:center; border-radius:var(--radius-md); overflow:hidden; position:relative;
  background:#fff3dc; box-shadow:inset 0 0 0 2px var(--divider); transition:box-shadow .3s ease; }
.stage svg,.stage img{ width:100%; height:100%; object-fit:contain; display:block; }
.stage .bg{ position:absolute; inset:-24px; width:calc(100% + 48px); height:calc(100% + 48px); object-fit:cover; filter:blur(24px) saturate(1.15); opacity:.6; }
.stage .fg{ position:relative; animation:fadeIn .7s ease; }
@keyframes fadeIn{ from{ opacity:0; } to{ opacity:1; } }
.stage.tapped{ box-shadow:0 0 0 6px var(--accent); }
#progress{ display:flex; gap:7px; justify-content:center; align-items:center; min-height:16px; }
#progress i{ width:9px; height:9px; border-radius:50%; background:var(--divider); transition:transform .2s; }
#progress i.on{ background:var(--primary); transform:scale(1.35); }
.caption{ min-height:84px; display:flex; align-items:center; justify-content:center; text-align:center; padding:4px 12px; font-size:24px; font-weight:600; }
.caption .key{ color:var(--primary-ink); font-weight:800; }
.caption .cwrap{ display:flex; flex-direction:column; align-items:center; gap:4px; max-width:34em; }
.caption .clead{ font-size:24px; font-weight:700; }
.caption .cnote{ font-size:21px; font-weight:500; line-height:1.4; display:-webkit-box; -webkit-line-clamp:4; -webkit-box-orient:vertical; overflow:hidden; }
.caption .cnote.solo{ font-size:23px; font-weight:600; }
.game-bot{ display:flex; justify-content:center; gap:16px; }
.navbtn{ appearance:none; border:0; cursor:pointer; min-width:88px; min-height:76px; border-radius:var(--radius-md); background:var(--surface); box-shadow:inset 0 0 0 2px var(--border),var(--shadow-card);
  display:flex; align-items:center; justify-content:center; font-size:30px; color:var(--primary-ink); }
.navbtn:focus-visible{ outline:3px solid var(--focus-ring); outline-offset:3px; }
.navbtn.heart[aria-pressed="true"]{ background:var(--primary-soft); box-shadow:inset 0 0 0 3px var(--primary),var(--shadow-card); }
.navbtn.heart.pop{ animation:pop .45s; }
@keyframes pop{ 40%{ transform:scale(1.25); } }
.restcard{ position:fixed; left:12px; right:12px; max-width:560px; margin:0 auto; bottom:calc(var(--safe-b) + 100px); background:var(--surface); border-radius:var(--radius-lg);
  padding:16px; display:flex; flex-direction:column; gap:12px; align-items:center; box-shadow:inset 0 0 0 3px var(--primary),var(--shadow-lift);
  opacity:0; transform:translateY(24px); transition:opacity .5s ease,transform .5s ease; pointer-events:none; z-index:5; }
.restcard.show{ opacity:1; transform:none; pointer-events:auto; }
.restcard p{ font-size:24px; font-weight:800; }
.ghosthand{ position:absolute; left:50%; top:50%; width:84px; height:84px; margin:-42px 0 0 -42px; pointer-events:none; z-index:4; opacity:0; transition:opacity .4s; }
.ghosthand.show{ opacity:1; }
.ghosthand.show svg{ animation:ghosttap 2.4s ease-in-out infinite; }
.ghosthand .ring{ position:absolute; left:4px; top:-6px; width:40px; height:40px; border-radius:50%; border:4px solid var(--accent); opacity:0; }
.ghosthand.show .ring{ animation:ghostring 2.4s ease-out infinite; }
@keyframes ghosttap{ 0%{ transform:translate(40px,50px); } 45%{ transform:translate(0,0); } 55%{ transform:translate(0,6px) scale(.94); } 70%{ transform:translate(0,0); } 100%{ transform:translate(40px,50px); } }
@keyframes ghostring{ 0%,50%{ opacity:0; transform:scale(.6); } 60%{ opacity:.9; } 90%,100%{ opacity:0; transform:scale(1.5); } }
body.idle-dim .game-top,body.idle-dim .game-bot,body.idle-dim #progress{ opacity:.3; transition:opacity 2s; }

/* Photos list, names and voices (caregiver settings) */
.plist{ display:flex; flex-direction:column; gap:10px; }
.pitem{ display:flex; align-items:center; gap:12px; border-radius:var(--radius-sm); padding:8px; background:var(--surface-sunk); }
.pitem img{ width:64px; height:64px; object-fit:cover; border-radius:10px; background:var(--primary-soft); flex:none; }
.pitem.hiddenphoto img{ opacity:.4; }
.pitem .pname{ flex:1; font-size:18px; min-width:0; }
.pitem .pname.wrap{ white-space:normal; word-break:break-word; }
.pitem .pname svg{ width:18px; height:18px; vertical-align:-3px; color:var(--primary); }
.pitem .pnote{ display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; font-size:15px; color:var(--text-muted); line-height:1.35; margin-top:2px; }
.pitem .pbtns{ display:flex; flex-direction:column; gap:6px; flex:none; }
.pitem button{ appearance:none; cursor:pointer; min-width:92px; min-height:52px; padding:6px 12px; border-radius:12px; border:0; background:var(--surface); box-shadow:inset 0 0 0 2px var(--border); font-size:17px; font-weight:700; color:var(--text); }
.pitem button.edit{ color:var(--primary-ink); box-shadow:inset 0 0 0 2px var(--primary); }
.pitem button.danger,.dgs-btn.danger{ color:#8a1c1c; box-shadow:inset 0 0 0 2px #c86a6a; }
.thumbs{ display:flex; gap:10px; flex-wrap:wrap; }
.thumbs figure{ margin:0; width:84px; display:flex; flex-direction:column; align-items:center; gap:4px; font-size:15px; text-align:center; line-height:1.25; }
.thumbs img{ width:84px; height:84px; object-fit:cover; border-radius:12px; background:var(--primary-soft); }
input[type=text],textarea{ width:100%; min-height:60px; font-size:20px; padding:10px 14px; border-radius:14px; border:2px solid var(--border); background:var(--surface); color:var(--text); font-family:inherit; -webkit-user-select:text; user-select:text; }
textarea{ min-height:112px; line-height:1.45; resize:vertical; }
textarea:focus,input[type=text]:focus{ outline:3px solid var(--focus-ring); outline-offset:2px; }
.modal{ position:fixed; inset:0; background:rgba(40,24,8,.5); display:flex; align-items:center; justify-content:center; padding:16px; z-index:85; }
.modalcard{ background:var(--surface); border-radius:var(--radius-lg); padding:20px; width:100%; max-width:520px; max-height:88vh; overflow-y:auto; display:flex; flex-direction:column; gap:14px; box-shadow:var(--shadow-lift); }
.modalcard > *{ flex-shrink:0; }
.modalcard h3{ font-size:24px; }
.modalcard h3 .count{ display:block; font-size:16px; font-weight:600; color:var(--text-muted); }
.modalcard p{ font-size:19px; }
.nvphoto{ width:100%; aspect-ratio:4/3; border-radius:14px; overflow:hidden; background:var(--primary-soft); display:flex; align-items:center; justify-content:center; }
.nvphoto img,.nvphoto svg{ width:100%; height:100%; object-fit:contain; }
.recbar{ display:flex; align-items:center; gap:10px; font-size:18px; }
.recbar .dot{ width:14px; height:14px; border-radius:50%; background:#b3261e; animation:recblink 1s infinite; }
@keyframes recblink{ 50%{ opacity:.25; } }
.progressbar{ height:14px; border-radius:7px; background:var(--divider); overflow:hidden; }
.progressbar i{ display:block; height:100%; width:0; background:var(--primary); transition:width .2s; }
.dgs-card .dgs-btn{ margin-top:8px; }
@media (max-height:700px){ .caption{ min-height:64px; font-size:21px; } .navbtn{ min-height:64px; } }
@media (prefers-reduced-motion:reduce){ .ghosthand.show svg,.ghosthand.show .ring{ animation:none; } .ghosthand.show .ring{ opacity:.9; } }

.thumb-ph{ display:grid; place-items:center; width:64px; height:64px; flex:none; border-radius:10px; background:var(--primary-soft, #f5e6cf); color:var(--primary-ink, #8a4a0a); }
.thumb-ph .dgs-icon{ width:50%; height:50%; }

/* No photos yet: a clear first step */
.start-addphotos{ margin:2px 0 0; text-align:center; font-size:19px; line-height:26px; color:var(--text-muted); }
.cg-addfirst{ box-shadow:inset 0 0 0 3px var(--primary), var(--shadow-card); }
/* High contrast: a solid card behind the photo caption, so it is always readable */
html.hc #caption{ background:#fff; color:#000; border:3px solid #000; box-shadow:0 0 0 4px rgba(255,255,255,.9); }
html.hc #caption .key{ color:#000; text-decoration:underline; text-underline-offset:5px; }
#caption{ box-sizing:border-box; max-width:min(calc(100vw - 32px), 640px) !important; }   /* never wider than the screen */
/* Design refinement from Joyce's design partner, 5 Nov 2026 (folded into the build; speed fixes marked). */
/* 2026 visual refinement — shared accessibility guardrails. */
.dgs-btn:focus-visible,.dgs-round:focus-visible,.dgs-back:focus-visible,
button:focus-visible,[role="button"]:focus-visible{outline:4px solid var(--focus-ring);outline-offset:4px;}
.dgs-btn--primary{background-image:linear-gradient(160deg,rgba(255,255,255,.13),transparent 54%);}
.dgs-btn--secondary{background-image:linear-gradient(180deg,rgba(255,255,255,.9),rgba(255,255,255,.14));}
.dgs-notice{border:1px solid var(--divider);}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;}}

/* Photo Album: a restrained photo-frame treatment, prioritising the original image. */
.stage{background:#f6ebd9!important;box-shadow:inset 0 0 0 3px rgba(115,65,20,.14),0 8px 24px rgba(86,60,34,.11);}
.stage .bg{filter:blur(30px) saturate(.78) brightness(1.05);opacity:.28;}
.stage .fg{filter:drop-shadow(0 4px 10px rgba(52,37,23,.16));}
.caption{border-radius:var(--radius-md);background:rgba(255,252,246,.88);padding:9px 14px;}
.navbtn{background:linear-gradient(165deg,#fffdf8,#fff4e3);border:2px solid transparent;}
.navbtn.heart[aria-pressed="true"]{background:#fce6c8;box-shadow:inset 0 0 0 4px var(--primary),0 3px 12px rgba(126,70,18,.12);}
#progress i.on{width:12px;height:12px;}
@media(max-height:650px){.caption{min-height:58px;padding:4px 8px;}.caption .cnote{font-size:19px;}}

/* "All games": back to the Gentle Games landing page, top corner of the start screen */
.dgs-allgames{ display:inline-flex; align-items:center; gap:6px; min-height:48px; padding:0 14px; border-radius:999px; background:var(--surface); color:var(--primary-ink, var(--primary)); text-decoration:none; font-size:17px; font-weight:700; box-shadow:inset 0 0 0 2px var(--border); flex:none; white-space:nowrap; }
.dgs-allgames .dgs-icon{ width:22px; height:22px; }
.dgs-allgames:active{ transform:scale(.96); }
.dgs-allgames:focus-visible{ outline:3px solid var(--focus-ring); outline-offset:3px; }
.dgs-topbar.has-allgames{ justify-content:flex-start; gap:10px; padding-right:68px; }
/* Narrow phones: "All games" on the first row (beside the sound button), the language switch on the row below */
@media (max-width:520px){
  .dgs-topbar.has-allgames{ flex-wrap:wrap; row-gap:8px; padding-right:0; }
  .dgs-topbar.has-allgames .dgs-allgames{ margin-right:100%; }
}
/* Very short screens: drop the tablet tip under the buttons so the start screen still fits without scrolling */
@media (max-width:520px) and (max-height:700px){ .dgs-topbar.has-allgames ~ .dgs-footnote{ display:none; } }

<body>

<!-- ==== SECTION: MARKUP ==== -->
<!-- Screens follow the MOO Dementia Games kit. Words come from STRINGS or, for shared words, the kit (KIT.STR). -->

<!-- Sound button, top right on the start, how-to and rest screens (the photo screen has its own) -->
<button id="muteBtn" class="dgs-round" type="button" aria-pressed="false"></button>

<!-- First launch: language for the person playing -->
<div id="screen-lang" class="screen"><div class="col dgs-center" id="lang-body"></div></div>

<!-- Start: language at the top, name, picture, Play, then the two guide buttons -->
<div id="screen-start" class="screen">
  <div class="col">
    <div class="dgs-topbar has-allgames"><a class="dgs-allgames" href="../"><svg class="dgs-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg><span>All games</span></a><div class="dgs-lang" id="start-lang" role="group" aria-label="Language / 语言"></div></div>
    <h1 class="dgs-title" id="start-title"></h1>
    <div class="dgs-hero" style="--hero-ratio:4/3"><div class="dgs-art startart" id="start-art"></div></div>
    <div class="dgs-btns">
      <button id="btn-play" class="dgs-btn dgs-btn--primary dgs-btn--play" type="button"></button>
      <p class="start-addphotos" id="start-addphotos" hidden></p>
      <div class="dgs-guides">
        <button id="btn-howto" class="dgs-guide" type="button"></button>
        <button id="btn-caregivers" class="dgs-guide" type="button"></button>
      </div>
    </div>
    <p class="dgs-footnote" data-i18n="tabletNote"></p>
  </div>
</div>

<!-- How to play: 4 steps -->
<div id="screen-howto" class="screen">
  <div class="col">
    <div class="dgs-topbar"><button class="dgs-back" id="btn-howto-back" type="button"></button></div>
    <div class="pic"><div class="howto-art" id="howto-art"></div></div>
    <p class="dgs-caption" id="howto-line"></p>
    <div class="dgs-dots" id="howto-dots" aria-hidden="true"></div>
    <div class="dgs-btns">
      <button id="btn-howto-next" class="dgs-btn dgs-btn--primary" type="button"></button>
      <button id="btn-howto-skip" class="dgs-btn dgs-btn--quiet" type="button"></button>
    </div>
  </div>
</div>

<!-- For Caregivers (open to everyone) -->
<div id="screen-caregivers" class="screen">
  <div class="col">
    <div class="dgs-topbar"><button class="dgs-back" id="btn-cg-back" type="button"></button></div>
    <div class="scroll" id="cg-body"></div>
  </div>
</div>

<!-- Caregiver settings (opened by holding the button) -->
<div id="screen-settings" class="screen">
  <div class="col">
    <div class="dgs-topbar"><button class="dgs-back" id="btn-set-back" type="button"></button></div>
    <div class="scroll" id="set-body"></div>
  </div>
</div>

<!-- Photos -->
<div id="screen-game" class="screen noscroll">
  <div class="game-top">
    <div style="display:flex;gap:10px"><button class="dgs-round" id="btn-g-home" type="button"></button><button class="dgs-round" id="btn-g-help" type="button" aria-label="?"></button></div>
    <div style="display:flex;gap:10px">
      <button class="dgs-round" id="btn-g-mute" type="button" aria-pressed="false"><span class="ic" data-icon="sound"></span></button>
      <button class="dgs-btn dgs-btn--secondary" id="btn-g-rest" type="button"></button>
    </div>
  </div>
  <div class="stagewrap"><div class="stage" id="stage"></div></div>
  <div id="progress" aria-hidden="true"></div>

    { id: 'i30', type: 'ikeda', for: 'care', en: 'Let’s encourage our friends who are dedicating themselves to childrearing, caring for the elderly and nursing the sick.', zh: '让我们鼓励正在养育孩子、照顾长辈、护理病人的朋友。', src: '“To My Friends”, Seikyo Shimbun (World Tribune translation, 28 Dec 2022)', zhFrom: 'ours' },
    { id: 'i44', type: 'ikeda', for: 'care', en: 'Sincere efforts to brighten our surroundings and the lives of others return to illuminate our own final years with dignity.', zh: '真诚地为周围环境和他人的生活带来光明，这份努力会回过来，让我们自己的晚年也充满尊严。', src: JT, zhFrom: 'ours' },
    { id: 'i25', type: 'ikeda', for: 'care', en: 'Individuals who feel needed and strive on behalf of others can keep their youth and energy.', zh: '只要一心怀着急他人所需、为他人尽力的意念，人就可常保朝气，暖和身边之人的心，让社区更显光明。', src: JT, srcZh: JTZ, zhFrom: 'official' },
    { id: 'i23', type: 'ikeda', for: 'care', en: 'Recognizing and treasuring the contributions of older people is essential to the long-term flourishing of any society.', zh: '树立真心尊敬高龄人士的风气，无疑是为社会的持续繁荣打稳基础。', src: JT, srcZh: JTZ, zhFrom: 'official' },
    { id: 'i1', type: 'ikeda', for: 'care', en: 'There is a saying, ‘The foolish regard old age as winter; the wise regard it as a golden time.’ Everything depends upon our attitude, how we approach life.', zh: '有句话说：“愚者视老年为冬天，智者视老年为黄金时期。”一切都取决于我们的心态，取决于我们怎样面对人生。', src: 'The Wisdom for Creating Happiness and Peace, Part 1, 9.1 (from A Discussion on the Third Stage of Life, 1998)', zhFrom: 'ours' },
    { id: 'i11', type: 'ikeda', for: 'player', en: 'I believe youth can last a lifetime.', zh: '我相信青春可以持续一生。', src: JT, srcZh: JTZ, zhFrom: 'ours' },
    { id: 'i12', type: 'ikeda', for: 'player', en: 'Inner youthfulness is not a matter of our physical age.', zh: '其实心境年轻与否是不能以实际年龄来下定论的。', src: JT, srcZh: JTZ, zhFrom: 'official' },
    { id: 'i28', type: 'ikeda', for: 'player', en: 'The wisdom and experience of older people is a resource of inestimable worth.', zh: '高龄人士的智慧与经验，是丰富现在未来的宝贵财产。', src: JT, srcZh: JTZ, zhFrom: 'official' },
    { id: 'i5', type: 'ikeda', for: 'player', en: 'The ideal old age might be likened to a magnificent sunset.', zh: '但愿晚年能如承诺翌日亦是晴天的无限夕阳一般，灿烂尽显，光辉四射，向未来的世代送上希望的光明。', src: JT, srcZh: JTZ, zhFrom: 'official' },
    { id: 's2', type: 'saying', for: 'care', en: 'Dementia changes the map, not the worth of the traveler.', zh: '失智症改变的是地图，不是旅人的价值。' },
    { id: 's6', type: 'saying', for: 'care', en: 'The person is still here, even when the story is scattered.', zh: '即使故事零散了，这个人依然在这里。' },
    { id: 's12', type: 'saying', for: 'care', en: 'A diagnosis explains changes; it does not erase a life.', zh: '诊断解释了变化，但抹不去一个人的一生。' },
    { id: 's20', type: 'saying', for: 'care', en: 'Confusion is not stubbornness.', zh: '糊涂不是固执。' },
    { id: 's30', type: 'saying', for: 'care', en: 'Repetition is not failure; it is a need for reassurance.', zh: '反复问同一件事不是失败，而是需要安心。' },
    { id: 's43', type: 'saying', for: 'care', en: 'Behavior is communication when language falters.', zh: '当语言跟不上时，行为就是在表达。' },
    { id: 's44', type: 'saying', for: 'care', en: 'Look for the need behind the noise.', zh: '留意吵闹背后的需要。' },
    { id: 's54', type: 'saying', for: 'care', en: 'People remember how they were made to feel.', zh: '人们会记得别人带给自己的感受。' },
    { id: 's76', type: 'saying', for: 'care', en: 'Validation is not agreement; it is acknowledgment.', zh: '认同感受不等于同意，而是表示“我明白”。' },
    { id: 's29', type: 'saying', for: 'care', en: 'Familiar rituals are memory’s handrails.', zh: '熟悉的日常习惯，是记忆的扶手。' },
    { id: 's72', type: 'saying', for: 'care', en: 'Dementia is a condition, not an identity.', zh: '失智症是一种病况，不是一个人的身份。' },
    { id: 's28', type: 'saying', for: 'care', en: 'Music can reach where explanation cannot.', zh: '音乐能到达解释到不了的地方。' },
    { id: 'e34', type: 'encourage', for: 'care', en: 'Rest is part of care, not a break from it.', zh: '休息是照顾的一部分，不是中断。' },
    { id: 'e63', type: 'encourage', for: 'care', en: 'You can love someone and still need respite.', zh: '您可以爱一个人，同时也需要喘息。' },
    { id: 'e33', type: 'encourage', for: 'care', en: 'Caregiver guilt is common; it is not a reliable judge.', zh: '照顾者的内疚很常见，但它不是可靠的判官。' },
    { id: 'e86', type: 'encourage', for: 'care', en: 'Burnout is a signal, not a verdict.', zh: '累垮是一个信号，不是一个判决。' },
    { id: 'e97', type: 'encourage', for: 'care', en: 'You do not need a cure to offer care.', zh: '不需要治愈，也能给予照顾。' },
    { id: 'e98', type: 'encourage', for: 'care', en: 'You do not need perfect words to offer presence.', zh: '不需要完美的话语，也能陪伴在旁。' },
    { id: 'e90', type: 'encourage', for: 'care', en: 'No one should have to improvise dementia care alone.', zh: '没有人应该独自摸索怎样照顾失智的家人。' },
    { id: 'e83', type: 'encourage', for: 'care', en: 'Love can be practical: a pill box, a nightlight, a labeled drawer.', zh: '爱可以很实际：一个药盒、一盏小夜灯、一个贴了标签的抽屉。' },
    { id: 'e4', type: 'encourage', for: 'player', en: 'A good day can be small: warm light, familiar music, a hand nearby.', zh: '美好的一天可以很简单：温暖的光、熟悉的音乐、身边有一只手。' },
    { id: 'e95', type: 'encourage', for: 'player', en: 'A good moment is not a small thing.', zh: '美好的片刻，不是小事。' },
    { id: 'e91', type: 'encourage', for: 'player', en: 'Aging can still include wonder.', zh: '年纪大了，依然可以有惊喜。' },
    { id: 'e96', type: 'encourage', for: 'player', en: 'The present is where connection lives.', zh: '当下，就是我们相连的地方。' },
    { id: 't4', type: 'tip', for: 'care', en: 'Communicate face-to-face, one idea at a time, with short sentences and time to respond.', zh: '面对面说话，一次只说一件事，句子简短，给对方时间回应。' },
    { id: 't6', type: 'tip', for: 'care', en: 'Use names and reminders; avoid quizzing with “Do you remember?”', zh: '多叫名字、多提示；不要用“您还记得吗？”来考他们。' },
    { id: 't7', type: 'tip', for: 'care', en: 'Offer two clear choices rather than open-ended questions.', zh: '给两个清楚的选择，而不是开放式的问题。' },
    { id: 't8', type: 'tip', for: 'care', en: 'Reduce noise, clutter and background TV during conversation and meals.', zh: '说话和吃饭时，减少噪音、杂物和开着的电视。' },
    { id: 't20', type: 'tip', for: 'care', en: 'Check hearing and vision; use glasses and hearing aids, because poor senses worsen confusion.', zh: '检查听力和视力；戴好眼镜和助听器，感官不好会让人更糊涂。' },
    { id: 't37', type: 'tip', for: 'care', en: 'Offer familiar music from their youth; use it to calm and connect.', zh: '放他们年轻时熟悉的音乐，用来安抚和交流。' },
    { id: 't48', type: 'tip', for: 'care', en: 'Stop activities when frustration rises; redirect to something easier.', zh: '一开始烦躁，就停下活动，换一件更容易的事。' },
    { id: 't50', type: 'tip', for: 'care', en: 'Respond to emotion first, facts second.', zh: '先回应情绪，再谈事实。' },
    { id: 't52', type: 'tip', for: 'care', en: 'Look for unmet needs behind agitation: pain, hunger, the toilet, noise or tiredness.', zh: '找出烦躁背后没被满足的需要：疼痛、饥饿、要上厕所、太吵或太累。' },
    { id: 't60', type: 'tip', for: 'care', en: 'Plan for late-afternoon restlessness: an earlier dinner, a calm evening, lights on.', zh: '为傍晚的不安做准备：早点吃晚饭，晚上保持安静，把灯打开。' },
    { id: 't72', type: 'tip', for: 'care', en: 'Take scheduled breaks; respite is maintenance, not luxury.', zh: '安排固定的休息时间；喘息是保养，不是奢侈。' },
    { id: 't71', type: 'tip', for: 'care', en: 'Accept help specifically; keep a list of tasks others can do.', zh: '有人说要帮忙时，具体地接受；准备一张别人可以帮忙做的事的清单。' }
  ];

let DB = null;
function openDB(){

    if (!('indexedDB' in window)) return rej(new Error('no idb'));
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = e => {
      const d = e.target.result;
      if (!d.objectStoreNames.contains('photos')) {
        const s = d.createObjectStore('photos', { keyPath: 'id' });
        s.createIndex('addedAt', 'addedAt');
      }
    };
    req.onsuccess = e => { DB = e.target.result; res(DB); };
    req.onerror = () => rej(req.error);
  });
}
function idbAll(){

    const tx = d.transaction('photos', 'readonly');

    r.onsuccess = () => res(r.result || []);
    r.onerror = () => rej(r.error);
  })).catch(() => []);
}

  return openDB().then(d => new Promise((res, rej) => {

    r.onerror = () => rej(r.error);
  }));
}

let AC = null, masterGain = null, musicBus = null, duckGain = null;
let musicPlaying = false, musicTimer = null, liveOsc = [];

function volToGain(v){ return Math.max(0, Math.min(100, v)) / 100 * 0.6; }
function ensureAudio(){
  if (!AC) {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return false;
    AC = new Ctx();
    masterGain = AC.createGain(); masterGain.gain.value = 1; masterGain.connect(AC.destination);
    musicBus = AC.createGain(); musicBus.gain.value = volToGain(S.musicVol); musicBus.connect(masterGain);
    duckGain = AC.createGain(); duckGain.gain.value = 1; duckGain.connect(musicBus);
  }
  if (AC.state === 'suspended') { try { AC.resume(); } catch(e){} }
  return true;
}
function setMusicGain(v, ramp){
  if (!musicBus || !AC) return;
  const g = (S.muted) ? 0 : volToGain(v);
  if (ramp) {
    musicBus.gain.cancelScheduledValues(AC.currentTime);
    musicBus.gain.setValueAtTime(musicBus.gain.value, AC.currentTime);
    musicBus.gain.linearRampToValueAtTime(g, AC.currentTime + ramp);
  } else {
    musicBus.gain.value = g;
  }
}
function duck(on){
  if (!duckGain || !AC) return;
  const target = on ? 0.22 : 1;
  duckGain.gain.cancelScheduledValues(AC.currentTime);
  duckGain.gain.setValueAtTime(duckGain.gain.value, AC.currentTime);
  duckGain.gain.linearRampToValueAtTime(target, AC.currentTime + 0.25);
}
function freq(note){
  const m = /^([A-G])(\d)$/.exec(note);
  if (!m) return 0;
  const semi = { C:0, D:2, E:4, F:5, G:7, A:9, B:11 }[m[1]];
  const oct = parseInt(m[2], 10);
  return 440 * Math.pow(2, (semi + (oct - 4) * 12 - 9) / 12);
}
function parseMelody(src){
  const out = [];
  src.split('|').forEach(bar => {
    bar.trim().split(/\s+/).forEach(tok => {
      if (!tok) return;
      const p = tok.split('/');
      out.push({ note: p[0], beats: parseFloat(p[1] || '1') });
    });
  });
  return out;
}
function playNote(f, at, dur){
  if (!AC || !f) return;
  const g = AC.createGain();
  g.gain.setValueAtTime(0.0001, at);
  g.gain.exponentialRampToValueAtTime(0.5, at + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, at + Math.max(0.28, dur));
  g.connect(duckGain);
  const o1 = AC.createOscillator(); o1.type = 'triangle'; o1.frequency.value = f;
  const o2 = AC.createOscillator(); o2.type = 'sine'; o2.frequency.value = f * 2;
  const g2 = AC.createGain(); g2.gain.value = 0.16;
  o1.connect(g); o2.connect(g2); g2.connect(g);
  o1.start(at); o1.stop(at + dur + 0.2);
  o2.start(at); o2.stop(at + dur + 0.2);
  liveOsc.push({ o: [o1, o2], end: at + dur + 0.2 });
}
function startMusic(){
  if (musicPlaying) return;
  if (!ensureAudio()) return;
  musicPlaying = true;
  setMusicGain(S.musicVol, 0);
  const beat = 60 / MELODY_BPM;
  const notes = parseMelody(THEME);
  const total = notes.reduce((a, n) => a + n.beats, 0) * beat;
  function schedule(t0){
    if (!musicPlaying) return;
    // If the audio clock is paused (screen locked), don't pile up loops ahead of it.
    if (t0 - AC.currentTime > total) { musicTimer = setTimeout(() => schedule(t0), 1000); return; }
    liveOsc = liveOsc.filter(x => x.end > AC.currentTime);
    let at = t0;
    notes.forEach(n => {
      if (n.note !== 'R') playNote(freq(n.note), at, n.beats * beat * 0.95);
      at += n.beats * beat;
    });
    musicTimer = setTimeout(() => schedule(t0 + total), Math.max(300, (total - 0.3) * 1000));
  }
  schedule(AC.currentTime + 0.15);
}
function stopMusic(fadeSec){
  if (!musicPlaying) return;
  musicPlaying = false;
  clearTimeout(musicTimer);
  if (fadeSec) setMusicGain(0, fadeSec);
  else setMusicGain(0, 0);
  const endAt = AC.currentTime + (fadeSec || 0) + 0.02;
  liveOsc.forEach(x => x.o.forEach(o => { try { o.stop(endAt); } catch(e){} }));
  liveOsc = [];
  setTimeout(() => { if (!musicPlaying) setMusicGain(S.musicVol, 0); }, (fadeSec || 0) * 1000 + 60);
}
function setMuted(m){
  S.muted = m;
  setMusicGain(S.musicVol, 0.3);
  if (m) { try { speechSynthesis.cancel(); } catch(e){} }
  const b = document.getElementById('btn-g-mute');
  if (b) { b.innerHTML = '<span class="ic">' + (m ? ICONS.mute : ICONS.sound) + '</span>'; b.setAttribute('aria-pressed', String(m)); }
  const g = document.getElementById('muteBtn');
  if (g) { g.innerHTML = KIT.icon(m ? 'soundOff' : 'sound'); g.setAttribute('aria-pressed', String(m)); g.setAttribute('aria-label', KIT.s(m ? 'btn_unmute' : 'btn_mute')); }
}

let voiceCache = [];
function loadVoices(){
  try { voiceCache = window.speechSynthesis ? (speechSynthesis.getVoices() || []) : []; } catch(e){ voiceCache = []; }
}
if ('speechSynthesis' in window) {
  loadVoices();
  speechSynthesis.onvoiceschanged = () => {
    loadVoices();
    if (!loadVoices.logged && voiceCache.length) { loadVoices.logged = true; try { console.log('[photoalbum] voices:', voiceCache.map(v => v.name + ' ' + v.lang + (v.localService ? ' (local)' : ' (online)'))); } catch(e){} }
  };
}
// Keep Cantonese voices out: Chinese text in this game is written for Mandarin.
function isCantonese(v){
  const lang = (v.lang || '').toLowerCase();
  const name = (v.name || '').toLowerCase();
  return /yue|cantonese|zh-hk|zh-mo|hong kong/.test(lang) || /cantonese|yue/.test(name);
}
function acceptableVoice(v){
  if (!v || isCantonese(v)) return false;
  const lang = (v.lang || '').toLowerCase();
  if (S.lang === 'en') return /^en/.test(lang);
  return /^zh|^cmn/.test(lang);
}
function pickVoice(){
  const all = voiceCache.length ? voiceCache : (speechSynthesis.getVoices() || []);
  const pref = S.lang === 'en' ? /^en[-_](sg|gb|au)/i : /^(zh[-_]cn|cmn)/i;
  const cand = all.filter(acceptableVoice).sort((a, b) => (pref.test(b.lang) ? 1 : 0) - (pref.test(a.lang) ? 1 : 0));
  const local = cand.filter(v => v.localService);
  if (local.length) return local[0];
  if (S.onlineVoice && cand.length) return cand[0];
  return null;
}
function speak(text){
  if (!text || !S.voiceOn || S.muted) return;
  if (!('speechSynthesis' in window)) return;
  const v = pickVoice();
  if (!v) { showCaptionNotice(); return; }
  const u = new SpeechSynthesisUtterance(text);
  u.lang = (S.lang === 'en') ? 'en' : 'zh-CN';
  u.rate = 0.85;
  u.volume = Math.max(0, Math.min(1, S.speechVol / 100));
  u.voice = v;
  u.onend = () => duck(false);
  u.onerror = () => duck(false);
  duck(true);
  try { speechSynthesis.cancel(); speechSynthesis.speak(u); } catch(e){ duck(false); }
}

function bindSettingsEvents(el){
  KIT.wireSettings(el, {
    onSeg: (id, v) => {
      const k = id.slice(4);
      if (k === 'lang') { setLang(v); return; }
      if (k === 'slideSec' || k === 'sessionMin') S[k] = parseInt(v, 10); else S[k] = v;
      saveSettings();
      if (k === 'bgMusic') { if (v === 'off') stopMusic(0.5); else { ensureAudio(); startMusic(); } }
      renderSettings(true);
    },
    onToggle: (id, on) => {
      const k = id.slice(4);
      S[k] = on;
      if (k === 'contrast') document.documentElement.classList.toggle('hc', S.contrast);
      saveShared(); saveSettings();
      renderSettings(true);
    },
    onRange: (id, v, final) => {
      const k = id.slice(4);
      S[k] = Math.round(v * 100);
      if (k === 'musicVol') setMusicGain(S.musicVol, 0.1);
      saveSettings();
      if (final && k === 'speechVol') speak(KIT.s('voice_sample'));
    }
  });
  const on = (id, fn) => { const b = document.getElementById(id); if (b) b.addEventListener('click', fn); };
  on('btn-mark-home', () => { paSetupMark('home'); renderSettings(true); });
  on('btn-test-voice', () => { ensureAudio(); speak(KIT.s('voice_sample')); });
  on('btn-add-photos', pickPhotos);
  on('btn-add-nv', () => { S.nvIndex = 0; openNV(false); });
  $$('[data-edit]', el).forEach(b => b.addEventListener('click', () => {
    const i = S.photos.findIndex(x => x.id === b.getAttribute('data-edit'));
    if (i >= 0) { S.nvIndex = i; openNV(true); }
  }));
  $$('[data-sedit]', el).forEach(b => b.addEventListener('click', () => openSceneEdit(b.getAttribute('data-sedit'))));
  $$('[data-shide]', el).forEach(b => b.addEventListener('click', () => {
    const id = b.getAttribute('data-shide');
    setSceneOpts(id, { hidden: !sceneOpts(id).hidden });
    if (S.index >= activeList().length) S.index = 0;
    renderSettings(true);
  }));
  $$('[data-hide]', el).forEach(b => b.addEventListener('click', async () => {
    const p = S.photos.find(x => x.id === b.getAttribute('data-hide'));
    if (!p) return;
    p.hidden = !p.hidden;
    await idbPut(p);
    await reloadPhotos();
    renderSettings(true);
  }));
  $$('[data-del]', el).forEach(b => b.addEventListener('click', () => {
    const id = b.getAttribute('data-del');
    KIT.dialog({
      title: t('deletePhotoConfirm'),
      html: '<div class="nvphoto" style="max-height:30vh"><img src="' + ((S.photos.find(x => x.id === id) || {}).thumb || '') + '" alt=""></div>',
      buttons: [{ label: KIT.s('btn_cancel'), primary: true }, { label: t('deletePhoto'), icon: 'trash', onClick: async () => { await idbDel(id); await reloadPhotos(); renderSettings(true); } }]
    });
  }));
  on('btn-backup', backupNow);
  on('btn-restore', () => document.getElementById('file-restore').click());
  const fr = document.getElementById('file-restore');
  if (fr) fr.addEventListener('change', () => {
    const f = fr.files && fr.files[0];
    if (f) restoreFromFile(f);
    fr.value = '';
  });
  bindHold(document.getElementById('btn-clear'), 3000, () => {
    KIT.dialog({
      title: KIT.s('clear_title'), html: KIT.p(t('clearDesc')),
      buttons: [{ label: KIT.s('btn_keep_all'), primary: true }, { label: KIT.s('btn_delete'), icon: 'trash', onClick: () => { clearAllData(); KIT.toast(KIT.s('clear_done')); } }]
    });
  });
}

function resizeImage(file, maxSide){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const w = img.naturalWidth, h = img.naturalHeight;
      const sc = Math.min(1, maxSide / Math.max(w, h));
      const cw = Math.max(1, Math.round(w * sc));
      const ch = Math.max(1, Math.round(h * sc));
      const cv = document.createElement('canvas');
      cv.width = cw; cv.height = ch;
      const ctx = cv.getContext('2d');
      ctx.drawImage(img, 0, 0, cw, ch);
      URL.revokeObjectURL(url);
      cv.toBlob(b => b ? res(b) : rej(new Error('blob')), 'image/jpeg', 0.85);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('img')); };
    img.src = url;
  });
}
function blobToDataURL(blob){
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result);
    r.onerror = () => rej(r.error);
    r.readAsDataURL(blob);
  });
}
function dataURLToBlob(d){
  const parts = String(d).split(',');
  const mime = (parts[0].match(/:(.*?);/) || [])[1] || 'image/jpeg';
  const bin = atob(parts[1] || '');
  const arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], { type: mime });
}
async function importPhotos(files){
  let n = 0;
  const total = files.length;
  const firstNew = S.photos.length;
  // Show progress: importing 20 photos on a phone takes a while, and silence looks like nothing happened.
  openModal('<h3>' + esc(t('addingPhotos')) + '</h3>' +
    '<div class="progressbar"><i id="imp-bar"></i></div><p class="small" id="imp-count">0 / ' + total + '</p>');
  for (let i = 0; i < files.length; i++) {
    const f = files[i];
    // Some phones give an empty type for camera photos; let the decoder decide.
    if (f.type && !/^image\//.test(f.type)) continue;
    try {
      const blob = await resizeImage(f, 1200);
      const thumb = await resizeImage(blob, 200);
      const rec = {
        id: uid(), blob: blob, thumb: await blobToDataURL(thumb),
        name: '', note: '', voice: null, voiceType: null,
        hidden: false, fav: false, addedAt: Date.now()
      };
      await idbPut(rec);
      n++;
    } catch(e) {}
    const bar = document.getElementById('imp-bar'), cnt = document.getElementById('imp-count');
    if (bar) bar.style.width = Math.round((i + 1) / total * 100) + '%';
    if (cnt) cnt.textContent = (i + 1) + ' / ' + total;
  }
  await reloadPhotos();
  renderStartArt();
  if (document.getElementById('screen-settings').classList.contains('active')) renderSettings();
  if (document.getElementById('screen-caregivers').classList.contains('active')) renderCaregivers();
  if (!n) { closeModal(); return; }
  // Go straight on to names & voices for the new photos (optional).
  openModal(
    '<h3>' + esc(t('cgPhotoCount').replace('{n}', n)) + '</h3>' +
    '<p>' + esc(t('photosNamesHint')) + '</p>' +
    '<button class="dgs-btn dgs-btn--primary" id="imp-nv"><span class="ic">' + ICONS.mic + '</span>' + esc(t('addNamesNow')) + '</button>' +
    '<button class="dgs-btn dgs-btn--secondary" data-close="1">' + esc(t('later')) + '</button>'
  );
  document.getElementById('imp-nv').addEventListener('click', () => { S.nvIndex = Math.min(firstNew, S.photos.length - 1); openNV(false); });
}

        '<button class="dgs-btn dgs-btn--primary" id="nv-save">' + esc(t('save')) + ' ›</button></div>' +
        '<button class="dgs-btn dgs-btn--quiet" data-close="1">' + esc(t('done')) + '</button>')
  );
  renderRecArea();

  document.getElementById('nv-save').addEventListener('click', async () => {
    p.name = document.getElementById('nv-name').value.trim();
    p.note = document.getElementById('nv-note').value.trim().slice(0, NOTE_MAX);

  });
  const sk = document.getElementById('nv-skip');
  if (sk) sk.addEventListener('click', nextNV);
}

function nextNV(){
  stopRec();

function renderRecArea(){
  const area = document.getElementById('nv-rec-area');
  if (!area) return;
  const p = S.photos[S.nvIndex];
  if (!p) return;
  let html = '';
  if (p.voice && !(rec && rec.state === 'recording')) html += '<button class="dgs-btn dgs-btn--secondary" id="nv-play" style="width:100%;margin-bottom:10px"><span class="ic">' + ICONS.play + '</span>' + esc(t('playVoice')) + '</button>';
  if (!navigator.mediaDevices || !window.MediaRecorder) {
    html += '<p class="small">' + esc(t('micDenied')) + '</p>';
    area.innerHTML = html;
    bindRecButtons();
    return;
  }
  if (rec && rec.state === 'recording') {
    html += '<div class="recbar"><span class="dot"></span>' + esc(t('recording')) +
      ' <span id="rec-count">' + recCountdown + '</span>s</div>' +
      '<button class="dgs-btn dgs-btn--secondary" id="nv-stop">' + esc(t('stopRecord')) + '</button>';
  } else {
    html += '<button class="dgs-btn dgs-btn--secondary" id="nv-record" style="width:100%"><span class="ic">' + ICONS.mic + '</span>' + esc(p.voice ? t('rerecord') : t('recordVoice')) + '</button>';
  }
  area.innerHTML = html;
  bindRecButtons();
}
function bindRecButtons(){
  const play = document.getElementById('nv-play');
  if (play) play.addEventListener('click', () => {
    const p = S.photos[S.nvIndex];
    if (p && p.voice) playVoiceBlob(p.voice);
  });
  const recBtn = document.getElementById('nv-record');
  if (recBtn) recBtn.addEventListener('click', startRec);
  const stopBtn = document.getElementById('nv-stop');
  if (stopBtn) stopBtn.addEventListener('click', stopRec);
}
async function startRec(){
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { renderRecArea(); return; }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    recChunks = [];
    rec = new MediaRecorder(stream);
    rec.ondataavailable = e => { if (e.data && e.data.size) recChunks.push(e.data); };
    rec.onstop = async () => {
      stream.getTracks().forEach(tr => tr.stop());
      const blob = new Blob(recChunks, { type: rec.mimeType || 'audio/webm' });
      const p = S.photos[S.nvIndex];
      if (p) {
        p.voice = blob;
        p.voiceType = blob.type;
        await idbPut(p);
        await reloadPhotos();
      }
      rec = null;
      renderRecArea();
    };
    rec.start();
    recCountdown = 10;
    renderRecArea();
    clearInterval(recTimer);
    recTimer = setInterval(() => {
      recCountdown--;
      const el = document.getElementById('rec-count');
      if (el) el.textContent = recCountdown;
      if (recCountdown <= 0) stopRec();
    }, 1000);
  } catch(e) {
    const area = document.getElementById('nv-rec-area');
    if (area) area.innerHTML = '<p class="small">' + esc(t('micDenied')) + '</p>';
  }
}
function stopRec(){
  clearInterval(recTimer);
  if (rec && rec.state === 'recording') { try { rec.stop(); } catch(e){} }
}

function playVoiceBlob(blob, after){
  try {
    const url = URL.createObjectURL(blob);
    const a = new Audio(url);
    duck(true);
    a.onended = () => { duck(false); URL.revokeObjectURL(url); if (after) after(); };
    a.onerror = () => { duck(false); URL.revokeObjectURL(url); };
    a.play().catch(() => { duck(false); URL.revokeObjectURL(url); });
  } catch(e) { duck(false); }
}

      thumb: p.thumb || null,
      blob: await blobToDataURL(p.blob),
      voice: p.voice ? await blobToDataURL(p.voice) : null,
      voiceType: p.voiceType || null
    });
  }
  const json = JSON.stringify(data);
  const name = 'photoalbum-backup-' + new Date().toISOString().slice(0, 10) + '.json';
  const file = new File([json], name, { type: 'application/json' });
  const done = () => { paSetupMark('backup'); KIT.toast(KIT.s('backup_done')); if (document.getElementById('screen-settings').classList.contains('active')) renderSettings(true); };
  try {
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: 'Photo Album backup' });
      done(); return;
    }
  } catch(e) { if (e && e.name === 'AbortError') return; }
  try {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(file);
    a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    done();
  } catch(e) { KIT.dialog({ title: KIT.s('backup_fail') }); }
}
function restoreFromFile(file){
  const r = new FileReader();
  r.onload = () => {
    let data;
    try { data = JSON.parse(r.result); } catch(e) { openModal('<h3>' + esc(t('restore')) + '</h3><p>' + esc(t('restoreError')) + '</p><button class="dgs-btn dgs-btn--primary" data-close="1">' + esc(t('close')) + '</button>'); return; }
    if (!data || data.app !== 'dgs-photoalbum') {
      openModal('<h3>' + esc(t('restore')) + '</h3><p>' + esc(t('restoreError')) + '</p><button class="dgs-btn dgs-btn--primary" data-close="1">' + esc(t('close')) + '</button>');
      return;
    }
    const n = (data.photos || []).length;
    openModal(
      '<h3>' + esc(t('restore')) + '</h3>' +
      '<p>' + esc(t('restoreWarning')) + '</p>' +
      '<p class="small">' + n + ' ' + (S.lang === 'en' ? 'photos' : '张照片') + '</p>' +
      '<div class="row2">' +
        '<button class="dgs-btn dgs-btn--secondary" data-close="1">' + esc(t('cancel')) + '</button>' +
        '<button class="dgs-btn dgs-btn--primary" id="confirm-restore">' + esc(t('confirm')) + '</button>' +
      '</div>'
    );
    document.getElementById('confirm-restore').addEventListener('click', async () => {
      await clearAllData(true);
      if (data.settings) LS.set(K_SET, data.settings);
      if (data.shared) {
        KIT.sharedWrite(K_SHARED_LANG, data.shared.lang === 'zh-CN' ? 'zh-CN' : 'en');
        KIT.sharedWrite(K_SHARED_LEVEL, data.shared.level || 'standard');
        KIT.sharedWrite(K_SHARED_ONLINE, !!data.shared.onlineVoice);
        KIT.sharedWrite(K_SHARED_CONTRAST, !!data.shared.contrast);
      }
      if (data.favs) LS.set(K_FAVS, data.favs);
      if (data.dwell) LS.set(K_DWELL, data.dwell);
      if (data.scenes) LS.set(K_SCENES, data.scenes);
      if (data.sessions) LS.set(K_SESS, data.sessions);
      for (const p of (data.photos || [])) {
        try {
          const blob = dataURLToBlob(p.blob);
          const voice = p.voice ? dataURLToBlob(p.voice) : null;
          await idbPut({
            id: p.id || uid(), blob: blob, thumb: p.thumb || null,
            name: p.name || '', note: String(p.note || '').slice(0, NOTE_MAX), voice: voice, voiceType: p.voiceType || null,
            hidden: !!p.hidden, fav: !!p.fav, addedAt: p.addedAt || Date.now()
          });
        } catch(e) {}
      }
      loadSettings();
      document.documentElement.classList.toggle('hc', S.contrast);
      applyLang();
      await reloadPhotos();
      renderStartArt();
      closeModal();
      renderSettings();
      KIT.toast(KIT.s('restore_done'));
    });
  };
  r.readAsText(file);
}
async function clearAllData(silent){
  await idbClear();
  [K_SET, K_SESS, K_FAVS, K_DWELL, K_SCENES, K_SETUP].forEach(k => LS.del(k));
  if (!silent) {
    S.photos = [];
    S.index = 0;
    Object.keys(DEFAULTS).forEach(k => { S[k] = DEFAULTS[k]; });
    closeModal();
    renderStartArt();
    renderSettings();

}

function logMood(face){

function startSession(){
  S.sessionStart = Date.now();
  scheduleRestCard(Math.max(1, S.sessionMin) * 60 * 1000);
}
function scheduleRestCard(ms){
  clearTimeout(S.sessionTimer);
  S.sessionTimer = setTimeout(showRestCard, ms);
}
function showRestCard(){
  const card = document.getElementById('restcard');
  if (!card) return;
  card.classList.add('show');
  clearTimeout(S.restHide);
  // Slideshow is safe to leave running: the card fades by itself and asks again later.
  S.restHide = setTimeout(() => { card.classList.remove('show'); scheduleRestCard(5 * 60000); }, 20000);
}
function endSession(){
  bumpDwell();
  { const a = LS.get(K_SESS, []) || []; a.push({ at: Date.now(), sec: Math.max(0, Math.round((Date.now() - S.sessionStart) / 1000)), mood: null }); LS.set(K_SESS, a.slice(-60)); }
  clearTimeout(S.sessionTimer);
  clearTimeout(S.restHide);
  stopSlideshowTimers();
  hideGhost();
  try { speechSynthesis.cancel(); } catch(e){}
  document.body.classList.remove('idle-dim');
  const card = document.getElementById('restcard');
  if (card) card.classList.remove('show');
  stopMusic(3);
  renderRest();
  showScreen('screen-rest');
}

async function reloadPhotos(){
  const rows = await idbAll();
  rows.sort((a, b) => (a.addedAt || 0) - (b.addedAt || 0));
  S.photos = rows;
  if (S.index >= activeList().length) S.index = 0;
}
function gameActive(){ return document.getElementById('screen-game').classList.contains('active'); }
function stopSlideshowTimers(){ clearTimeout(S.slideTimer); clearTimeout(S.resumeTimer); }
function startSlideTimer(){
  clearTimeout(S.slideTimer);
  if (S.level === 'simplest') return;
  if (!gameActive()) return; // never keep cycling photos behind another screen
  const ms = (S.level === 'gentler' ? Math.max(20000, S.slideSec * 1000) : S.slideSec * 1000);
  S.slideTimer = setTimeout(() => nextPhoto(true), ms);
}
function effStyle(){ return (S.level === 'standard') ? S.promptStyle : 'gentle'; }
function currentItem(){
  const list = activeList();
  if (!list.length) return null;
  if (S.index < 0) S.index = list.length - 1;
  if (S.index >= list.length) S.index = 0;
  return list[S.index];
}
function renderCurrent(){
  const item = currentItem();
  const stage = document.getElementById('stage');
  if (!item) { stage.innerHTML = SCENES[0].svg; return; }
  if (S.currentURL) { try { URL.revokeObjectURL(S.currentURL); } catch(e){} S.currentURL = null; }
  if (item.blob) {
    try {
      S.currentURL = URL.createObjectURL(item.blob);
      stage.innerHTML = stageImg(S.currentURL);
    } catch(e) { stage.innerHTML = SCENES[0].svg; }
  } else {
    stage.innerHTML = stageImg((item.svg.match(/src="([^"]+)"/) || [])[1] || '');
  }
  S.current = item;
  S.shownAt = Date.now();
  clearTimeout(S.resumeTimer);
  document.getElementById('stage').classList.remove('tapped');
  try { speechSynthesis.cancel(); } catch(e){} duck(false);
  updateCaption();
  stage.setAttribute('role','img'); stage.setAttribute('aria-label', document.getElementById('caption').textContent);
  renderProgress();
  renderHeart();
  startSlideTimer();
}
function updateCaption(){
  const el = document.getElementById('caption');
  const item = S.current;
  if (!item) { el.textContent = ''; return; }
  const note = noteOf(item);
  if (item.blob) setCaption(item.name ? nameLineHTML(item.name) : (note ? '' : esc(gentleFor(item))), note);
  else setCaption('', note);
}
function nameLineHTML(name){
  const pr = t('thisIs').split('{name}');
  return esc(pr[0]) + '<span class="key">' + esc(name) + '</span>' + esc(pr[1] || '');
}
function setCaption(leadHTML, note, leadLast){
  const el = document.getElementById('caption');
  const lead = leadHTML ? '<span class="clead">' + leadHTML + '</span>' : '';
  const body = note ? '<span class="cnote' + (leadHTML ? '' : ' solo') + '">' + esc(note) + '</span>' : '';
  el.innerHTML = '<span class="cwrap">' + (leadLast ? body + lead : lead + body) + '</span>';
}
function renderHeart(){
  const b = document.getElementById('btn-heart');
  if (!b) return;
  const item = S.current;
  let on = false;
  if (item) {
    if (item.blob) on = !!item.fav;
    else on = (LS.get(K_FAVS, []) || []).indexOf(item.id) >= 0;
  }
  b.setAttribute('aria-pressed', on ? 'true' : 'false');
  b.innerHTML = '<span class="ic">' + (on ? ICONS.heartFill : ICONS.heart) + '</span>';
}
function toggleHeart(){ setTimeout(()=>{const b=document.getElementById('btn-heart');b.classList.remove('pop');void b.offsetWidth;if(b.getAttribute('aria-pressed')==='true')b.classList.add('pop');},0);
  const item = S.current;
  if (!item) return;
  if (item.blob) { item.fav = !item.fav; idbPut(item); }
  else {
    const favs = LS.get(K_FAVS, []) || [];
    const i = favs.indexOf(item.id);
    if (i >= 0) favs.splice(i, 1); else favs.push(item.id);
    LS.set(K_FAVS, favs);
  }
  renderHeart();
}
function nextPhoto(auto){
  const list = activeList();
  if (!list.length) return;
  bumpDwell();
  S.index = (S.index + 1) % list.length;
  renderCurrent();
}
function prevPhoto(){
  const list = activeList();
  if (!list.length) return;
  bumpDwell();
  S.index = (S.index - 1 + list.length) % list.length;
  renderCurrent();
}
function bumpDwell(){
  const item = S.current;
  if (!item || !S.shownAt) return;
  const sec = Math.min(180, Math.round((Date.now() - S.shownAt) / 1000));
  S.shownAt = 0;
  if (sec < 3) return;
  const d = LS.get(K_DWELL, {}) || {};
  d[item.id] = (d[item.id] || 0) + sec;
  LS.set(K_DWELL, d);
}
function tapStage(){
  if (S.swiped) return;
  clearTimeout(S.slideTimer);
  const item = S.current;
  if (!item) return;
  S.stageTapped = true; hideGhost(); armGhost();
  const st = document.getElementById('stage');
  st.classList.add('tapped'); clearTimeout(S.glowT); S.glowT = setTimeout(() => st.classList.remove('tapped'), 1800);
  const style = effStyle();
  const note = noteOf(item);
  let line = '';
  if (style === 'story') {
    line = [note, t('storyPrompt')].filter(Boolean).join(' ');
    setCaption(note ? esc(t('storyPrompt')) : '', note || t('storyPrompt'), true);
  } else if (item.blob) {
    const nameLine = item.name ? t('thisIs').replace('{name}', item.name) : '';
    line = [nameLine, note].filter(Boolean).join(' ') || gentleFor(item);
    updateCaption();
  } else {
    line = note; updateCaption();
  }
  // A recorded family voice plays first; the write-up is read after it.
  if (item.blob && item.voice && !S.muted) {
    playVoiceBlob(item.voice, () => { if (S.current === item && note) speak(note); });
  } else speak(line);
  clearTimeout(S.resumeTimer);
  S.resumeTimer = setTimeout(() => { startSlideTimer(); }, 30000);
}
function gentleFor(item){
  const pool = [t('gentleComment')].concat(t('gentleMore') || []);
  let h = 0; String(item.id).split('').forEach(c => { h = (h * 31 + c.charCodeAt(0)) >>> 0; });
  return pool[h % pool.length];
}
function startGame(){
  S.index = 0;
  S.current = null;
  S.stageTapped = false;
  const list = activeList();
  if (!list.length) return;
  showScreen('screen-game');
  renderCurrent();
  setMuted(S.muted);
  S.ghostCount = 0;
  armGhost();
  startSession();
  if (S.bgMusic !== 'off' && !musicPlaying) startMusic();
}

// ---- Gentle hint: a hand shows "tap the photo" after 10 s idle, until they have tapped once ----
const GHOST_IDLE_MS = 10000;
function armGhost(){
  clearTimeout(S.ghostTimer);
  if (S.level !== 'simplest' || !gameActive() || (S.ghostCount || 0) >= 3) return;
  S.ghostTimer = setTimeout(showGhost, GHOST_IDLE_MS);
}
function showGhost(){
  if (S.level !== 'simplest' || !gameActive() || !document.getElementById('modal').classList.contains('hidden')) return;
  const st = document.getElementById('stage');
  let g = st.querySelector('.ghosthand');
  if (!g) {
    g = document.createElement('div'); g.className = 'ghosthand'; g.setAttribute('aria-hidden', 'true');
    g.innerHTML = '<span class="ring"></span><svg viewBox="0 0 24 24" width="84" height="84" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="color:var(--primary);filter:drop-shadow(0 3px 4px rgba(0,0,0,.25))"><path fill="#fff" d="M9 11V5.5a1.5 1.5 0 0 1 3 0v4a1.5 1.5 0 0 1 3 0v1.5a1.5 1.5 0 0 1 3 0v3.5c0 3.6-2.4 6.5-6 6.5-2.5 0-3.9-1.2-5.2-3.2L5 14.6a1.4 1.4 0 0 1 2.3-1.6L9 15z"/>' + ICONS.hand.replace(/<\/?svg[^>]*>/g, '') + '</svg>';
    st.appendChild(g);
  }
  S.ghostCount = (S.ghostCount || 0) + 1;
  requestAnimationFrame(() => g.classList.add('show'));
  clearTimeout(S.ghostHide); S.ghostHide = setTimeout(() => { g.classList.remove('show'); armGhost(); }, 5000);
}
function hideGhost(){
  clearTimeout(S.ghostTimer);
  const g = document.querySelector('#stage .ghosthand');
  if (g) g.classList.remove('show');
}
// ---- Long idle in the slideshow: soften the controls and nudge the picture to protect OLED screens ----
setInterval(() => {
  if (!gameActive()) return;
  const idle = Date.now() - S.lastTouch;
  if (idle > 10 * 60000) {
    document.body.classList.add('idle-dim');
    const st = document.getElementById('stage');
    const m = Math.floor(idle / 60000) % 4;
    st.style.transform = 'translate(' + [0, 2, 0, -2][m] + 'px,' + [2, 0, -2, 0][m] + 'px)';
  }
}, 30000);

function stageImg(src){ return '<img class="bg" src="'+src+'" alt="" aria-hidden="true"><img class="fg" src="'+src+'" alt="">'; }
function renderProgress(){ const el=document.getElementById('progress'); if(!el) return; const n=activeList().length;
  el.innerHTML = n>12 ? '<span class="small">'+(S.index+1)+' / '+n+'</span>' : Array.from({length:n},(_,i)=>'<i class="'+(i===S.index?'on':'')+'"></i>').join(''); }
(function(){ const st=document.getElementById('stage'); let x0=0,y0=0,t0=0; st.style.touchAction='pan-y';
  st.addEventListener('pointerdown',e=>{x0=e.clientX;y0=e.clientY;t0=Date.now();});
  st.addEventListener('pointerup',e=>{ const dx=e.clientX-x0,dy=e.clientY-y0;
    if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.5&&Date.now()-t0<800){ S.swiped=true; setTimeout(()=>{S.swiped=false;},350); if(dx<0) nextPhoto(false); else prevPhoto(); } });
  document.getElementById('btn-rest-home').addEventListener('click',()=>showScreen('screen-start'));
  document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeModal();
    if(!document.getElementById('screen-game').classList.contains('active')||!document.getElementById('modal').classList.contains('hidden')) return;
    if(e.key==='ArrowRight') nextPhoto(false); if(e.key==='ArrowLeft') prevPhoto(); });
})();

// Photo Album theme: an original tune written for this game (not based on any existing song). 3/4, C major, slow.
// Format: NOTE/beats separated by spaces, '|' marks a bar, R is a rest.
const MELODY_BPM = 76;
const THEME =
  'E5/1 G5/1 C6/1 | B5/1.5 A5/0.5 G5/1 | A5/1 G5/1 E5/1 | D5/3 | ' +
  'E5/1 G5/1 A5/1 | C6/1.5 B5/0.5 A5/1 | G5/1 E5/1 D5/1 | C5/3 | ' +
  'A4/1 C5/1 E5/1 | G5/2 E5/1 | F5/1 E5/1 D5/1 | E5/3 | ' +
  'G5/1 A5/1 G5/1 | E5/1.5 D5/0.5 C5/1 | D5/1 E5/1 D5/1 | C5/2 R/1';

/* ==== BOOT ==== */
(function init(){
  KIT.init({ lang: () => S.lang, getState: (k, d) => LS.get('dgs.photoalbum.' + k, d), setState: (k, v) => LS.set('dgs.photoalbum.' + k, v) });
  loadSettings();
  document.documentElement.classList.toggle('hc', S.contrast);
  const hasSharedLang = LS.get(K_SHARED_LANG, null) !== null;
  applyLang();
  renderStartArt();
  renderRest();

  document.addEventListener('click', e => {
    const pick = e.target.closest('[data-kit-pick]');
    if (pick) { setLang(pick.getAttribute('data-kit-pick')); showScreen('screen-start'); return; }
    const sw = e.target.closest('[data-kit-lang]');
    if (sw && sw.getAttribute('data-kit-lang') !== S.lang) setLang(sw.getAttribute('data-kit-lang'));
  });

  document.getElementById('lang-body').innerHTML = '<div class="dgs-hero" style="--hero-ratio:4/3"><div class="dgs-art startart">' + (SCENES.find(s => s.id === 'kopitiam') || SCENES[0]).svg + '</div></div>' + KIT.langScreenHTML();
  setMuted(S.muted);
  document.getElementById('muteBtn').addEventListener('click', () => { ensureAudio(); setMuted(!S.muted); });
  if (!hasSharedLang) showScreen('screen-lang');
  else showScreen('screen-start');

  let musicStarted = false;
  document.addEventListener('pointerdown', () => {
    if (musicStarted) return;
    musicStarted = true;
    ensureAudio();
    if (S.bgMusic !== 'off') startMusic();
    loadVoices();
  }, { once: true });

  document.getElementById('btn-play').addEventListener('click', async () => {
    await reloadPhotos();
    if (S.bgMusic === 'off') stopMusic(0.3);
    startGame();
  });
  document.getElementById('btn-howto').addEventListener('click', () => openHowto(false));
  document.getElementById('btn-caregivers').addEventListener('click', () => {
    renderCaregivers();
    showScreen('screen-caregivers');
  });

  document.getElementById('btn-howto-back').addEventListener('click', () => {
    try { speechSynthesis.cancel(); } catch(e){}
    if (S.returnToGame) { S.returnToGame = false; showScreen('screen-game'); startSlideTimer(); }
    else showScreen('screen-start');
  });
  document.getElementById('btn-howto-next').addEventListener('click', () => {
    if (S.howtoStep < HOWTO.length - 1) { S.howtoStep++; renderHowto(); }
    else {
      try { speechSynthesis.cancel(); } catch(e){}
      if (S.returnToGame) { S.returnToGame = false; showScreen('screen-game'); startSlideTimer(); }
      else playFromHowto();
    }
  });
  async function playFromHowto(){ await reloadPhotos(); startGame(); }
  document.getElementById('btn-howto-skip').addEventListener('click', () => { try { speechSynthesis.cancel(); } catch(e){} if (S.returnToGame) { S.returnToGame = false; showScreen('screen-game'); startSlideTimer(); } else playFromHowto(); });

  document.getElementById('btn-cg-back').addEventListener('click', () => showScreen('screen-start'));
  document.getElementById('btn-set-back').addEventListener('click', () => {
    renderCaregivers();
    showScreen('screen-caregivers');
  });

  document.getElementById('btn-g-help').addEventListener('click', () => openHowto(true));
  document.getElementById('btn-g-mute').addEventListener('click', () => setMuted(!S.muted));
  document.getElementById('btn-g-rest').addEventListener('click', endSession);
  document.getElementById('btn-g-home').addEventListener('click', () => KIT.dialog({ title: KIT.s('home_q'), buttons: [
    { label: KIT.s('btn_stay'), primary: true },
    { label: KIT.s('btn_home'), icon: 'home', onClick: () => { endSession(); showScreen('screen-start'); } }
  ] }));
  document.getElementById('btn-next').addEventListener('click', () => nextPhoto(false));
  document.getElementById('btn-prev').addEventListener('click', prevPhoto);
  document.getElementById('btn-heart').addEventListener('click', toggleHeart);
  document.getElementById('stage').addEventListener('click', tapStage);
  document.getElementById('btn-restcard-rest').addEventListener('click', endSession);
  document.getElementById('btn-restcard-keep').addEventListener('click', () => {
    document.getElementById('restcard').classList.remove('show');
    clearTimeout(S.restHide);
    scheduleRestCard(Math.max(1, S.sessionMin) * 60 * 1000); // session clock keeps running
  });

  document.getElementById('btn-play-again').addEventListener('click', async () => {
    await reloadPhotos();
    if (S.bgMusic !== 'off') startMusic();
    startGame();
  });
  document.getElementById('btn-skip-mood').addEventListener('click', () => document.getElementById('mood-wrap').classList.add('hidden'));

  document.addEventListener('pointerdown', () => {
    S.lastTouch = Date.now();
    if (document.body.classList.contains('idle-dim')) { document.body.classList.remove('idle-dim'); document.getElementById('stage').style.transform = ''; }
    if (gameActive()) { hideGhost(); armGhost(); }
  }, true);
  document.addEventListener('contextmenu', e => e.preventDefault());
  document.addEventListener('dblclick', e => e.preventDefault(), { passive: false });
  document.addEventListener('gesturestart', e => e.preventDefault());

  let wakeLock = null;
  async function requestWakeLock(){
    try {
      if ('wakeLock' in navigator && document.visibilityState === 'visible') wakeLock = await navigator.wakeLock.request('screen');
    } catch(e) {}
  }
  requestWakeLock();
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      if (AC) { try { AC.suspend(); } catch(e){} }
      try { speechSynthesis.pause(); } catch(e){}
    } else {
      if (AC) { try { AC.resume(); } catch(e){} }
      try { speechSynthesis.cancel(); } catch(e){} duck(false);
      requestWakeLock();
    }
  });

  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch(e){}
  try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch(e){}

  reloadPhotos().then(() => {
    renderStartArt();
    if (document.getElementById('screen-settings').classList.contains('active')) renderSettings();
    if (document.getElementById('screen-caregivers').classList.contains('active')) renderCaregivers();
  });
})();
</script>
<script>
/* "All games" label follows the page language (set by the game on <html lang>). */
(function(){
  function label(){ var zh = (document.documentElement.lang || '').indexOf('zh') === 0;
    document.querySelectorAll('.dgs-allgames').forEach(function(a){ var s = a.querySelector('span'); if (s) s.textContent = zh ? '所有游戏' : 'All games'; a.setAttribute('aria-label', zh ? '所有游戏 · 温和小游戏' : 'All games · Gentle Games'); }); }
  label(); try { new MutationObserver(label).observe(document.documentElement, { attributes: true, attributeFilter: ['lang'] }); } catch (e) {}
})();
</script>
