<script>
/* ==== SECTION: CONFIG ==== */
// Everything a builder might want to change lives here.
const DGS_KIT_VERSION = 1;   // MOO Dementia Games kit v1 (4 Nov 2026): shared look, caregiver page and settings
const CONFIG = {
  GAME_ID: 'spotit',
  SERIES_HOME_URL: '../',          // link to the series landing page; hidden while '#'
  THEME_MELODY: 'spotitTheme',   // key in MELODIES
  TABLET_MIN_PX: 600,            // shortest screen side at or above this counts as a tablet
  SESSION_MIN_DEFAULT: 12,       // minutes before the gentle "time for a rest?" screen
  SPEECH_RATES: { vslow: 0.6, slow: 0.7, normal: 0.85 },
  MUSIC_LEVELS: [0, 0.15, 0.3, 0.5],
  SPEECH_LEVELS: [0, 0.5, 0.8, 1],
  // Per level: objects visible at once (phone / tablet), hint times in seconds,
  // how many things to find per round, and whether a faint outline shows from the start.
  // Each scene holds 12 objects, so tablets top out at 12 for now.
  LEVELS: {
    standard: { phone: [6, 8], tablet: [10, 12], hints: [8, 16, 24], targets: [4, 5], outline: false },
    gentler:  { phone: [4, 6], tablet: [6, 10],  hints: [6, 12, 18], targets: [3, 4], outline: false },
    simplest: { phone: [3, 4], tablet: [4, 6],   hints: [4, 8, 12],  targets: [3, 3], outline: true }
  },
  SCENE_ORDER: ['kopitiam', 'hawker', 'market', 'kitchen', 'living', 'bedroom', 'garden', 'kampung', 'seaside', 'sewing'],
  DEFAULTS: { musicVol: 0.3, speechVol: 0.8, bgMusic: 'soft', sessionMin: 12, rate: 'slow', hiddenScenes: [], helpStyle: 'step' },
  // helpStyle: how far the hints go. soft = glow only; clear = glow, then a ring; step = glow, ring, then the hand (every level starts here)
  DEFAULT_LANG: 'en',            // English first; polite Mandarin second
  // Familiar everyday objects used across scenes (kept in one list so they can be swapped).
  CULTURAL_OBJECTS: ['kopitiam cup', 'teapot', 'kaya toast', 'lantern', 'birdcage', 'wet-market scale',
    'tangerines', 'thermos flask', 'radio', 'orchid', 'hibiscus', 'bamboo']
};
/* ==== END SECTION: CONFIG ==== */
</script>
<style>
/* ==== SECTION: STYLES ==== */
/* MOO Dementia Games kit v1 (DGS_KIT_VERSION). Part 1 is identical in every game except the palette
   values; part 2 is the shared components (kit bundle.css); part 3 is Spot It! only. */

/* ---------- 1. Tokens: Spot It! palette ---------- */
:root{
  --bg:#fff9db; --surface:#ffffff; --surface-sunk:#f6efcf; --text:#1e2a3a; --text-muted:#4a5566;
  --primary:#1d5fa8; --primary-ink:#1a5698; --primary-strong:#123f72; --primary-soft:#dce8f6; --on-primary:#ffffff;
  --accent:#e8a900; --accent-soft:#fff0c2; --border:#8a8f99; --divider:#eadfb4; --focus-ring:#1d5fa8;
  --art-ink:#3b342c;
  --space-1:8px; --space-2:12px; --space-3:16px; --space-4:24px; --space-5:32px; --space-6:48px;
  --radius-sm:12px; --radius-md:20px; --radius-lg:28px; --radius-pill:999px;
  --tap-min:72px; --tap-play:104px; --icon:32px; --icon-lg:44px; --content-max:560px;
  --shadow-card:0 1px 2px rgba(0,0,0,.06),0 6px 18px rgba(0,0,0,.07);
  --shadow-lift:0 2px 4px rgba(0,0,0,.08),0 12px 28px rgba(0,0,0,.10);
  --font-sans:"PingFang SC","Noto Sans SC","Microsoft YaHei","Hiragino Sans GB",system-ui,-apple-system,"Segoe UI",sans-serif;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px); --safe-r:env(safe-area-inset-right,0px);
  /* Spot It! game-screen names (mapped to the kit tokens) */
  --muted:var(--text-muted); --line:var(--divider); --r:var(--radius-lg);
}
@media (min-width:700px) and (min-height:560px){ :root{ --tap-min:88px; } }
html.hc{
  --bg:#ffffff; --surface:#ffffff; --surface-sunk:#f0f0f0; --text:#000000; --text-muted:#2b2b2b;
  --primary:#0b3f78; --primary-ink:#0b3f78; --primary-strong:#06264a; --primary-soft:#c9dbf0;
  --accent:#b07d00; --accent-soft:#f6ead0; --border:#000000; --divider:#5c5c5c; --focus-ring:#000000;
}

/* ==== MOO Dementia Games kit v1: shared components (identical in every game) ==== */
/* ---------- 2. Shared components (kit) ---------- */
*,*::before,*::after{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{
  margin:0; height:100%; background:var(--bg); color:var(--text);
  font-family:var(--font-sans); font-size:22px; line-height:1.55;
  overscroll-behavior:none; overflow:hidden;
  -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
  touch-action:manipulation; -webkit-text-size-adjust:100%;
}
img,svg{ -webkit-user-drag:none; user-select:none; }
[hidden]{ display:none !important; }
h1,h2,h3,h4,p{ margin:0; }
button{ font:inherit; color:inherit; }
.dgs-icon{ width:var(--icon); height:var(--icon); flex:none; display:block; }

.screen{
  position:fixed; inset:0; display:flex; flex-direction:column; gap:var(--space-3);
  background:var(--bg);
  padding:calc(var(--safe-t) + 12px) calc(var(--safe-r) + 16px) calc(var(--safe-b) + 12px) calc(var(--safe-l) + 16px);
}
.screen > .col{ width:100%; max-width:var(--content-max); margin:0 auto; display:flex; flex-direction:column; gap:var(--space-3); min-height:0; flex:1 1 auto; }
.dgs-topbar{ display:flex; align-items:center; justify-content:space-between; gap:var(--space-2); flex:0 0 auto; min-height:60px; }
.dgs-topbar .grow{ flex:1; }
.scroll{ overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain; touch-action:pan-y; flex:1 1 auto; min-height:0; margin:0 -16px; padding:4px 16px 40px; }
.scroll::-webkit-scrollbar{ width:0; }
.scroll > .col{ max-width:var(--content-max); margin:0 auto; display:flex; flex-direction:column; gap:var(--space-3); }

/* Buttons */
.dgs-btn{
  appearance:none; border:0; margin:0; cursor:pointer;
  display:flex; align-items:center; justify-content:center; gap:var(--space-2);
  min-height:var(--tap-min); width:100%; padding:0 var(--space-4);
  border-radius:var(--radius-lg); font-size:26px; line-height:32px; font-weight:700; letter-spacing:.01em; text-align:center;
  transition:transform .12s ease, box-shadow .12s ease; touch-action:manipulation;
}
.dgs-btn:focus-visible,.dgs-guide:focus-visible,.dgs-round:focus-visible,.dgs-lang button:focus-visible,.dgs-hold:focus-visible,.dgs-level:focus-visible,.dgs-mood:focus-visible,.dgs-seg button:focus-visible,.dgs-switch:focus-visible{ outline:3px solid var(--focus-ring); outline-offset:3px; }
.dgs-btn:active{ transform:scale(.96); }
/* Every button gives a smooth, slight press so a tap clearly registers */
.dgs-round,.dgs-guide,.dgs-level,.dgs-hold,.dgs-mood,.dgs-seg button,.dgs-lang button{ transition:transform .12s ease, box-shadow .12s ease, background-color .12s ease; }
.dgs-round:active,.dgs-guide:active,.dgs-level:active,.dgs-hold:active,.dgs-mood:active,.dgs-seg button:active,.dgs-lang button:active{ transform:scale(.96); }
@media (prefers-reduced-motion:reduce){
  .dgs-btn:active,.dgs-round:active,.dgs-guide:active,.dgs-level:active,.dgs-hold:active,.dgs-mood:active,.dgs-seg button:active,.dgs-lang button:active{ transform:none; filter:brightness(.92); }
}
.dgs-btn--primary{ background:var(--primary); color:var(--on-primary); box-shadow:0 4px 0 var(--primary-strong); }
.dgs-btn--primary:active{ box-shadow:0 2px 0 var(--primary-strong); }
.dgs-btn--secondary{ background:var(--surface); color:var(--text); box-shadow:inset 0 0 0 2px var(--border),var(--shadow-card); }
.dgs-btn--quiet{ background:transparent; color:var(--primary-ink); min-height:56px; font-size:20px; font-weight:600; text-decoration:underline; text-underline-offset:5px; }
.dgs-btn--small{ min-height:64px; font-size:21px; }
.dgs-btn--play{ min-height:var(--tap-play); font-size:34px; line-height:40px; font-weight:800; box-shadow:0 5px 0 var(--primary-strong),var(--shadow-lift); }
.dgs-btn__disc{ width:56px; height:56px; border-radius:50%; background:var(--on-primary); color:var(--primary); display:grid; place-items:center; flex:none; }
.dgs-btn__disc .dgs-icon{ width:28px; height:28px; margin-left:4px; }

/* Language switch and round buttons */
.dgs-lang{ display:inline-flex; padding:4px; border-radius:var(--radius-pill); background:var(--surface-sunk); box-shadow:inset 0 0 0 1.5px var(--divider); }
.dgs-lang button{ appearance:none; border:0; cursor:pointer; min-height:52px; min-width:76px; padding:0 18px; border-radius:var(--radius-pill); background:transparent; color:var(--text); font-size:20px; font-weight:600; }
.dgs-lang button[aria-pressed="true"]{ background:var(--surface); color:var(--primary-ink); font-weight:800; box-shadow:inset 0 0 0 2.5px var(--primary),var(--shadow-card); }
.dgs-round{ appearance:none; border:0; cursor:pointer; width:60px; height:60px; flex:none; border-radius:50%; display:grid; place-items:center; background:var(--surface); color:var(--text); box-shadow:inset 0 0 0 2px var(--border),var(--shadow-card); }
.dgs-round .dgs-icon{ width:30px; height:30px; }
.dgs-back{ appearance:none; border:0; cursor:pointer; display:inline-flex; align-items:center; gap:8px; min-height:60px; padding:0 18px 0 12px; border-radius:var(--radius-pill); background:var(--surface); color:var(--text); font-size:20px; font-weight:700; box-shadow:inset 0 0 0 2px var(--border),var(--shadow-card); }
.dgs-back .dgs-icon{ width:26px; height:26px; }
#muteBtn{ position:fixed; z-index:75; top:calc(var(--safe-t) + 12px); right:calc(var(--safe-r) + 16px); }

/* Titles and text */
.dgs-title{ margin:0; text-align:center; font-size:40px; line-height:48px; font-weight:800; color:var(--text); text-wrap:balance; }
.dgs-title small{ display:block; font-size:20px; line-height:28px; font-weight:600; color:var(--text-muted); letter-spacing:.02em; margin-top:2px; }
.dgs-screen-title{ margin:0; text-align:center; font-size:30px; line-height:40px; font-weight:700; text-wrap:balance; }
.dgs-caption{ margin:0; text-align:center; font-size:28px; line-height:40px; font-weight:600; text-wrap:balance; }
.key{ font-style:normal; color:var(--primary); font-weight:800; text-decoration:underline; text-decoration-thickness:3px; text-underline-offset:6px; text-decoration-color:var(--accent); }
.dgs-footnote{ margin:0; text-align:center; font-size:18px; line-height:27px; color:var(--text-muted); }
.note{ font-size:18px; line-height:27px; color:var(--text-muted); margin:0; }

/* Picture frame */
.dgs-art{ border-radius:var(--radius-md); background:var(--surface); box-shadow:var(--shadow-card); overflow:hidden; display:block; }
.dgs-art img,.dgs-art svg{ width:100%; height:100%; display:block; object-fit:cover; }

/* Guide buttons */
.dgs-guides{ display:grid; grid-template-columns:1fr 1fr; gap:var(--space-2); }
.dgs-guide{ appearance:none; border:0; cursor:pointer; min-height:104px; padding:var(--space-2); border-radius:var(--radius-lg); background:var(--surface); color:var(--text); box-shadow:inset 0 0 0 2px var(--border),var(--shadow-card); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; font-size:21px; line-height:26px; font-weight:700; text-align:center; }
.dgs-guide .dgs-icon{ width:var(--icon-lg); height:var(--icon-lg); color:var(--primary); }

/* Dots */
.dgs-dots{ display:flex; justify-content:center; gap:10px; }
.dgs-dots i{ width:12px; height:12px; border-radius:50%; background:var(--divider); display:block; }
.dgs-dots i.on{ background:var(--primary); width:32px; border-radius:var(--radius-pill); }

/* Quote (kit Quote): caregiver page top, and the player's Rest screen */
.dgs-quote{ margin:0; padding:18px 20px 16px; border-radius:var(--radius-md); background:var(--accent-soft); display:flex; flex-direction:column; gap:10px; }
.dgs-quote blockquote{ margin:0; font-size:19px; line-height:30px; font-weight:500; color:var(--text); }
.dgs-quote blockquote::before{ content:"“"; } .dgs-quote blockquote::after{ content:"”"; }
html[lang="zh-CN"] .dgs-quote blockquote::before{ content:"“"; }
.dgs-quote figcaption{ font-size:16px; line-height:22px; color:var(--text-muted); }
.dgs-quote cite{ font-style:italic; }
.dgs-quote.tip small{ font-size:15px; line-height:20px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:var(--primary-ink); }
.dgs-quote.tip p{ margin:0; font-size:19px; line-height:30px; font-weight:600; }
.dgs-quote.player{ background:transparent; padding:0 4px; text-align:center; }
.dgs-quote.player blockquote{ font-size:24px; line-height:34px; }
/* Caregiver page */
.dgs-kind{ display:grid; grid-template-columns:auto 1fr; gap:14px; align-items:center; padding:18px 20px; border-radius:var(--radius-md); background:var(--accent-soft); }
.dgs-kind .dgs-icon{ width:40px; height:40px; color:var(--primary); }
.dgs-kind small{ display:block; font-size:16px; line-height:22px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:var(--primary-ink); }
.dgs-kind b{ display:block; font-size:22px; line-height:31px; font-weight:700; }
.dgs-disclaimer{ margin:0; padding:var(--space-3) var(--space-4); border-radius:var(--radius-md); background:var(--surface-sunk); font-size:19px; line-height:28px; font-weight:600; }
.dgs-quick{ display:grid; grid-template-columns:repeat(3,1fr); gap:var(--space-2); padding:var(--space-3); border-radius:var(--radius-md); background:var(--surface); box-shadow:var(--shadow-card); }
.dgs-quick > div{ display:flex; flex-direction:column; align-items:center; gap:8px; text-align:center; }
.dgs-quick__icon{ width:64px; height:64px; border-radius:50%; background:var(--primary-soft); color:var(--primary); display:grid; place-items:center; }
.dgs-quick b{ font-size:19px; line-height:25px; font-weight:700; }
.dgs-quick span.other{ font-size:16px; line-height:21px; color:var(--text-muted); }
.dgs-section{ border-radius:var(--radius-md); background:var(--surface); box-shadow:var(--shadow-card); overflow:hidden; }
.dgs-section > summary{ list-style:none; cursor:pointer; display:flex; align-items:center; gap:var(--space-2); min-height:var(--tap-min); padding:var(--space-2) var(--space-4); font-size:24px; line-height:32px; font-weight:700; }
.dgs-section > summary::-webkit-details-marker{ display:none; }
.dgs-section > summary .dgs-icon{ color:var(--primary); }
.dgs-section > summary::after{ content:""; margin-left:auto; flex:none; width:14px; height:14px; border-right:3px solid var(--text); border-bottom:3px solid var(--text); transform:rotate(45deg) translate(-3px,-3px); transition:transform .2s; }
.dgs-section[open] > summary::after{ transform:rotate(-135deg) translate(-3px,-3px); }
.dgs-section > summary:focus-visible{ outline:3px solid var(--focus-ring); outline-offset:-3px; }
.dgs-section__body{ padding:0 var(--space-4) var(--space-4); font-size:19px; line-height:30px; display:flex; flex-direction:column; gap:12px; }
.dgs-section__body h4{ margin:8px 0 0; font-size:19px; line-height:26px; color:var(--primary-ink); }
.dgs-section__body ul{ margin:0; padding-left:1.1em; }
.dgs-section__body li{ margin:4px 0; }
.dgs-bda{ display:grid; gap:10px; }
.dgs-bda div{ padding:12px 16px; border-radius:var(--radius-sm); background:var(--surface-sunk); }
.dgs-bda b{ display:block; color:var(--primary-ink); font-size:16px; letter-spacing:.05em; text-transform:uppercase; }
.dgs-part{ display:grid; gap:4px; padding:14px 16px; border-radius:var(--radius-sm); background:var(--surface-sunk); }
.dgs-part b{ font-size:20px; line-height:27px; }
.dgs-part p{ margin:0; font-size:18px; line-height:27px; }
.dgs-part .why{ display:grid; grid-template-columns:auto 1fr; gap:8px; align-items:start; margin-top:4px; padding-top:8px; border-top:1.5px solid var(--divider); }
.dgs-part .why .dgs-icon{ width:22px; height:22px; color:var(--primary); margin-top:3px; }
.dgs-part .why em{ font-style:normal; font-weight:700; color:var(--primary-ink); }
.dgs-sub{ font-size:17px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:var(--primary-ink); margin:6px 4px 0; }
.dgs-card{ padding:18px 20px; border-radius:var(--radius-md); background:var(--surface); box-shadow:var(--shadow-card); display:flex; flex-direction:column; gap:10px; }
.dgs-card h3{ font-size:22px; line-height:30px; }

/* Level picker */
.dgs-levels{ display:grid; gap:var(--space-2); }
.dgs-level{ appearance:none; border:0; cursor:pointer; text-align:left; display:grid; grid-template-columns:36px 1fr; gap:4px 14px; align-items:center; min-height:var(--tap-min); padding:14px 18px; border-radius:var(--radius-md); background:var(--surface); color:var(--text); box-shadow:inset 0 0 0 2px var(--border); }
.dgs-level b{ grid-column:2; font-size:22px; line-height:28px; }
.dgs-level > span:not(.dgs-radio){ grid-column:2; font-size:17px; line-height:24px; color:var(--text-muted); }
.dgs-level .dgs-radio{ grid-column:1; grid-row:1/3; width:30px; height:30px; border-radius:50%; box-shadow:inset 0 0 0 2.5px var(--border); display:grid; place-items:center; }
.dgs-level[aria-checked="true"]{ background:var(--primary-soft); box-shadow:inset 0 0 0 3px var(--primary); }
.dgs-level[aria-checked="true"] b{ color:var(--primary-ink); }
.dgs-level[aria-checked="true"] .dgs-radio{ box-shadow:inset 0 0 0 2.5px var(--primary); }
.dgs-level[aria-checked="true"] .dgs-radio::after{ content:""; width:16px; height:16px; border-radius:50%; background:var(--primary); }

/* Hold button */
.dgs-hold{ appearance:none; border:0; cursor:pointer; width:100%; display:flex; align-items:center; gap:var(--space-3); min-height:88px; padding:12px 20px; border-radius:var(--radius-lg); background:var(--surface); color:var(--text); box-shadow:inset 0 0 0 2px var(--border),var(--shadow-card); text-align:left; touch-action:none; }
.dgs-hold__ring{ --p:0; flex:none; width:60px; height:60px; border-radius:50%; display:grid; place-items:center; background:conic-gradient(var(--accent) calc(var(--p) * 1turn), var(--surface-sunk) 0); }
.dgs-hold__ring > span{ width:46px; height:46px; border-radius:50%; background:var(--surface); display:grid; place-items:center; }
.dgs-hold__ring .dgs-icon{ width:26px; height:26px; }
.dgs-hold b{ display:block; font-size:22px; line-height:28px; }
.dgs-hold small{ display:block; font-size:17px; line-height:22px; color:var(--text-muted); }

/* Settings */
.dgs-group{ display:flex; flex-direction:column; gap:6px; scroll-margin-top:12px; }
.dgs-group > h3{ margin:0 4px 4px; font-size:17px; line-height:22px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:var(--primary-ink); display:flex; align-items:center; gap:8px; }
.dgs-group > h3 .dgs-icon{ width:22px; height:22px; }
.dgs-group__rows{ border-radius:var(--radius-md); background:var(--surface); box-shadow:var(--shadow-card); }
.dgs-row{ display:grid; grid-template-columns:1fr auto; align-items:center; gap:8px 16px; padding:16px 20px; min-height:var(--tap-min); border-top:1.5px solid var(--divider); scroll-margin-top:12px; }
.dgs-row:first-child{ border-top:0; }
.dgs-row > .lbl,.dgs-row > label{ font-size:19px; line-height:26px; font-weight:600; min-width:0; }
.dgs-row > .note,.dgs-row > p{ grid-column:1 / -1; }
.dgs-row--stack{ grid-template-columns:1fr; }
.dgs-row--stack > *{ grid-column:1 / -1; }
.dgs-switch{ appearance:none; margin:0; cursor:pointer; width:68px; height:40px; border-radius:var(--radius-pill); background:var(--surface-sunk); box-shadow:inset 0 0 0 2px var(--border); position:relative; border:0; flex:none; transition:background-color .15s; }
.dgs-switch::after{ content:""; position:absolute; top:5px; left:5px; width:30px; height:30px; border-radius:50%; background:var(--surface); box-shadow:0 0 0 2px var(--border); transition:transform .15s; }
.dgs-switch[aria-checked="true"]{ background:var(--primary); box-shadow:none; }
.dgs-switch[aria-checked="true"]::after{ transform:translateX(28px); box-shadow:none; }
.dgs-seg{ display:flex; flex-wrap:wrap; padding:4px; border-radius:var(--radius-sm); background:var(--surface-sunk); gap:4px; }
.dgs-seg button{ appearance:none; border:0; cursor:pointer; flex:1 1 0; min-width:64px; min-height:52px; border-radius:9px; background:transparent; color:var(--text); font-size:18px; font-weight:600; padding:4px 10px; line-height:1.25; }
.dgs-seg.many{ display:grid; grid-template-columns:repeat(auto-fit,minmax(118px,1fr)); }
.dgs-seg.many.short{ grid-template-columns:repeat(4,1fr); }
.dgs-seg button[aria-pressed="true"]{ background:var(--surface); color:var(--primary-ink); font-weight:800; box-shadow:inset 0 0 0 2.5px var(--primary); }
input[type=range]{ -webkit-appearance:none; appearance:none; width:100%; height:48px; background:transparent; margin:0; touch-action:none; }
input[type=range]::-webkit-slider-runnable-track{ height:10px; border-radius:999px; background:var(--surface-sunk); box-shadow:inset 0 0 0 1.5px var(--border); }
input[type=range]::-webkit-slider-thumb{ -webkit-appearance:none; width:36px; height:36px; margin-top:-13px; border-radius:50%; background:var(--primary); border:4px solid var(--surface); box-shadow:0 0 0 2px var(--primary); }
input[type=range]::-moz-range-track{ height:10px; border-radius:999px; background:var(--surface-sunk); }
input[type=range]::-moz-range-thumb{ width:30px; height:30px; border-radius:50%; background:var(--primary); border:4px solid var(--surface); }
.dgs-progress{ height:12px; border-radius:999px; background:var(--surface-sunk); overflow:hidden; }
.dgs-progress i{ display:block; height:100%; background:var(--primary); border-radius:inherit; transition:width .4s ease; }
.dgs-checklist{ list-style:none; padding:0; margin:0; display:grid; gap:6px; }
.dgs-check{ appearance:none; border:0; background:transparent; cursor:pointer; width:100%; display:flex; align-items:center; gap:12px; min-height:56px; padding:4px 0; text-align:left; font-size:19px; color:var(--text); }
.dgs-tick{ width:30px; height:30px; border-radius:8px; box-shadow:inset 0 0 0 2px var(--border); display:grid; place-items:center; flex:none; }
.dgs-tick .dgs-icon{ width:20px; height:20px; }
.dgs-check.is-done .dgs-tick{ background:var(--primary); color:var(--on-primary); box-shadow:none; }
.dgs-check.is-done span:last-child{ color:var(--text-muted); text-decoration:line-through; }

/* Notice */
.dgs-notice{ display:grid; grid-template-columns:auto 1fr; gap:12px; align-items:start; padding:14px 18px; border-radius:var(--radius-md); background:var(--accent-soft); font-size:18px; line-height:27px; }
.dgs-notice .dgs-icon{ width:28px; height:28px; }
.dgs-notice b{ display:block; }

/* Mood faces */
.dgs-moods{ display:grid; grid-template-columns:repeat(3,1fr); gap:var(--space-2); width:100%; }
.dgs-mood{ appearance:none; border:0; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:6px; padding:12px 4px; min-height:var(--tap-min); border-radius:var(--radius-md); background:var(--surface); color:var(--text); box-shadow:inset 0 0 0 2px var(--border); }
.dgs-mood svg{ width:min(18vw,72px); height:min(18vw,72px); }
.dgs-mood b{ font-size:22px; line-height:26px; }
.dgs-mood span{ font-size:16px; line-height:20px; color:var(--text-muted); }
.dgs-moods.small .dgs-mood svg{ width:52px; height:52px; }
.dgs-moods.small .dgs-mood b{ font-size:19px; }

/* Rest card */
#restCard{ position:fixed; z-index:45; left:50%; bottom:calc(var(--safe-b) + 24px); width:min(94vw,520px); transform:translate(-50%,140%); opacity:0;
  display:flex; flex-direction:column; gap:var(--space-2); padding:var(--space-4); border-radius:var(--radius-lg) var(--radius-lg) var(--radius-md) var(--radius-md); background:var(--surface); box-shadow:var(--shadow-lift); transition:transform .9s ease, opacity 1.2s ease; }
#restCard.show{ transform:translate(-50%,0); opacity:1; }
#restCard h3{ text-align:center; font-size:26px; line-height:34px; }
#restCard .row{ display:grid; grid-template-columns:1fr 1fr; gap:var(--space-2); }

/* Dialog (never alert()) and toast */
#dialog{ position:fixed; inset:0; z-index:80; background:rgba(0,0,0,.45); display:flex; align-items:center; justify-content:center; padding:16px; }
#dialog .box{ background:var(--surface); border-radius:var(--radius-lg); padding:var(--space-4); width:min(100%,480px); max-height:90vh; overflow:auto; display:flex; flex-direction:column; gap:var(--space-3); text-align:center; box-shadow:var(--shadow-lift); }
#dialog .box h3{ font-size:28px; line-height:36px; }
#dialog .box p,#dialog .box li{ font-size:19px; line-height:28px; text-align:left; }
#dialog .box ul{ margin:0; padding-left:1.1em; }
#dialog .btns{ display:flex; flex-direction:column; gap:var(--space-2); }
.dgs-btn--plain{ background:var(--surface); color:var(--text); box-shadow:inset 0 0 0 2px var(--border); min-height:64px; font-size:20px; font-weight:600; }
#toast{ position:fixed; z-index:90; left:50%; top:calc(var(--safe-t) + 90px); transform:translateX(-50%); background:var(--text); color:var(--surface); border-radius:var(--radius-sm); padding:12px 20px; font-size:18px; font-weight:700; opacity:0; transition:opacity .4s; pointer-events:none; max-width:90vw; text-align:center; }
#toast.show{ opacity:1; }

/* Ghost hand */
#ghost{ position:fixed; z-index:50; left:0; top:0; width:84px; height:84px; pointer-events:none; opacity:0; transition:opacity .5s ease; }
#ghost.show{ opacity:.95; }
#ghost svg{ width:100%; height:100%; filter:drop-shadow(0 4px 8px rgba(0,0,0,.22)); }
#ghostTarget{ position:fixed; z-index:49; width:110px; height:110px; margin:-55px 0 0 -55px; border-radius:50%; border:5px solid var(--accent); box-shadow:0 0 0 8px var(--accent-soft); pointer-events:none; opacity:0; }
#ghostTarget.show{ opacity:1; animation:pulse 2.4s ease-in-out infinite; }
@keyframes pulse{ 0%,100%{ transform:scale(.88); opacity:.6; } 50%{ transform:scale(1.04); opacity:1; } }

/* Captions (every spoken line is shown) */
#caption{
  position:fixed; z-index:40; left:16px; right:16px; margin:0 auto; width:fit-content; transform:translateY(12px); bottom:calc(var(--safe-b) + 130px);
  max-width:min(calc(100vw - 32px),640px); background:var(--surface); color:var(--text);
  border-radius:var(--radius-md); padding:12px 22px; font-size:28px; font-weight:600; text-align:center; line-height:1.4;
  box-shadow:var(--shadow-lift); opacity:0; pointer-events:none; transition:opacity .6s ease, transform .6s ease;
}
#caption.show{ opacity:1; transform:none; }


/* Hero picture on start / end / rest */
.dgs-hero{ flex:1 1 auto; min-height:100px; display:flex; justify-content:center; align-items:center; }
.dgs-hero > .dgs-art{ height:100%; max-height:40vh; aspect-ratio:var(--hero-ratio,1/1); max-width:100%; }
.dgs-col{ width:100%; max-width:var(--content-max); margin:0 auto; display:flex; flex-direction:column; gap:var(--space-3); min-height:0; flex:1 1 auto; }
.dgs-center{ justify-content:center; }
.dgs-btns{ display:flex; flex-direction:column; gap:var(--space-2); }
@media (max-height:640px){ .dgs-title{ font-size:34px; line-height:40px; } .dgs-btn--play{ min-height:88px; } }
@media (prefers-reduced-motion:reduce){ *,*::before,*::after{ animation-duration:.001s !important; animation-iteration-count:1 !important; transition-duration:.001s !important; } }

/* Spot It! scenes and play screen (kept from v1, on kit tokens) */
/* Scene picker */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.scard{font:inherit;display:flex;flex-direction:column;gap:6px;padding:10px;border-radius:var(--r);background:var(--surface);
  border:3px solid var(--line);color:var(--text);cursor:pointer;text-align:left;box-shadow:0 4px 0 var(--line)}
.scard:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.scard svg{width:100%;height:auto;display:block;aspect-ratio:1}
.scard .nm{font-size:24px;font-weight:800;padding:2px 6px 0;color:var(--primary)}
.scard .ds{font-size:18px;color:var(--muted);padding:0 6px 4px;line-height:1.4}

/* Game screen */
.gbar{display:flex;align-items:center;gap:10px}
.dots{flex:1;display:flex;justify-content:center;align-items:center;gap:10px;min-width:0}
.dots i{flex:none;width:18px;height:18px;border-radius:50%;border:3px solid var(--primary);background:var(--surface)}
.dots i.done{background:var(--accent);border-color:var(--accent)}
.dots i.now{width:24px;height:24px;box-shadow:0 0 0 4px var(--primary-soft)}
#scene{position:relative;flex:1;min-height:200px;touch-action:manipulation;overflow:hidden}
#scene>svg{position:absolute;inset:0;width:100%;height:100%}
.tcard{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:var(--r);padding:12px;
  border:3px solid var(--line);min-height:120px}
.timg{position:relative;width:96px;height:96px;flex:none;border-radius:20px;background:var(--bg);border:3px solid var(--accent);padding:4px;cursor:pointer;font:inherit}
.timg .badge{position:absolute;right:-10px;bottom:-10px;width:40px;height:40px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;border:3px solid #fff}
.timg .badge svg{width:22px;height:22px}
.timg svg{width:100%;height:100%}
.tlabel{font-size:18px;color:var(--muted);font-weight:700}
.tprompt{font-size:26px;font-weight:700;line-height:1.35}
.kw{white-space:nowrap;color:var(--primary);font-weight:800;font-size:1.12em;text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:5px}
.donecard{flex-direction:column;align-items:stretch;text-align:center;gap:12px;padding:16px}
.donecard .star{width:72px;height:72px;margin:0 auto}
.donecard h2{color:var(--primary)}

/* Scene effects */
.obj{cursor:pointer}
.obj .art{transform-box:fill-box;transform-origin:50% 100%}
.obj.found .art{animation:pop .7s ease}
@keyframes pop{35%{transform:scale(1.14)}70%{transform:scale(.97)}}
.glow{fill:var(--accent);pointer-events:none}
.glow.h1{opacity:.28}
.glow.found{opacity:.4}
.ring{fill:none;pointer-events:none;stroke:var(--accent);stroke-width:8}
.ring.h2,.ring.h3{animation:ringp 1.4s ease-in-out infinite alternate}
.ring.h3{stroke:var(--primary);stroke-width:9}
@keyframes ringp{from{stroke-width:7;opacity:1}to{stroke-width:14;opacity:.55}}
.obj.dim{opacity:.5;transition:opacity .8s}
.ripple,.spark{position:absolute;pointer-events:none;border-radius:50%}
.ripple{width:80px;height:80px;margin:-40px 0 0 -40px;border:4px solid var(--primary);opacity:.45;animation:ripple .9s ease-out forwards}
@keyframes ripple{from{transform:scale(.3)}to{transform:scale(1.8);opacity:0}}
.spark{width:16px;height:16px;margin:-8px 0 0 -8px;background:var(--accent);animation:spark .9s ease-out forwards}
@keyframes spark{from{transform:translate(0,0) scale(1);opacity:1}to{transform:translate(var(--dx),var(--dy)) scale(.3);opacity:0}}
.praise{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:var(--surface);color:var(--primary);
  font-weight:800;font-size:28px;padding:8px 26px;border-radius:999px;border:3px solid var(--accent);white-space:nowrap;
  pointer-events:none;animation:praise 1.6s ease forwards;z-index:3}
@keyframes praise{0%{opacity:0;transform:translate(-50%,10px)}15%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
#hand{position:absolute;width:60px;height:60px;margin:-4px 0 0 -22px;pointer-events:none;display:none;z-index:4;
  animation:tap 1.2s ease-in-out infinite alternate;filter:drop-shadow(0 3px 4px rgba(0,0,0,.3))}
#hand.on{display:block}
@keyframes tap{from{transform:translate(18px,22px)}to{transform:translate(0,0)}}
.confetti{position:absolute;width:14px;height:14px;border-radius:3px;pointer-events:none;animation:fall 2.4s ease-in forwards}
@keyframes fall{from{transform:translateY(-20px) rotate(0)}to{transform:translateY(var(--h)) rotate(320deg);opacity:0}}

/* How to Play animations */
.tapper{animation:tapper 1.2s ease-in-out infinite alternate}
@keyframes tapper{from{transform:translate(14px,16px)}to{transform:translate(0,0)}}
.wave{animation:wave 1.4s ease-in-out infinite}
@keyframes wave{50%{opacity:.25}}


/* Simplest: the background sits a little darker so the glowing target stands out */
svg.lv-simplest .scene-bg{ filter:brightness(.95); }
/* Scene picker: the last place played is larger; "More places" spans the row */
#scene-grid .scard.last{ grid-column:1 / -1; }
#scene-grid .scard.last svg{ max-height:46vh; }
#scene-grid .scenes-more{ grid-column:1 / -1; }

/* ---------- 3. Spot It! only ---------- */
#s-lang{ justify-content:center; }
#s-lang .col{ flex:0 0 auto; gap:var(--space-4); }
#s-lang .dgs-hero{ flex:0 0 auto; height:30vh; }
#s-lang .dgs-btn--primary,#s-lang .dgs-btn--secondary{ min-height:96px; font-size:30px; }
#s-start .col{ gap:var(--space-2); }
#s-howto .pic{ flex:1 1 auto; min-height:0; display:flex; align-items:center; justify-content:center; }
#s-howto .pic .dgs-art{ height:100%; max-height:44vh; aspect-ratio:1/1; max-width:100%; display:grid; place-items:center; padding:8px; }
#s-howto .pic svg{ width:100%; height:100%; }
#s-howto .dgs-caption{ min-height:2.9em; display:block; }
#s-howto .dgs-btns{ gap:4px; }
#s-scenes .grid{ flex:1 1 auto; min-height:0; overflow-y:auto; touch-action:pan-y; padding:4px 2px 12px; align-content:start; }
.scard{ border:0; box-shadow:inset 0 0 0 2px var(--border),var(--shadow-card); }
.scard:active{ box-shadow:inset 0 0 0 2px var(--border); }
.scard.last{ box-shadow:inset 0 0 0 3px var(--primary),var(--shadow-card); }
.scard:focus-visible,.timg:focus-visible{ outline:3px solid var(--focus-ring); outline-offset:3px; }
.scard .nm{ color:var(--primary-ink); }
#s-rest .col{ justify-content:safe center; overflow-y:auto; }
@media (max-height:700px){ .donecard{ gap:6px; padding:10px; } .donecard .star{ width:44px; height:44px; } .donecard h2{ font-size:24px; line-height:30px; } .donecard .dgs-btn{ min-height:60px; } #s-rest .dgs-hero{ display:none; } }
#s-rest .dgs-hero{ max-height:30vh; }
#s-rest .dgs-art{ border-radius:var(--radius-lg); overflow:hidden; }
@media (max-height:700px){ #s-rest .dgs-hero{ max-height:20vh; } }

/* Play screen */
#s-game{ gap:var(--space-2); }
#s-game > *{ width:100%; max-width:820px; margin-left:auto; margin-right:auto; }
.gbar .dgs-back{ flex:none; }
.tcard{ border:0; box-shadow:inset 0 0 0 2px var(--divider),var(--shadow-card); }
.pair{ display:grid; grid-template-columns:1fr 1fr; gap:var(--space-2); }
.pair .dgs-btn{ min-height:64px; font-size:21px; padding:0 10px; }
.donecard .dgs-btn{ min-height:72px; }
.places{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:4px; }
.places button{ font:inherit; display:flex; align-items:center; gap:10px; min-height:64px; padding:6px 12px; border-radius:var(--radius-sm); font-size:19px; font-weight:700;
  background:var(--surface-sunk); color:var(--text-muted); border:0; box-shadow:inset 0 0 0 2px var(--divider); cursor:pointer; text-align:left; }
.places button.on{ background:var(--primary-soft); color:var(--text); box-shadow:inset 0 0 0 2.5px var(--primary); }
.places .tick{ width:30px; height:30px; flex:none; border-radius:8px; border:3px solid var(--primary); display:flex; align-items:center; justify-content:center; color:#fff; }
.places button.on .tick{ background:var(--primary); }
.places .tick svg{ width:20px; height:20px; }
@media (min-width:700px){ .timg{ width:120px; height:120px; } .tprompt{ font-size:30px; } #s-scenes .grid{ grid-template-columns:repeat(3,1fr); } }
@media (max-height:620px){ .tcard{ min-height:100px; padding:8px; } .timg{ width:80px; height:80px; } .tprompt{ font-size:22px; } }
@media (orientation:landscape) and (max-height:520px){
  #s-game:not([hidden]){ display:grid; grid-template-columns:1fr 1fr; grid-template-rows:auto 1fr auto auto; column-gap:16px; }
  #s-game .gbar{ grid-column:1/3; }
  #s-game #scene{ grid-row:2/5; grid-column:1; }
  #s-game .tcard,#s-game .pair{ grid-column:2; }
}
@media (prefers-reduced-motion:reduce){ .ring.h2,.ring.h3{ stroke-width:12; } }
/* Design refinement from Joyce's design partner, 5 Nov 2026 (folded into the build; speed fixes marked). */
/* 2026 visual refinement — shared accessibility guardrails. */
.dgs-btn:focus-visible,.dgs-round:focus-visible,.dgs-back:focus-visible,
button:focus-visible,[role="button"]:focus-visible{outline:4px solid var(--focus-ring);outline-offset:4px;}
.dgs-btn--primary{background-image:linear-gradient(160deg,rgba(255,255,255,.13),transparent 54%);}
.dgs-btn--secondary{background-image:linear-gradient(180deg,rgba(255,255,255,.9),rgba(255,255,255,.14));}
.dgs-notice{border:1px solid var(--divider);}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;}}

/* Spot It: a clear search target and legible storybook scene; no extra objects. */
#scene{border-radius:22px;background:#f8f1db;box-shadow:0 0 0 3px #e4d4ae,0 10px 23px rgba(40,55,56,.13);}
/* (speed) no filter on the whole scene: its hint rings animate inside it */
.tcard{background:linear-gradient(145deg,#fff,#fff8e2);box-shadow:inset 0 0 0 3px var(--primary),0 7px 18px rgba(24,65,110,.1);}
.timg{width:clamp(96px,22vw,120px);height:clamp(96px,22vw,120px);background:#fffdfa;border:4px solid var(--primary);box-shadow:0 3px 10px rgba(29,95,168,.12);}
.tprompt{font-size:clamp(25px,5.5vw,33px);}
.obj{outline:none;}
/* (speed) objects get a drawn shadow ellipse instead of a filter on each one */
.scard svg{border-radius:14px;background:#fff8e9;}
.scard{gap:8px;}
@media(max-height:670px){.tcard{padding:8px;min-height:90px;}.timg{width:86px;height:86px;}.tprompt{font-size:24px;}}
@media(prefers-reduced-motion:reduce){.obj.found .art{animation:none!important;}}

/* "All games": back to the Gentle Games landing page, top corner of the start screen */
.dgs-allgames{ display:inline-flex; align-items:center; gap:6px; min-height:48px; padding:0 14px; border-radius:999px; background:var(--surface); color:var(--primary-ink, var(--primary)); text-decoration:none; font-size:17px; font-weight:700; box-shadow:inset 0 0 0 2px var(--border); flex:none; white-space:nowrap; }
.dgs-allgames .dgs-icon{ width:22px; height:22px; }
.dgs-allgames:active{ transform:scale(.96); }
.dgs-allgames:focus-visible{ outline:3px solid var(--focus-ring); outline-offset:3px; }
.dgs-topbar.has-allgames{ justify-content:flex-start; gap:10px; padding-right:68px; }
/* Narrow phones: "All games" on the first row (beside the sound button), the language switch on the row below */
@media (max-width:520px){
  .dgs-topbar.has-allgames{ flex-wrap:wrap; row-gap:8px; padding-right:0; }
  .dgs-topbar.has-allgames .dgs-allgames{ margin-right:100%; }
}

@media (max-width:520px) and (max-height:700px){ .dgs-topbar.has-allgames ~ .dgs-footnote{ display:none; } }

<body>
<!-- ==== SECTION: MARKUP ==== -->
<!-- Screens follow the MOO Dementia Games kit. SCREENS fills the words from STRINGS and KIT.STR, so every word can switch language. -->

<!-- Sound button, top right on the start, how-to and rest screens (the play screen has its own) -->
<button id="muteBtn" class="dgs-round mute-btn" type="button" data-act="mute"></button>

<!-- First launch: language for the person playing -->
<section class="screen" id="s-lang" hidden><div class="col dgs-center" id="lang-body"></div></section>

<!-- Start: language at the top, name, picture, Play, then the two guide buttons -->
<section class="screen" id="s-start" hidden>
  <div class="col">
    <div class="dgs-topbar has-allgames"><a class="dgs-allgames" href="../"><svg class="dgs-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg><span>All games</span></a><div class="dgs-lang" id="start-lang" role="group" aria-label="Language / 语言"></div></div>
    <h1 class="dgs-title" id="start-title"></h1>
    <div class="dgs-hero"><div class="dgs-art" id="hero"></div></div>
    <div class="dgs-btns">
      <button id="play-btn" class="dgs-btn dgs-btn--primary dgs-btn--play" type="button" data-act="play"></button>
      <div class="dgs-guides">
        <button id="howto-btn" class="dgs-guide" type="button" data-act="howto"></button>
        <button id="care-btn" class="dgs-guide" type="button" data-act="care"></button>
      </div>
    </div>
    <p class="dgs-footnote" data-t="tablet_note"></p>
  </div>
</section>

<!-- How to play: 4 steps -->
<section class="screen" id="s-howto" hidden>
  <div class="col">
    <div class="dgs-topbar"><button id="how-back" class="dgs-back" type="button" data-act="howto-close"></button></div>
    <div class="pic"><div class="dgs-art" id="how-pic"></div></div>
    <p class="dgs-caption" id="how-text"></p>
    <div class="dgs-dots" id="how-dots" aria-hidden="true"></div>
    <div class="dgs-btns">
      <button id="how-next" class="dgs-btn dgs-btn--primary" type="button" data-act="howto-next"></button>
      <button id="how-skip" class="dgs-btn dgs-btn--quiet" type="button" data-act="howto-skip"></button>
    </div>
  </div>
</section>

<!-- Choose a place -->
<section class="screen" id="s-scenes" hidden>
  <div class="col">
    <div class="dgs-topbar"><button class="dgs-back" type="button" data-act="home" data-back="home"></button><span class="grow"></span><button class="dgs-round mute-btn" type="button" data-act="mute"></button></div>
    <h2 class="dgs-screen-title" id="scenes-title"></h2>
    <p class="dgs-footnote" id="scenes-sub"></p>
    <div class="grid" id="scene-grid"></div>
  </div>
</section>

<!-- Play -->
<section class="screen" id="s-game" hidden>

  "cg.why1": "Spot It! shows a calm picture of a familiar place, such as a kopitiam, a wet market or a kampung, and asks for one thing at a time: \"Can you find the teapot?\"",
  "cg.why2": "Looking for something familiar keeps attention gently for a few minutes, and the picture gives you both something to talk about. There are no scores, no timers and no wrong answers.",
  "cg.setup": "Choose a language and a level. In settings you can hide places that do not suit. Everything else works as it is.",
  "cg.p.places.h": "Choosing a place",
  "cg.p.places.d": "Ten everyday places, each with twelve familiar things. The place played last is shown first.",
  "cg.p.places.p": "A place they know well is easier to look at and easier to talk about.",
  "cg.p.picture.h": "The picture",
  "cg.p.picture.d": "Things sit in three rows: on the wall, on the table and on the floor. Fewer things show on gentler levels and on phones.",
  "cg.p.picture.p": "A tidy layout makes it easier to scan without feeling lost.",
  "cg.p.card.h": "What to find",
  "cg.p.card.d": "Under the picture, a small picture and words show what to find, and the voice says it. Tap the small picture to hear it again.",
  "cg.p.card.p": "Seeing and hearing the name together helps when one of them is harder.",
  "cg.p.touch.h": "Touching the picture",
  "cg.p.touch.d": "Tapping something else only makes a soft ripple. Nothing says it was wrong.",
  "cg.p.touch.p": "Trying never feels like failing.",
  "cg.p.help.h": "Help in steps",
  "cg.p.help.d": "After a while the thing glows faintly, then a ring pulses around it, then the rest of the picture dims, a hand points to it and the voice says \"It's just here.\" You can stop the help earlier with Help style in settings.",
  "cg.p.help.p": "Everything can always be found, at their own pace.",
  "cg.p.skip.h": "Another one",
  "cg.p.skip.d": "Skips to a different thing to find. The skipped one comes back later in the round, or is swapped for another.",
  "cg.p.skip.p": "A way out of something they do not recognise, without any sense of giving up.",
  "cg.p.found.h": "Finding it",
  "cg.p.found.d": "A soft chime, a small sparkle and a short word of thanks such as \"That's the one.\"",
  "cg.p.found.p": "A small, clear moment of success.",
  "cg.p.dots.h": "Round dots",
  "cg.p.dots.d": "The dots at the top show how many things are in this round and how many are found.",
  "cg.p.dots.p": "A round always has a clear end in sight.",
  "cg.p.done.h": "All found",
  "cg.p.done.d": "At the end of a round, a star and two choices: another place, or rest.",
  "cg.p.done.p": "A natural point to stop or go on.",
  "cg.p.adapt.h": "Adjusting by itself",
  "cg.p.adapt.d": "Within the chosen level, the next round has a few more things when little help was needed, and fewer when a lot of help was needed.",
  "cg.p.adapt.p": "Keeps most rounds comfortable without anyone changing settings.",
  "cg.p.rest.h": "Rest",
  "cg.p.rest.d": "Always on the play screen. When the session time is up, a card offers Rest or Keep playing, between finds, never in the middle of one.",
  "cg.p.rest.p": "A clear way to finish at any point.",
  "cg.p.mood.h": "Mood faces",
  "cg.p.mood.d": "After a rest they can tap a face. You can also note how they seem at any time on this page.",
  "cg.p.mood.p": "Helps you see their better and harder times of day. For your reference, not a medical record.",
  "cg.p.level.h": "Level",
  "cg.p.level.d": "Standard, Gentler or Simplest changes how many things show, how many to find and how soon help comes. Simplest shows a faint glow on the thing to find from the start.",
  "cg.p.level.p": "Adjust the game to how they are on the day. Change it as often as needed.",
  "cg.a.place.h": "Choosing a place",
  "cg.a.place": "Start with a place they knew well: a kopitiam if they had breakfast there every day, the kampung if they grew up in one. Hide places that do not suit in settings.",
  "cg.a.talk.h": "Talking about the picture",
  "cg.a.say1": "“We had a teapot like that.”",
  "cg.a.say2": "“Which stall did you like?”",
  "cg.a.say3": "“Look at all the tangerines.”",
  "cg.a.avoid.h": "Avoid",
  "cg.a.avoid": "“It’s right there.” or “You just saw it.” Praise the looking, not just the finding.",
  "cg.a.good.h": "Signs it is going well",
  "cg.a.good": "Pointing, naming things, telling you about a place.",
  "cg.a.much.h": "Signs it is too much",
  "cg.a.much": "Staring without looking, tapping everywhere, sighing, pushing the phone away.",
  "cg.a.do.h": "What to do",
  "cg.a.do": "Tap Rest. Next time choose Gentler or Simplest, or try Window Seat, which asks for nothing.",
  "cg.self": "While they look, you can sit beside them and rest; the game gives help when it is needed.",
  "cg.rec.byYou": "Noted on the caregiver page",

  var JT = '“Realizing the potential of an aging society”, The Japan Times, 8 March 2007';
  var JTZ = '〈高龄社会的生存之道〉，《日本时报》，2007年3月8日';
  var HLL = 'On Health and Long Life (quoted in SGI-USA, “The Buddhist View on Caregiving”, 2022)';
  var QUOTES = [
    { id: 'i31', type: 'ikeda', for: 'care', en: 'Gaining a person’s understanding is better than just telling them no… When we make such efforts for people suffering from dementia, they feel that we care about them and understand them.', zh: '让对方理解，比只对他说“不”更好……我们这样用心对待失智症患者时，他们能感受到我们的关心和理解。', src: HLL, zhFrom: 'ours' },
    { id: 'i32', type: 'ikeda', for: 'care', en: 'In caring for others, the important thing is to try not to shoulder it alone.', zh: '照顾他人时，重要的是尽量不要一个人扛。', src: HLL, zhFrom: 'ours' },
    { id: 'i30', type: 'ikeda', for: 'care', en: 'Let’s encourage our friends who are dedicating themselves to childrearing, caring for the elderly and nursing the sick.', zh: '让我们鼓励正在养育孩子、照顾长辈、护理病人的朋友。', src: '“To My Friends”, Seikyo Shimbun (World Tribune translation, 28 Dec 2022)', zhFrom: 'ours' },
    { id: 'i44', type: 'ikeda', for: 'care', en: 'Sincere efforts to brighten our surroundings and the lives of others return to illuminate our own final years with dignity.', zh: '真诚地为周围环境和他人的生活带来光明，这份努力会回过来，让我们自己的晚年也充满尊严。', src: JT, zhFrom: 'ours' },
    { id: 'i25', type: 'ikeda', for: 'care', en: 'Individuals who feel needed and strive on behalf of others can keep their youth and energy.', zh: '只要一心怀着急他人所需、为他人尽力的意念，人就可常保朝气，暖和身边之人的心，让社区更显光明。', src: JT, srcZh: JTZ, zhFrom: 'official' },
    { id: 'i23', type: 'ikeda', for: 'care', en: 'Recognizing and treasuring the contributions of older people is essential to the long-term flourishing of any society.', zh: '树立真心尊敬高龄人士的风气，无疑是为社会的持续繁荣打稳基础。', src: JT, srcZh: JTZ, zhFrom: 'official' },
    { id: 'i1', type: 'ikeda', for: 'care', en: 'There is a saying, ‘The foolish regard old age as winter; the wise regard it as a golden time.’ Everything depends upon our attitude, how we approach life.', zh: '有句话说：“愚者视老年为冬天，智者视老年为黄金时期。”一切都取决于我们的心态，取决于我们怎样面对人生。', src: 'The Wisdom for Creating Happiness and Peace, Part 1, 9.1 (from A Discussion on the Third Stage of Life, 1998)', zhFrom: 'ours' },
    { id: 'i11', type: 'ikeda', for: 'player', en: 'I believe youth can last a lifetime.', zh: '我相信青春可以持续一生。', src: JT, srcZh: JTZ, zhFrom: 'ours' },
    { id: 'i12', type: 'ikeda', for: 'player', en: 'Inner youthfulness is not a matter of our physical age.', zh: '其实心境年轻与否是不能以实际年龄来下定论的。', src: JT, srcZh: JTZ, zhFrom: 'official' },
    { id: 'i28', type: 'ikeda', for: 'player', en: 'The wisdom and experience of older people is a resource of inestimable worth.', zh: '高龄人士的智慧与经验，是丰富现在未来的宝贵财产。', src: JT, srcZh: JTZ, zhFrom: 'official' },
    { id: 'i5', type: 'ikeda', for: 'player', en: 'The ideal old age might be likened to a magnificent sunset.', zh: '但愿晚年能如承诺翌日亦是晴天的无限夕阳一般，灿烂尽显，光辉四射，向未来的世代送上希望的光明。', src: JT, srcZh: JTZ, zhFrom: 'official' },
    { id: 's2', type: 'saying', for: 'care', en: 'Dementia changes the map, not the worth of the traveler.', zh: '失智症改变的是地图，不是旅人的价值。' },
    { id: 's6', type: 'saying', for: 'care', en: 'The person is still here, even when the story is scattered.', zh: '即使故事零散了，这个人依然在这里。' },
    { id: 's12', type: 'saying', for: 'care', en: 'A diagnosis explains changes; it does not erase a life.', zh: '诊断解释了变化，但抹不去一个人的一生。' },
    { id: 's20', type: 'saying', for: 'care', en: 'Confusion is not stubbornness.', zh: '糊涂不是固执。' },
    { id: 's30', type: 'saying', for: 'care', en: 'Repetition is not failure; it is a need for reassurance.', zh: '反复问同一件事不是失败，而是需要安心。' },
    { id: 's43', type: 'saying', for: 'care', en: 'Behavior is communication when language falters.', zh: '当语言跟不上时，行为就是在表达。' },
    { id: 's44', type: 'saying', for: 'care', en: 'Look for the need behind the noise.', zh: '留意吵闹背后的需要。' },
    { id: 's54', type: 'saying', for: 'care', en: 'People remember how they were made to feel.', zh: '人们会记得别人带给自己的感受。' },
    { id: 's76', type: 'saying', for: 'care', en: 'Validation is not agreement; it is acknowledgment.', zh: '认同感受不等于同意，而是表示“我明白”。' },
    { id: 's29', type: 'saying', for: 'care', en: 'Familiar rituals are memory’s handrails.', zh: '熟悉的日常习惯，是记忆的扶手。' },
    { id: 's72', type: 'saying', for: 'care', en: 'Dementia is a condition, not an identity.', zh: '失智症是一种病况，不是一个人的身份。' },
    { id: 's28', type: 'saying', for: 'care', en: 'Music can reach where explanation cannot.', zh: '音乐能到达解释到不了的地方。' },
    { id: 'e34', type: 'encourage', for: 'care', en: 'Rest is part of care, not a break from it.', zh: '休息是照顾的一部分，不是中断。' },
    { id: 'e63', type: 'encourage', for: 'care', en: 'You can love someone and still need respite.', zh: '您可以爱一个人，同时也需要喘息。' },
    { id: 'e33', type: 'encourage', for: 'care', en: 'Caregiver guilt is common; it is not a reliable judge.', zh: '照顾者的内疚很常见，但它不是可靠的判官。' },
    { id: 'e86', type: 'encourage', for: 'care', en: 'Burnout is a signal, not a verdict.', zh: '累垮是一个信号，不是一个判决。' },
    { id: 'e97', type: 'encourage', for: 'care', en: 'You do not need a cure to offer care.', zh: '不需要治愈，也能给予照顾。' },
    { id: 'e98', type: 'encourage', for: 'care', en: 'You do not need perfect words to offer presence.', zh: '不需要完美的话语，也能陪伴在旁。' },
    { id: 'e90', type: 'encourage', for: 'care', en: 'No one should have to improvise dementia care alone.', zh: '没有人应该独自摸索怎样照顾失智的家人。' },
    { id: 'e83', type: 'encourage', for: 'care', en: 'Love can be practical: a pill box, a nightlight, a labeled drawer.', zh: '爱可以很实际：一个药盒、一盏小夜灯、一个贴了标签的抽屉。' },
    { id: 'e4', type: 'encourage', for: 'player', en: 'A good day can be small: warm light, familiar music, a hand nearby.', zh: '美好的一天可以很简单：温暖的光、熟悉的音乐、身边有一只手。' },
    { id: 'e95', type: 'encourage', for: 'player', en: 'A good moment is not a small thing.', zh: '美好的片刻，不是小事。' },
    { id: 'e91', type: 'encourage', for: 'player', en: 'Aging can still include wonder.', zh: '年纪大了，依然可以有惊喜。' },
    { id: 'e96', type: 'encourage', for: 'player', en: 'The present is where connection lives.', zh: '当下，就是我们相连的地方。' },
    { id: 't4', type: 'tip', for: 'care', en: 'Communicate face-to-face, one idea at a time, with short sentences and time to respond.', zh: '面对面说话，一次只说一件事，句子简短，给对方时间回应。' },
    { id: 't6', type: 'tip', for: 'care', en: 'Use names and reminders; avoid quizzing with “Do you remember?”', zh: '多叫名字、多提示；不要用“您还记得吗？”来考他们。' },
    { id: 't7', type: 'tip', for: 'care', en: 'Offer two clear choices rather than open-ended questions.', zh: '给两个清楚的选择，而不是开放式的问题。' },
    { id: 't8', type: 'tip', for: 'care', en: 'Reduce noise, clutter and background TV during conversation and meals.', zh: '说话和吃饭时，减少噪音、杂物和开着的电视。' },
    { id: 't20', type: 'tip', for: 'care', en: 'Check hearing and vision; use glasses and hearing aids, because poor senses worsen confusion.', zh: '检查听力和视力；戴好眼镜和助听器，感官不好会让人更糊涂。' },
    { id: 't37', type: 'tip', for: 'care', en: 'Offer familiar music from their youth; use it to calm and connect.', zh: '放他们年轻时熟悉的音乐，用来安抚和交流。' },
    { id: 't48', type: 'tip', for: 'care', en: 'Stop activities when frustration rises; redirect to something easier.', zh: '一开始烦躁，就停下活动，换一件更容易的事。' },
    { id: 't50', type: 'tip', for: 'care', en: 'Respond to emotion first, facts second.', zh: '先回应情绪，再谈事实。' },
    { id: 't52', type: 'tip', for: 'care', en: 'Look for unmet needs behind agitation: pain, hunger, the toilet, noise or tiredness.', zh: '找出烦躁背后没被满足的需要：疼痛、饥饿、要上厕所、太吵或太累。' },
    { id: 't60', type: 'tip', for: 'care', en: 'Plan for late-afternoon restlessness: an earlier dinner, a calm evening, lights on.', zh: '为傍晚的不安做准备：早点吃晚饭，晚上保持安静，把灯打开。' },
    { id: 't72', type: 'tip', for: 'care', en: 'Take scheduled breaks; respite is maintenance, not luxury.', zh: '安排固定的休息时间；喘息是保养，不是奢侈。' },
    { id: 't71', type: 'tip', for: 'care', en: 'Accept help specifically; keep a list of tasks others can do.', zh: '有人说要帮忙时，具体地接受；准备一张别人可以帮忙做的事的清单。' }
  ];

    if (/zh[-_]cn|cmn/i.test(v.lang)) r += 1;
    return r;
  },
  pick() {
    if (!('speechSynthesis' in window)) return { none: true };
    if (!this.voices.length) this.load();
    const en = lang() === 'en';
    let vs = this.voices.filter(v => {
      const l = v.lang.replace('_', '-').toLowerCase();
      return en ? l.startsWith('en') : ((l.startsWith('zh') || l.startsWith('cmn')) && !this.isCantonese(v));
    });
    vs.sort((a, b) => this.rank(b) - this.rank(a));
    const local = vs.filter(v => v.localService);
    if (local.length) return { voice: local[0] };
    if (vs.length) return getOnline() ? { voice: vs[0] } : { blocked: true };
    // no Mandarin voice: say so plainly if the phone only has Cantonese ones
    if (!en && this.voices.some(v => this.isCantonese(v))) return { none: true, cantonese: true };

  status() { const p = this.pick(); return p.voice ? 'ok' : (p.blocked ? 'online-blocked' : (p.cantonese ? 'cantonese' : 'none')); },
  speak(text, onend) {

    const p = this.pick();

// Jianpu -> notes. Format: tokens separated by spaces, '|' bar lines ignored.
// 1-7 scale degrees, 0 rest, ' octave up, , octave down, _ halves the length, . adds half, - holds one more beat.
function parseJianpu(m) {
  if (!m || !m.notes) return [];
  const KEYS = { C: 0, 'C#': 1, Db: 1, D: 2, Eb: 3, E: 4, F: 5, 'F#': 6, G: 7, Ab: 8, A: 9, Bb: 10, B: 11 };
  const root = 60 + (KEYS[m.key] || 0), deg = [0, 0, 2, 4, 5, 7, 9, 11], beat = 60 / (m.bpm || 90);
  const out = [];
  m.notes.split(/\s+/).forEach(tok => {
    if (!tok || tok === '|') return;
    if (tok === '-') { if (out.length) out[out.length - 1].d += beat; return; }
    const mt = tok.match(/^([0-7])([',]*)(_*)(\.?)$/);
    if (!mt) return;
    let d = beat * Math.pow(0.5, mt[3].length) * (mt[4] ? 1.5 : 1);
    if (mt[1] === '0') { out.push({ f: null, d }); return; }
    const oct = (mt[2].match(/'/g) || []).length - (mt[2].match(/,/g) || []).length;
    const midi = root + deg[+mt[1]] + 12 * oct;
    out.push({ f: 440 * Math.pow(2, (midi - 69) / 12), d });
  });
  return out;
}

// Sound: everything synthesised with Web Audio
const Sound = {
  ctx: null, master: null, music: null, sfx: null, playing: false, ducked: false, timer: null, nextT: 0, idx: 0, notes: [],
  ensure() {
    if (this.ctx) return true;
    try {
      const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return false;
      try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) { }
      this.ctx = new AC();
      this.master = this.ctx.createGain(); this.master.connect(this.ctx.destination);
      this.music = this.ctx.createGain(); this.music.gain.value = 0; this.music.connect(this.master);
      this.sfx = this.ctx.createGain(); this.sfx.connect(this.master);
      this.applyVolumes();
      return true;
    } catch (e) { return false; }
  },
  unlock() { if (this.ensure() && this.ctx.state !== 'running') this.ctx.resume().catch(() => { }); },
  muted() { return !!Store.get(GK('muted'), false); },
  setMuted(m) { Store.set(GK('muted'), m); this.applyVolumes(); if (m) Speech.stop(); },
  applyVolumes() {
    if (!this.ctx) return;
    this.master.gain.value = this.muted() ? 0 : 1;
    this.sfx.gain.value = Math.max(0.2, getSetting('speechVol')) * 0.55;
    this.setMusicLevel();
  },
  setMusicLevel() {
    if (!this.ctx) return;
    const v = this.playing ? getSetting('musicVol') * (this.ducked ? 0.3 : 1) : 0;
    const g = this.music.gain, now = this.ctx.currentTime;
    g.cancelScheduledValues(now); g.setValueAtTime(g.value, now); g.linearRampToValueAtTime(v, now + 0.6);
  },
  duck(on) { this.ducked = on; this.setMusicLevel(); },
  startTheme() {
    if (getSetting('musicVol') <= 0 || !this.ensure()) return;
    if (this.playing) { this.setMusicLevel(); return; }
    this.notes = parseJianpu(MELODIES[CONFIG.THEME_MELODY]);
    if (!this.notes.length) return;
    this.playing = true; this.idx = 0; this.nextT = this.ctx.currentTime + 0.15;
    this.setMusicLevel(); this.tick();
    this.timer = setInterval(() => this.tick(), 200);
  },
  tick() {
    if (!this.playing || !this.ctx || this.ctx.state !== 'running') return;
    if (this.nextT < this.ctx.currentTime) this.nextT = this.ctx.currentTime + 0.05;
    while (this.nextT < this.ctx.currentTime + 1.0) {
      const n = this.notes[this.idx % this.notes.length]; this.idx++;
      if (n.f) this.pluck(n.f, n.d, this.nextT, this.music, 0.5);
      this.nextT += n.d;
    }
  },
  stopTheme(fade = 1) {
    if (!this.playing) return;
    this.playing = false; clearInterval(this.timer);
    if (this.ctx) { const g = this.music.gain, now = this.ctx.currentTime; g.cancelScheduledValues(now); g.setValueAtTime(g.value, now); g.linearRampToValueAtTime(0, now + fade); }
  },
  pluck(f, d, when, dest, vol) {
    const c = this.ctx, o = c.createOscillator(), o2 = c.createOscillator(), g = c.createGain(), g2 = c.createGain(), lp = c.createBiquadFilter();
    o.type = 'triangle'; o.frequency.value = f; o2.type = 'sine'; o2.frequency.value = f * 2; g2.gain.value = 0.18;
    lp.type = 'lowpass'; lp.frequency.value = 2400;
    const len = Math.min(2.2, d * 1.4 + 0.3);
    g.gain.setValueAtTime(0, when); g.gain.linearRampToValueAtTime(vol, when + 0.03); g.gain.exponentialRampToValueAtTime(0.0008, when + len);
    o.connect(lp); o2.connect(g2); g2.connect(lp); lp.connect(g); g.connect(dest);
    o.start(when); o2.start(when); o.stop(when + len + 0.05); o2.stop(when + len + 0.05);
  },
  found() {   // a soft, rising three-note chime
    if (!this.ensure() || this.ctx.state !== 'running') return;
    const now = this.ctx.currentTime + 0.02;
    [[784, 0], [988, 0.13], [1175, 0.26]].forEach(([f, dt]) => this.pluck(f, 0.5, now + dt, this.sfx, 0.32));
  },
  suspend() { if (this.ctx) this.ctx.suspend().catch(() => { }); },
  resume() { if (this.ctx && this.ctx.state !== 'running') this.ctx.resume().catch(() => { }); }
};

function recordMood(m) {

/* Back up / Restore / Clear */
function collectData() {
  const data = {};
  Store.keys().filter(k => k.startsWith(GK(''))).forEach(k => { data[k] = Store.get(k); });
  Object.values(SHARED).forEach(k => { const v = Store.get(k, null); if (v !== null) data[k] = v; });
  return { app: 'dgs', game: CONFIG.GAME_ID, version: 2, date: new Date().toISOString(), data };
}
async function makeBackup() {
  const json = JSON.stringify(collectData(), null, 1);
  const name = `spotit-backup-${new Date().toISOString().slice(0, 10)}.json`;
  const done = () => { setState({ lastBackup: new Date().toISOString() }); KIT.toast(KIT.s('backup_done')); renderSettings(true); };
  try {
    const file = new File([json], name, { type: 'application/json' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], title: name }); done(); return; }
      catch (e) { if (e && e.name === 'AbortError') return; }
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(file); a.download = name; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    done();
  } catch (e) { KIT.dialog({ title: KIT.s('backup_fail') }); }
}
function onRestoreFile(file) {
  if (!file) return;
  const r = new FileReader();
  r.onload = () => {
    let b = null;
    try { b = JSON.parse(r.result); } catch (e) { }
    if (!b || b.game !== CONFIG.GAME_ID || !b.data) { KIT.dialog({ title: KIT.s('restore_bad') }); return; }
    const sessions = (b.data[GK('sessions')] || []).length, lv = b.data[SHARED.level] || 'standard';
    const d = new Date(b.date);
    KIT.dialog({
      title: KIT.s('restore_title'),
      html: KIT.ul([t('restore_date', { d: isNaN(d) ? '?' : d.toLocaleString() }), t('restore_sessions', { n: sessions }), t('restore_level', { l: t('level_' + lv) })]) + KIT.p(KIT.s('restore_warning')),
      buttons: [{ label: KIT.s('btn_cancel'), primary: true }, { label: KIT.s('btn_restore_yes'), icon: 'restore', onClick: () => applyRestore(b) }]
    });
  };
  r.readAsText(file);
}
function applyRestore(b) {
  Store.keys().filter(k => k.startsWith(GK(''))).forEach(k => Store.remove(k));
  Object.entries(b.data).forEach(([k, v]) => {
    if (!k.startsWith('dgs.')) return;
    if (Object.values(SHARED).includes(k)) KIT.sharedWrite(k, v); else Store.set(k, v);
  });
  applySavedLook(); applyI18n(); KIT.toast(KIT.s('restore_done')); showScreen('s-settings');
}
function confirmClear() {
  KIT.dialog({
    title: KIT.s('clear_title'), html: KIT.p(KIT.s('clear_text')),
    buttons: [{ label: KIT.s('btn_keep_all'), primary: true }, { label: KIT.s('btn_delete'), icon: 'trash', onClick: clearAll }]
  });
}
function clearAll() {
  Store.keys().filter(k => k.startsWith(GK(''))).forEach(k => Store.remove(k));
  KIT.toast(KIT.s('clear_done')); setTimeout(() => location.reload(), 900);
}

/* Gentle session end: the kit's rest card, between finds, never mid-search */
const Session = {
  start: 0,
  begin() { if (!this.start) this.start = Date.now(); },
  due() { return this.start && Date.now() - this.start >= getSetting('sessionMin') * 60000; },
  showEnd() { Game.pause(); $('#restCard').hidden = false; requestAnimationFrame(() => $('#restCard').classList.add('show')); if (!this._release) this._release = KIT.focusIn($('#restCard'), true); },
  hideEnd() { $('#restCard').classList.remove('show'); $('#restCard').hidden = true; if (this._release) { const r = this._release; this._release = null; r(); } },
  endOpen() { return !$('#restCard').hidden; },
  keep() { this.hideEnd(); this.start = Date.now(); applyMusicFor('s-game'); Game.resume(); },
  finish(early) {
    this.hideEnd();
    if (this.start) {
      const list = Store.get(GK('sessions'), []);
      list.push({ date: new Date().toISOString(), minutes: Math.max(1, Math.round((Date.now() - this.start) / 60000)), mood: null, endedEarly: !!early });
      Store.set(GK('sessions'), list.slice(-60));
      this.start = 0;
    }
    Speech.stop(); Sound.stopTheme(3);
    showScreen('s-rest');
    setTimeout(() => { if (current === 's-rest') Sound.startTheme(); }, 3200);
  }
};

/* One click handler for the whole app */
function wireStatic() {
  document.addEventListener('click', e => {
    const pick = e.target.closest('[data-kit-pick]');
    if (pick) { setLang(pick.dataset.kitPick); Device.persistStorage(); showScreen('s-start'); return; }
    const lb = e.target.closest('[data-kit-lang]');
    if (lb) { if (lb.dataset.kitLang !== lang()) { setLang(lb.dataset.kitLang); showScreen(current); } return; }
    const sc = e.target.closest('[data-scene]'); if (sc) { Game.enter(sc.dataset.scene); return; }
    const md = e.target.closest('#mood-faces .dgs-mood'); if (md) { recordMood(md.dataset.mood); return; }
    const b = e.target.closest('[data-act]'); if (!b) return;
    switch (b.dataset.act) {
      case 'play': case 'playagain': case 'another': scenesAll = false; showScreen('s-scenes'); break;
      case 'moreplaces': scenesAll = true; renderScenes(); break;
      case 'howto': Howto.open('s-start'); break;
      case 'help': Howto.open('s-game'); break;
      case 'howto-next': Howto.next(); break;
      case 'howto-skip': Howto.close(true); break;
      case 'howto-close': Howto.close(false); break;
      case 'care': showScreen('s-care'); break;
      case 'home': showScreen('s-start'); break;
      case 'back-care': showScreen('s-care'); break;
      case 'mute': Sound.setMuted(!Sound.muted()); renderMute(); break;
      case 'rest': Session.finish(!Session.due()); break;
      case 'end-rest': Session.finish(false); break;
      case 'end-keep': Session.keep(); break;
      case 'skip': Game.skip(); break;
      case 'hear': Game.sayTarget(); break;
      case 'mood-skip': recordMood('skip'); break;
    }
  });
  $('#restore-file').addEventListener('change', e => onRestoreFile(e.target.files[0]));
  $('#scene').addEventListener('pointerdown', e => Game.tap(e));

  // First touch anywhere unlocks audio (browsers block autoplay)
  const unlock = () => { Sound.unlock(); applyMusicFor(current); };
  document.addEventListener('pointerdown', unlock, { once: true });

  // Screen locked / app switched: pause sound and speech; resume afterwards
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { Speech.stop(); Sound.suspend(); Game.pause(); }
    else { Sound.resume(); Wake.request(); if (current === 's-game' && !Session.endOpen()) Game.resume(); }
  });

  // Android back button steps back inside the game instead of leaving it
  history.pushState({ dgs: 1 }, '');
  addEventListener('popstate', () => {
    if (!$('#dialog').hidden) $('#dialog').hidden = true;
    else if (Howto.isOpen()) Howto.close(false);
    else if (Session.endOpen()) Session.keep();
    else if (current === 's-settings') showScreen('s-care');
    else if (current === 's-game') showScreen('s-scenes');
    else if (current !== 's-start' && current !== 's-lang') showScreen('s-start');
    else return;   // on the start screen, let Back leave
    history.pushState({ dgs: 1 }, '');
  });
}

const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const SLOT_Y = [18, 145, 272];   // three rows: wall, table/counter, floor
const slotXY = i => [(i % 4) * 100, SLOT_Y[Math.floor(i / 4)]];

// An illustration may be an SVG string or an embedded image (data URI), so better artwork can drop in later
function illustrationSrc(art, w, h) { return /^data:/.test(art) ? `<image href="${art}" width="${w}" height="${h}"/>` : art; }
function objectArt(sceneId, k) {
  const o = ILL.scenes[sceneId].objects.find(x => x.k === k);
  return `<g stroke="${ILL.ink}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">${illustrationSrc(o.art, 100, 120)}</g>`;
}
let svgUid = 0;
// Build a scene. keys = which objects to show (null = all). opts.hit adds tap areas; opts.ring circles one object.
function sceneSVG(sceneId, keys, opts = {}) {
  const sc = ILL.scenes[sceneId], id = 'c' + (++svgUid);
  const objs = sc.objects.filter(o => !keys || keys.includes(o.k));
  const ring = opts.ring ? sc.objects.findIndex(o => o.k === opts.ring) : -1;
  let ringSvg = '';
  if (ring >= 0) { const [x, y] = slotXY(ring); ringSvg = `<ellipse cx="${x + 50}" cy="${y + 62}" rx="50" ry="60" class="ring h2"/>`; }
  return `<svg class="${opts.hit ? 'lv-' + getLevel() : ''}" viewBox="0 0 400 400" preserveAspectRatio="xMidYMid meet" role="img" aria-label="${escapeHtml(opts.label || t('scene_' + sceneId))}">
    <defs><clipPath id="${id}"><rect width="400" height="400" rx="28"/></clipPath></defs>
    <g clip-path="url(#${id})"><g class="scene-bg">${illustrationSrc(sc.bg, 400, 400)}</g>
      <g class="hints-back"></g>
      ${objs.map(o => { const i = sc.objects.indexOf(o), [x, y] = slotXY(i);
        return `<g class="obj" data-k="${o.k}" transform="translate(${x} ${y})">${opts.hit ? '<rect width="100" height="120" fill="#fff" fill-opacity="0"/>' : ''}
          <g class="art" stroke="${ILL.ink}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"><ellipse cx="50" cy="113" rx="31" ry="4" fill="#3a2f2a" fill-opacity=".075" stroke="none"/>${illustrationSrc(o.art, 100, 120)}</g></g>`; }).join('')}
      <g class="hints-front">${ringSvg}</g>
    </g>
    <rect x="2" y="2" width="396" height="396" rx="27" fill="none" stroke="#fff" stroke-width="4"/></svg>`;
}

const Game = {
  sceneId: null, visible: [], targets: [], i: 0, busy: false, paused: false, timers: [], hintLv: 0,
  tFind: 0, round: null,

  // How many objects to show and find, inside the level's range, nudged by how the last rounds went
  sizes() {
    const L = getLevel(), cfg = CONFIG.LEVELS[L], range = Device.isTablet() ? cfg.tablet : cfg.phone;
    const adapt = Store.get(GK('adapt'), {}); const f = (L in adapt) ? adapt[L] : 0.5;
    const n = Math.min(12, Math.round(range[0] + f * (range[1] - range[0])));
    const m = Math.min(n, Math.round(cfg.targets[0] + f * (cfg.targets[1] - cfg.targets[0])));
    return { n, m, cfg };
  },
  enter(sceneId) {
    this.sceneId = sceneId; setState({ lastScene: sceneId });
    const { n, m } = this.sizes();
    const all = ILL.scenes[sceneId].objects.map(o => o.k);
    this.visible = shuffle(all.slice()).slice(0, n);
    this.targets = shuffle(this.visible.slice()).slice(0, m);
    this.i = 0; this.busy = false; this.paused = false;
    this.round = { hints: 0, secs: 0, finds: 0 };
    Session.begin();
    showScreen('s-game');
    $('#scene svg:not(#hand)')?.remove();
    $('#scene').insertAdjacentHTML('afterbegin', sceneSVG(sceneId, this.visible, { hit: true }));
    $('#gbtns').style.display = '';
    $('#game-back').style.visibility = '';
    this.next();
  },
  svg() { return $('#scene > svg:not(#hand)'); },
  target() { return this.targets[this.i]; },
  name(k) { return t('obj_' + this.sceneId + '_' + k); },
  promptText() { return t('find_pre') + this.name(this.target()) + t('find_post'); },

  renderDots() {
    $('#dots').innerHTML = this.targets.map((_, j) => `<i class="${j < this.i ? 'done' : (j === this.i ? 'now' : '')}"></i>`).join('');
  },
  renderTarget() {
    const k = this.target();
    $('#tcard').className = 'tcard';
    $('#tcard').innerHTML = `<button class="timg" data-act="hear" aria-label="${escapeHtml(t('btn_hear'))}"><svg viewBox="-4 -4 108 128" aria-hidden="true">${objectArt(this.sceneId, k)}</svg><span class="badge">${ICON.speaker}</span></button>
      <div class="grow"><div class="tlabel">${escapeHtml(t('look_for'))}</div>
      <p class="tprompt" aria-live="polite">${escapeHtml(t('find_pre'))}<span class="kw">${escapeHtml(this.name(k))}</span>${escapeHtml(t('find_post'))}</p></div>`;
  },
  sayTarget() { if (this.target()) Speech.speak(this.promptText()); },

  next() {
    this.clearHints();
    if (this.i >= this.targets.length) return this.complete();
    this.busy = false; this.hintLv = 0; this.tFind = Date.now();
    this.renderDots(); this.renderTarget(); this.sayTarget();
    if (this.sizes().cfg.outline) this.hint(1, true);
    this.scheduleHints();
  },
  scheduleHints() {
    this.timers.forEach(clearTimeout); this.timers = [];
    const h = this.sizes().cfg.hints, waited = (Date.now() - this.tFind) / 1000;
    const most = { soft: 1, clear: 2, step: 3 }[getSetting('helpStyle')] || 3;   // the caregiver's help style
    h.forEach((s, j) => { if (j + 1 <= most && this.hintLv < j + 1) this.timers.push(setTimeout(() => this.hint(j + 1), Math.max(500, (s - waited) * 1000))); });
  },
  clearHints() {
    this.timers.forEach(clearTimeout); this.timers = [];
    const svg = this.svg(); if (!svg) return;
    $$('.hints-front .ring, .hints-back .glow.h1', svg).forEach(e => e.remove());
    $$('.obj.dim', svg).forEach(e => e.classList.remove('dim'));
    $('#hand').classList.remove('on');
  },
  slotOf(k) { return slotXY(ILL.scenes[this.sceneId].objects.findIndex(o => o.k === k)); },
  // Hints escalate: faint glow, then a pulsing ring, then the game circles it and invites a tap.
  hint(n, silent) {
    if (this.paused || this.busy) return;
    const svg = this.svg(), k = this.target(); if (!svg || !k) return;
    if (!silent) { this.hintLv = Math.max(this.hintLv, n); }
    const [x, y] = this.slotOf(k), cx = x + 50, cy = y + 62, NS = 'http://www.w3.org/2000/svg';
    if (n >= 1 && !$('.hints-back .glow.h1', svg)) {
      const g = document.createElementNS(NS, 'ellipse');
      g.setAttribute('cx', cx); g.setAttribute('cy', cy); g.setAttribute('rx', 54); g.setAttribute('ry', 62); g.setAttribute('class', 'glow h1');
      $('.hints-back', svg).appendChild(g);
    }
    if (n >= 2) {
      $$('.hints-front .ring', svg).forEach(e => e.remove());
      const r = document.createElementNS(NS, 'ellipse');
