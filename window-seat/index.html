/* ==== SECTION: CONFIG ==== */
/*
  Window Seat 窗边小憩 — MOO Dementia Games, game 1 of 6. Built on the shared kit (DGS_KIT_VERSION).
  Calm sensory engagement: a window onto a living scene that responds gently to touch.
  Everything is local. No network requests during play. No analytics.
*/
const GAME_ID = 'windowseat';
const GAME_FILE = 'window-seat.html';
const DGS_KIT_VERSION = 1;              // Shared look, words and settings from the MOO Dementia Games kit.
const SERIES_HOME_URL = '../';            // Link to the series landing page. Hidden while '#'.

const STRINGS = {};                     // Filled by STRINGS_ZH and STRINGS_EN.

const PALETTE = {
  bg: '#EAF0FB', surface: '#FFFFFF', primary: '#2F3F8F', accent: '#D9A93B', text: '#1B2347'
};

/* Shared keys used by every game in the series. */
const SHARED_KEYS = {
  lang: 'dgs.lang', level: 'dgs.level', onlineVoice: 'dgs.onlineVoice', contrast: 'dgs.contrast'
};

/* Default settings. Shared keys first, then this game's own. */
const DEFAULTS = {

const SPEECH_RATES = [0.6, 0.7, 0.85];   // very slow / slow / normal-ish
const SPEECH_PAUSE_MS = 350;             // a small breath between phrases
const REMARK_MIN_S = 180, REMARK_MAX_S = 300;   // gentle remarks every 3 to 5 minutes
const REMARKS_PER_SCENE = 4;
const GHOST_IDLE_MS = 10000;            // 6000 to 15000 allowed
const GHOST_MIN_SCREEN_MS = 2000;       // never in the first 2 s of a screen
const GHOST_MAX_PER_SCENE = 3;          // keeps "just watching" peaceful
const HOLD_OPEN_MS = 1500;
const HOLD_CLEAR_MS = 3000;

const MUSIC_FADE_MS = 3000;

const BURNIN_IDLE_MS = 10 * 60 * 1000;
const BURNIN_SHIFT_MS = 60 * 1000;

const SESSION_CHOICES = [5, 8, 10, 12, 15, 20, 30];
const SPEED_CHOICES = [0.7, 1, 1.3];

/* Levels set the defaults and the allowed range. */
const LEVELS = {
  standard: { sessionMinutes: 12, animMul: 1.0,  lookMin: 60,  lookMax: 90,  prompts: true,  calmOnly: false, natureOnly: false, ghostIdleMs: 10000, restRepeatMin: 12, skipPicker: false },
  gentler:  { sessionMinutes: 10, animMul: 0.75, lookMin: 120, lookMax: 180, prompts: true,  calmOnly: false, natureOnly: false, ghostIdleMs: 8000,  restRepeatMin: 8,  skipPicker: false },
  simplest: { sessionMinutes: 8,  animMul: 0.6,  lookMin: 0,   lookMax: 0,   prompts: false, calmOnly: true,  natureOnly: true,  ghostIdleMs: 7000,  restRepeatMin: 5,  skipPicker: true }
};

/* Scenes, in picker order. Set a scene to false to hide it. */
const SCENES = ['koi', 'garden', 'train', 'rain'];
const SCENE_AVAILABLE = { koi: true, garden: true, train: true, rain: true };

/* Familiar, non-religious objects. Swap freely: each name needs a drawing in CONTENT_ILLUSTRATIONS.objects. */
const CULTURAL_OBJECTS = ['kopitiamCup', 'teapot', 'orchidPot', 'tangerines'];
/* Which object sits on the windowsill in each scene. */
const SILL_OBJECT = { koi: 'orchidPot', garden: 'tangerines', train: 'kopitiamCup', rain: 'kopitiamCup' };

/* The story "A day out": a day trip to Malaysia and back. Each chapter is one scene. */
const STORY = [
  { scene: 'garden', intro: 'story_1' },               // morning at home
  { scene: 'train', route: 'out', intro: 'story_2' },  // train to Malaysia
  { scene: 'rain', intro: 'story_3' },                 // afternoon rain at a coffee shop
  { scene: 'koi', intro: 'story_4' },                  // dusk by the pond
  { scene: 'train', route: 'home', intro: 'story_5' }  // train home in the evening
];
const STORY_CHAPTER_MIN = 4;                            // about 20 minutes in all
const STORY_PACE = { standard: 1, gentler: 1.25, simplest: 1.5 };
const STORY_FADE_MS = 1400;
const TRAIN_CHAPTER_S = 45;                             // single-scene train: each part of the journey

/* Lines shown at random in one card: the top of the For Caregivers page ('care') and the Rest screen ('player').
   type 'ikeda'     Daisaku Ikeda, checked on 4 Nov 2026 against the official pages named in src
                    (daisakuikeda.org, sokaglobal.org, sgi-usa.org, worldtribune.org). Shown with author and source.
   type 'saying'    Short secular sayings from Joyce's list (no author). Shown with no author line.
   type 'encourage' Short encouragements from the same list. 'player' ones never mention illness.
   type 'tip'       Caregiving tips from Joyce's advice list. Shown with a small "Caregiving tip" label.
   zhFrom 'official' = Chinese from the official Chinese edition (daisakuikeda.org/cht, jt-oped11), converted to
   simplified characters; 'ours' = our own translation, to be checked by the native reviewer.
   To add or remove a line, edit this list only. */
const QUOTES = [
  { id: "i31", type: "ikeda", for: "care", en: "Gaining a person’s understanding is better than just telling them no… When we make such efforts for people suffering from dementia, they feel that we care about them and understand them.", zh: "让对方理解，比只对他说“不”更好……我们这样用心对待失智症患者时，他们能感受到我们的关心和理解。", src: "On Health and Long Life (quoted in SGI-USA, “The Buddhist View on Caregiving”, 2022)", srcZh: "On Health and Long Life (quoted in SGI-USA, “The Buddhist View on Caregiving”, 2022)", zhFrom: "ours" },
  { id: "i32", type: "ikeda", for: "care", en: "In caring for others, the important thing is to try not to shoulder it alone.", zh: "照顾他人时，重要的是尽量不要一个人扛。", src: "On Health and Long Life (quoted in SGI-USA, “The Buddhist View on Caregiving”, 2022)", srcZh: "On Health and Long Life (quoted in SGI-USA, “The Buddhist View on Caregiving”, 2022)", zhFrom: "ours" },
  { id: "i30", type: "ikeda", for: "care", en: "Let’s encourage our friends who are dedicating themselves to childrearing, caring for the elderly and nursing the sick.", zh: "让我们鼓励正在养育孩子、照顾长辈、护理病人的朋友。", src: "“To My Friends”, Seikyo Shimbun (World Tribune translation, 28 Dec 2022)", srcZh: "“To My Friends”, Seikyo Shimbun (World Tribune translation, 28 Dec 2022)", zhFrom: "ours" },
  { id: "i44", type: "ikeda", for: "care", en: "Sincere efforts to brighten our surroundings and the lives of others return to illuminate our own final years with dignity.", zh: "真诚地为周围环境和他人的生活带来光明，这份努力会回过来，让我们自己的晚年也充满尊严。", src: "“Realizing the potential of an aging society”, The Japan Times, 8 March 2007", srcZh: "“Realizing the potential of an aging society”, The Japan Times, 8 March 2007", zhFrom: "ours" },
  { id: "i25", type: "ikeda", for: "care", en: "Individuals who feel needed and strive on behalf of others can keep their youth and energy.", zh: "只要一心怀着急他人所需、为他人尽力的意念，人就可常保朝气，暖和身边之人的心，让社区更显光明。", src: "“Realizing the potential of an aging society”, The Japan Times, 8 March 2007", srcZh: "〈高龄社会的生存之道〉，《日本时报》，2007年3月8日", zhFrom: "official" },
  { id: "i23", type: "ikeda", for: "care", en: "Recognizing and treasuring the contributions of older people is essential to the long-term flourishing of any society.", zh: "树立真心尊敬高龄人士的风气，无疑是为社会的持续繁荣打稳基础。", src: "“Realizing the potential of an aging society”, The Japan Times, 8 March 2007", srcZh: "〈高龄社会的生存之道〉，《日本时报》，2007年3月8日", zhFrom: "official" },
  { id: "i1", type: "ikeda", for: "care", en: "There is a saying, ‘The foolish regard old age as winter; the wise regard it as a golden time.’ Everything depends upon our attitude, how we approach life.", zh: "有句话说：“愚者视老年为冬天，智者视老年为黄金时期。”一切都取决于我们的心态，取决于我们怎样面对人生。", src: "The Wisdom for Creating Happiness and Peace, Part 1, 9.1 (from A Discussion on the Third Stage of Life, 1998)", srcZh: "The Wisdom for Creating Happiness and Peace, Part 1, 9.1 (from A Discussion on the Third Stage of Life, 1998)", zhFrom: "ours" },
  { id: "i11", type: "ikeda", for: "player", en: "I believe youth can last a lifetime.", zh: "我相信青春可以持续一生。", src: "“Realizing the potential of an aging society”, The Japan Times, 8 March 2007", srcZh: "〈高龄社会的生存之道〉，《日本时报》，2007年3月8日", zhFrom: "ours" },
  { id: "i12", type: "ikeda", for: "player", en: "Inner youthfulness is not a matter of our physical age.", zh: "其实心境年轻与否是不能以实际年龄来下定论的。", src: "“Realizing the potential of an aging society”, The Japan Times, 8 March 2007", srcZh: "〈高龄社会的生存之道〉，《日本时报》，2007年3月8日", zhFrom: "official" },
  { id: "i28", type: "ikeda", for: "player", en: "The wisdom and experience of older people is a resource of inestimable worth.", zh: "高龄人士的智慧与经验，是丰富现在未来的宝贵财产。", src: "“Realizing the potential of an aging society”, The Japan Times, 8 March 2007", srcZh: "〈高龄社会的生存之道〉，《日本时报》，2007年3月8日", zhFrom: "official" },
  { id: "i5", type: "ikeda", for: "player", en: "The ideal old age might be likened to a magnificent sunset.", zh: "但愿晚年能如承诺翌日亦是晴天的无限夕阳一般，灿烂尽显，光辉四射，向未来的世代送上希望的光明。", src: "“Realizing the potential of an aging society”, The Japan Times, 8 March 2007", srcZh: "〈高龄社会的生存之道〉，《日本时报》，2007年3月8日", zhFrom: "official" },
  { id: "s2", type: "saying", for: "care", en: "Dementia changes the map, not the worth of the traveler.", zh: "失智症改变的是地图，不是旅人的价值。", zhFrom: "ours" },
  { id: "s6", type: "saying", for: "care", en: "The person is still here, even when the story is scattered.", zh: "即使故事零散了，这个人依然在这里。", zhFrom: "ours" },
  { id: "s12", type: "saying", for: "care", en: "A diagnosis explains changes; it does not erase a life.", zh: "诊断解释了变化，但抹不去一个人的一生。", zhFrom: "ours" },
  { id: "s20", type: "saying", for: "care", en: "Confusion is not stubbornness.", zh: "糊涂不是固执。", zhFrom: "ours" },
  { id: "s30", type: "saying", for: "care", en: "Repetition is not failure; it is a need for reassurance.", zh: "反复问同一件事不是失败，而是需要安心。", zhFrom: "ours" },
  { id: "s43", type: "saying", for: "care", en: "Behavior is communication when language falters.", zh: "当语言跟不上时，行为就是在表达。", zhFrom: "ours" },
  { id: "s44", type: "saying", for: "care", en: "Look for the need behind the noise.", zh: "留意吵闹背后的需要。", zhFrom: "ours" },
  { id: "s54", type: "saying", for: "care", en: "People remember how they were made to feel.", zh: "人们会记得别人带给自己的感受。", zhFrom: "ours" },
  { id: "s76", type: "saying", for: "care", en: "Validation is not agreement; it is acknowledgment.", zh: "认同感受不等于同意，而是表示“我明白”。", zhFrom: "ours" },
  { id: "s29", type: "saying", for: "care", en: "Familiar rituals are memory’s handrails.", zh: "熟悉的日常习惯，是记忆的扶手。", zhFrom: "ours" },
  { id: "s72", type: "saying", for: "care", en: "Dementia is a condition, not an identity.", zh: "失智症是一种病况，不是一个人的身份。", zhFrom: "ours" },
  { id: "s28", type: "saying", for: "care", en: "Music can reach where explanation cannot.", zh: "音乐能到达解释到不了的地方。", zhFrom: "ours" },
  { id: "e34", type: "encourage", for: "care", en: "Rest is part of care, not a break from it.", zh: "休息是照顾的一部分，不是中断。", zhFrom: "ours" },
  { id: "e63", type: "encourage", for: "care", en: "You can love someone and still need respite.", zh: "您可以爱一个人，同时也需要喘息。", zhFrom: "ours" },
  { id: "e33", type: "encourage", for: "care", en: "Caregiver guilt is common; it is not a reliable judge.", zh: "照顾者的内疚很常见，但它不是可靠的判官。", zhFrom: "ours" },
  { id: "e86", type: "encourage", for: "care", en: "Burnout is a signal, not a verdict.", zh: "累垮是一个信号，不是一个判决。", zhFrom: "ours" },
  { id: "e97", type: "encourage", for: "care", en: "You do not need a cure to offer care.", zh: "不需要治愈，也能给予照顾。", zhFrom: "ours" },
  { id: "e98", type: "encourage", for: "care", en: "You do not need perfect words to offer presence.", zh: "不需要完美的话语，也能陪伴在旁。", zhFrom: "ours" },
  { id: "e90", type: "encourage", for: "care", en: "No one should have to improvise dementia care alone.", zh: "没有人应该独自摸索怎样照顾失智的家人。", zhFrom: "ours" },
  { id: "e83", type: "encourage", for: "care", en: "Love can be practical: a pill box, a nightlight, a labeled drawer.", zh: "爱可以很实际：一个药盒、一盏小夜灯、一个贴了标签的抽屉。", zhFrom: "ours" },
  { id: "e4", type: "encourage", for: "player", en: "A good day can be small: warm light, familiar music, a hand nearby.", zh: "美好的一天可以很简单：温暖的光、熟悉的音乐、身边有一只手。", zhFrom: "ours" },
  { id: "e95", type: "encourage", for: "player", en: "A good moment is not a small thing.", zh: "美好的片刻，不是小事。", zhFrom: "ours" },
  { id: "e91", type: "encourage", for: "player", en: "Aging can still include wonder.", zh: "年纪大了，依然可以有惊喜。", zhFrom: "ours" },
  { id: "e96", type: "encourage", for: "player", en: "The present is where connection lives.", zh: "当下，就是我们相连的地方。", zhFrom: "ours" },
  { id: "t4", type: "tip", for: "care", en: "Communicate face-to-face, one idea at a time, with short sentences and time to respond.", zh: "面对面说话，一次只说一件事，句子简短，给对方时间回应。", zhFrom: "ours" },
  { id: "t6", type: "tip", for: "care", en: "Use names and reminders; avoid quizzing with “Do you remember?”", zh: "多叫名字、多提示；不要用“您还记得吗？”来考他们。", zhFrom: "ours" },
  { id: "t7", type: "tip", for: "care", en: "Offer two clear choices rather than open-ended questions.", zh: "给两个清楚的选择，而不是开放式的问题。", zhFrom: "ours" },
  { id: "t8", type: "tip", for: "care", en: "Reduce noise, clutter and background TV during conversation and meals.", zh: "说话和吃饭时，减少噪音、杂物和开着的电视。", zhFrom: "ours" },
  { id: "t20", type: "tip", for: "care", en: "Check hearing and vision; use glasses and hearing aids, because poor senses worsen confusion.", zh: "检查听力和视力；戴好眼镜和助听器，感官不好会让人更糊涂。", zhFrom: "ours" },
  { id: "t37", type: "tip", for: "care", en: "Offer familiar music from their youth; use it to calm and connect.", zh: "放他们年轻时熟悉的音乐，用来安抚和交流。", zhFrom: "ours" },
  { id: "t48", type: "tip", for: "care", en: "Stop activities when frustration rises; redirect to something easier.", zh: "一开始烦躁，就停下活动，换一件更容易的事。", zhFrom: "ours" },
  { id: "t50", type: "tip", for: "care", en: "Respond to emotion first, facts second.", zh: "先回应情绪，再谈事实。", zhFrom: "ours" },
  { id: "t52", type: "tip", for: "care", en: "Look for unmet needs behind agitation: pain, hunger, the toilet, noise or tiredness.", zh: "找出烦躁背后没被满足的需要：疼痛、饥饿、要上厕所、太吵或太累。", zhFrom: "ours" },
  { id: "t60", type: "tip", for: "care", en: "Plan for late-afternoon restlessness: an earlier dinner, a calm evening, lights on.", zh: "为傍晚的不安做准备：早点吃晚饭，晚上保持安静，把灯打开。", zhFrom: "ours" },
  { id: "t72", type: "tip", for: "care", en: "Take scheduled breaks; respite is maintenance, not luxury.", zh: "安排固定的休息时间；喘息是保养，不是奢侈。", zhFrom: "ours" },
  { id: "t71", type: "tip", for: "care", en: "Accept help specifically; keep a list of tasks others can do.", zh: "有人说要帮忙时，具体地接受；准备一张别人可以帮忙做的事的清单。", zhFrom: "ours" }
];

/* Theme song id (see CONTENT_MELODIES). */
const THEME_MELODY = 'windowsill';   // the game's own original theme song (series decision, 4 Nov 2026)

</script>

/* ==== SECTION: STYLES ==== */
/* MOO Dementia Games kit v1 (DGS_KIT_VERSION). Part 1 is identical in every game except the palette
   values; part 2 is the shared components (kit bundle.css); part 3 is Window Seat only. */

/* ---------- 1. Tokens: Window Seat palette ---------- */
:root{
  --bg:#eaf0fb; --surface:#ffffff; --surface-sunk:#e0e6f2; --text:#1b2347; --text-muted:#515876;

html.hc{
  --bg:#ffffff; --surface:#ffffff; --surface-sunk:#f0f0f0; --text:#000000; --text-muted:#2b2b2b;
  --primary:#13207a; --primary-ink:#13207a; --primary-strong:#0b1350; --primary-soft:#e3e6f7;
  --accent:#b07d00; --accent-soft:#f6ead0; --border:#000000; --divider:#5c5c5c; --focus-ring:#000000;
}

/* ---------- 2. Shared components (kit) ---------- */
*,*::before,*::after{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{
  margin:0; height:100%; background:var(--bg); color:var(--text);
  font-family:var(--font-sans); font-size:22px; line-height:1.55;
  overscroll-behavior:none; overflow:hidden;
  -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;

}

[hidden]{ display:none !important; }
h1,h2,h3,h4,p{ margin:0; }
button{ font:inherit; color:inherit; }
.dgs-icon{ width:var(--icon); height:var(--icon); flex:none; display:block; }

.scroll{ overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain; touch-action:pan-y; flex:1 1 auto; min-height:0; margin:0 -16px; padding:4px 16px 40px; }
.scroll::-webkit-scrollbar{ width:0; }
.scroll > .col{ max-width:var(--content-max); margin:0 auto; display:flex; flex-direction:column; gap:var(--space-3); }

/* Buttons */
.dgs-btn{
  appearance:none; border:0; margin:0; cursor:pointer;
  display:flex; align-items:center; justify-content:center; gap:var(--space-2);
  min-height:var(--tap-min); width:100%; padding:0 var(--space-4);
  border-radius:var(--radius-lg); font-size:26px; line-height:32px; font-weight:700; letter-spacing:.01em; text-align:center;
  transition:transform .12s ease, box-shadow .12s ease; touch-action:manipulation;
}
.dgs-btn:focus-visible,.dgs-guide:focus-visible,.dgs-round:focus-visible,.dgs-lang button:focus-visible,.dgs-hold:focus-visible,.dgs-level:focus-visible,.dgs-mood:focus-visible,.dgs-seg button:focus-visible,.dgs-switch:focus-visible{ outline:3px solid var(--focus-ring); outline-offset:3px; }
.dgs-btn:active{ transform:scale(.96); }
/* Every button gives a smooth, slight press so a tap clearly registers */
.dgs-round,.dgs-guide,.dgs-level,.dgs-hold,.dgs-mood,.dgs-seg button,.dgs-lang button{ transition:transform .12s ease, box-shadow .12s ease, background-color .12s ease; }
.dgs-round:active,.dgs-guide:active,.dgs-level:active,.dgs-hold:active,.dgs-mood:active,.dgs-seg button:active,.dgs-lang button:active{ transform:scale(.96); }
@media (prefers-reduced-motion:reduce){
  .dgs-btn:active,.dgs-round:active,.dgs-guide:active,.dgs-level:active,.dgs-hold:active,.dgs-mood:active,.dgs-seg button:active,.dgs-lang button:active{ transform:none; filter:brightness(.92); }
}
.dgs-btn--primary{ background:var(--primary); color:var(--on-primary); box-shadow:0 4px 0 var(--primary-strong); }
.dgs-btn--primary:active{ box-shadow:0 2px 0 var(--primary-strong); }
.dgs-btn--secondary{ background:var(--surface); color:var(--text); box-shadow:inset 0 0 0 2px var(--border),var(--shadow-card); }
.dgs-btn--quiet{ background:transparent; color:var(--primary-ink); min-height:56px; font-size:20px; font-weight:600; text-decoration:underline; text-underline-offset:5px; }
.dgs-btn--small{ min-height:64px; font-size:21px; }
.dgs-btn--play{ min-height:var(--tap-play); font-size:34px; line-height:40px; font-weight:800; box-shadow:0 5px 0 var(--primary-strong),var(--shadow-lift); }
.dgs-btn__disc{ width:56px; height:56px; border-radius:50%; background:var(--on-primary); color:var(--primary); display:grid; place-items:center; flex:none; }
.dgs-btn__disc .dgs-icon{ width:28px; height:28px; margin-left:4px; }

/* Language switch and round buttons */
.dgs-lang{ display:inline-flex; padding:4px; border-radius:var(--radius-pill); background:var(--surface-sunk); box-shadow:inset 0 0 0 1.5px var(--divider); }
.dgs-lang button{ appearance:none; border:0; cursor:pointer; min-height:52px; min-width:76px; padding:0 18px; border-radius:var(--radius-pill); background:transparent; color:var(--text); font-size:20px; font-weight:600; }
.dgs-lang button[aria-pressed="true"]{ background:var(--surface); color:var(--primary-ink); font-weight:800; box-shadow:inset 0 0 0 2.5px var(--primary),var(--shadow-card); }
.dgs-round{ appearance:none; border:0; cursor:pointer; width:60px; height:60px; flex:none; border-radius:50%; display:grid; place-items:center; background:var(--surface); color:var(--text); box-shadow:inset 0 0 0 2px var(--border),var(--shadow-card); }
.dgs-round .dgs-icon{ width:30px; height:30px; }
.dgs-back{ appearance:none; border:0; cursor:pointer; display:inline-flex; align-items:center; gap:8px; min-height:60px; padding:0 18px 0 12px; border-radius:var(--radius-pill); background:var(--surface); color:var(--text); font-size:20px; font-weight:700; box-shadow:inset 0 0 0 2px var(--border),var(--shadow-card); }
.dgs-back .dgs-icon{ width:26px; height:26px; }
#muteBtn{ position:fixed; z-index:75; top:calc(var(--safe-t) + 12px); right:calc(var(--safe-r) + 16px); }

/* Titles and text */
.dgs-title{ margin:0; text-align:center; font-size:40px; line-height:48px; font-weight:800; color:var(--text); text-wrap:balance; }
.dgs-title small{ display:block; font-size:20px; line-height:28px; font-weight:600; color:var(--text-muted); letter-spacing:.02em; margin-top:2px; }
.dgs-screen-title{ margin:0; text-align:center; font-size:30px; line-height:40px; font-weight:700; text-wrap:balance; }
.dgs-caption{ margin:0; text-align:center; font-size:28px; line-height:40px; font-weight:600; text-wrap:balance; }
.key{ font-style:normal; color:var(--primary); font-weight:800; text-decoration:underline; text-decoration-thickness:3px; text-underline-offset:6px; text-decoration-color:var(--accent); }
.dgs-footnote{ margin:0; text-align:center; font-size:18px; line-height:27px; color:var(--text-muted); }
.note{ font-size:18px; line-height:27px; color:var(--text-muted); margin:0; }

/* Picture frame */
.dgs-art{ border-radius:var(--radius-md); background:var(--surface); box-shadow:var(--shadow-card); overflow:hidden; display:block; }
.dgs-art img,.dgs-art svg{ width:100%; height:100%; display:block; object-fit:cover; }

/* Guide buttons */
.dgs-guides{ display:grid; grid-template-columns:1fr 1fr; gap:var(--space-2); }
.dgs-guide{ appearance:none; border:0; cursor:pointer; min-height:104px; padding:var(--space-2); border-radius:var(--radius-lg); background:var(--surface); color:var(--text); box-shadow:inset 0 0 0 2px var(--border),var(--shadow-card); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; font-size:21px; line-height:26px; font-weight:700; text-align:center; }
.dgs-guide .dgs-icon{ width:var(--icon-lg); height:var(--icon-lg); color:var(--primary); }

/* Dots */
.dgs-dots{ display:flex; justify-content:center; gap:10px; }
.dgs-dots i{ width:12px; height:12px; border-radius:50%; background:var(--divider); display:block; }
.dgs-dots i.on{ background:var(--primary); width:32px; border-radius:var(--radius-pill); }

/* Quote (kit Quote): caregiver page top, and the player's Rest screen */
.dgs-quote{ margin:0; padding:18px 20px 16px; border-radius:var(--radius-md); background:var(--accent-soft); display:flex; flex-direction:column; gap:10px; }
.dgs-quote blockquote{ margin:0; font-size:19px; line-height:30px; font-weight:500; color:var(--text); }
.dgs-quote blockquote::before{ content:"“"; } .dgs-quote blockquote::after{ content:"”"; }
html[lang="zh-CN"] .dgs-quote blockquote::before{ content:"“"; }
.dgs-quote figcaption{ font-size:16px; line-height:22px; color:var(--text-muted); }
.dgs-quote cite{ font-style:italic; }
.dgs-quote.tip small{ font-size:15px; line-height:20px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:var(--primary-ink); }
.dgs-quote.tip p{ margin:0; font-size:19px; line-height:30px; font-weight:600; }
.dgs-quote.player{ background:transparent; padding:0 4px; text-align:center; }
.dgs-quote.player blockquote{ font-size:24px; line-height:34px; }
/* Caregiver page */
.dgs-kind{ display:grid; grid-template-columns:auto 1fr; gap:14px; align-items:center; padding:18px 20px; border-radius:var(--radius-md); background:var(--accent-soft); }
.dgs-kind .dgs-icon{ width:40px; height:40px; color:var(--primary); }
.dgs-kind small{ display:block; font-size:16px; line-height:22px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:var(--primary-ink); }
.dgs-kind b{ display:block; font-size:22px; line-height:31px; font-weight:700; }
.dgs-disclaimer{ margin:0; padding:var(--space-3) var(--space-4); border-radius:var(--radius-md); background:var(--surface-sunk); font-size:19px; line-height:28px; font-weight:600; }
.dgs-quick{ display:grid; grid-template-columns:repeat(3,1fr); gap:var(--space-2); padding:var(--space-3); border-radius:var(--radius-md); background:var(--surface); box-shadow:var(--shadow-card); }
.dgs-quick > div{ display:flex; flex-direction:column; align-items:center; gap:8px; text-align:center; }
.dgs-quick__icon{ width:64px; height:64px; border-radius:50%; background:var(--primary-soft); color:var(--primary); display:grid; place-items:center; }
.dgs-quick b{ font-size:19px; line-height:25px; font-weight:700; }
.dgs-quick span.other{ font-size:16px; line-height:21px; color:var(--text-muted); }
.dgs-section{ border-radius:var(--radius-md); background:var(--surface); box-shadow:var(--shadow-card); overflow:hidden; }
.dgs-section > summary{ list-style:none; cursor:pointer; display:flex; align-items:center; gap:var(--space-2); min-height:var(--tap-min); padding:var(--space-2) var(--space-4); font-size:24px; line-height:32px; font-weight:700; }
.dgs-section > summary::-webkit-details-marker{ display:none; }
.dgs-section > summary .dgs-icon{ color:var(--primary); }
.dgs-section > summary::after{ content:""; margin-left:auto; flex:none; width:14px; height:14px; border-right:3px solid var(--text); border-bottom:3px solid var(--text); transform:rotate(45deg) translate(-3px,-3px); transition:transform .2s; }
.dgs-section[open] > summary::after{ transform:rotate(-135deg) translate(-3px,-3px); }
.dgs-section > summary:focus-visible{ outline:3px solid var(--focus-ring); outline-offset:-3px; }
.dgs-section__body{ padding:0 var(--space-4) var(--space-4); font-size:19px; line-height:30px; display:flex; flex-direction:column; gap:12px; }
.dgs-section__body h4{ margin:8px 0 0; font-size:19px; line-height:26px; color:var(--primary-ink); }
.dgs-section__body ul{ margin:0; padding-left:1.1em; }
.dgs-section__body li{ margin:4px 0; }
.dgs-bda{ display:grid; gap:10px; }
.dgs-bda div{ padding:12px 16px; border-radius:var(--radius-sm); background:var(--surface-sunk); }
.dgs-bda b{ display:block; color:var(--primary-ink); font-size:16px; letter-spacing:.05em; text-transform:uppercase; }
.dgs-part{ display:grid; gap:4px; padding:14px 16px; border-radius:var(--radius-sm); background:var(--surface-sunk); }
.dgs-part b{ font-size:20px; line-height:27px; }
.dgs-part p{ margin:0; font-size:18px; line-height:27px; }
.dgs-part .why{ display:grid; grid-template-columns:auto 1fr; gap:8px; align-items:start; margin-top:4px; padding-top:8px; border-top:1.5px solid var(--divider); }
.dgs-part .why .dgs-icon{ width:22px; height:22px; color:var(--primary); margin-top:3px; }
.dgs-part .why em{ font-style:normal; font-weight:700; color:var(--primary-ink); }
.dgs-sub{ font-size:17px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:var(--primary-ink); margin:6px 4px 0; }
.dgs-card{ padding:18px 20px; border-radius:var(--radius-md); background:var(--surface); box-shadow:var(--shadow-card); display:flex; flex-direction:column; gap:10px; }
.dgs-card h3{ font-size:22px; line-height:30px; }

/* Level picker */
.dgs-levels{ display:grid; gap:var(--space-2); }
.dgs-level{ appearance:none; border:0; cursor:pointer; text-align:left; display:grid; grid-template-columns:36px 1fr; gap:4px 14px; align-items:center; min-height:var(--tap-min); padding:14px 18px; border-radius:var(--radius-md); background:var(--surface); color:var(--text); box-shadow:inset 0 0 0 2px var(--border); }
.dgs-level b{ grid-column:2; font-size:22px; line-height:28px; }
.dgs-level > span:not(.dgs-radio){ grid-column:2; font-size:17px; line-height:24px; color:var(--text-muted); }
.dgs-level .dgs-radio{ grid-column:1; grid-row:1/3; width:30px; height:30px; border-radius:50%; box-shadow:inset 0 0 0 2.5px var(--border); display:grid; place-items:center; }
.dgs-level[aria-checked="true"]{ background:var(--primary-soft); box-shadow:inset 0 0 0 3px var(--primary); }
.dgs-level[aria-checked="true"] b{ color:var(--primary-ink); }
.dgs-level[aria-checked="true"] .dgs-radio{ box-shadow:inset 0 0 0 2.5px var(--primary); }
.dgs-level[aria-checked="true"] .dgs-radio::after{ content:""; width:16px; height:16px; border-radius:50%; background:var(--primary); }

/* Hold button */
.dgs-hold{ appearance:none; border:0; cursor:pointer; width:100%; display:flex; align-items:center; gap:var(--space-3); min-height:88px; padding:12px 20px; border-radius:var(--radius-lg); background:var(--surface); color:var(--text); box-shadow:inset 0 0 0 2px var(--border),var(--shadow-card); text-align:left; touch-action:none; }
.dgs-hold__ring{ --p:0; flex:none; width:60px; height:60px; border-radius:50%; display:grid; place-items:center; background:conic-gradient(var(--accent) calc(var(--p) * 1turn), var(--surface-sunk) 0); }
.dgs-hold__ring > span{ width:46px; height:46px; border-radius:50%; background:var(--surface); display:grid; place-items:center; }
.dgs-hold__ring .dgs-icon{ width:26px; height:26px; }
.dgs-hold b{ display:block; font-size:22px; line-height:28px; }
.dgs-hold small{ display:block; font-size:17px; line-height:22px; color:var(--text-muted); }

/* Settings */
.dgs-group{ display:flex; flex-direction:column; gap:6px; scroll-margin-top:12px; }
.dgs-group > h3{ margin:0 4px 4px; font-size:17px; line-height:22px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:var(--primary-ink); display:flex; align-items:center; gap:8px; }
.dgs-group > h3 .dgs-icon{ width:22px; height:22px; }
.dgs-group__rows{ border-radius:var(--radius-md); background:var(--surface); box-shadow:var(--shadow-card); }
.dgs-row{ display:grid; grid-template-columns:1fr auto; align-items:center; gap:8px 16px; padding:16px 20px; min-height:var(--tap-min); border-top:1.5px solid var(--divider); scroll-margin-top:12px; }
.dgs-row:first-child{ border-top:0; }
.dgs-row > .lbl,.dgs-row > label{ font-size:19px; line-height:26px; font-weight:600; min-width:0; }
.dgs-row > .note,.dgs-row > p{ grid-column:1 / -1; }
.dgs-row--stack{ grid-template-columns:1fr; }
.dgs-row--stack > *{ grid-column:1 / -1; }
.dgs-switch{ appearance:none; margin:0; cursor:pointer; width:68px; height:40px; border-radius:var(--radius-pill); background:var(--surface-sunk); box-shadow:inset 0 0 0 2px var(--border); position:relative; border:0; flex:none; transition:background-color .15s; }
.dgs-switch::after{ content:""; position:absolute; top:5px; left:5px; width:30px; height:30px; border-radius:50%; background:var(--surface); box-shadow:0 0 0 2px var(--border); transition:transform .15s; }
.dgs-switch[aria-checked="true"]{ background:var(--primary); box-shadow:none; }
.dgs-switch[aria-checked="true"]::after{ transform:translateX(28px); box-shadow:none; }
.dgs-seg{ display:flex; flex-wrap:wrap; padding:4px; border-radius:var(--radius-sm); background:var(--surface-sunk); gap:4px; }
.dgs-seg button{ appearance:none; border:0; cursor:pointer; flex:1 1 0; min-width:64px; min-height:52px; border-radius:9px; background:transparent; color:var(--text); font-size:18px; font-weight:600; padding:4px 10px; line-height:1.25; }
.dgs-seg.many{ display:grid; grid-template-columns:repeat(auto-fit,minmax(118px,1fr)); }
.dgs-seg.many.short{ grid-template-columns:repeat(4,1fr); }
.dgs-seg button[aria-pressed="true"]{ background:var(--surface); color:var(--primary-ink); font-weight:800; box-shadow:inset 0 0 0 2.5px var(--primary); }
input[type=range]{ -webkit-appearance:none; appearance:none; width:100%; height:48px; background:transparent; margin:0; touch-action:none; }
input[type=range]::-webkit-slider-runnable-track{ height:10px; border-radius:999px; background:var(--surface-sunk); box-shadow:inset 0 0 0 1.5px var(--border); }
input[type=range]::-webkit-slider-thumb{ -webkit-appearance:none; width:36px; height:36px; margin-top:-13px; border-radius:50%; background:var(--primary); border:4px solid var(--surface); box-shadow:0 0 0 2px var(--primary); }
input[type=range]::-moz-range-track{ height:10px; border-radius:999px; background:var(--surface-sunk); }
input[type=range]::-moz-range-thumb{ width:30px; height:30px; border-radius:50%; background:var(--primary); border:4px solid var(--surface); }
.dgs-progress{ height:12px; border-radius:999px; background:var(--surface-sunk); overflow:hidden; }
.dgs-progress i{ display:block; height:100%; background:var(--primary); border-radius:inherit; transition:width .4s ease; }
.dgs-checklist{ list-style:none; padding:0; margin:0; display:grid; gap:6px; }
.dgs-check{ appearance:none; border:0; background:transparent; cursor:pointer; width:100%; display:flex; align-items:center; gap:12px; min-height:56px; padding:4px 0; text-align:left; font-size:19px; color:var(--text); }
.dgs-tick{ width:30px; height:30px; border-radius:8px; box-shadow:inset 0 0 0 2px var(--border); display:grid; place-items:center; flex:none; }
.dgs-tick .dgs-icon{ width:20px; height:20px; }
.dgs-check.is-done .dgs-tick{ background:var(--primary); color:var(--on-primary); box-shadow:none; }
.dgs-check.is-done span:last-child{ color:var(--text-muted); text-decoration:line-through; }

/* Notice */
.dgs-notice{ display:grid; grid-template-columns:auto 1fr; gap:12px; align-items:start; padding:14px 18px; border-radius:var(--radius-md); background:var(--accent-soft); font-size:18px; line-height:27px; }
.dgs-notice .dgs-icon{ width:28px; height:28px; }
.dgs-notice b{ display:block; }

/* Mood faces */
.dgs-moods{ display:grid; grid-template-columns:repeat(3,1fr); gap:var(--space-2); width:100%; }
.dgs-mood{ appearance:none; border:0; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:6px; padding:12px 4px; min-height:var(--tap-min); border-radius:var(--radius-md); background:var(--surface); color:var(--text); box-shadow:inset 0 0 0 2px var(--border); }
.dgs-mood svg{ width:min(18vw,72px); height:min(18vw,72px); }
.dgs-mood b{ font-size:22px; line-height:26px; }
.dgs-mood span{ font-size:16px; line-height:20px; color:var(--text-muted); }
.dgs-moods.small .dgs-mood svg{ width:52px; height:52px; }
.dgs-moods.small .dgs-mood b{ font-size:19px; }

/* Rest card */
#restCard{ position:fixed; z-index:45; left:50%; bottom:calc(var(--safe-b) + 24px); width:min(94vw,520px); transform:translate(-50%,140%); opacity:0;
  display:flex; flex-direction:column; gap:var(--space-2); padding:var(--space-4); border-radius:var(--radius-lg) var(--radius-lg) var(--radius-md) var(--radius-md); background:var(--surface); box-shadow:var(--shadow-lift); transition:transform .9s ease, opacity 1.2s ease; }
#restCard.show{ transform:translate(-50%,0); opacity:1; }
#restCard h3{ text-align:center; font-size:26px; line-height:34px; }
#restCard .row{ display:grid; grid-template-columns:1fr 1fr; gap:var(--space-2); }

/* Dialog (never alert()) and toast */
#dialog{ position:fixed; inset:0; z-index:80; background:rgba(0,0,0,.45); display:flex; align-items:center; justify-content:center; padding:16px; }
#dialog .box{ background:var(--surface); border-radius:var(--radius-lg); padding:var(--space-4); width:min(100%,480px); max-height:90vh; overflow:auto; display:flex; flex-direction:column; gap:var(--space-3); text-align:center; box-shadow:var(--shadow-lift); }
#dialog .box h3{ font-size:28px; line-height:36px; }
#dialog .box p,#dialog .box li{ font-size:19px; line-height:28px; text-align:left; }
#dialog .box ul{ margin:0; padding-left:1.1em; }
#dialog .btns{ display:flex; flex-direction:column; gap:var(--space-2); }
.dgs-btn--plain{ background:var(--surface); color:var(--text); box-shadow:inset 0 0 0 2px var(--border); min-height:64px; font-size:20px; font-weight:600; }
#toast{ position:fixed; z-index:90; left:50%; top:calc(var(--safe-t) + 90px); transform:translateX(-50%); background:var(--text); color:var(--surface); border-radius:var(--radius-sm); padding:12px 20px; font-size:18px; font-weight:700; opacity:0; transition:opacity .4s; pointer-events:none; max-width:90vw; text-align:center; }
#toast.show{ opacity:1; }

/* Ghost hand */
#ghost{ position:fixed; z-index:50; left:0; top:0; width:84px; height:84px; pointer-events:none; opacity:0; transition:opacity .5s ease; }
#ghost.show{ opacity:.95; }
#ghost svg{ width:100%; height:100%; filter:drop-shadow(0 4px 8px rgba(0,0,0,.22)); }
#ghostTarget{ position:fixed; z-index:49; width:110px; height:110px; margin:-55px 0 0 -55px; border-radius:50%; border:5px solid var(--accent); box-shadow:0 0 0 8px var(--accent-soft); pointer-events:none; opacity:0; }
#ghostTarget.show{ opacity:1; animation:pulse 2.4s ease-in-out infinite; }
@keyframes pulse{ 0%,100%{ transform:scale(.88); opacity:.6; } 50%{ transform:scale(1.04); opacity:1; } }

/* Captions (every spoken line is shown) */
#caption{
  position:fixed; z-index:40; left:16px; right:16px; margin:0 auto; width:fit-content; transform:translateY(12px); bottom:calc(var(--safe-b) + 130px);
  max-width:min(calc(100vw - 32px),640px); background:var(--surface); color:var(--text);
  border-radius:var(--radius-md); padding:12px 22px; font-size:28px; font-weight:600; text-align:center; line-height:1.4;
  box-shadow:var(--shadow-lift); opacity:0; pointer-events:none; transition:opacity .6s ease, transform .6s ease;
}
#caption.show{ opacity:1; transform:none; }

/* ---------- 3. Window Seat only ---------- */
/* Language choice */
#scr-lang{ justify-content:center; }
#scr-lang .col{ flex:0 0 auto; gap:var(--space-4); }
#scr-lang .dgs-btn--primary,#scr-lang .dgs-btn--secondary{ min-height:96px; font-size:30px; }

/* Start */
#scr-start .col{ gap:var(--space-2); }
#scr-start .hero{ flex:1 1 auto; min-height:110px; display:flex; justify-content:center; align-items:center; }
#scr-start .hero .dgs-art{ height:100%; max-height:44vh; aspect-ratio:1/1; max-width:100%; }
#scr-start .actions{ display:flex; flex-direction:column; gap:var(--space-2); flex:0 0 auto; }

/* How to play */
#scr-howto .pic{ flex:1 1 auto; min-height:0; display:flex; align-items:center; justify-content:center; }
#scr-howto .pic .dgs-art{ height:100%; max-height:44vh; aspect-ratio:1/1; max-width:100%; display:grid; place-items:center; padding:8px; }
#scr-howto .pic svg{ width:100%; height:100%; }
#scr-howto .dgs-caption{ min-height:2.9em; display:block; }
#scr-howto .actions{ display:flex; flex-direction:column; gap:4px; flex:0 0 auto; }

/* Scene picker */
#scr-scenes .grid{ flex:1 1 auto; min-height:0; display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); grid-auto-rows:max-content; gap:var(--space-2); align-content:start; overflow-y:auto; touch-action:pan-y; padding:4px 2px 8px; }
.scene-card{ appearance:none; border:0; display:flex; flex-direction:column; border-radius:var(--radius-md); background:var(--surface); box-shadow:inset 0 0 0 2px var(--border),var(--shadow-card); overflow:hidden; cursor:pointer; padding:0; color:var(--text); text-align:center; }
.scene-card .ph{ aspect-ratio:2/1; background:var(--surface-sunk) center/cover no-repeat; }
.scene-card .lb{ padding:10px 8px 12px; font-size:21px; font-weight:700; line-height:1.3; }
.scene-card.last{ box-shadow:inset 0 0 0 3px var(--primary),var(--shadow-card); }
.scene-card:focus-visible{ outline:3px solid var(--focus-ring); outline-offset:3px; }
.story-card{ grid-column:1 / -1; flex-direction:row; align-items:stretch; text-align:left; }
.story-card .ph{ flex:0 0 38%; aspect-ratio:auto; min-height:96px; }
.story-card .tx{ flex:1; display:flex; flex-direction:column; justify-content:center; gap:2px; padding:10px 14px; }
.story-card .tx b{ font-size:24px; line-height:1.25; color:var(--primary-ink); }
.story-card .tx span{ font-size:17px; color:var(--text-muted); line-height:1.4; }
#scr-scenes .ambient-row{ flex:0 0 auto; display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 20px; border-radius:var(--radius-md); background:var(--surface); box-shadow:var(--shadow-card); font-size:19px; font-weight:600; min-height:var(--tap-min); }
@media (min-width:760px), (orientation:landscape){ #scr-scenes .grid{ grid-template-columns:repeat(4,minmax(0,1fr)); } }

/* Play */
#scr-play{ padding:0; background:#1b2347; }
#scene{ position:absolute; inset:0; overflow:hidden; transition:transform 2s ease; }
#scene img.layer{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:center; pointer-events:none; }
#scene canvas{ position:absolute; inset:0; width:100%; height:100%; touch-action:none; }
.frame{ position:absolute; inset:0; pointer-events:none; border:clamp(8px,1.3vw,14px) solid var(--primary); box-shadow:inset 0 0 0 2px rgba(255,255,255,.45), inset 0 0 40px rgba(0,0,0,.2); }
.frame.hide{ display:none; }
.sill{ position:absolute; left:0; right:0; bottom:0; height:calc(var(--safe-b) + 30px); background:#b98552; border-top:3px solid #3a2f2a; box-shadow:inset 0 8px 0 rgba(0,0,0,.08); pointer-events:none; }
.sill-obj{ position:absolute; right:calc(var(--safe-r) + 22px); bottom:calc(var(--safe-b) + 22px); width:min(17vw,96px); height:auto; pointer-events:none; }
#scr-play .topbar{ position:absolute; top:0; left:0; right:0; display:flex; align-items:center; gap:12px; padding:calc(var(--safe-t) + 12px) calc(var(--safe-r) + 16px) 0 calc(var(--safe-l) + 16px); z-index:5; pointer-events:none; }
#scr-play .topbar > *{ pointer-events:auto; }
/* Phone turned sideways (or any wide screen): the scene keeps its upright shape in a centred panel,
   with the same picture softly blurred at the sides, so nothing is cropped or squeezed. */
.scene-side{ display:none; }
@media (min-aspect-ratio:4/5){
  #scene{ left:0; right:0; margin:0 auto; width:calc(100vh * 0.75); width:calc(100dvh * 0.75); max-width:100%; box-shadow:0 0 48px rgba(0,0,0,.35); }
  .scene-side{ display:block; position:absolute; top:-40px; left:-40px; width:calc(100% + 80px); height:calc(100% + 80px); object-fit:cover; filter:blur(28px) brightness(.8) saturate(.9); pointer-events:none; }
}
.chapter-btn{ margin-left:auto; width:52px; height:52px; }

#scr-play .gamebar{ position:absolute; left:0; right:0; bottom:calc(var(--safe-b) + 36px); z-index:5; display:grid; grid-template-columns:var(--tap-min) minmax(0,300px) var(--tap-min); justify-content:center; gap:var(--space-2); align-items:center; padding:0 16px; pointer-events:none; }
#scr-play .gamebar > *{ pointer-events:auto; }
#scr-play .gamebar .dgs-round{ width:var(--tap-min); height:var(--tap-min); }
#scr-play .dgs-round,#scr-play .dgs-back{ box-shadow:0 5px 20px rgba(0,0,0,.25); }
#restBtn{ background:var(--surface); color:var(--primary); box-shadow:0 6px 22px rgba(0,0,0,.28); font-size:28px; }
#restBtn svg{ width:30px; height:30px; }
#fade{ position:absolute; inset:0; background:var(--bg); opacity:0; pointer-events:none; transition:opacity 1.4s ease; z-index:4; }
#fade.on{ opacity:1; }
.story-dots{ display:flex; gap:10px; align-items:center; margin:0 auto; background:rgba(255,255,255,.9); padding:10px 14px; border-radius:999px; }
.story-dots i{ width:12px; height:12px; border-radius:50%; background:var(--divider); display:block; }
.story-dots i.done{ background:#8496cf; }
.story-dots i.on{ background:var(--primary); width:16px; height:16px; }
.dimmed .ui-static{ opacity:.35; transition:opacity 4s ease; }
.ui-static{ transition:opacity .6s ease; }

/* End and rest */
#scr-end .col,#scr-rest .col{ justify-content:center; gap:var(--space-3); }
#scr-end .hero .dgs-art{ aspect-ratio:16/9; max-height:24vh; margin:0 auto; }
#scr-rest .hero .dgs-art{ aspect-ratio:1/1; max-height:38vh; margin:0 auto; }
#scr-end .btns,#scr-rest .btns{ display:flex; flex-direction:column; gap:var(--space-2); }

/* Mood log and session table */
.mood-sum{ display:grid; gap:12px; }
.ms-row{ display:grid; gap:6px; }
.ms-lbl{ font-size:17px; font-weight:700; }
.ms-bar{ display:flex; height:14px; border-radius:7px; overflow:hidden; gap:2px; background:var(--surface-sunk); }
.ms-bar i{ display:block; }
.ms-cnt{ display:flex; gap:14px; font-size:17px; font-weight:700; }
.ms-c{ display:inline-flex; align-items:center; gap:4px; }
.ms-c svg{ width:26px; height:26px; }
.sessions{ width:100%; border-collapse:collapse; font-size:17px; }
.sessions th,.sessions td{ padding:8px 4px; border-bottom:1.5px solid var(--divider); text-align:left; vertical-align:middle; }
.sessions th{ font-size:15px; color:var(--text-muted); }
.sessions svg{ width:28px; height:28px; }
.voice-list{ display:grid; gap:6px; }
.voice-opt{ appearance:none; border:0; cursor:pointer; text-align:left; min-height:56px; padding:8px 14px; border-radius:var(--radius-sm); background:var(--surface-sunk); color:var(--text); font-size:17px; font-weight:600; line-height:1.35; word-break:break-word; }
.voice-opt[aria-pressed="true"]{ background:var(--primary-soft); color:var(--primary-ink); font-weight:800; box-shadow:inset 0 0 0 2.5px var(--primary); }

/* How-to-play mini animations */
.ht-pulse{ animation:htPulse 2.4s ease-in-out infinite; transform-origin:center; transform-box:fill-box; }
.ht-tap{ animation:htTap 2.8s ease-in-out infinite; }
.ht-ripple{ animation:htRipple 2.8s ease-out infinite; transform-origin:center; transform-box:fill-box; }
.ht-ripple.d2{ animation-delay:.5s; }
.ht-swim{ animation:htSwim 9s ease-in-out infinite; }
.ht-drift{ animation:htDrift 6s ease-in-out infinite; }
@keyframes htPulse{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.06); } }
@keyframes htTap{ 0%,100%{ transform:translate(60px,60px); } 45%,60%{ transform:translate(0,0); } }
@keyframes htRipple{ 0%,40%{ transform:scale(.2); opacity:0; } 50%{ opacity:1; } 100%{ transform:scale(1.6); opacity:0; } }
@keyframes htSwim{ 0%{ transform:translate(-40px,10px); } 50%{ transform:translate(40px,-10px); } 100%{ transform:translate(-40px,10px); } }
@keyframes htDrift{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-10px); } }

@media (max-height:640px){ .dgs-title{ font-size:34px; line-height:40px; } .dgs-btn--play{ min-height:88px; } }
@media (orientation:landscape) and (max-height:560px){
  #scr-start .hero .dgs-art{ max-height:40vh; }
  .dgs-guide{ min-height:var(--tap-min); flex-direction:row; }
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{ animation-duration:.001s !important; animation-iteration-count:1 !important; transition-duration:.001s !important; }
  #ghostTarget.show{ animation:softPulse 2.4s ease-in-out infinite !important; animation-duration:2.4s !important; animation-iteration-count:infinite !important; }
}
@keyframes softPulse{ 0%,100%{ opacity:.45; } 50%{ opacity:1; } }
/* Design refinement from Joyce's design partner, 5 Nov 2026 (folded into the build; speed fixes marked). */
/* 2026 visual refinement — shared accessibility guardrails. */
.dgs-btn:focus-visible,.dgs-round:focus-visible,.dgs-back:focus-visible,
button:focus-visible,[role="button"]:focus-visible{outline:4px solid var(--focus-ring);outline-offset:4px;}
.dgs-btn--primary{background-image:linear-gradient(160deg,rgba(255,255,255,.13),transparent 54%);}
.dgs-btn--secondary{background-image:linear-gradient(180deg,rgba(255,255,255,.9),rgba(255,255,255,.14));}
.dgs-notice{border:1px solid var(--divider);}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;}}

/* Window Seat: richer window materials, with scenery remaining the focal point. */
.frame{border-color:#795735;border-style:solid;box-shadow:inset 0 0 0 3px rgba(255,246,214,.67),inset 0 0 24px rgba(32,25,28,.14),0 0 0 2px #3d3229;}
.sill{background:linear-gradient(180deg,#deb47d 0%,#bb8754 38%,#996333 100%);border-top:4px solid #79502e;box-shadow:inset 0 7px 0 rgba(255,242,211,.27),0 -5px 13px rgba(32,25,28,.16);}
.sill-obj{filter:drop-shadow(0 6px 5px rgba(21,28,24,.28));}
.scene-card .ph{filter:saturate(1.06) contrast(1.02);}
.scene-card.last{box-shadow:inset 0 0 0 4px var(--primary),0 5px 20px rgba(47,63,143,.14);}
.story-card .ph{filter:saturate(1.06);}
#scene img.layer{image-rendering:auto;}
@media(prefers-reduced-motion:reduce){#scene,#fade{transition:none!important;}}

</section>

</section>

/* ==== SECTION: ENGINE ==== */
/* ---------- Tiny event bus ---------- */
const Bus = (() => {
  const map = {};
  return {
    on(ev, fn){ (map[ev] = map[ev] || []).push(fn); },
    emit(ev, data){ (map[ev] || []).forEach(fn => { try { fn(data); } catch (e) { console.error(e); } }); }
  };
})();

/* ---------- Caregiver notices (never shown to the player) ---------- */
const Notices = (() => {
  const active = new Set();
  return {
    add(key){ if (!active.has(key)) { active.add(key); Bus.emit('notice', key); } },
    remove(key){ if (active.delete(key)) Bus.emit('notice', key); },
    list(){ return Array.from(active); }
  };
})();

/* ---------- Storage: localStorage with in-memory fallback ---------- */
const Store = (() => {
  const mem = {};
  let ok = true;
  try { const k = 'dgs.__probe'; localStorage.setItem(k, '1'); localStorage.removeItem(k); }
  catch (e) { ok = false; }
  function fail(){ ok = false; Notices.add('notice_storage'); }
  function raw(key){
    if (ok) { try { return localStorage.getItem(key); } catch (e) { fail(); } }
    return key in mem ? mem[key] : null;
  }
  return {
    get(key, fallback){
      const v = raw(key);
      if (v === null || v === undefined) return fallback;
      /* Shared keys may have been written by another game as a plain string ("en") or as JSON ("\"en\""). Accept both. */
      try { return JSON.parse(v); } catch (e) { return typeof fallback === 'string' ? v : fallback; }
    },
    /* Plain-text write for shared string keys (dgs.lang, dgs.level), the series standard. */
    setPlain(key, str){
      mem[key] = String(str);
      if (!ok) { Notices.add('notice_storage'); return false; }
      try { localStorage.setItem(key, String(str)); return true; } catch (e) { fail(); return false; }
    },
    set(key, val){
      const s = JSON.stringify(val);
      mem[key] = s;
      if (!ok) { Notices.add('notice_storage'); return false; }
      try { localStorage.setItem(key, s); return true; } catch (e) { fail(); return false; }
    },
    remove(key){
      delete mem[key];
      if (ok) { try { localStorage.removeItem(key); } catch (e) { fail(); } }
    },
    has(key){ return raw(key) !== null; },
    keys(prefix){
      const out = new Set(Object.keys(mem).filter(k => k.startsWith(prefix)));
      if (ok) { try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && k.startsWith(prefix)) out.add(k); } } catch (e) {} }
      return Array.from(out);
    },
    isOk(){ return ok; }
  };
})();
if (!Store.isOk()) Notices.add('notice_storage');

const gameKey = s => 'dgs.' + GAME_ID + '.' + s;

/* ---------- Settings ---------- */
function getSetting(name){
  if (SHARED_KEYS[name]) {
    const v = Store.get(SHARED_KEYS[name], DEFAULTS[name]);
    if (typeof DEFAULTS[name] === 'boolean') return v === true || v === 'true' || v === 1 || v === '1';
    return v;
  }
  const s = Store.get(gameKey('settings'), {});
  return Object.prototype.hasOwnProperty.call(s, name) ? s[name] : DEFAULTS[name];
}
function setSetting(name, val){
  if (SHARED_KEYS[name]) { if (typeof val === 'string') Store.setPlain(SHARED_KEYS[name], val); else Store.set(SHARED_KEYS[name], val); }
  else { const s = Store.get(gameKey('settings'), {}); s[name] = val; Store.set(gameKey('settings'), s); }
  Bus.emit('setting', { name, val });
}
function getState(name, fallback){ const s = Store.get(gameKey('state'), {}); return name in s ? s[name] : fallback; }
function setState(name, val){ const s = Store.get(gameKey('state'), {}); s[name] = val; Store.set(gameKey('state'), s); }

/* Level-aware values: the level sets defaults and limits, settings work inside them. */
function levelCfg(){ return LEVELS[getSetting('level')] || LEVELS.standard; }
function effSessionMinutes(){ const m = getSetting('sessionMinutes'); return m || levelCfg().sessionMinutes; }
function effIntensity(){ return levelCfg().calmOnly ? 'calm' : getSetting('intensity'); }
function effSound(){ const s = getSetting('sound'); return (levelCfg().natureOnly && s === 'music') ? 'nature' : s; }
function effPrompts(){ return levelCfg().prompts && getSetting('lookPrompts'); }
function effRemarks(){ return levelCfg().prompts && getSetting('remarks'); }
function effSpeed(){ return getSetting('speed') * levelCfg().animMul; }
function setLevel(level){
  if (!LEVELS[level]) return;
  setSetting('level', level);
  setSetting('sessionMinutes', null);   // level sets a fresh default
  document.documentElement.classList.toggle('level-simplest', level === 'simplest');
}

/* ---------- IndexedDB for media (caregiver music) ---------- */
const DB = (() => {
  const NAME = 'dgs-' + GAME_ID, STORE = 'media';
  const mem = {};
  let dbp = null;
  function open(){
    if (dbp) return dbp;
    dbp = new Promise((res, rej) => {
      try {
        const r = indexedDB.open(NAME, 1);
        r.onupgradeneeded = () => { r.result.createObjectStore(STORE); };
        r.onsuccess = () => res(r.result);
        r.onerror = () => rej(r.error);
      } catch (e) { rej(e); }
    });
    dbp.catch(() => { Notices.add('notice_storage'); });
    return dbp;
  }
  function run(mode, fn){
    return open().then(db => new Promise((res, rej) => {
      const tx = db.transaction(STORE, mode);
      const req = fn(tx.objectStore(STORE));
      tx.oncomplete = () => res(req && req.result);
      tx.onerror = () => rej(tx.error);
    }));
  }
  return {
    put(key, val){ mem[key] = val; return run('readwrite', s => s.put(val, key)).catch(() => { Notices.add('notice_storage'); }); },
    get(key){ return run('readonly', s => s.get(key)).then(v => v === undefined ? mem[key] : v).catch(() => mem[key]); },
    del(key){ delete mem[key]; return run('readwrite', s => s.delete(key)).catch(() => {}); },

/* ---------- Language ---------- */
let currentLang = DEFAULT_LANG;
function t(key, vars){
  const table = STRINGS[currentLang] || STRINGS[DEFAULT_LANG] || {};
  let s = table[key];
  if (s === undefined) {
    s = (STRINGS[DEFAULT_LANG] || {})[key];
    if (s === undefined) { console.warn('[Window Seat] missing string:', key); s = ''; }
  }
  if (vars) s = s.replace(/\{(\w+)\}/g, (m, k) => (k in vars ? vars[k] : m));
  return s;
}
function tIn(lang, key){ return ((STRINGS[lang] || {})[key]) || ''; }
function plain(s){ return String(s).replace(/\[\[|\]\]/g, ''); }
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c])); }
function rich(s){ return escapeHtml(s).replace(/\[\[(.+?)\]\]/g, '<span class="key">$1</span>'); }

}

}

/* ---------- Captions: every spoken line is also shown ---------- */
const Caption = (() => {
  let timer = null;

    show(text, ms){
      const el = document.getElementById('caption');
      if (!el) return;
      el.innerHTML = rich(text);

    },
    hide(){ const el = document.getElementById('caption'); if (el) el.classList.remove('show'); clearTimeout(timer); }
  };
})();

/* ---------- Speech ---------- */
const Speech = (() => {
  const has = 'speechSynthesis' in window && typeof SpeechSynthesisUtterance !== 'undefined';
  let voices = [], logged = false, status = 'none', speakTimer = null, watchdog = null, loadedOnce = false;   // status: 'local' | 'online' | 'onlineOnly' | 'none'
  const bad = new Set();                 // voices that failed or stayed silent this session: skip them
  let last = null;                       // { ok, voice, why } for the caregiver Voice check
  function load(){
    if (!has) return;
    try { voices = window.speechSynthesis.getVoices() || []; } catch (e) { voices = []; }
    if (voices.length && !logged) {
      logged = true;
      console.log('[Window Seat] voices available on this device (best first per language is chosen):\n' +
        voices.map(v => `  ${v.name} | ${v.lang} | local=${v.localService}`).join('\n'));
    }
    refresh();
  }
  function candidates(lang){
    return voices.filter(v => {
      const l = (v.lang || '').replace('_', '-').toLowerCase();
      if (lang === 'en') return l.startsWith('en');
      if (/yue|zh-hk|zh-mo/.test(l)) return false;        // no Cantonese or other dialect speech
      return l.startsWith('zh') || l.startsWith('cmn');
    }).sort((a, b) => score(b, lang) - score(a, lang));   // best first
  }
  /* Prefer the most natural-sounding voice. Natural/neural voices (Edge, Windows 11), enhanced voices (iPhone)
     and Google voices (Chrome) sound far more human than the old desktop voices. */
  const NOVELTY = /bells|bubbles|bad news|good news|boing|cellos|jester|organ|trinoids|whisper|zarvox|albert|fred|junior|ralph|superstar|wobble|bahh|eddy|flo|grandma|grandpa|reed|rocko|sandy|shelley/i;
  const WARM = /xiaoxiao|xiaoyi|xiaochen|xiaohan|xiaomo|xiaorui|tingting|lili|yu-shu|luna|wayne|sonia|libby|natasha|karen|samantha|moira|serena|kate|aria|jenny/i;
  function score(v, lang){
    const l = (v.lang || '').replace('_', '-').toLowerCase(), n = v.name || '';
    let s = 0;
    if (lang !== 'en') s += (l === 'zh-cn' || l === 'cmn-hans-cn') ? 4 : (l === 'zh-sg' || l.startsWith('cmn')) ? 3 : 1;
    else s += l === 'en-sg' ? 4 : l === 'en-gb' ? 3 : (l === 'en-au' || l === 'en-us' || l === 'en-ie') ? 2 : 1;
    if (/natural|neural/i.test(n)) s += 8;
    else if (/enhanced|premium/i.test(n)) s += 6;
    else if (/google/i.test(n)) s += 4;
    if (WARM.test(n)) s += 2;
    if (/desktop|compact|espeak/i.test(n)) s -= 2;
    if (NOVELTY.test(n)) s -= 20;
    if (v.default) s += 0.5;
    return s;
  }
  function chosenKey(lang){ return lang === 'en' ? 'voiceEn' : 'voiceZh'; }
  function pick(){
    const c = candidates(currentLang);
    const allowed = (getSetting('onlineVoice') ? c : c.filter(v => v.localService)).filter(v => !bad.has(v.name));
    const want = getSetting(chosenKey(currentLang));
    const chosen = want && allowed.find(v => v.name === want);
    if (chosen) return { voice: chosen, status: chosen.localService ? 'local' : 'online' };
    if (allowed.length) return { voice: allowed[0], status: allowed[0].localService ? 'local' : 'online' };
    const permitted = getSetting('onlineVoice') ? c : c.filter(v => v.localService);
    if (permitted.length) return { voice: null, status: 'failed' };     // voices exist, but every one stayed silent
    if (c.length) return { voice: null, status: 'onlineOnly' };
    return { voice: null, status: 'none' };
  }
  function refresh(){
    status = has ? pick().status : 'none';
    Notices.remove('notice_voice_online'); Notices.remove('notice_voice_none'); Notices.remove('notice_voice_failed');
    if (status === 'onlineOnly') Notices.add('notice_voice_online');
    if (status === 'failed') Notices.add('notice_voice_failed');
    if (status === 'none' && has && (voices.length || loadedOnce)) Notices.add('notice_voice_none');
  }
  if (has) {
    load();
    try { window.speechSynthesis.addEventListener('voiceschanged', load); } catch (e) { window.speechSynthesis.onvoiceschanged = load; }
    setTimeout(() => { loadedOnce = true; load(); }, 2500);
  }
  /* Speak phrase by phrase with a small breath between them. If a voice errors or stays silent,
     mark it and try the next one (once) from the phrase that failed, so a broken online voice never leaves the game mute. */
  function speakWith(line, attempt){
    const p = pick();
    if (!p.voice) { last = { ok: false, voice: '', why: p.status === 'failed' ? 'all-failed' : 'no-voice' }; Bus.emit('voicecheck'); return; }
    try { window.speechSynthesis.cancel(); } catch (e) {}
    clearTimeout(speakTimer); clearTimeout(watchdog);
    const parts = (line.match(/[^，。！？、,.!?;；]+[，。！？、,.!?;；]*/g) || [line]).map(x => x.trim()).filter(Boolean);
    let i = 0, started = false;
    const fail = why => {
      clearTimeout(watchdog);
      bad.add(p.voice.name); last = { ok: false, voice: p.voice.name, why };
      Sound.duck(false); refresh(); Bus.emit('voicecheck');
      // retry with another voice, from the phrase that failed (never re-read what was already heard)
      const rest = parts.slice(Math.max(0, i - 1)).join(currentLang === 'en' ? ' ' : '');
      if (attempt < 1 && rest) speakWith(rest, attempt + 1);
    };

      if (i >= parts.length) { Sound.duck(false); return; }
      const u = new SpeechSynthesisUtterance(parts[i++]);
      u.voice = p.voice; u.lang = p.voice.lang || (currentLang === 'en' ? 'en' : 'zh-CN');
      u.rate = Math.max(0.5, Math.min(1, getSetting('speechRate'))); u.pitch = 1;
      u.volume = Math.max(0, Math.min(1, getSetting('speechVolume')));
      u.onstart = () => { if (!started) { started = true; clearTimeout(watchdog); last = { ok: true, voice: p.voice.name, why: '' }; Bus.emit('voicecheck'); } };
      u.onend = () => { if (!started) { started = true; clearTimeout(watchdog); last = { ok: true, voice: p.voice.name, why: '' }; } speakTimer = setTimeout(next, SPEECH_PAUSE_MS); };
      u.onerror = e => { const why = (e && e.error) || 'error'; if (why === 'interrupted' || why === 'canceled') { Sound.duck(false); return; } fail(why); };
      try { window.speechSynthesis.resume(); } catch (e) {}
      window.speechSynthesis.speak(u);
    };

    /* Chrome can drop a line spoken in the same moment as cancel(); a short pause avoids that. */
    speakTimer = setTimeout(() => {
      try { next(); } catch (e) { fail('exception'); return; }
      watchdog = setTimeout(() => { if (!started && document.visibilityState === 'visible') fail('silent'); }, 4000);
    }, 120);
  }
  function diag(){
    const count = (lang, local) => candidates(lang).filter(v => !!v.localService === local).length;
    return { supported: has, total: voices.length, zl: count('zh-CN', true), zo: count('zh-CN', false), el: count('en', true), eo: count('en', false), last };
  }

  return {
    diag,
    /* opts.caption === false when the sentence is already on screen */
    speak(text, opts){
      opts = opts || {};
      if (opts.caption !== false) Caption.show(text);
      if (!has || getSetting('muted')) return;
      speakWith(plain(text), 0);
    },
    /* For the caregiver voice chooser */
    voicesFor(lang){
      const c = candidates(lang), online = getSetting('onlineVoice');
      return c.filter(v => online || v.localService).map(v => ({ name: v.name, online: !v.localService }));
    },
    currentName(){ const p = pick(); return p.voice ? p.voice.name : ''; },
    chosenKey,
    stop(){ clearTimeout(speakTimer); clearTimeout(watchdog); if (has) { try { window.speechSynthesis.cancel(); } catch (e) {} } Sound.duck(false); },
    refresh, status(){ return status; }
  };
})();

/* ---------- Jianpu parser ----------
   Tokens: 1-7 (scale degree), 0 (rest), - (hold one more beat), | (bar line)
   Suffixes: ' up an octave, , down an octave, / half beat, // quarter beat, . dotted
   Prefix: # sharp, b flat. "(half)" is accepted as "/". */
function parseJianpu(mel){
  const SEMI = { 1:0, 2:2, 3:4, 4:5, 5:7, 6:9, 7:11 };
  const beat = 60 / (mel.bpm || 60);
  const notes = [];
  const src = String(mel.jianpu).replace(/\(half\)/g, '/').replace(/\|/g, ' | ');
  let barStart = true;
  src.split(/\s+/).filter(Boolean).forEach(tok => {
    if (tok === '|') { barStart = true; return; }
    if (tok === '-') { if (notes.length) notes[notes.length - 1].dur += beat; return; }
    const m = tok.match(/^([#b]?)([0-7])([',]*)(\/*)(\.?)$/);
    if (!m) { console.warn('[Window Seat] jianpu token not understood:', tok); return; }
    let dur = beat / Math.pow(2, m[4].length);
    if (m[5]) dur *= 1.5;
    let midi = null;
    if (m[2] !== '0') {
      midi = mel.tonicMidi + SEMI[m[2]];
      for (const ch of m[3]) midi += ch === "'" ? 12 : -12;
      if (m[1] === '#') midi += 1; if (m[1] === 'b') midi -= 1;
    }
    notes.push({ midi, dur, barStart });
    barStart = false;
  });
  return { notes, beat, beatsPerBar: parseInt(String(mel.timeSig || '4/4'), 10) || 4 };
}

/* ---------- Sound (Web Audio, all synthesised) ---------- */
const Sound = (() => {
  let ctx = null, master, musicG, duckG, themeG, natureG, sfxG, noiseBuf = null;
  let musicScale = 1, ducked = false;

    for (let i = 0; i < len; i++) {

      b3 = 0.86650 * b3 + w * 0.3104856; b4 = 0.55000 * b4 + w * 0.5329522; b5 = -0.7616 * b5 - w * 0.0168980;
      d[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + w * 0.5362) * 0.11; b6 = w * 0.115926;

      while (due('drip', () => 2 + Math.random() * 3)) {
        const f = 700 + Math.random() * 500;
        tone(natureNext.drip, out, { f0: f * 1.5, f1: f, len: 0.18, vol: 0.06, glide: 0.07 });
        natureNext.drip += 2.5 + Math.random() * 4;
      }
    } else if (natureScene === 'garden') {
      while (due('chirp', () => 5 + Math.random() * 6)) {
        chirps(natureNext.chirp, out, 2 + Math.floor(Math.random() * 3), 0.018);
        natureNext.chirp += 7 + Math.random() * 9;
      }
    } else if (natureScene === 'train') {
      if (trainRate < 0.2) natureNext.clack = now + 0.4;   // standing at a station: no clacks
      else while (due('clack', () => 0.5)) {    // soft, steady clickety-clack
        const t0 = natureNext.clack, p = 1.7 / trainRate;
        [0, 0.17, 0.85, 1.02].forEach((o, i) => burst(t0 + o / trainRate, out, { freq: i % 2 ? 420 : 340, vol: 0.32, len: 0.09, att: 0.004 }));
        natureNext.clack += p;
      }
    }
  }
  function stopNature(fadeMs){
    clearInterval(natureTimer); natureTimer = null;
    if (!ctx || !natureOut) { natureScene = null; return; }
    const out = natureOut, srcs = natureSrcs;
    natureOut = null; natureSrcs = []; natureScene = null;
    out.gain.cancelScheduledValues(ctx.currentTime);
    out.gain.setTargetAtTime(0.0001, ctx.currentTime, Math.max(0.05, (fadeMs || 800) / 4000));
    setTimeout(() => { srcs.forEach(s => { try { s.stop(); } catch (e) {} }); try { out.disconnect(); } catch (e) {} }, (fadeMs || 800) + 300);
  }

  /* ---- Gentle tap responses ---- */
  function chirps(t, out, n, vol){
    for (let i = 0; i < n; i++) {
      const base = 1900 + Math.random() * 500;
      tone(t, out, { f0: base, f1: base * (1.15 + Math.random() * 0.2), len: 0.09, vol, att: 0.015 });
      t += 0.11 + Math.random() * 0.06;
    }
  }
  const PENTA = [69, 71, 74, 76, 78, 81, 83];   // D major pentatonic, upper middle
  function sfx(name){
    const c = ensure(); if (!c || c.state !== 'running') return;
    const t = ctx.currentTime + 0.02;
    if (name === 'plink') {
      const m = PENTA[Math.floor(Math.random() * PENTA.length)];
      tone(t, sfxG, { f0: mtof(m), len: 1.6, vol: 0.09, att: 0.02 });
      tone(t, sfxG, { f0: mtof(m + 12), len: 0.7, vol: 0.02, att: 0.02 });
    } else if (name === 'bird') {
      chirps(t, sfxG, 3 + Math.floor(Math.random() * 3), 0.045);
    } else if (name === 'tok') {
      tone(t, sfxG, { f0: 480, f1: 260, len: 0.22, vol: 0.06, glide: 0.12 });
    } else if (name === 'drops') {
      for (let i = 0; i < 6; i++) burst(t + i * (0.05 + Math.random() * 0.08), sfxG, { type: 'bandpass', freq: 3000 + Math.random() * 2500, q: 2, vol: 0.06, len: 0.03 });
    } else if (name === 'wipe') {
      burst(t, sfxG, { type: 'bandpass', freq: 1300, q: 0.6, vol: 0.05, len: 0.4, att: 0.12 });
    } else if (name === 'chime') {
      tone(t, sfxG, { f0: mtof(81), len: 2.6, vol: 0.05, att: 0.04 });
      tone(t + 0.3, sfxG, { f0: mtof(86), len: 2.6, vol: 0.04, att: 0.04 });
    }
  }

  /* ---- Caregiver's own music (HTML audio element, local blob) ---- */
  function setCustom(blob){
    if (customEl) { try { customEl.pause(); } catch (e) {} customEl = null; }
    if (customUrl) { URL.revokeObjectURL(customUrl); customUrl = null; }
    if (!blob) return Promise.resolve(false);
    customUrl = URL.createObjectURL(blob);
    customEl = new window.Audio(customUrl);
    customEl.loop = true; customEl.preload = 'auto';
    applyVolumes();
    if (customWanted) customEl.play().catch(() => {});
    return Promise.resolve(true);
  }
  function playCustom(on){
    customWanted = !!on;
    clearInterval(customFade); customFade = null;
    if (!customEl) return false;
    if (on) { applyVolumes(); customEl.play().catch(() => {}); } else customEl.pause();
    return true;
  }
  function fadeCustom(ms){
    if (!customEl || customEl.paused) return;
    const start = customEl.volume, t0 = Date.now();
    clearInterval(customFade);
    customFade = setInterval(() => {
      const k = Math.min(1, (Date.now() - t0) / ms);
      customEl.volume = start * (1 - k);
      if (k >= 1) { clearInterval(customFade); customFade = null; customEl.pause(); customWanted = false; }
    }, 100);
  }

  return {
    ensure, unlock, applyVolumes, startTheme, stopTheme, startNature, stopNature, sfx,
    setCustom, playCustom, fadeCustom, hasCustom(){ return !!customEl; },
    isThemeOn(){ return themeOn && !themeStopT; },
    setMusicScale(s){ musicScale = s; applyVolumes(); },
    setTrainRate(r){
      trainRate = Math.max(0, Math.min(2, r));
      if (ctx && trainG) { trainG.gain.cancelScheduledValues(ctx.currentTime); trainG.gain.setTargetAtTime(0.25 + 0.65 * Math.min(1, trainRate), ctx.currentTime, 0.5); }
    },
    setNatureLevel(v){
      natureLevel = Math.max(0, Math.min(1, v));
      if (ctx && natureOut) { natureOut.gain.cancelScheduledValues(ctx.currentTime); natureOut.gain.setTargetAtTime(Math.max(0.0001, natureLevel), ctx.currentTime, 1.5); }
    },
    duck(on){ ducked = !!on; applyVolumes(); },
    fadeAll(ms){ stopTheme(ms); stopNature(ms); fadeCustom(ms); },
    suspend(){ if (ctx && ctx.state === 'running') ctx.suspend().catch(() => {}); if (customEl && !customEl.paused) { customEl.pause(); } },
    resume(){ if (ctx && ctx.state !== 'running') ctx.resume().catch(() => {}); if (customWanted && customEl && customEl.paused) customEl.play().catch(() => {}); }
  };
})();

/* ---------- Device helpers ---------- */
const Device = (() => {
  const rm = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : { matches: false };
  return {
    reducedMotion(){ return !!rm.matches; },
    isStandalone(){
      try { return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true; }
      catch (e) { return false; }
    },
    persistStorage(){ try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch (e) {} },
    /* Zoom is an accessibility aid for caregivers, but a player who zooms by accident may not know how to get back.
       So pinch and double-tap zoom work on the caregiver pages only. */
    zoomAllowed(){ return typeof UI !== 'undefined' && (UI.current === 'care' || UI.current === 'settings'); },
    setZoom(allowed){
      const m = document.querySelector('meta[name=viewport]'); if (!m) return;
      m.setAttribute('content', 'width=device-width, initial-scale=1, viewport-fit=cover' + (allowed ? '' : ', maximum-scale=1, user-scalable=no'));
    },
    blockGestures(){
      const stop = e => { if (!Device.zoomAllowed()) e.preventDefault(); };
      document.addEventListener('contextmenu', e => e.preventDefault());
      document.addEventListener('gesturestart', stop);
      document.addEventListener('gesturechange', stop);
      document.addEventListener('dblclick', stop);
      document.addEventListener('selectstart', e => { if (!(e.target.closest && e.target.closest('input,textarea'))) e.preventDefault(); });
      document.addEventListener('touchmove', e => {
        if (e.touches && e.touches.length > 1) { if (!Device.zoomAllowed()) e.preventDefault(); return; }   // pinch
        if (!(e.target.closest && e.target.closest('.scroll, #sceneGrid, input[type=range]'))) e.preventDefault();   // pull-to-refresh
      }, { passive: false });
      let lastEnd = 0;   // double-tap zoom on older iOS
      document.addEventListener('touchend', e => {
        const n = Date.now();
        if (n - lastEnd < 320 && !Device.zoomAllowed() && !(e.target.closest && e.target.closest('input'))) e.preventDefault();
        lastEnd = n;
      }, { passive: false });
    }
  };
})();

/* ---------- Screen wake lock ---------- */
const Wake = (() => {
  let want = false, sentinel = null;
  async function request(){
    want = true;
    try {
      if ('wakeLock' in navigator && document.visibilityState === 'visible' && !sentinel) {
        sentinel = await navigator.wakeLock.request('screen');
        sentinel.addEventListener('release', () => { sentinel = null; });
      }
    } catch (e) { sentinel = null; }
  }
  function release(){ want = false; try { if (sentinel) sentinel.release(); } catch (e) {} sentinel = null; }
  return { request, release, wanted(){ return want; } };
})();

/* Pause on hide, resume on show (and ask for the wake lock again). */
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') { Speech.stop(); Sound.suspend(); Bus.emit('hidden'); }
  else { Sound.resume(); if (Wake.wanted()) Wake.request(); Bus.emit('visible'); }
});

const MOOD_PERIODS = [
  { key: 'period_morning', from: 5, to: 12 }, { key: 'period_afternoon', from: 12, to: 17 },
  { key: 'period_evening', from: 17, to: 20 }, { key: 'period_night', from: 20, to: 29 }

  const list = Store.get(gameKey('sessions'), []);
  list.push({ date: new Date().toISOString(), minutes: null, mood, endedEarly: false, source: 'caregiver' });
  while (list.length > 200) list.shift();

  const since = Date.now() - 30 * 86400000;
  const rows = MOOD_PERIODS.map(() => ({ happy: 0, okay: 0, notgreat: 0 }));
  Store.get(gameKey('sessions'), []).forEach(e => { if (e.mood && rows[periodOf(e.date)] && new Date(e.date).getTime() >= since) rows[periodOf(e.date)][e.mood]++; });

  const tone = { happy: 'var(--primary)', okay: '#8496cf', notgreat: 'var(--accent)' };
  return '<div class="mood-sum">' + rows.map((r, i) => {

}
