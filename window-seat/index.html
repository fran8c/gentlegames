/* ---------- Toast and dialog (never alert()) ---------- */
function toast(msg){
  const el = $('toast'); el.textContent = msg; el.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.remove('show'), 3200);
}
/* Move keyboard focus into a pop-up (the same as the kit's focusIn). */
const FOCUSABLE = 'button:not([disabled]),[href],input:not([disabled]),select,textarea,[tabindex]:not([tabindex="-1"])';
function focusIn(el, trap) {
  if (!el) return function () {};
  var prev = document.activeElement;
  setTimeout(function () {
    var b = el.querySelector('.dgs-btn--primary:not([disabled])') || el.querySelector(FOCUSABLE);
    try { (b || el).focus({ preventScroll: true }); } catch (x) {}
  }, 40);
  function onKey(e) {
    if (e.key !== 'Tab') return;
    var items = Array.prototype.filter.call(el.querySelectorAll(FOCUSABLE), function (x) { return x.offsetParent !== null; });
    if (!items.length) return;
    var first = items[0], last = items[items.length - 1];
    if (!el.contains(document.activeElement)) { e.preventDefault(); first.focus(); }
    else if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }
  if (trap) document.addEventListener('keydown', onKey, true);
  return function () {
    document.removeEventListener('keydown', onKey, true);
    if (prev && prev.focus && document.contains(prev)) { try { prev.focus({ preventScroll: true }); } catch (x) {} }
  };
}
let dialogRelease = null;
function openDialog(o){
  const box = $('dialogBox');
  box.innerHTML = '<h3>' + escapeHtml(o.title) + '</h3>' + (o.html || '') + '<div class="btns"></div>';
  const wrap = box.querySelector('.btns');
  o.buttons.forEach(b => {
    const el = document.createElement('button');
    el.type = 'button'; el.className = 'dgs-btn ' + (b.primary ? 'dgs-btn--primary' : 'dgs-btn--plain');
    el.innerHTML = b.icon ? btnHTML(b.icon, b.label) : '<span>' + escapeHtml(b.label) + '</span>';
    el.addEventListener('click', () => { closeDialog(); if (b.onClick) b.onClick(); });
    wrap.appendChild(el);
  });
  $('dialog').setAttribute('role', 'dialog'); $('dialog').setAttribute('aria-modal', 'true');
  $('dialog').hidden = false;
  if (dialogRelease) dialogRelease();
  dialogRelease = focusIn(box, true);
}
function closeDialog(){ $('dialog').hidden = true; $('dialogBox').innerHTML = ''; if (dialogRelease) { const r = dialogRelease; dialogRelease = null; r(); } }

/* ---------- Hold button (kit HoldButton): a filling ring; a short tap does nothing ---------- */
function holdHTML(id, label, hint, icon){
  return '<button id="' + id + '" class="dgs-hold" type="button"><span class="dgs-hold__ring"><span>' + ICON(icon || 'settings') + '</span></span>' +
    '<span><b>' + escapeHtml(label) + '</b><small>' + escapeHtml(hint) + '</small></span></button>';
}
function makeHold(btn, ms, onDone){
  if (!btn) return;
  const ring = btn.querySelector('.dgs-hold__ring');
  let raf = 0, t0 = 0, active = false;
  const set = k => ring.style.setProperty('--p', k);
  const frame = () => {
    const k = Math.min(1, (performance.now() - t0) / ms);
    set(k);
    if (k >= 1) { active = false; setTimeout(() => set(0), 400); onDone(); return; }
    raf = requestAnimationFrame(frame);
  };
  const start = e => { if (e.cancelable) e.preventDefault(); if (active) return; active = true; t0 = performance.now(); try { if (e.pointerId !== undefined) btn.setPointerCapture(e.pointerId); } catch (x) {} raf = requestAnimationFrame(frame); };
  const stop = () => { if (!active) return; active = false; cancelAnimationFrame(raf); if (performance.now() - t0 < 600) toast(t('hold_tap_hint')); set(0); };
  btn.addEventListener('pointerdown', start);
  ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(ev => btn.addEventListener(ev, stop));
  btn.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && !e.repeat) start(e); });
  btn.addEventListener('keyup', stop);
  btn.addEventListener('click', e => e.preventDefault());
  btn.addEventListener('contextmenu', e => e.preventDefault());
}

/* ---------- Ghost hand (standard component) ---------- */
const Ghost = (() => {
  let timer = null, anim = null, plan = null, armedAt = 0, assistT = null;
  const shown = {}, completed = new Set();
  const handEl = () => $('ghost'), ringEl = () => $('ghostTarget');
  const SIZE = 84, TIP = { x: 24 / 64 * SIZE, y: 4 / 64 * SIZE };
  function arm(stepId, targetFn, opts){
    cancel();
    plan = { stepId, targetFn, opts: opts || {} };
    armedAt = Date.now();
    schedule();
  }
  function schedule(){
    clearTimeout(timer);
    if (!plan || completed.has(plan.stepId)) return;
    if ((shown[plan.stepId] || 0) >= (plan.opts.max || Infinity)) return;
    const idle = plan.opts.idleMs || levelCfg().ghostIdleMs || GHOST_IDLE_MS;
    const sinceArm = Date.now() - armedAt;
    timer = setTimeout(show, Math.max(idle, GHOST_MIN_SCREEN_MS - sinceArm));
  }
  function show(){
    if (!plan || document.visibilityState === 'hidden') return;
    if (plan.opts.when && !plan.opts.when()) { schedule(); return; }
    const p = plan.targetFn();
    if (!p) { schedule(); return; }
    shown[plan.stepId] = (shown[plan.stepId] || 0) + 1;
    const hand = handEl(), ring = ringEl();
    ring.style.left = p.x + 'px'; ring.style.top = p.y + 'px'; ring.classList.add('show');
    if (Device.reducedMotion()) {
      hand.innerHTML = '<svg viewBox="0 0 64 64"><path d="M32 6v40M18 32l14 16 14-16" fill="none" stroke="#3a2f2a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg>';
      hand.style.transform = 'translate(' + (p.x - SIZE / 2) + 'px,' + (p.y - SIZE - 50) + 'px)';
      hand.classList.add('show');
    } else {
      hand.innerHTML = '<svg viewBox="0 0 64 64"><path d="' + HAND_PATH + '" fill="#ffffff" stroke="#3a2f2a" stroke-width="3" stroke-linejoin="round"/></svg>';
      const tx = p.x - TIP.x, ty = p.y - TIP.y;
      const fx = tx + 70, fy = ty + 110, mx = tx + 60, my = ty + 20;   // a simple arc
      hand.classList.add('show');
      try {
        anim = hand.animate([
          { transform: `translate(${fx}px,${fy}px)`, opacity: 0 },
          { transform: `translate(${mx}px,${my}px)`, opacity: 1, offset: 0.3 },
          { transform: `translate(${tx}px,${ty}px) scale(1)`, opacity: 1, offset: 0.55 },
          { transform: `translate(${tx}px,${ty + 4}px) scale(.92)`, opacity: 1, offset: 0.65 },
          { transform: `translate(${tx}px,${ty}px) scale(1)`, opacity: 1, offset: 0.78 },
          { transform: `translate(${tx}px,${ty}px)`, opacity: 0 }
        ], { duration: 2600, iterations: Infinity, easing: 'ease-in-out' });
      } catch (e) { hand.style.transform = `translate(${tx}px,${ty}px)`; }
    }
    if (plan.opts.onShown) plan.opts.onShown(p);
    /* Hint escalation: after the hand has shown the way, the game can complete the step together. */
    clearTimeout(assistT);
    if (plan.opts.assist) { const pl = plan; assistT = setTimeout(() => { if (plan === pl) { pl.opts.assist(p); hide(); schedule(); } }, 5600); }
  }
  function hide(){
    clearTimeout(assistT);
    if (anim) { try { anim.cancel(); } catch (e) {} anim = null; }
    const hand = handEl(), ring = ringEl();
    if (hand) { hand.classList.remove('show'); hand.style.transform = ''; }
    if (ring) ring.classList.remove('show');
  }
  function poke(){ if (!plan) return; hide(); schedule(); }
  function complete(stepId){ completed.add(stepId); if (plan && plan.stepId === stepId) { clearTimeout(timer); hide(); } }
  function cancel(){ clearTimeout(timer); hide(); plan = null; }
  function resetStep(stepId){ delete shown[stepId]; completed.delete(stepId); }
  document.addEventListener('pointerdown', poke, true);   // tapping anywhere dismisses it
  return { arm, poke, complete, cancel, hide, resetStep };
})();

const RestCard = (() => {

/* ---------- Back up, restore, clear ---------- */
function blobToDataUrl(blob){ return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(blob); }); }
function dataUrlToBlob(url){
  const [head, b64] = url.split(','); const type = (head.match(/data:([^;]+)/) || [])[1] || 'application/octet-stream';
  const bin = atob(b64); const arr = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], { type });
}
async function makeBackup(){
  try {
    const data = { app: 'dgs', gameId: GAME_ID, version: 1, createdAt: new Date().toISOString(), shared: {}, gameData: {}, media: {} };
    Object.values(SHARED_KEYS).forEach(k => { if (Store.has(k)) data.shared[k] = Store.get(k); });
    setState('lastBackup', data.createdAt);
    Store.keys('dgs.' + GAME_ID + '.').forEach(k => { data.gameData[k] = Store.get(k); });
    const music = await DB.get('music');
    if (music && music.blob) data.media.music = { name: music.name, type: music.type, dataUrl: await blobToDataUrl(music.blob) };
    const name = 'window-seat-backup-' + data.createdAt.slice(0, 10) + '.json';
    const json = JSON.stringify(data);
    let file = null;
    try { file = new File([json], name, { type: 'application/json' }); } catch (e) {}
    if (file && navigator.canShare && navigator.share) {
      try {
        if (navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: name }); toast(t('backup_done')); renderSettings(true); return; }
      } catch (e) { if (e && e.name === 'AbortError') { renderSettings(true); return; } }
    }
    const url = URL.createObjectURL(file || new Blob([json], { type: 'application/json' }));
    const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1500);
    toast(t('backup_done')); renderSettings(true);
  } catch (e) { console.error(e); toast(t('backup_fail')); }
}
function onRestoreFile(file){
  if (!file) return;
  const r = new FileReader();
  r.onload = () => {
    let data = null;
    try { data = JSON.parse(r.result); } catch (e) {}
    if (!data || data.app !== 'dgs' || data.gameId !== GAME_ID) {
      openDialog({ title: t('restore_bad'), buttons: [{ label: t('btn_close'), primary: true }] });
      return;
    }
    const settingsN = Object.keys(data.shared || {}).length + Object.keys(((data.gameData || {})[gameKey('settings')]) || {}).length;
    const sessionsN = (((data.gameData || {})[gameKey('sessions')]) || []).length;
    let when = data.createdAt; try { when = new Date(data.createdAt).toLocaleString(currentLang === 'en' ? 'en-SG' : 'zh-CN'); } catch (e) {}
    openDialog({
      title: t('restore_title'),
      html: '<ul><li>' + escapeHtml(t('restore_date', { date: when })) + '</li><li>' + escapeHtml(t('restore_settings', { n: settingsN })) + '</li><li>' +
        escapeHtml(t('restore_sessions', { n: sessionsN })) + '</li>' + (data.media && data.media.music ? '<li>' + escapeHtml(t('restore_music')) + '</li>' : '') + '</ul>' +
        '<div class="dgs-notice">' + ICON('info') + '<div><b>' + escapeHtml(t('restore_warning')) + '</b></div></div>',
      buttons: [{ label: t('btn_cancel'), primary: true }, { label: t('btn_restore_yes'), icon: 'upload', onClick: () => applyRestore(data) }]
    });
  };
  r.readAsText(file);
}
async function applyRestore(data){
  Store.keys('dgs.' + GAME_ID + '.').forEach(k => Store.remove(k));
  Object.values(SHARED_KEYS).forEach(k => Store.remove(k));
  Object.entries(data.shared || {}).forEach(([k, v]) => { if (k.startsWith('dgs.')) { if (typeof v === 'string') Store.setPlain(k, v); else Store.set(k, v); } });
  Object.entries(data.gameData || {}).forEach(([k, v]) => { if (k.startsWith('dgs.' + GAME_ID + '.')) Store.set(k, v); });
  await DB.clearAll();
  Sound.setCustom(null);
  if (data.media && data.media.music && data.media.music.dataUrl) {
    try { const blob = dataUrlToBlob(data.media.music.dataUrl); await DB.put('music', { name: data.media.music.name, type: data.media.music.type, blob }); Sound.setCustom(blob); } catch (e) {}
  }
  applySavedLook();
  setLang(getSetting('lang'));
  toast(t('restore_done'));
  renderSettings();
}

  openDialog({

function onMusicFile(file){
  if (!file) return;
  const probe = document.createElement('audio');
  if (file.type && probe.canPlayType && !probe.canPlayType(file.type)) { toast(t('music_bad')); return; }
  DB.put('music', { name: file.name, type: file.type, blob: file }).then(() => { Sound.setCustom(file); refreshMusicName(); });

/* ---------- Scene picker ---------- */
function renderScenes(){
  $('scenesBack').innerHTML = btnHTML('back', t('btn_back'));
  $('scenesTitle').innerHTML = rich(t('scenes_title'));
  const list = SCENES.filter(s => SCENE_AVAILABLE[s]);
  const last = getState('lastScene', getSetting('defaultScene'));
  const grid = $('sceneGrid');
  grid.className = 'grid' + (list.length <= 2 ? ' n2' : '');
  const mins = Math.round(STORY.length * STORY_CHAPTER_MIN * (STORY_PACE[getSetting('level')] || 1));
  const storyCard = '<button type="button" class="scene-card story-card' + (last === 'story' ? ' last' : '') + '" data-scene="story"><span class="ph" style="background-image:url(&quot;' + Game.thumb('story') + '&quot;)"></span>' +
    '<span class="tx"><b>' + escapeHtml(t('story_title')) + '</b><span>' + escapeHtml(t('story_minutes', { n: mins })) + '</span></span></button>';
  grid.innerHTML = storyCard + list.map(s => '<button type="button" class="scene-card' + (s === last ? ' last' : '') + '" data-scene="' + s + '"><span class="ph" style="background-image:url(&quot;' + Game.thumb(s) + '&quot;)"></span><span class="lb">' + escapeHtml(t('scene_' + s)) + '</span></button>').join('');
  grid.querySelectorAll('[data-scene]').forEach(b => b.addEventListener('click', () => {
    const s = b.getAttribute('data-scene');
    setState('lastScene', s); setState('sceneChosen', true);
    Ghost.complete('scenes-pick');
    showScreen('play', { scene: s });
  }));
  $('ambientRow').innerHTML = '<span id="ambientLbl">' + escapeHtml(t('ambient_label')) + '</span><button type="button" class="dgs-switch" role="switch" id="ambientToggle" aria-labelledby="ambientLbl" aria-checked="' + !!getSetting('ambient') + '"></button>';
  $('ambientToggle').addEventListener('click', () => { setSetting('ambient', !getSetting('ambient')); renderScenes(); });
}

/* ---------- Sound on/off (top right, and in the game bar during play) ---------- */
function renderMute(){
  const m = !!getSetting('muted');
  ['muteBtn', 'playMute'].forEach(id => {
    const b = $(id); if (!b) return;
    b.innerHTML = ICON(m ? 'soundOff' : 'sound');
    b.setAttribute('aria-pressed', String(m));
    b.setAttribute('aria-label', t(m ? 'btn_unmute' : 'btn_mute'));
  });
}

/* ---------- Wiring and boot ---------- */
function wireStatic(){
  const toggleMute = () => {
    const m = !getSetting('muted'); setSetting('muted', m);
    if (m) Speech.stop();
    Sound.unlock(); Sound.applyVolumes(); renderMute();
  };
  $('muteBtn').addEventListener('click', toggleMute);
  $('playMute').addEventListener('click', toggleMute);
  $('howtoSkip').addEventListener('click', () => { Ghost.complete('howto-' + UI.howto.step); goPlay(); });
  $('endRest').addEventListener('click', () => finishSession(null));
  $('playBtn').addEventListener('click', () => { Ghost.complete('start-play'); goPlay(); });
  $('howtoBtn').addEventListener('click', () => showScreen('howto', { returnTo: 'start' }));
  $('careBtn').addEventListener('click', () => showScreen('care'));
  $('howtoClose').addEventListener('click', closeHowto);
  $('howtoNext').addEventListener('click', () => {
    Ghost.complete('howto-' + UI.howto.step);
    if (UI.howto.step < HOWTO_KEYS.length - 1) { UI.howto.step++; renderHowto(); }
    else if (UI.howto.returnTo === 'play') showScreen('play', { resume: true });
    else goPlay();
  });
  $('careBack').addEventListener('click', () => showScreen('start'));
  $('setBack').addEventListener('click', () => showScreen('care'));
  $('scenesBack').addEventListener('click', () => showScreen('start'));
  $('helpBtn').addEventListener('click', () => showScreen('howto', { returnTo: 'play' }));
  $('restBtn').addEventListener('click', () => showScreen('end'));
  const goHome = () => { Game.endSession(null); Speech.stop(); showScreen('start'); };
  /* Home ends the session, so check first; Stay is the main button */
  $('homeBtn').addEventListener('click', () => openDialog({ title: t('home_confirm'), buttons: [
    { label: t('btn_stay'), primary: true },
    { label: t('btn_home'), icon: 'home', onClick: goHome }
  ] }));
  $('chapterBtn').addEventListener('click', () => Game.skipChapter());
  $('restHome').addEventListener('click', () => showScreen('start'));
  $('endSkip').addEventListener('click', () => finishSession(null));
  $('endKeep').addEventListener('click', () => showScreen('play', { resume: true }));
  $('cardRest').addEventListener('click', () => { RestCard.hide(true); showScreen('end'); });
  $('cardKeep').addEventListener('click', () => RestCard.hide());
  $('playAgain').addEventListener('click', () => { Ghost.complete('rest-again'); goPlay(); });
  $('restoreFile').addEventListener('change', e => { onRestoreFile(e.target.files[0]); e.target.value = ''; });
  $('musicFile').addEventListener('change', e => { onMusicFile(e.target.files[0]); e.target.value = ''; });

  /* The theme starts softly after the first tap anywhere (browsers block autoplay). */
  const unlock = () => {
    Sound.unlock();
    if (!UI.audioUnlocked) { UI.audioUnlocked = true; applyMusicFor(UI.current); }
  };
  document.addEventListener('pointerdown', unlock, true);
  document.addEventListener('touchend', () => Sound.unlock(), true);
  document.addEventListener('click', () => Sound.unlock(), true);

  /* Back button stays inside the game: it steps back gently instead of leaving. */
  try { history.replaceState({ ws: 0 }, ''); history.pushState({ ws: 1 }, ''); } catch (e) {}
  window.addEventListener('popstate', () => {
    try { history.pushState({ ws: 1 }, ''); } catch (e) {}
    if (!$('dialog').hidden) { closeDialog(); return; }
    const back = { howto: null, care: 'start', settings: 'care', scenes: 'start', play: 'end', end: null, rest: 'start' }[UI.current];
    if (UI.current === 'howto') closeHowto();
    else if (UI.current === 'end') showScreen('play', { resume: true });
    else if (back) showScreen(back);
  });

  Bus.on('lang', () => { renderMute(); if (UI.current && ENTER[UI.current] && UI.current !== 'play' && UI.current !== 'settings' && UI.current !== 'howto') ENTER[UI.current]({}); if (UI.current === 'howto') renderHowto(); if (RestCard.isOpen()) RestCard.show(); });
  Bus.on('setting', e => { if (e.name === 'muted' || e.name === 'musicVolume') Sound.applyVolumes(); if (UI.current === 'play') Game.onSettingsChanged(); });
  Bus.on('voicecheck', () => { const el = $('voiceCheck'); if (el && UI.current === 'settings') el.outerHTML = voiceCheckHTML(); });
  Bus.on('notice', () => { if (UI.current === 'care') { const y = $('careBody').scrollTop; renderCare(); $('careBody').scrollTop = y; } });
  window.addEventListener('pagehide', () => Game.saveOnHide());
}

function bootApp(){
  currentLang = langChosen() ? getSetting('lang') : DEFAULT_LANG;
  if (SUPPORTED_LANGS.indexOf(currentLang) < 0) currentLang = DEFAULT_LANG;
  document.documentElement.lang = currentLang === 'en' ? 'en' : 'zh-CN';
  applySavedLook();
  Device.blockGestures();
  if (!getState('firstRunDone', false)) { Device.persistStorage(); setState('firstRunDone', true); }
  const hero = illustrationSrc(CONTENT_ILLUSTRATIONS.cover);
  $('endHero').src = hero; $('restHero').src = hero;
  $('helpBtn').innerHTML = ICON('help'); $('helpBtn').setAttribute('aria-label', t('btn_help'));
  $('homeBtn').innerHTML = ICON('home'); $('homeBtn').setAttribute('aria-label', t('btn_home'));
  wireStatic();
  renderMute();
  applyI18n(document);
  Game.init();
  DB.get('music').then(m => { if (m && m.blob) Sound.setCustom(m.blob); });
  Speech.refresh();
  showScreen(langChosen() ? 'start' : 'lang');
}

/* Accepts either inline SVG markup or a data: URI (e.g. base64 PNG/JPEG), so artwork can be swapped later. */
function illustrationSrc(v){
  if (!v) return '';
  v = String(v).trim();
  if (v.startsWith('data:')) return v;
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(v);
}

/*
  Each scene is a small story that unfolds slowly, and touch means something familiar:
    koi    – an evening by the pond: dusk deepens to night; a tap scatters fish food and the koi come to eat
    garden – a morning in the garden: mist clears to sunshine; a tap scatters seeds and a bird comes to peck
    train  – a train trip to Malaysia and back: town, padi, rubber, bridge, sea, a station stop; a tap makes someone outside wave
    rain   – afternoon rain at a coffee shop: heavy rain eases to sunshine; the glass mists over and a touch wipes it clear
  Played alone, a scene loops gently. In the story ("A day out") each scene is one chapter.
*/
const Game = (() => {
  const VW = 900, VH = 1600, TAU = Math.PI * 2;   // every illustration uses this coordinate box
  const rand = (a, b) => a + Math.random() * (b - a);
  const pick = a => a[Math.floor(Math.random() * a.length)];
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const smooth = x => { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); };
  const angDiff = (a, b) => { let d = (a - b) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; };

  let canvas, g, W = 0, H = 0, DPR = 1, s = 1, ox = 0, oy = 0;
  let sceneId = null, impl = null, paused = true, raf = 0, lastT = 0, time = 0, sceneTime = 0;
  const imgs = {}, bm = {}, thumbs = {};
  let fx = [], calm = false, speed = 1, sfxGate = 0, dragging = false;
  let lastInteract = Date.now(), dimmed = false, shiftAt = 0, resumeOnShow = false;
  let lookIn = Infinity, lookU = 0.5, lookPending = null, autoIn = 8;
  let remarkIn = Infinity, remarkBag = [], lastSpokeAt = 0;
  let session = null, touched = false, story = null;
  let glowSprite = null, dropSprite = null;

  /* ---------- images and cached bitmaps ---------- */
  function load(key, src){
    return new Promise(res => {
      if (!src) { res(null); return; }
      const im = new Image();
      im.onload = () => { imgs[key] = im; res(im); };
      im.onerror = () => { console.warn('[Window Seat] image failed to load:', key); res(null); };
      im.src = illustrationSrc(src);
    });
  }
  function bitmap(key, wU, hU){
    const im = imgs[key]; if (!im) return null;
    const pw = Math.max(1, Math.round(wU * s * DPR)), ph = Math.max(1, Math.round(hU * s * DPR));
    const k = key + '@' + pw + 'x' + ph;
    if (bm[k]) return bm[k];
    const c = document.createElement('canvas'); c.width = pw; c.height = ph;
    c.getContext('2d').drawImage(im, 0, 0, pw, ph);
    bm[k] = c; return c;
  }
  function aspect(key){ const im = imgs[key]; return im && im.naturalWidth ? im.naturalHeight / im.naturalWidth : 1; }
  function sprite(key, x, y, w, o){
    o = o || {};
    const h = w * aspect(key);
    const b = bitmap(key, w, h); if (!b) return;
    g.save(); g.translate(x, y);
    if (o.rot) g.rotate(o.rot);
    if (o.flip) g.scale(-1, 1);
    if (o.sy) g.scale(1, o.sy);
    if (o.alpha !== undefined) g.globalAlpha = o.alpha;
    g.drawImage(b, -w / 2, o.bottom ? -h : -h / 2, w, h);
    g.restore();
  }
  function makeGlow(){
    const c = document.createElement('canvas'); c.width = c.height = 128;
    const x = c.getContext('2d'), gr = x.createRadialGradient(64, 64, 0, 64, 64, 64);
    gr.addColorStop(0, 'rgba(247,232,191,1)'); gr.addColorStop(0.25, 'rgba(240,213,140,.75)'); gr.addColorStop(1, 'rgba(217,169,59,0)');
    x.fillStyle = gr; x.fillRect(0, 0, 128, 128); return c;
  }
  function makeDrop(){
    const c = document.createElement('canvas'); c.width = c.height = 64;
    const x = c.getContext('2d');
    const gr = x.createRadialGradient(26, 24, 2, 32, 32, 30);
    gr.addColorStop(0, 'rgba(255,255,255,.55)'); gr.addColorStop(0.7, 'rgba(201,213,240,.28)'); gr.addColorStop(1, 'rgba(47,63,143,.35)');
    x.fillStyle = gr; x.beginPath(); x.arc(32, 32, 28, 0, TAU); x.fill();
    x.lineWidth = 3; x.strokeStyle = 'rgba(58,47,42,.35)'; x.stroke();
    x.fillStyle = 'rgba(255,255,255,.9)'; x.beginPath(); x.ellipse(23, 21, 7, 5, -0.6, 0, TAU); x.fill();
    x.strokeStyle = 'rgba(255,255,255,.5)'; x.lineWidth = 3; x.beginPath(); x.arc(32, 32, 21, 0.3, 1.4); x.stroke();
    return c;
  }
  function glow(x, y, r, a){ if (a <= 0) return; g.save(); g.globalAlpha = clamp(a, 0, 1); g.drawImage(glowSprite, x - r, y - r, r * 2, r * 2); g.restore(); }
  function wash(color, a){ if (a <= 0.003) return; const v = view(); g.fillStyle = color.replace('A', a.toFixed(3)); g.fillRect(v.x0 - 10, v.y0 - 10, v.x1 - v.x0 + 20, v.y1 - v.y0 + 20); }

  /* ---------- view mapping (cover, centred) ---------- */
  function resize(){
    const el = document.getElementById('scene');
    W = el.clientWidth || window.innerWidth; H = el.clientHeight || window.innerHeight;
    DPR = Math.min(2, window.devicePixelRatio || 1);
    if (W * H * DPR * DPR > 4.5e6) DPR = Math.sqrt(4.5e6 / (W * H));
    canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
    s = Math.max(W / VW, H / VH); ox = (W - VW * s) / 2; oy = (H - VH * s) / 2;
    Object.keys(bm).forEach(k => delete bm[k]);
    if (impl && impl.onResize) impl.onResize();
  }
  function view(){ return { x0: -ox / s, x1: (W - ox) / s, y0: -oy / s, y1: (H - oy) / s }; }
  function toScreen(p){ return { x: ox + p.x * s, y: oy + p.y * s }; }

  /* ---------- speaking: cues, narration, remarks ---------- */
  function cue(key){                         // a scene's own moment ("The rain is easing.")
    if (!levelCfg().prompts || UI.current !== 'play' || paused) return;
    lastSpokeAt = Date.now(); Speech.speak(t(key));
  }
  function narrate(key){                     // the story's chapter openings
    lastSpokeAt = Date.now();
    if (levelCfg().prompts) Speech.speak(t(key)); else Caption.show(t(key));
  }

  /* ---------- effects (all fade by themselves) ---------- */
  function addFx(e){ e.age = 0; fx.push(e); if (fx.length > MAX_EFFECTS) fx.splice(0, fx.length - MAX_EFFECTS); }
  function updateFx(dt){
    for (const e of fx) {
      e.age += dt;
      if (e.type === 'firefly') { e.x += e.vx * dt; e.y += e.vy * dt; e.vx += rand(-30, 30) * dt; e.vy -= 4 * dt; }
      else if (e.type === 'note') { e.y -= 45 * dt; e.x += Math.sin(e.age * 3) * 10 * dt; }
      else if (e.type === 'petal') { e.y += e.vy * dt; e.x += Math.sin(e.age * 1.3 + e.ph) * 25 * dt; e.rot += dt * 0.6; }
      else if (e.type === 'lily') { e.x += e.vx * dt; }
    }
    fx = fx.filter(e => e.age < e.life);
  }
  function fade(e, inT, outT){ return clamp(Math.min(e.age / (inT || 0.3), (e.life - e.age) / (outT || 1)), 0, 1); }
  function star(x, y, r, a){
    g.save(); g.globalAlpha = a; g.fillStyle = '#F7E8BF'; g.translate(x, y); g.beginPath();
    for (let i = 0; i < 8; i++) { const rr = i % 2 ? r * 0.28 : r, an = i * Math.PI / 4; g.lineTo(Math.cos(an) * rr, Math.sin(an) * rr); }
    g.closePath(); g.fill(); g.restore();
  }
  function drawFx(){
    for (const e of fx) {
      if (e.type === 'ripple') {
        for (let k = 0; k < e.rings; k++) {
          const age = e.age - k * 0.5; if (age < 0) continue;
          const r = (e.r0 || 24) + age * (e.grow || 85), a = clamp(1 - age / (e.life - k * 0.5), 0, 1) * 0.75;
          g.strokeStyle = k ? 'rgba(255,255,255,' + a * 0.8 + ')' : 'rgba(247,232,191,' + a + ')';
          g.lineWidth = 5; g.beginPath(); g.ellipse(e.x, e.y, r, r * 0.42, 0, 0, TAU); g.stroke();
        }
      } else if (e.type === 'firefly') {
        const a = fade(e, 0.6, 1.5) * (0.55 + 0.45 * Math.sin(e.age * 2.2 + e.ph));
        glow(e.x, e.y, 26, a); g.fillStyle = 'rgba(255,248,225,' + a + ')'; g.beginPath(); g.arc(e.x, e.y, 4, 0, TAU); g.fill();
      } else if (e.type === 'glow') {
        glow(e.x, e.y, e.r * (0.7 + e.age / e.life * 0.6), fade(e, 0.25, 1.2) * 0.55);
      } else if (e.type === 'note') {
        const a = fade(e, 0.2, 0.8); glow(e.x, e.y, 18, a * 0.8);
        g.fillStyle = 'rgba(247,232,191,' + a + ')'; g.beginPath(); g.arc(e.x, e.y, 6, 0, TAU); g.fill();
      } else if (e.type === 'petal') {
        const a = fade(e, 0.6, 2);
        g.save(); g.translate(e.x, e.y); g.rotate(e.rot); g.globalAlpha = a;
        g.fillStyle = '#FFFFFF'; g.strokeStyle = '#A9B9E3'; g.lineWidth = 3;
        g.beginPath(); g.ellipse(0, 0, 16, 9, 0, 0, TAU); g.fill(); g.stroke();
        g.fillStyle = '#F0D58C'; g.beginPath(); g.ellipse(-8, 0, 6, 4, 0, 0, TAU); g.fill(); g.restore();
      } else if (e.type === 'lily') {
        const a = fade(e, 1, 2.5);
        g.save(); g.translate(e.x, e.y); g.globalAlpha = a;
        g.fillStyle = '#5f9a4e'; g.strokeStyle = '#3f6e3a'; g.lineWidth = 5;
        g.beginPath(); g.ellipse(0, 0, 70, 30, 0, 0.25, TAU - 0.05); g.lineTo(0, 0); g.closePath(); g.fill(); g.stroke();
        g.fillStyle = '#FFFFFF'; g.strokeStyle = '#C9D5F0'; g.lineWidth = 3;
        for (let i = 0; i < 6; i++) { g.save(); g.rotate(i * TAU / 6); g.beginPath(); g.ellipse(0, -16, 9, 18, 0, 0, TAU); g.fill(); g.stroke(); g.restore(); }
        g.fillStyle = '#D9A93B'; g.beginPath(); g.arc(0, -4, 8, 0, TAU); g.fill(); g.restore();
      } else if (e.type === 'sparkle') {
        const p = e.follow ? e.follow() : e;
        if (!p) { e.age = e.life; continue; }
        const f = fade(e, 1, 2), pulse = 0.5 + 0.5 * Math.sin(e.age * TAU * 0.4);    // 0.4 Hz: slow, never a flash
        glow(p.x, p.y, (calm ? 120 : 150) * (0.9 + 0.1 * pulse), f * (calm ? 0.35 : 0.5) * (0.75 + 0.25 * pulse));
        if (!calm) for (let i = 0; i < 4; i++) {
          const an = e.age * 0.5 + i * TAU / 4;
          star(p.x + Math.cos(an) * 120, p.y + Math.sin(an) * 70, 20, f * (0.55 + 0.45 * Math.sin(e.age * TAU * 0.5 + i * 1.7)));
        }
      }
    }
  }
  function fireflies(x, y, n){ for (let i = 0; i < n; i++) addFx({ type: 'firefly', x: x + rand(-30, 30), y: y + rand(-20, 20), vx: rand(-25, 25), vy: rand(-55, -25), ph: rand(0, 6), life: rand(3.5, 5) }); }
  function sfx(name){ const n = performance.now(); if (n - sfxGate < 140) return; sfxGate = n; Sound.sfx(name); }

  /* ================= SCENES ================= */
  const IMPL = {};

  /* ----- Koi pond: an evening by the pond ----- */
  IMPL.koi = {
    cycle: 600,
    setup(){
      const b = this.bounds();
      const kinds = ['gold', 'white', 'whiteGold', 'gold', 'white'];
      this.fish = kinds.slice(0, calm ? 3 : 5).map(k => this.makeFish(k, rand(b.x0, b.x1), rand(b.y0, b.y1)));
      this.flies = []; this.food = []; this.taps = 0; this.dark = 0; this.nightCued = false;
    },
    bounds(){
      const v = view();
      return { x0: Math.max(80, v.x0 + 70), x1: Math.min(820, v.x1 - 70), y0: Math.max(560, v.y0 + 120), y1: Math.min(1480, v.y1 - 230) };
    },
    makeFish(kind, x, y){ return { kind, x, y, a: rand(0, TAU), sp: rand(26, 40), wander: 0, phase: rand(0, 6), len: rand(150, 185), target: null, targetT: 0, leaving: false, alpha: 1 }; },
    persp(y){ return clamp(0.62 + 0.38 * (y - 520) / 900, 0.55, 1.05); },
    progress(p, inStory){
      this.dark = inStory ? smooth(p * 1.1) : 0.5 - 0.5 * Math.cos(TAU * p);   // sunset → night (→ back, when alone)
      if (this.dark > 0.72 && !this.nightCued) { this.nightCued = true; cue('koi_night'); }
      if (this.dark < 0.35) this.nightCued = false;
    },
    update(dt){
      const b = this.bounds(), v = view();
      /* more fireflies as it gets dark */
      const want = Math.round((calm ? 2 : 3) + this.dark * (calm ? 4 : 10));
      if (this.flies.length < want && Math.random() < dt * 0.6) this.flies.push({ x: rand(60, 840), y: rand(Math.max(200, v.y0 + 40), 760), vx: rand(-10, 10), vy: rand(-6, 6), ph: rand(0, 6), a: 0 });
      if (this.flies.length > want && Math.random() < dt * 0.3) this.flies[0].out = true;
      for (const p of this.flies) {
        p.a = clamp(p.a + (p.out ? -dt * 0.4 : dt * 0.4), 0, 1);
        p.vx = clamp(p.vx + rand(-12, 12) * dt, -14, 14); p.vy = clamp(p.vy + rand(-10, 10) * dt, -10, 10);
        p.x += p.vx * dt; p.y += p.vy * dt; p.ph += dt * 1.5;
        if (p.x < 40 || p.x > 860) p.vx *= -1;
        if (p.y < Math.max(180, v.y0 + 30) || p.y > 820) p.vy *= -1;
      }
      this.flies = this.flies.filter(p => !(p.out && p.a <= 0));
      /* fish food floats a little and slowly sinks away */
      for (const f of this.food) { f.age += dt; f.x += Math.sin(f.age * 1.2 + f.ph) * 3 * dt; }
      this.food = this.food.filter(f => f.age < 10 && !f.eaten);
      for (const f of this.fish) {
        let desired = null;
        if (!f.leaving && this.food.length) {
          let best = null, bd = 560;
          for (const p of this.food) { const d = Math.hypot(p.x - f.x, p.y - f.y); if (d < bd) { bd = d; best = p; } }
          if (best) { f.target = best; f.targetT = 0.5; if (bd < 34) { best.eaten = true; addFx({ type: 'ripple', x: best.x, y: best.y, rings: 1, life: 1.6, r0: 10, grow: 40 }); } }
        }
        if (f.target && f.targetT > 0) {
          desired = Math.atan2(f.target.y - f.y, f.target.x - f.x); f.targetT -= dt;
        } else if (!f.leaving && (f.x < b.x0 || f.x > b.x1 || f.y < b.y0 || f.y > b.y1)) {
          desired = Math.atan2((b.y0 + b.y1) / 2 - f.y, (b.x0 + b.x1) / 2 - f.x);
        }

  /* ----- Train: a trip to Malaysia and back ----- */
  const TRAIN_OUT = [
    { c: 'town', far: 'hills', mid: 'town', near: 'grass', wavers: ['cyclist', 'trishaw', 'auntie'] },
    { c: 'padi', far: 'hills', mid: 'padi', near: 'grass', wavers: ['farmer', 'cyclist', 'auntie'] },
    { c: 'rubber', far: 'hills', mid: 'rubber', near: 'grass', wavers: ['farmer', 'auntie', 'cyclist'] },
    { c: 'bridge', far: 'hills', mid: 'river', near: 'bridge', wavers: ['fisher'] },
    { c: 'sea', far: 'sea', mid: 'beach', near: 'grass', wavers: ['fisher', 'auntie'] }

  IMPL.train = {
    SPEED: { far: 8, mid: 40, near: 110 },
    setup(opts){

      const out = TRAIN_OUT.map(x => Object.assign({ home: false }, x)).concat([station(false)]);
      const back = TRAIN_OUT.slice().reverse().map(x => Object.assign({ home: true }, x)).concat([station(true)]);
      this.chapters = this.route === 'out' ? out : this.route === 'home' ? back : out.concat(back);
      this.cycle = this.chapters.length * TRAIN_CHAPTER_S;
      this.scroll = { far: rand(0, 1800), mid: rand(0, 1800), near: rand(0, 1800) };
      this.seg = { mid: [], near: [] };

      this.house = null; this.flocks = []; this.wavers = []; this.taps = 0;

  /* ----- Rain: an afternoon rain at a coffee shop ----- */
  IMPL.rain = {

    onResize(){ this.makeMist(); },

    draw(){

        g.save(); g.beginPath(); g.rect(-200, -200, 1300, 545); g.clip(); g.lineWidth = 22;

    tap(x, y, sx, sy){

  };

  /* ================= LOOP ================= */
  function loop(tms){
    raf = requestAnimationFrame(loop);
    if (paused) return;
    const real = tms - lastT;
    if (real < FRAME_MS - 2) return;
    lastT = tms;
    const rdt = Math.min(0.1, real / 1000), dt = rdt * speed;
    time += dt; sceneTime += rdt;
    const ch = story && story.chapters[story.i];
    const p = ch ? clamp(story.elapsed / ch.dur, 0, 1) : ((sceneTime / (impl.cycle || 600)) % 1);
    if (impl.progress) impl.progress(p, !!ch);
    impl.update(dt); updateFx(dt);
    tickTimers(rdt);
    g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, canvas.width, canvas.height);
    g.setTransform(DPR * s, 0, 0, DPR * s, DPR * ox, DPR * oy);
    impl.draw(); drawFx();
    if (impl.drawScreen) impl.drawScreen();
  }
  function tickTimers(rdt){
    /* The story moves on by itself */
    if (story && !story.busy) {
      story.elapsed += rdt;
      if (story.elapsed >= story.chapters[story.i].dur) nextChapter();
    }
    /* 'Look' moments: gentle, ignorable; frequency adapts inside the level's range */
    if (lookIn !== Infinity) { lookIn -= rdt; if (lookIn <= 0) doLook(); }
    if (lookPending && time - lookPending.at > 12) { lookU = clamp(lookU + 0.15, 0, 1); lookPending = null; }
    /* Gentle remarks, like someone sitting alongside. Never close to another spoken line. */
    if (remarkIn !== Infinity) {
      remarkIn -= rdt;
      if (remarkIn <= 0) {
        if (Date.now() - lastSpokeAt < 25000 || RestCard.isOpen()) remarkIn = 20;
        else { sayRemark(); scheduleRemark(); }
      }
    }
    /* The scene looks after itself */
    autoIn -= rdt;
    if (autoIn <= 0) { impl.auto(); autoIn = rand(8, 16) * (calm ? 1.6 : 1) * (getSetting('ambient') ? 0.7 : 1); }
    /* Session time: a rest card rises, the scene never stops (the story has its own gentle ending) */
    if (session && !story) {
      session.activeMs += rdt * 1000;
      if (session.activeMs >= session.nextRestAt) { if (!RestCard.isOpen()) RestCard.show(); session.nextRestAt += levelCfg().restRepeatMin * 60000; }
    } else if (session) session.activeMs += rdt * 1000;
    /* OLED care: dim static UI after 10 minutes untouched, shift the scene 1-2 px every minute */
    const idle = Date.now() - lastInteract;
    if (idle > BURNIN_IDLE_MS) {
      if (!dimmed) { dimmed = true; document.getElementById('scr-play').classList.add('dimmed'); shiftAt = 0; }
      if (Date.now() - shiftAt > BURNIN_SHIFT_MS) { shiftAt = Date.now(); document.getElementById('scene').style.transform = 'translate(' + pick([-2, -1, 1, 2]) + 'px,' + pick([-2, -1, 1, 2]) + 'px)'; }
    }
  }
  function wakeUI(){
    lastInteract = Date.now();
    if (dimmed) { dimmed = false; document.getElementById('scr-play').classList.remove('dimmed'); document.getElementById('scene').style.transform = ''; }
  }
  function scheduleLook(){
    const L = levelCfg();
    if (!effPrompts() || !L.lookMax) { lookIn = Infinity; return; }
    lookIn = L.lookMin + (L.lookMax - L.lookMin) * clamp(lookU + rand(-0.2, 0.2), 0, 1);
  }
  function scheduleRemark(){ remarkIn = effRemarks() ? rand(REMARK_MIN_S, REMARK_MAX_S) : Infinity; }
  function sayRemark(){
    if (!remarkBag.length) { remarkBag = Array.from({ length: REMARKS_PER_SCENE }, (_, i) => i + 1).sort(() => Math.random() - 0.5); }

  function doLook(){
    if (Date.now() - lastSpokeAt < 8000) { lookIn = 10; return; }

    if (lk) {
      addFx({ type: 'sparkle', follow: lk.follow, life: 10 });
      Sound.sfx('chime');

      lastSpokeAt = Date.now();

  /* ---------- the story: chapters, gentle fades, a quiet ending ---------- */
  function storyChapters(){
    const pace = STORY_PACE[getSetting('level')] || 1;
    return STORY.filter(c => SCENE_AVAILABLE[c.scene]).map(c => Object.assign({ dur: STORY_CHAPTER_MIN * 60 * pace }, c));
  }
  function renderDots(){

    el.hidden = false;
    nb.hidden = false; nb.innerHTML = ICON('next'); nb.setAttribute('aria-label', t('chapter_next')); nb.title = t('chapter_next');
    el.innerHTML = story.chapters.map((c, i) => '<i class="' + (i < story.i ? 'done' : i === story.i ? 'on' : '') + '"></i>').join('');
    el.setAttribute('aria-label', t('story_title'));

  function loadChapter(){
    const c = story.chapters[story.i];
    setupScene(c.scene, { route: c.route, story: true });

    const i = story.i;
    setTimeout(() => { if (story && story.i === i && UI.current === 'play') narrate(c.intro); }, 1600);
  }
  function nextChapter(){
    if (story.i + 1 < story.chapters.length) {

      fadeEl.classList.add('on');
      setTimeout(() => {
        story.i++; story.elapsed = 0;
        loadChapter();
        setTimeout(() => { fadeEl.classList.remove('on'); if (story) story.busy = false; }, 250);
      }, STORY_FADE_MS);
    } else {
      story.busy = true;                                   // the end of the day
      narrate('story_end');
      setTimeout(() => { story = null; renderDots(); if (UI.current === 'play') showScreen('end'); }, 6000);
    }
  }

  /* ---------- session log (no scores, ever) ---------- */
  function startSession(){ session = { startedAt: Date.now(), activeMs: 0, nextRestAt: effSessionMinutes() * 60000 }; }
  function logSession(mood){
    if (!session) return;
    const list = Store.get(gameKey('sessions'), []);
    list.push({ date: new Date(session.startedAt).toISOString(), minutes: Math.round(session.activeMs / 6000) / 10, mood: mood || null, endedEarly: session.activeMs < effSessionMinutes() * 60000 });
    while (list.length > 200) list.shift();
    Store.set(gameKey('sessions'), list);
    session = null;
  }

  /* ---------- sound for the current scene ---------- */
  function applySound(){
    if (!UI.audioUnlocked || !sceneId) return;
    const mode = effSound();
    Sound.setMusicScale(0.55);
    if (mode === 'off') { Sound.stopTheme(800); Sound.playCustom(false); Sound.stopNature(800); return; }
    Sound.startNature(sceneId);
    if (mode === 'music' && !getSetting('ambient')) {
      if (Sound.hasCustom()) { Sound.stopTheme(800); Sound.playCustom(true); }
      else { Sound.playCustom(false); Sound.startTheme(); }
    } else { Sound.stopTheme(1200); Sound.playCustom(false); }
  }

  /* ---------- thumbnails for the scene picker ---------- */

  /* ---------- scene set-up (used by single scenes and by each story chapter) ---------- */
  function setupScene(id, opts){
    if (!SCENE_AVAILABLE[id] || !IMPL[id]) id = SCENES.find(x => SCENE_AVAILABLE[x]);
    sceneId = id; impl = IMPL[id];
    const ill = CONTENT_ILLUSTRATIONS.scenes[id];
    document.getElementById('sceneBg').src = illustrationSrc(ill.bg);
    document.getElementById('sceneSide').src = illustrationSrc(ill.bg);   // blurred at the sides when the phone is sideways
    const fg = document.getElementById('sceneFg');
    if (ill.fg) { fg.src = illustrationSrc(ill.fg); fg.hidden = false; } else { fg.hidden = true; fg.removeAttribute('src'); }
    document.getElementById('sceneFrame').classList.toggle('hide', !!ill.ownFrame);
    const obj = CONTENT_ILLUSTRATIONS.objects[SILL_OBJECT[id]];
    const sill = document.getElementById('sillObj');
    if (obj) { sill.src = illustrationSrc(obj); sill.hidden = false; } else sill.hidden = true;
    calm = effIntensity() === 'calm';
    speed = effSpeed() * (calm ? 0.8 : 1);
    fx = []; time = 0; sceneTime = 0; resize(); impl.setup(opts || {});
    lookPending = null; lookU = 0.5; scheduleLook(); autoIn = rand(5, 9);
    remarkBag = []; lastSpokeAt = Date.now(); scheduleRemark();
    Sound.setNatureLevel(1);
  }

  /* ---------- public ---------- */
  function init(){
    canvas = document.getElementById('sceneCanvas'); g = canvas.getContext('2d');
    glowSprite = makeGlow(); dropSprite = makeDrop();
    const local = e => { const r = canvas.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
    canvas.addEventListener('pointerdown', e => { dragging = true; const [x, y] = local(e); doTap(x, y, false); });
    canvas.addEventListener('pointermove', e => { if (!dragging || paused || !impl || !impl.drag) return; const [x, y] = local(e); impl.drag((x - ox) / s, (y - oy) / s, x, y); lastInteract = Date.now(); });
    ['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => canvas.addEventListener(ev, () => { dragging = false; }));
    document.getElementById('scr-play').addEventListener('pointerdown', wakeUI, true);
    window.addEventListener('resize', () => { if (UI.current === 'play') resize(); });
    Bus.on('hidden', () => { if (!paused) { pause(); resumeOnShow = true; } });
    Bus.on('visible', () => { if (resumeOnShow && UI.current === 'play') { resumeOnShow = false; resume(); } });
    const jobs = [];
    Object.entries(CONTENT_ILLUSTRATIONS.scenes).forEach(([id, ill]) => {
      jobs.push(load(id + '.bg', ill.bg));
      if (ill.fg) jobs.push(load(id + '.fg', ill.fg));
      Object.entries(ill.sprites || {}).forEach(([k, v]) => jobs.push(load(id + '.' + k, v)));
      Object.entries(ill.strips || {}).forEach(([k, st]) => jobs.push(load(id + '.strip.' + k, st.src)));
    });
    Promise.all(jobs).then(() => {
      SCENES.forEach(id => { const u = paintThumb(id); if (u) thumbs[id] = u; });
      if (UI.current === 'scenes') renderScenes();
    });
  }
  function enter(id){
    document.getElementById('fade').classList.remove('on');
    if (id === 'story') {
      story = { i: 0, elapsed: 0, chapters: storyChapters(), busy: false };
      setupScene(story.chapters[0].scene, { route: story.chapters[0].route, story: true });
    } else { story = null; setupScene(id, {}); }
    renderDots();
    document.getElementById('restBtn').innerHTML = btnHTML('moon', t('btn_rest'));
    document.getElementById('helpBtn').setAttribute('aria-label', t('btn_help'));
    if (!session) startSession();
    touched = false; wakeUI();
    setState('lastScene', id);
    resume();
    if (story) { const c = story.chapters[0]; setTimeout(() => { if (story && story.i === 0 && UI.current === 'play') narrate(c.intro); }, 1500); }
    else if (!getSetting('ambient') && levelCfg().prompts) setTimeout(() => { if (UI.current === 'play' && sceneId === id && !touched) { lastSpokeAt = Date.now(); Speech.speak(t('play_touch')); } }, 1500);
  }
  function pause(){ paused = true; dragging = false; cancelAnimationFrame(raf); raf = 0; Ghost.cancel(); }
  function resume(){
    if (!impl) return;
    if (!session) startSession();
    paused = false; lastT = performance.now();
    cancelAnimationFrame(raf); raf = requestAnimationFrame(loop);
    Wake.request(); applySound(); armGhost(); wakeUI();
    document.getElementById('restBtn').innerHTML = btnHTML('moon', t('btn_rest'));
  }
  return {
    init, enter, pause, resume, applySound,
    endSession(mood){ story = null; renderDots(); logSession(mood); },
    saveOnHide(){ if (session && session.activeMs > 60000) logSession(null); },
    onSettingsChanged(){ if (!impl) return; calm = effIntensity() === 'calm'; speed = effSpeed() * (calm ? 0.8 : 1); applySound(); },
    thumb(id){ if (id === 'story') id = 'train'; return thumbs[id] || illustrationSrc((CONTENT_ILLUSTRATIONS.scenes[id] || {}).bg); },
    isPaused(){ return paused; },
    /* "Next chapter": move on through the story without ending it */
    skipChapter(){ if (story && !story.busy && UI.current === 'play') { Speech.stop(); nextChapter(); } },
    inStory(){ return !!story; }
  };
})();
