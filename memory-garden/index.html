/* ==== SECTION: STYLES ==== */
/* MOO Dementia Games kit v1 (DGS_KIT_VERSION). Part 1 is identical in every game except the palette
   values; part 2 is the shared components (kit bundle.css); part 3 is Memory Garden only. */

/* ---------- 1. Tokens: Memory Garden palette ---------- */
:root{
  --bg:#fbf4ec; --surface:#fffdfb; --surface-sunk:#f6e9ee; --text:#2e1c24; --text-muted:#5a4350;
  --primary:#8e3b5e; --primary-ink:#7d3352; --primary-strong:#6b2040; --primary-soft:#f6e3ea; --on-primary:#ffffff;
  --accent:#3f7a3c; --accent-soft:#e4efe0; --border:#9c8590; --divider:#ecdde3; --focus-ring:#8e3b5e;
  --art-ink:#3a2f2a;
  --space-1:8px; --space-2:12px; --space-3:16px; --space-4:24px; --space-5:32px; --space-6:48px;
  --radius-sm:12px; --radius-md:20px; --radius-lg:28px; --radius-pill:999px;
  --tap-min:72px; --tap-play:104px; --icon:32px; --icon-lg:44px; --content-max:560px;
  --shadow-card:0 1px 2px rgba(0,0,0,.06),0 6px 18px rgba(0,0,0,.07);
  --shadow-lift:0 2px 4px rgba(0,0,0,.08),0 12px 28px rgba(0,0,0,.10);
  --font-sans:"PingFang SC","Noto Sans SC","Microsoft YaHei","Hiragino Sans GB",system-ui,-apple-system,"Segoe UI",sans-serif;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px); --safe-r:env(safe-area-inset-right,0px);
  /* Memory Garden game-screen names (mapped to the kit tokens) */
  --font:var(--font-sans); --text-inverse:#ffffff; --shadow-sm:var(--shadow-card); --shadow-md:var(--shadow-card); --shadow-lg:var(--shadow-lift);
  --touch-min:var(--tap-min); --sage:#e4efe0; --blush:#f6e3ea; --sun:#ffe9b8; --ease:cubic-bezier(.4,0,.2,1); --dur:.3s;
}
@media (min-width:700px) and (min-height:560px){ :root{ --tap-min:88px; } }
html.hc{
  --bg:#ffffff; --surface:#ffffff; --surface-sunk:#f0f0f0; --text:#1a0a10; --text-muted:#3a1f2b;
  --primary:#6b2040; --primary-ink:#6b2040; --primary-strong:#4a1029; --primary-soft:#f2dce6;
  --accent:#1f5a1d; --accent-soft:#e0ecdc; --border:#000000; --divider:#5c5c5c; --focus-ring:#000000; --sun:#ffffff;
}
html{ font-size:22px; }
@media (min-width:700px){ html{ font-size:26px; } }

/* ==== MOO Dementia Games kit v1: shared components (identical in every game) ==== */
/* ---------- 2. Shared components (kit) ---------- */
*,*::before,*::after{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{
  margin:0; height:100%; background:var(--bg); color:var(--text);
  font-family:var(--font-sans); font-size:22px; line-height:1.55;
  overscroll-behavior:none; overflow:hidden;
  -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
  touch-action:manipulation; -webkit-text-size-adjust:100%;
}
img,svg{ -webkit-user-drag:none; user-select:none; }
[hidden]{ display:none !important; }
h1,h2,h3,h4,p{ margin:0; }
button{ font:inherit; color:inherit; }
.dgs-icon{ width:var(--icon); height:var(--icon); flex:none; display:block; }

.screen{
  position:fixed; inset:0; display:flex; flex-direction:column; gap:var(--space-3);
  background:var(--bg);
  padding:calc(var(--safe-t) + 12px) calc(var(--safe-r) + 16px) calc(var(--safe-b) + 12px) calc(var(--safe-l) + 16px);
}
.screen > .col{ width:100%; max-width:var(--content-max); margin:0 auto; display:flex; flex-direction:column; gap:var(--space-3); min-height:0; flex:1 1 auto; }
.dgs-topbar{ display:flex; align-items:center; justify-content:space-between; gap:var(--space-2); flex:0 0 auto; min-height:60px; }
.dgs-topbar .grow{ flex:1; }
.scroll{ overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain; touch-action:pan-y; flex:1 1 auto; min-height:0; margin:0 -16px; padding:4px 16px 40px; }
.scroll::-webkit-scrollbar{ width:0; }
.scroll > .col{ max-width:var(--content-max); margin:0 auto; display:flex; flex-direction:column; gap:var(--space-3); }

/* Buttons */
.dgs-btn{
  appearance:none; border:0; margin:0; cursor:pointer;
  display:flex; align-items:center; justify-content:center; gap:var(--space-2);
  min-height:var(--tap-min); width:100%; padding:0 var(--space-4);
  border-radius:var(--radius-lg); font-size:26px; line-height:32px; font-weight:700; letter-spacing:.01em; text-align:center;
  transition:transform .12s ease, box-shadow .12s ease; touch-action:manipulation;
}
.dgs-btn:focus-visible,.dgs-guide:focus-visible,.dgs-round:focus-visible,.dgs-lang button:focus-visible,.dgs-hold:focus-visible,.dgs-level:focus-visible,.dgs-mood:focus-visible,.dgs-seg button:focus-visible,.dgs-switch:focus-visible{ outline:3px solid var(--focus-ring); outline-offset:3px; }
.dgs-btn:active{ transform:scale(.96); }
/* Every button gives a smooth, slight press so a tap clearly registers */
.dgs-round,.dgs-guide,.dgs-level,.dgs-hold,.dgs-mood,.dgs-seg button,.dgs-lang button{ transition:transform .12s ease, box-shadow .12s ease, background-color .12s ease; }
.dgs-round:active,.dgs-guide:active,.dgs-level:active,.dgs-hold:active,.dgs-mood:active,.dgs-seg button:active,.dgs-lang button:active{ transform:scale(.96); }
@media (prefers-reduced-motion:reduce){
  .dgs-btn:active,.dgs-round:active,.dgs-guide:active,.dgs-level:active,.dgs-hold:active,.dgs-mood:active,.dgs-seg button:active,.dgs-lang button:active{ transform:none; filter:brightness(.92); }
}
.dgs-btn--primary{ background:var(--primary); color:var(--on-primary); box-shadow:0 4px 0 var(--primary-strong); }
.dgs-btn--primary:active{ box-shadow:0 2px 0 var(--primary-strong); }
.dgs-btn--secondary{ background:var(--surface); color:var(--text); box-shadow:inset 0 0 0 2px var(--border),var(--shadow-card); }
.dgs-btn--quiet{ background:transparent; color:var(--primary-ink); min-height:56px; font-size:20px; font-weight:600; text-decoration:underline; text-underline-offset:5px; }
.dgs-btn--small{ min-height:64px; font-size:21px; }
.dgs-btn--play{ min-height:var(--tap-play); font-size:34px; line-height:40px; font-weight:800; box-shadow:0 5px 0 var(--primary-strong),var(--shadow-lift); }
.dgs-btn__disc{ width:56px; height:56px; border-radius:50%; background:var(--on-primary); color:var(--primary); display:grid; place-items:center; flex:none; }
.dgs-btn__disc .dgs-icon{ width:28px; height:28px; margin-left:4px; }

/* Language switch and round buttons */
.dgs-lang{ display:inline-flex; padding:4px; border-radius:var(--radius-pill); background:var(--surface-sunk); box-shadow:inset 0 0 0 1.5px var(--divider); }
.dgs-lang button{ appearance:none; border:0; cursor:pointer; min-height:52px; min-width:76px; padding:0 18px; border-radius:var(--radius-pill); background:transparent; color:var(--text); font-size:20px; font-weight:600; }
.dgs-lang button[aria-pressed="true"]{ background:var(--surface); color:var(--primary-ink); font-weight:800; box-shadow:inset 0 0 0 2.5px var(--primary),var(--shadow-card); }
.dgs-round{ appearance:none; border:0; cursor:pointer; width:60px; height:60px; flex:none; border-radius:50%; display:grid; place-items:center; background:var(--surface); color:var(--text); box-shadow:inset 0 0 0 2px var(--border),var(--shadow-card); }
.dgs-round .dgs-icon{ width:30px; height:30px; }
.dgs-back{ appearance:none; border:0; cursor:pointer; display:inline-flex; align-items:center; gap:8px; min-height:60px; padding:0 18px 0 12px; border-radius:var(--radius-pill); background:var(--surface); color:var(--text); font-size:20px; font-weight:700; box-shadow:inset 0 0 0 2px var(--border),var(--shadow-card); }
.dgs-back .dgs-icon{ width:26px; height:26px; }
#muteBtn{ position:fixed; z-index:75; top:calc(var(--safe-t) + 12px); right:calc(var(--safe-r) + 16px); }

/* Titles and text */
.dgs-title{ margin:0; text-align:center; font-size:40px; line-height:48px; font-weight:800; color:var(--text); text-wrap:balance; }
.dgs-title small{ display:block; font-size:20px; line-height:28px; font-weight:600; color:var(--text-muted); letter-spacing:.02em; margin-top:2px; }
.dgs-screen-title{ margin:0; text-align:center; font-size:30px; line-height:40px; font-weight:700; text-wrap:balance; }
.dgs-caption{ margin:0; text-align:center; font-size:28px; line-height:40px; font-weight:600; text-wrap:balance; }
.key{ font-style:normal; color:var(--primary); font-weight:800; text-decoration:underline; text-decoration-thickness:3px; text-underline-offset:6px; text-decoration-color:var(--accent); }
.dgs-footnote{ margin:0; text-align:center; font-size:18px; line-height:27px; color:var(--text-muted); }
.note{ font-size:18px; line-height:27px; color:var(--text-muted); margin:0; }

/* Picture frame */
.dgs-art{ border-radius:var(--radius-md); background:var(--surface); box-shadow:var(--shadow-card); overflow:hidden; display:block; }
.dgs-art img,.dgs-art svg{ width:100%; height:100%; display:block; object-fit:cover; }

/* Guide buttons */
.dgs-guides{ display:grid; grid-template-columns:1fr 1fr; gap:var(--space-2); }
.dgs-guide{ appearance:none; border:0; cursor:pointer; min-height:104px; padding:var(--space-2); border-radius:var(--radius-lg); background:var(--surface); color:var(--text); box-shadow:inset 0 0 0 2px var(--border),var(--shadow-card); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; font-size:21px; line-height:26px; font-weight:700; text-align:center; }
.dgs-guide .dgs-icon{ width:var(--icon-lg); height:var(--icon-lg); color:var(--primary); }

/* Dots */
.dgs-dots{ display:flex; justify-content:center; gap:10px; }
.dgs-dots i{ width:12px; height:12px; border-radius:50%; background:var(--divider); display:block; }
.dgs-dots i.on{ background:var(--primary); width:32px; border-radius:var(--radius-pill); }

/* Quote (kit Quote): caregiver page top, and the player's Rest screen */
.dgs-quote{ margin:0; padding:18px 20px 16px; border-radius:var(--radius-md); background:var(--accent-soft); display:flex; flex-direction:column; gap:10px; }
.dgs-quote blockquote{ margin:0; font-size:19px; line-height:30px; font-weight:500; color:var(--text); }
.dgs-quote blockquote::before{ content:"“"; } .dgs-quote blockquote::after{ content:"”"; }
html[lang="zh-CN"] .dgs-quote blockquote::before{ content:"“"; }
.dgs-quote figcaption{ font-size:16px; line-height:22px; color:var(--text-muted); }
.dgs-quote cite{ font-style:italic; }
.dgs-quote.tip small{ font-size:15px; line-height:20px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:var(--primary-ink); }
.dgs-quote.tip p{ margin:0; font-size:19px; line-height:30px; font-weight:600; }
.dgs-quote.player{ background:transparent; padding:0 4px; text-align:center; }
.dgs-quote.player blockquote{ font-size:24px; line-height:34px; }
/* Caregiver page */
.dgs-kind{ display:grid; grid-template-columns:auto 1fr; gap:14px; align-items:center; padding:18px 20px; border-radius:var(--radius-md); background:var(--accent-soft); }
.dgs-kind .dgs-icon{ width:40px; height:40px; color:var(--primary); }
.dgs-kind small{ display:block; font-size:16px; line-height:22px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:var(--primary-ink); }
.dgs-kind b{ display:block; font-size:22px; line-height:31px; font-weight:700; }
.dgs-disclaimer{ margin:0; padding:var(--space-3) var(--space-4); border-radius:var(--radius-md); background:var(--surface-sunk); font-size:19px; line-height:28px; font-weight:600; }
.dgs-quick{ display:grid; grid-template-columns:repeat(3,1fr); gap:var(--space-2); padding:var(--space-3); border-radius:var(--radius-md); background:var(--surface); box-shadow:var(--shadow-card); }
.dgs-quick > div{ display:flex; flex-direction:column; align-items:center; gap:8px; text-align:center; }
.dgs-quick__icon{ width:64px; height:64px; border-radius:50%; background:var(--primary-soft); color:var(--primary); display:grid; place-items:center; }
.dgs-quick b{ font-size:19px; line-height:25px; font-weight:700; }
.dgs-quick span.other{ font-size:16px; line-height:21px; color:var(--text-muted); }
.dgs-section{ border-radius:var(--radius-md); background:var(--surface); box-shadow:var(--shadow-card); overflow:hidden; }
.dgs-section > summary{ list-style:none; cursor:pointer; display:flex; align-items:center; gap:var(--space-2); min-height:var(--tap-min); padding:var(--space-2) var(--space-4); font-size:24px; line-height:32px; font-weight:700; }
.dgs-section > summary::-webkit-details-marker{ display:none; }
.dgs-section > summary .dgs-icon{ color:var(--primary); }
.dgs-section > summary::after{ content:""; margin-left:auto; flex:none; width:14px; height:14px; border-right:3px solid var(--text); border-bottom:3px solid var(--text); transform:rotate(45deg) translate(-3px,-3px); transition:transform .2s; }
.dgs-section[open] > summary::after{ transform:rotate(-135deg) translate(-3px,-3px); }
.dgs-section > summary:focus-visible{ outline:3px solid var(--focus-ring); outline-offset:-3px; }
.dgs-section__body{ padding:0 var(--space-4) var(--space-4); font-size:19px; line-height:30px; display:flex; flex-direction:column; gap:12px; }
.dgs-section__body h4{ margin:8px 0 0; font-size:19px; line-height:26px; color:var(--primary-ink); }
.dgs-section__body ul{ margin:0; padding-left:1.1em; }
.dgs-section__body li{ margin:4px 0; }
.dgs-bda{ display:grid; gap:10px; }
.dgs-bda div{ padding:12px 16px; border-radius:var(--radius-sm); background:var(--surface-sunk); }
.dgs-bda b{ display:block; color:var(--primary-ink); font-size:16px; letter-spacing:.05em; text-transform:uppercase; }
.dgs-part{ display:grid; gap:4px; padding:14px 16px; border-radius:var(--radius-sm); background:var(--surface-sunk); }
.dgs-part b{ font-size:20px; line-height:27px; }
.dgs-part p{ margin:0; font-size:18px; line-height:27px; }
.dgs-part .why{ display:grid; grid-template-columns:auto 1fr; gap:8px; align-items:start; margin-top:4px; padding-top:8px; border-top:1.5px solid var(--divider); }
.dgs-part .why .dgs-icon{ width:22px; height:22px; color:var(--primary); margin-top:3px; }
.dgs-part .why em{ font-style:normal; font-weight:700; color:var(--primary-ink); }
.dgs-sub{ font-size:17px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:var(--primary-ink); margin:6px 4px 0; }
.dgs-card{ padding:18px 20px; border-radius:var(--radius-md); background:var(--surface); box-shadow:var(--shadow-card); display:flex; flex-direction:column; gap:10px; }
.dgs-card h3{ font-size:22px; line-height:30px; }

/* Level picker */
.dgs-levels{ display:grid; gap:var(--space-2); }
.dgs-level{ appearance:none; border:0; cursor:pointer; text-align:left; display:grid; grid-template-columns:36px 1fr; gap:4px 14px; align-items:center; min-height:var(--tap-min); padding:14px 18px; border-radius:var(--radius-md); background:var(--surface); color:var(--text); box-shadow:inset 0 0 0 2px var(--border); }
.dgs-level b{ grid-column:2; font-size:22px; line-height:28px; }
.dgs-level > span:not(.dgs-radio){ grid-column:2; font-size:17px; line-height:24px; color:var(--text-muted); }
.dgs-level .dgs-radio{ grid-column:1; grid-row:1/3; width:30px; height:30px; border-radius:50%; box-shadow:inset 0 0 0 2.5px var(--border); display:grid; place-items:center; }
.dgs-level[aria-checked="true"]{ background:var(--primary-soft); box-shadow:inset 0 0 0 3px var(--primary); }
.dgs-level[aria-checked="true"] b{ color:var(--primary-ink); }
.dgs-level[aria-checked="true"] .dgs-radio{ box-shadow:inset 0 0 0 2.5px var(--primary); }
.dgs-level[aria-checked="true"] .dgs-radio::after{ content:""; width:16px; height:16px; border-radius:50%; background:var(--primary); }

/* Hold button */
.dgs-hold{ appearance:none; border:0; cursor:pointer; width:100%; display:flex; align-items:center; gap:var(--space-3); min-height:88px; padding:12px 20px; border-radius:var(--radius-lg); background:var(--surface); color:var(--text); box-shadow:inset 0 0 0 2px var(--border),var(--shadow-card); text-align:left; touch-action:none; }
.dgs-hold__ring{ --p:0; flex:none; width:60px; height:60px; border-radius:50%; display:grid; place-items:center; background:conic-gradient(var(--accent) calc(var(--p) * 1turn), var(--surface-sunk) 0); }
.dgs-hold__ring > span{ width:46px; height:46px; border-radius:50%; background:var(--surface); display:grid; place-items:center; }
.dgs-hold__ring .dgs-icon{ width:26px; height:26px; }
.dgs-hold b{ display:block; font-size:22px; line-height:28px; }
.dgs-hold small{ display:block; font-size:17px; line-height:22px; color:var(--text-muted); }

/* Settings */
.dgs-group{ display:flex; flex-direction:column; gap:6px; scroll-margin-top:12px; }
.dgs-group > h3{ margin:0 4px 4px; font-size:17px; line-height:22px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:var(--primary-ink); display:flex; align-items:center; gap:8px; }
.dgs-group > h3 .dgs-icon{ width:22px; height:22px; }
.dgs-group__rows{ border-radius:var(--radius-md); background:var(--surface); box-shadow:var(--shadow-card); }
.dgs-row{ display:grid; grid-template-columns:1fr auto; align-items:center; gap:8px 16px; padding:16px 20px; min-height:var(--tap-min); border-top:1.5px solid var(--divider); scroll-margin-top:12px; }
.dgs-row:first-child{ border-top:0; }
.dgs-row > .lbl,.dgs-row > label{ font-size:19px; line-height:26px; font-weight:600; min-width:0; }
.dgs-row > .note,.dgs-row > p{ grid-column:1 / -1; }
.dgs-row--stack{ grid-template-columns:1fr; }
.dgs-row--stack > *{ grid-column:1 / -1; }
.dgs-switch{ appearance:none; margin:0; cursor:pointer; width:68px; height:40px; border-radius:var(--radius-pill); background:var(--surface-sunk); box-shadow:inset 0 0 0 2px var(--border); position:relative; border:0; flex:none; transition:background-color .15s; }
.dgs-switch::after{ content:""; position:absolute; top:5px; left:5px; width:30px; height:30px; border-radius:50%; background:var(--surface); box-shadow:0 0 0 2px var(--border); transition:transform .15s; }
.dgs-switch[aria-checked="true"]{ background:var(--primary); box-shadow:none; }
.dgs-switch[aria-checked="true"]::after{ transform:translateX(28px); box-shadow:none; }
.dgs-seg{ display:flex; flex-wrap:wrap; padding:4px; border-radius:var(--radius-sm); background:var(--surface-sunk); gap:4px; }
.dgs-seg button{ appearance:none; border:0; cursor:pointer; flex:1 1 0; min-width:64px; min-height:52px; border-radius:9px; background:transparent; color:var(--text); font-size:18px; font-weight:600; padding:4px 10px; line-height:1.25; }
.dgs-seg.many{ display:grid; grid-template-columns:repeat(auto-fit,minmax(118px,1fr)); }
.dgs-seg.many.short{ grid-template-columns:repeat(4,1fr); }
.dgs-seg button[aria-pressed="true"]{ background:var(--surface); color:var(--primary-ink); font-weight:800; box-shadow:inset 0 0 0 2.5px var(--primary); }
input[type=range]{ -webkit-appearance:none; appearance:none; width:100%; height:48px; background:transparent; margin:0; touch-action:none; }
input[type=range]::-webkit-slider-runnable-track{ height:10px; border-radius:999px; background:var(--surface-sunk); box-shadow:inset 0 0 0 1.5px var(--border); }
input[type=range]::-webkit-slider-thumb{ -webkit-appearance:none; width:36px; height:36px; margin-top:-13px; border-radius:50%; background:var(--primary); border:4px solid var(--surface); box-shadow:0 0 0 2px var(--primary); }
input[type=range]::-moz-range-track{ height:10px; border-radius:999px; background:var(--surface-sunk); }
input[type=range]::-moz-range-thumb{ width:30px; height:30px; border-radius:50%; background:var(--primary); border:4px solid var(--surface); }
.dgs-progress{ height:12px; border-radius:999px; background:var(--surface-sunk); overflow:hidden; }
.dgs-progress i{ display:block; height:100%; background:var(--primary); border-radius:inherit; transition:width .4s ease; }
.dgs-checklist{ list-style:none; padding:0; margin:0; display:grid; gap:6px; }
.dgs-check{ appearance:none; border:0; background:transparent; cursor:pointer; width:100%; display:flex; align-items:center; gap:12px; min-height:56px; padding:4px 0; text-align:left; font-size:19px; color:var(--text); }
.dgs-tick{ width:30px; height:30px; border-radius:8px; box-shadow:inset 0 0 0 2px var(--border); display:grid; place-items:center; flex:none; }
.dgs-tick .dgs-icon{ width:20px; height:20px; }
.dgs-check.is-done .dgs-tick{ background:var(--primary); color:var(--on-primary); box-shadow:none; }
.dgs-check.is-done span:last-child{ color:var(--text-muted); text-decoration:line-through; }

/* Notice */
.dgs-notice{ display:grid; grid-template-columns:auto 1fr; gap:12px; align-items:start; padding:14px 18px; border-radius:var(--radius-md); background:var(--accent-soft); font-size:18px; line-height:27px; }
.dgs-notice .dgs-icon{ width:28px; height:28px; }
.dgs-notice b{ display:block; }

/* Mood faces */
.dgs-moods{ display:grid; grid-template-columns:repeat(3,1fr); gap:var(--space-2); width:100%; }
.dgs-mood{ appearance:none; border:0; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:6px; padding:12px 4px; min-height:var(--tap-min); border-radius:var(--radius-md); background:var(--surface); color:var(--text); box-shadow:inset 0 0 0 2px var(--border); }
.dgs-mood svg{ width:min(18vw,72px); height:min(18vw,72px); }
.dgs-mood b{ font-size:22px; line-height:26px; }
.dgs-mood span{ font-size:16px; line-height:20px; color:var(--text-muted); }
.dgs-moods.small .dgs-mood svg{ width:52px; height:52px; }
.dgs-moods.small .dgs-mood b{ font-size:19px; }

/* Rest card */
#restCard{ position:fixed; z-index:45; left:50%; bottom:calc(var(--safe-b) + 24px); width:min(94vw,520px); transform:translate(-50%,140%); opacity:0;
  display:flex; flex-direction:column; gap:var(--space-2); padding:var(--space-4); border-radius:var(--radius-lg) var(--radius-lg) var(--radius-md) var(--radius-md); background:var(--surface); box-shadow:var(--shadow-lift); transition:transform .9s ease, opacity 1.2s ease; }
#restCard.show{ transform:translate(-50%,0); opacity:1; }
#restCard h3{ text-align:center; font-size:26px; line-height:34px; }
#restCard .row{ display:grid; grid-template-columns:1fr 1fr; gap:var(--space-2); }

/* Dialog (never alert()) and toast */
#dialog{ position:fixed; inset:0; z-index:80; background:rgba(0,0,0,.45); display:flex; align-items:center; justify-content:center; padding:16px; }
#dialog .box{ background:var(--surface); border-radius:var(--radius-lg); padding:var(--space-4); width:min(100%,480px); max-height:90vh; overflow:auto; display:flex; flex-direction:column; gap:var(--space-3); text-align:center; box-shadow:var(--shadow-lift); }
#dialog .box h3{ font-size:28px; line-height:36px; }
#dialog .box p,#dialog .box li{ font-size:19px; line-height:28px; text-align:left; }
#dialog .box ul{ margin:0; padding-left:1.1em; }
#dialog .btns{ display:flex; flex-direction:column; gap:var(--space-2); }
.dgs-btn--plain{ background:var(--surface); color:var(--text); box-shadow:inset 0 0 0 2px var(--border); min-height:64px; font-size:20px; font-weight:600; }
#toast{ position:fixed; z-index:90; left:50%; top:calc(var(--safe-t) + 90px); transform:translateX(-50%); background:var(--text); color:var(--surface); border-radius:var(--radius-sm); padding:12px 20px; font-size:18px; font-weight:700; opacity:0; transition:opacity .4s; pointer-events:none; max-width:90vw; text-align:center; }
#toast.show{ opacity:1; }

/* Ghost hand */
#ghost{ position:fixed; z-index:50; left:0; top:0; width:84px; height:84px; pointer-events:none; opacity:0; transition:opacity .5s ease; }
#ghost.show{ opacity:.95; }
#ghost svg{ width:100%; height:100%; filter:drop-shadow(0 4px 8px rgba(0,0,0,.22)); }
#ghostTarget{ position:fixed; z-index:49; width:110px; height:110px; margin:-55px 0 0 -55px; border-radius:50%; border:5px solid var(--accent); box-shadow:0 0 0 8px var(--accent-soft); pointer-events:none; opacity:0; }
#ghostTarget.show{ opacity:1; animation:pulse 2.4s ease-in-out infinite; }
@keyframes pulse{ 0%,100%{ transform:scale(.88); opacity:.6; } 50%{ transform:scale(1.04); opacity:1; } }

/* Captions (every spoken line is shown) */
#caption{
  position:fixed; z-index:40; left:16px; right:16px; margin:0 auto; width:fit-content; transform:translateY(12px); bottom:calc(var(--safe-b) + 130px);
  max-width:min(calc(100vw - 32px),640px); background:var(--surface); color:var(--text);
  border-radius:var(--radius-md); padding:12px 22px; font-size:28px; font-weight:600; text-align:center; line-height:1.4;
  box-shadow:var(--shadow-lift); opacity:0; pointer-events:none; transition:opacity .6s ease, transform .6s ease;
}
#caption.show{ opacity:1; transform:none; }


/* Hero picture on start / end / rest */
.dgs-hero{ flex:1 1 auto; min-height:100px; display:flex; justify-content:center; align-items:center; }
.dgs-hero > .dgs-art{ height:100%; max-height:40vh; aspect-ratio:var(--hero-ratio,1/1); max-width:100%; }
.dgs-col{ width:100%; max-width:var(--content-max); margin:0 auto; display:flex; flex-direction:column; gap:var(--space-3); min-height:0; flex:1 1 auto; }
.dgs-center{ justify-content:center; }
.dgs-btns{ display:flex; flex-direction:column; gap:var(--space-2); }
@media (max-height:640px){ .dgs-title{ font-size:34px; line-height:40px; } .dgs-btn--play{ min-height:88px; } }
@media (prefers-reduced-motion:reduce){ *,*::before,*::after{ animation-duration:.001s !important; animation-iteration-count:1 !important; transition-duration:.001s !important; } }

/* Memory Garden: garden, recall card, fact form and pop-up (kept from v6, on kit tokens) */
*,
*::before,
*::after{box-sizing:border-box}
@keyframes gentlePulse{
  0%,100%{box-shadow:0 8px 32px rgba(157,60,99,.22)}
  50%{box-shadow:0 8px 44px rgba(157,60,99,.34)}
}
.footer-row{display:flex;gap:.75rem}
.footer-row .btn{flex:1}
.caregiver-actions{display:flex;flex-direction:column;gap:.6rem;margin-top:.75rem}
#settings-title{font-size:1.35rem;color:var(--primary);margin:.25rem 0 1rem}
#screen-game{padding:0;overflow:hidden}
.game-topbar{
  position:absolute;top:calc(.6rem + env(safe-area-inset-top));left:.6rem;right:.6rem;
  display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;z-index:10;
}
.game-topbar>*{pointer-events:auto}
.garden-container{flex:1;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;min-height:0}
.garden-container>svg{position:absolute;inset:0;width:100%;height:100%}
@keyframes demoGlow{
  0%,100%{box-shadow:0 4px 20px rgba(107,163,104,.3);border-color:var(--accent)}
  50%{box-shadow:0 6px 30px rgba(107,163,104,.55);border-color:var(--accent)}
}
@keyframes seedBreathe{
  0%,100%{box-shadow:0 4px 20px rgba(157,60,99,.10)}
  50%{box-shadow:0 6px 28px rgba(157,60,99,.20)}
}
.flower-slot{position:absolute;pointer-events:none;transition:opacity .6s var(--ease),transform .6s var(--ease)}
.flower-slot svg{width:100%;height:100%;display:block}
.flower-slot.growing{animation:flowerGrow 1.2s var(--ease) forwards}
@keyframes flowerGrow{
  0%{transform:scale(.1);opacity:0}
  60%{transform:scale(1.08);opacity:1}
  100%{transform:scale(1);opacity:1}
}
.recall-overlay{
  position:absolute;inset:0;background:linear-gradient(to bottom,rgba(253,241,244,.65),rgba(253,241,244,.95));
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:1.5rem;gap:1rem;z-index:20;opacity:0;pointer-events:none;transition:opacity .5s var(--ease);
}
.recall-overlay.show{opacity:1;pointer-events:auto}
.recall-card{
  background:var(--surface);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);
  padding:1.25rem;max-width:420px;width:100%;display:flex;flex-direction:column;
  align-items:center;gap:.9rem;border:2px solid var(--border);
}
.recall-img{
  width:100%;aspect-ratio:1;max-height:280px;border-radius:var(--radius-md);
  background:var(--bg);display:flex;align-items:center;justify-content:center;
  overflow:hidden;font-size:4rem;
}
.recall-img img{width:100%;height:100%;object-fit:cover}
.recall-lead{font-size:1.15rem;color:var(--text-muted);text-align:center;margin:0;line-height:1.4}
.recall-lead .kw{color:var(--primary);font-weight:800;font-size:1.25em}
.recall-answer{
  font-size:1.5rem;font-weight:800;color:var(--primary);text-align:center;margin:0;line-height:1.3;
  opacity:0;transform:translateY(6px);transition:opacity .6s var(--ease),transform .6s var(--ease);
}
.recall-answer.show{opacity:1;transform:translateY(0)}
.recall-actions{display:flex;flex-direction:column;gap:.6rem;width:100%}
.recall-pause-ring{
  width:48px;height:48px;border-radius:50%;border:4px solid var(--border);
  border-top-color:var(--primary);animation:spin 1.2s linear infinite;display:none;
}
.recall-pause-ring.show{display:block}
@keyframes spin{to{transform:rotate(360deg)}}
.ghost-hand{position:absolute;width:64px;height:64px;pointer-events:none;z-index:15;opacity:0;transition:opacity .4s var(--ease)}
.ghost-hand.show{opacity:.9}
.ghost-hand svg{width:100%;height:100%}
.ghost-hand:not(.static) svg{animation:ghostArc 2.6s ease-in-out infinite}
@keyframes ghostArc{
  0%,100%{transform:translate(0,0) scale(1)}
  50%{transform:translate(16px,-12px) scale(.92)}
}
.ghost-target-pulse{
  animation:ghostTargetPulse 1.5s ease-in-out 2;
  outline:3px solid var(--accent);
  outline-offset:4px;
}
@keyframes ghostTargetPulse{
  0%,100%{box-shadow:0 0 0 0 rgba(107,163,104,.45)}
  50%{box-shadow:0 0 0 14px rgba(107,163,104,0)}
}
.caption{
  position:absolute;bottom:calc(6rem + env(safe-area-inset-bottom));left:50%;
  transform:translateX(-50%);max-width:90%;background:rgba(58,31,43,.88);color:#FFF;
  padding:.6rem 1rem;border-radius:var(--radius-md);font-size:.95rem;
  line-height:1.4;text-align:center;opacity:0;pointer-events:none;
  transition:opacity .3s var(--ease);z-index:18;
}
.caption.show{opacity:1}
.modal-overlay{
  position:fixed;inset:0;background:rgba(58,31,43,.5);display:none;
  align-items:center;justify-content:center;padding:1.5rem;z-index:50;
  opacity:0;transition:opacity .25s var(--ease);
}
.modal-overlay.show{display:flex;opacity:1}
.modal{
  background:var(--surface);border-radius:var(--radius-lg);padding:1.5rem;
  max-width:520px;width:100%;max-height:90vh;overflow-y:auto;
  box-shadow:var(--shadow-lg);border:2px solid var(--border);
  display:flex;flex-direction:column;gap:1rem;
}
.modal h3{margin:0;font-size:1.2rem;color:var(--primary)}
.modal p{margin:0;font-size:.95rem;line-height:1.5;color:var(--text)}
.modal-actions{display:flex;flex-direction:column;gap:.6rem;margin-top:.5rem}
.form-field{display:flex;flex-direction:column;gap:.4rem}
.form-field label{font-size:.9rem;font-weight:600;color:var(--text)}
.form-field input[type=text]{
  padding:.75rem 1rem;border-radius:var(--radius-sm);border:2px solid var(--border);
  font-size:1rem;background:var(--surface);color:var(--text);min-height:56px;
}
.form-field input[type=text]:focus{outline:none;border-color:var(--primary)}
.category-selector{display:flex;gap:.5rem;flex-wrap:wrap}
.cat-btn{
  flex:1;min-width:80px;padding:.7rem .5rem;border-radius:var(--radius-sm);
  border:2px solid var(--border);background:var(--surface);color:var(--text-muted);
  font-size:.9rem;font-weight:600;min-height:52px;transition:all .2s;
}
.cat-btn.active{background:var(--primary);color:var(--text-inverse);border-color:var(--primary)}
.photo-upload-area{
  display:flex;flex-direction:column;gap:.5rem;padding:.75rem;
  border:2px dashed var(--border);border-radius:var(--radius-sm);align-items:center;
}
.photo-preview{
  width:100%;max-width:200px;aspect-ratio:1;border-radius:var(--radius-sm);
  background:var(--bg);display:flex;align-items:center;justify-content:center;
  overflow:hidden;font-size:2.5rem;color:var(--text-muted);
}
.photo-preview img{width:100%;height:100%;object-fit:cover}
.record-btn{
  display:flex;align-items:center;justify-content:center;gap:.5rem;
  min-height:56px;padding:.6rem 1.2rem;border-radius:var(--radius-sm);
  background:var(--surface);color:var(--primary);border:2px solid var(--border);
  font-weight:600;font-size:.95rem;
}
.record-btn.recording{background:#E8B4C4;color:var(--text);border-color:var(--primary);animation:recPulse 1s ease-in-out infinite}
@keyframes recPulse{0%,100%{opacity:1}50%{opacity:.6}}
.fact-list{display:flex;flex-direction:column;gap:.5rem}
.fact-item{
  display:flex;align-items:center;gap:.75rem;padding:.75rem;
  border-radius:var(--radius-sm);background:var(--bg);border:1px solid var(--border);
}
.fact-item .fact-thumb{
  width:56px;height:56px;border-radius:8px;background:var(--surface);
  display:flex;align-items:center;justify-content:center;overflow:hidden;
  font-size:1.5rem;flex-shrink:0;
}
.fact-item .fact-thumb img{width:100%;height:100%;object-fit:cover}
.fact-item .fact-info{flex:1;min-width:0}
.fact-item .fact-answer{font-size:.95rem;font-weight:600;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fact-item .fact-status{font-size:.78rem;color:var(--text-muted);margin-top:.15rem}
.fact-item .fact-status.status-settled{color:var(--accent)}
.fact-item .fact-actions{display:flex;gap:.4rem;flex-shrink:0}
.fact-item .fact-btn{
  width:40px;height:40px;border-radius:50%;background:var(--surface);
  color:var(--primary);border:1px solid var(--border);font-size:1rem;
  display:inline-flex;align-items:center;justify-content:center;
}
.setup-progress{display:flex;flex-direction:column;gap:.5rem;margin-bottom:.75rem}
.progress-bar{width:100%;height:12px;background:var(--bg);border-radius:var(--radius-pill);overflow:hidden}
.progress-fill{height:100%;background:var(--accent);border-radius:var(--radius-pill);transition:width .4s var(--ease)}
@keyframes floatY{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-6px)}}
.cg-review-list{display:flex;flex-direction:column;gap:.4rem}
.cg-review-cat{font-size:.8rem;font-weight:700;color:var(--primary);text-transform:uppercase;letter-spacing:.05em;margin-top:.75rem}
.cg-review-cat:first-child{margin-top:0}
.cg-review-item{padding:.55rem .75rem;border-radius:8px;background:var(--bg);font-size:.85rem;line-height:1.35}
.cg-review-item .zh{font-weight:600;color:var(--text)}
.cg-review-item .en{font-size:.78rem;color:var(--text-muted);margin-top:.1rem}
@media(prefers-reduced-motion:reduce){
*,
*::before,
*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
.ghost-hand:not(.static) svg{animation:none}
.ghost-target-pulse{animation:none}
}
@media(max-height:640px) and (orientation:landscape){
.footer-row{flex:1}
}
.cg-review-item,
.fact-item{user-select:text;-webkit-user-select:text}
@keyframes scrIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
:focus-visible{outline:4px solid #1B5FAA!important;outline-offset:3px!important}
html[data-contrast="high"] .recall-overlay{background:rgba(255,255,255,.97)}
.recall-card,
.modal{border-radius:var(--radius-lg);border:1px solid var(--border)}
.cg-review-item .en,
.fact-item .fact-status{font-size:.85rem}
.fact-item .fact-btn{width:52px;height:52px;font-size:1.15rem}
.fact-item .fact-status.status-settled{color:var(--accent);font-weight:700}
.recall-overlay{background:linear-gradient(to bottom,rgba(251,244,236,.7),rgba(251,244,236,.97))}
.recall-lead{font-size:1.3rem;color:var(--text)}
.recall-answer{font-size:1.8rem}
.caption{font-size:1.1rem;background:rgba(46,28,36,.92)}
.form-field label{font-size:1rem}
.form-field input[type=text]:focus{border-color:var(--primary);box-shadow:0 0 0 4px var(--blush)}
.modal-overlay{backdrop-filter:blur(4px)}
.modal-actions .btn{width:100%}
.stepper-row{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.6rem 0;border-bottom:1px solid var(--border)}
.stepper-row:last-child{border-bottom:none}
.stepper-row .label{flex:1;line-height:1.35}
.stepper-row .sub{display:block;font-size:.85rem;color:var(--text-muted)}
.stepper{display:flex;align-items:center;gap:.4rem;background:var(--bg);border-radius:var(--radius-pill);padding:.3rem;border:2px solid var(--border)}
.step-btn{width:56px;height:56px;border-radius:50%;background:var(--primary);color:#fff;font-size:1.8rem;font-weight:700;line-height:1}
.step-btn:active{transform:scale(.92)}
.step-val{min-width:2.2ch;text-align:center;font-size:1.5rem;font-weight:800;color:var(--primary);font-variant-numeric:tabular-nums}
[tabindex="-1"]:focus,
[tabindex="-1"]:focus-visible{outline:none!important}
.fact-item{flex-wrap:wrap}
.fact-item .fact-info{flex:1 1 9rem}
.fact-item .fact-answer{white-space:normal;font-size:1.1rem}
.fact-item .fact-actions{width:100%;justify-content:flex-end;gap:.6rem}
.stepper-row{flex-wrap:wrap;padding:.9rem 0}
.stepper-row .label{flex:1 1 100%;font-weight:600}
.stepper{margin:0 auto}
.game-topbar{align-items:center}
.q-progress{position:absolute;left:50%;top:0;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:.35rem;
  background:var(--surface);border:2px solid var(--border);border-radius:var(--radius-pill);padding:.45rem 1.1rem;box-shadow:var(--shadow-sm);
  font-weight:700;color:var(--primary);font-size:1rem;opacity:0;transition:opacity .4s;pointer-events:none;white-space:nowrap}
.q-progress.show{opacity:1}
.q-dots{display:flex;gap:.4rem}
.q-dots i{width:12px;height:12px;border-radius:50%;background:var(--border);border:2px solid var(--primary)}
.q-dots i.done{background:var(--accent);border-color:var(--accent)}
.q-dots i.cur{background:var(--primary)}
.recall-count{background:var(--blush);color:var(--primary);font-weight:800;font-size:1.05rem;padding:.3rem 1rem;border-radius:var(--radius-pill)}
@media(max-width:420px){
.q-progress{font-size:.9rem;padding:.35rem .8rem}
}
.recall-lead{font-size:1.5rem;font-weight:700;color:var(--text)}

/* ---------- 3. Memory Garden only ---------- */
.screen:not(.active){ display:none !important; }
.hidden{ display:none !important; }
.sr-only{ position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0; }
#screen-language{ justify-content:center; }
#screen-language .col{ flex:0 0 auto; gap:var(--space-4); }

#screen-start .col{ gap:var(--space-2); }
.start-art svg,.end-art svg,.htp-art svg{ width:100%; height:100%; display:block; }
.start-art,.end-art{ border-radius:var(--radius-lg); overflow:hidden; }
#screen-how-to-play .pic{ flex:1 1 auto; min-height:0; display:flex; align-items:center; justify-content:center; }
#screen-how-to-play .pic .dgs-art{ height:100%; max-height:44vh; aspect-ratio:1/1; max-width:100%; display:grid; place-items:center; padding:8px; }
#screen-how-to-play .dgs-caption{ min-height:2.9em; display:block; }
#screen-how-to-play .dgs-btns{ gap:4px; }
#screen-session-end .col,#screen-rest .col,#screen-mood .col{ justify-content:safe center; overflow-y:auto; }
#screen-session-end .dgs-hero,#screen-rest .dgs-hero{ max-height:32vh; }
@media (max-height:700px){ #screen-session-end .dgs-hero,#screen-rest .dgs-hero{ max-height:20vh; } }
#screen-game{ gap:var(--space-2); }
.game-topbar{ justify-content:space-between; }
.game-left{ display:flex; gap:10px; }
.game-topbar{ position:relative; z-index:25; }   /* Home, help and sound stay reachable above a question card */
.game-bottom{ display:flex; justify-content:center; padding:8px 0 calc(var(--safe-b) + 4px); }
#btn-rest{ width:auto; min-width:210px; padding:0 32px; min-height:64px; }
.recall-actions .dgs-btn{ width:auto; min-width:180px; padding:0 24px; }
.fact-thumb svg{ width:70%; height:70%; }
.recall-img svg{ width:60%; height:60%; }
.fact-list{ display:flex; flex-direction:column; gap:10px; margin-bottom:10px; }
.fact-btn{ font-size:16px; font-weight:700; min-height:52px; padding:4px 12px; border-radius:12px; box-shadow:inset 0 0 0 2px var(--border); background:var(--surface); color:var(--text); }
.fact-btn.danger{ color:#8a1c1c; box-shadow:inset 0 0 0 2px #c86a6a; }
.stepper{ display:flex; align-items:center; gap:12px; margin-top:6px; }
.step-btn{ width:60px; height:60px; border-radius:50%; font-size:28px; font-weight:700; background:var(--surface); box-shadow:inset 0 0 0 2px var(--border); color:var(--primary-ink); }
.step-val{ min-width:2em; text-align:center; font-size:26px; font-weight:800; }
.cg-review-item{ display:flex; gap:10px; align-items:center; padding:6px 0; border-bottom:1px solid var(--divider); font-size:17px; }
.cg-review-item .en{ color:var(--text-muted); font-size:15px; }
.ck-thumb{ width:44px; height:44px; flex:none; }
.ck-thumb svg{ width:100%; height:100%; }
#dialog .box{ max-height:86vh; overflow-y:auto; }
.fact-item{ flex-wrap:wrap; }
.fact-actions{ width:100%; display:flex; gap:8px; }
.fact-actions .fact-btn{ flex:1; width:auto !important; height:auto !important; border-radius:12px !important; }
.recall-overlay.show ~ .caption{ visibility:hidden; }
.game-bottom{ gap:10px; flex-wrap:wrap; }
#btn-questions{ width:auto; min-width:180px; padding:0 24px; min-height:64px; }
.recall-actions{ align-items:center; }
.recall-img{ width:auto; height:min(280px, 30vh); max-width:100%; }
.recall-actions .btn-just-garden{ white-space:nowrap; }
@media (max-height:700px){ .recall-card{ padding:.9rem; gap:.5rem; } .recall-lead{ font-size:1.25rem; } .recall-answer{ font-size:1.4rem; } .recall-count{ font-size:.9rem; } }
.recall-actions .btn-just-garden{ min-height:56px; }
.garden-container{ cursor:pointer; isolation:isolate; }
.caption{ pointer-events:none; }
.flower-slot.fading{ transition:opacity .6s; }
.flower-slot svg{ overflow:visible; }
.flower-slot svg{ transform-origin:50% 92%; animation:flowerSway 6s ease-in-out var(--sway-delay, 0s) infinite alternate; }
@keyframes flowerSway{ from{ transform:rotate(-2.5deg); } to{ transform:rotate(2.5deg); } }
@media (prefers-reduced-motion:reduce){ .flower-slot svg{ animation:none; } }
.ghost-hand{ z-index:30; }
.dgs-compare h4{ margin-top:4px; }
/* Design refinement from Joyce's design partner, 5 Nov 2026 (folded into the build; speed fixes marked). */
/* 2026 visual refinement — shared accessibility guardrails. */
.dgs-btn:focus-visible,.dgs-round:focus-visible,.dgs-back:focus-visible,
button:focus-visible,[role="button"]:focus-visible{outline:4px solid var(--focus-ring);outline-offset:4px;}
.dgs-btn--primary{background-image:linear-gradient(160deg,rgba(255,255,255,.13),transparent 54%);}
.dgs-btn--secondary{background-image:linear-gradient(180deg,rgba(255,255,255,.9),rgba(255,255,255,.14));}
.dgs-notice{border:1px solid var(--divider);}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;}}

/* Garden: quiet depth, clearly isolated question cards and natural completion. */
.garden-container{border-radius:22px;background:linear-gradient(#f9ecdf,#e6f0dd);box-shadow:inset 0 0 0 3px rgba(107,73,65,.12),0 10px 22px rgba(70,55,50,.1);}
.garden-container svg.garden-bg{filter:saturate(1.09) contrast(1.025);}
/* (speed) no shadow filter on the flowers: they sway, and a filter would be redrawn every frame */
.recall-overlay{background:linear-gradient(180deg,rgba(250,244,239,.85),rgba(250,244,239,.96));}
.recall-card{box-shadow:0 13px 34px rgba(70,40,48,.21);border:3px solid var(--primary);}
.recall-lead{line-height:1.4;}
.fact-thumb svg,.recall-img svg{filter:drop-shadow(0 3px 3px rgba(50,40,30,.12));}
@media(prefers-reduced-motion:reduce){.flower-slot,.flower-slot svg{animation:none!important;transition:none!important;}}

/* "All games": back to the Gentle Games landing page, top corner of the start screen */
.dgs-allgames{ display:inline-flex; align-items:center; gap:6px; min-height:48px; padding:0 14px; border-radius:999px; background:var(--surface); color:var(--primary-ink, var(--primary)); text-decoration:none; font-size:17px; font-weight:700; box-shadow:inset 0 0 0 2px var(--border); flex:none; white-space:nowrap; }
.dgs-allgames .dgs-icon{ width:22px; height:22px; }
.dgs-allgames:active{ transform:scale(.96); }
.dgs-allgames:focus-visible{ outline:3px solid var(--focus-ring); outline-offset:3px; }
.dgs-topbar.has-allgames{ justify-content:flex-start; gap:10px; padding-right:68px; }
/* Narrow phones: "All games" on the first row (beside the sound button), the language switch on the row below */
@media (max-width:520px){
  .dgs-topbar.has-allgames{ flex-wrap:wrap; row-gap:8px; padding-right:0; }

}

@media (max-width:520px) and (max-height:700px){ .dgs-topbar.has-allgames ~ .dgs-footnote{ display:none; } }

  /* QUOTES: shared by all six games. See the kit's Quotes section for sources and the check notes. */
  var JT = '“Realizing the potential of an aging society”, The Japan Times, 8 March 2007';
  var JTZ = '〈高龄社会的生存之道〉，《日本时报》，2007年3月8日';
  var HLL = 'On Health and Long Life (quoted in SGI-USA, “The Buddhist View on Caregiving”, 2022)';
  var QUOTES = [
    { id: 'i31', type: 'ikeda', for: 'care', en: 'Gaining a person’s understanding is better than just telling them no… When we make such efforts for people suffering from dementia, they feel that we care about them and understand them.', zh: '让对方理解，比只对他说“不”更好……我们这样用心对待失智症患者时，他们能感受到我们的关心和理解。', src: HLL, zhFrom: 'ours' },
    { id: 'i32', type: 'ikeda', for: 'care', en: 'In caring for others, the important thing is to try not to shoulder it alone.', zh: '照顾他人时，重要的是尽量不要一个人扛。', src: HLL, zhFrom: 'ours' },
    { id: 'i30', type: 'ikeda', for: 'care', en: 'Let’s encourage our friends who are dedicating themselves to childrearing, caring for the elderly and nursing the sick.', zh: '让我们鼓励正在养育孩子、照顾长辈、护理病人的朋友。', src: '“To My Friends”, Seikyo Shimbun (World Tribune translation, 28 Dec 2022)', zhFrom: 'ours' },
    { id: 'i44', type: 'ikeda', for: 'care', en: 'Sincere efforts to brighten our surroundings and the lives of others return to illuminate our own final years with dignity.', zh: '真诚地为周围环境和他人的生活带来光明，这份努力会回过来，让我们自己的晚年也充满尊严。', src: JT, zhFrom: 'ours' },
    { id: 'i25', type: 'ikeda', for: 'care', en: 'Individuals who feel needed and strive on behalf of others can keep their youth and energy.', zh: '只要一心怀着急他人所需、为他人尽力的意念，人就可常保朝气，暖和身边之人的心，让社区更显光明。', src: JT, srcZh: JTZ, zhFrom: 'official' },
    { id: 'i23', type: 'ikeda', for: 'care', en: 'Recognizing and treasuring the contributions of older people is essential to the long-term flourishing of any society.', zh: '树立真心尊敬高龄人士的风气，无疑是为社会的持续繁荣打稳基础。', src: JT, srcZh: JTZ, zhFrom: 'official' },
    { id: 'i1', type: 'ikeda', for: 'care', en: 'There is a saying, ‘The foolish regard old age as winter; the wise regard it as a golden time.’ Everything depends upon our attitude, how we approach life.', zh: '有句话说：“愚者视老年为冬天，智者视老年为黄金时期。”一切都取决于我们的心态，取决于我们怎样面对人生。', src: 'The Wisdom for Creating Happiness and Peace, Part 1, 9.1 (from A Discussion on the Third Stage of Life, 1998)', zhFrom: 'ours' },
    { id: 'i11', type: 'ikeda', for: 'player', en: 'I believe youth can last a lifetime.', zh: '我相信青春可以持续一生。', src: JT, srcZh: JTZ, zhFrom: 'ours' },
    { id: 'i12', type: 'ikeda', for: 'player', en: 'Inner youthfulness is not a matter of our physical age.', zh: '其实心境年轻与否是不能以实际年龄来下定论的。', src: JT, srcZh: JTZ, zhFrom: 'official' },
    { id: 'i28', type: 'ikeda', for: 'player', en: 'The wisdom and experience of older people is a resource of inestimable worth.', zh: '高龄人士的智慧与经验，是丰富现在未来的宝贵财产。', src: JT, srcZh: JTZ, zhFrom: 'official' },
    { id: 'i5', type: 'ikeda', for: 'player', en: 'The ideal old age might be likened to a magnificent sunset.', zh: '但愿晚年能如承诺翌日亦是晴天的无限夕阳一般，灿烂尽显，光辉四射，向未来的世代送上希望的光明。', src: JT, srcZh: JTZ, zhFrom: 'official' },
    { id: 's2', type: 'saying', for: 'care', en: 'Dementia changes the map, not the worth of the traveler.', zh: '失智症改变的是地图，不是旅人的价值。' },
    { id: 's6', type: 'saying', for: 'care', en: 'The person is still here, even when the story is scattered.', zh: '即使故事零散了，这个人依然在这里。' },
    { id: 's12', type: 'saying', for: 'care', en: 'A diagnosis explains changes; it does not erase a life.', zh: '诊断解释了变化，但抹不去一个人的一生。' },
    { id: 's20', type: 'saying', for: 'care', en: 'Confusion is not stubbornness.', zh: '糊涂不是固执。' },
    { id: 's30', type: 'saying', for: 'care', en: 'Repetition is not failure; it is a need for reassurance.', zh: '反复问同一件事不是失败，而是需要安心。' },
    { id: 's43', type: 'saying', for: 'care', en: 'Behavior is communication when language falters.', zh: '当语言跟不上时，行为就是在表达。' },
    { id: 's44', type: 'saying', for: 'care', en: 'Look for the need behind the noise.', zh: '留意吵闹背后的需要。' },
    { id: 's54', type: 'saying', for: 'care', en: 'People remember how they were made to feel.', zh: '人们会记得别人带给自己的感受。' },
    { id: 's76', type: 'saying', for: 'care', en: 'Validation is not agreement; it is acknowledgment.', zh: '认同感受不等于同意，而是表示“我明白”。' },
    { id: 's29', type: 'saying', for: 'care', en: 'Familiar rituals are memory’s handrails.', zh: '熟悉的日常习惯，是记忆的扶手。' },
    { id: 's72', type: 'saying', for: 'care', en: 'Dementia is a condition, not an identity.', zh: '失智症是一种病况，不是一个人的身份。' },
    { id: 's28', type: 'saying', for: 'care', en: 'Music can reach where explanation cannot.', zh: '音乐能到达解释到不了的地方。' },
    { id: 'e34', type: 'encourage', for: 'care', en: 'Rest is part of care, not a break from it.', zh: '休息是照顾的一部分，不是中断。' },
    { id: 'e63', type: 'encourage', for: 'care', en: 'You can love someone and still need respite.', zh: '您可以爱一个人，同时也需要喘息。' },
    { id: 'e33', type: 'encourage', for: 'care', en: 'Caregiver guilt is common; it is not a reliable judge.', zh: '照顾者的内疚很常见，但它不是可靠的判官。' },
    { id: 'e86', type: 'encourage', for: 'care', en: 'Burnout is a signal, not a verdict.', zh: '累垮是一个信号，不是一个判决。' },
    { id: 'e97', type: 'encourage', for: 'care', en: 'You do not need a cure to offer care.', zh: '不需要治愈，也能给予照顾。' },
    { id: 'e98', type: 'encourage', for: 'care', en: 'You do not need perfect words to offer presence.', zh: '不需要完美的话语，也能陪伴在旁。' },
    { id: 'e90', type: 'encourage', for: 'care', en: 'No one should have to improvise dementia care alone.', zh: '没有人应该独自摸索怎样照顾失智的家人。' },
    { id: 'e83', type: 'encourage', for: 'care', en: 'Love can be practical: a pill box, a nightlight, a labeled drawer.', zh: '爱可以很实际：一个药盒、一盏小夜灯、一个贴了标签的抽屉。' },
    { id: 'e4', type: 'encourage', for: 'player', en: 'A good day can be small: warm light, familiar music, a hand nearby.', zh: '美好的一天可以很简单：温暖的光、熟悉的音乐、身边有一只手。' },
    { id: 'e95', type: 'encourage', for: 'player', en: 'A good moment is not a small thing.', zh: '美好的片刻，不是小事。' },
    { id: 'e91', type: 'encourage', for: 'player', en: 'Aging can still include wonder.', zh: '年纪大了，依然可以有惊喜。' },
    { id: 'e96', type: 'encourage', for: 'player', en: 'The present is where connection lives.', zh: '当下，就是我们相连的地方。' },
    { id: 't4', type: 'tip', for: 'care', en: 'Communicate face-to-face, one idea at a time, with short sentences and time to respond.', zh: '面对面说话，一次只说一件事，句子简短，给对方时间回应。' },
    { id: 't6', type: 'tip', for: 'care', en: 'Use names and reminders; avoid quizzing with “Do you remember?”', zh: '多叫名字、多提示；不要用“您还记得吗？”来考他们。' },
    { id: 't7', type: 'tip', for: 'care', en: 'Offer two clear choices rather than open-ended questions.', zh: '给两个清楚的选择，而不是开放式的问题。' },
    { id: 't8', type: 'tip', for: 'care', en: 'Reduce noise, clutter and background TV during conversation and meals.', zh: '说话和吃饭时，减少噪音、杂物和开着的电视。' },
    { id: 't20', type: 'tip', for: 'care', en: 'Check hearing and vision; use glasses and hearing aids, because poor senses worsen confusion.', zh: '检查听力和视力；戴好眼镜和助听器，感官不好会让人更糊涂。' },
    { id: 't37', type: 'tip', for: 'care', en: 'Offer familiar music from their youth; use it to calm and connect.', zh: '放他们年轻时熟悉的音乐，用来安抚和交流。' },
    { id: 't48', type: 'tip', for: 'care', en: 'Stop activities when frustration rises; redirect to something easier.', zh: '一开始烦躁，就停下活动，换一件更容易的事。' },
    { id: 't50', type: 'tip', for: 'care', en: 'Respond to emotion first, facts second.', zh: '先回应情绪，再谈事实。' },
    { id: 't52', type: 'tip', for: 'care', en: 'Look for unmet needs behind agitation: pain, hunger, the toilet, noise or tiredness.', zh: '找出烦躁背后没被满足的需要：疼痛、饥饿、要上厕所、太吵或太累。' },
    { id: 't60', type: 'tip', for: 'care', en: 'Plan for late-afternoon restlessness: an earlier dinner, a calm evening, lights on.', zh: '为傍晚的不安做准备：早点吃晚饭，晚上保持安静，把灯打开。' },
    { id: 't72', type: 'tip', for: 'care', en: 'Take scheduled breaks; respite is maintenance, not luxury.', zh: '安排固定的休息时间；喘息是保养，不是奢侈。' },
    { id: 't71', type: 'tip', for: 'care', en: 'Accept help specifically; keep a list of tasks others can do.', zh: '有人说要帮忙时，具体地接受；准备一张别人可以帮忙做的事的清单。' }
  ];

  const dict = STRINGS[currentLang] || STRINGS_ZH;
  let s = dict[key];
  if (s === undefined) s = STRINGS_EN[key];
  if (s === undefined) s = KIT.s(key, null, currentLang) || key;   // shared wording lives in the kit
  if (vars && typeof s === 'string') {
    for (const k in vars) s = s.replace(new RegExp('\\{'+k+'\\}','g'), vars[k]);
  }
  return s;
}

function safeGet(key, fallback){
  try { const v = localStorage.getItem(key); return v===null?fallback:v; }
  catch(e){ return key in memoryFallback ? memoryFallback[key] : fallback; }
}
let storageWarned = false;
function safeSet(key, value){
  try { localStorage.setItem(key, value); return true; }
  catch(e){
    memoryFallback[key] = value;
    if (!storageWarned && typeof showToast === 'function' && typeof t === 'function') {
      storageWarned = true;
      try { showToast(t('notice.storageUnavailable')); } catch(_){}
    }
    return false;
  }
}
function removeKey(key){
  try { localStorage.removeItem(key); } catch(e){}
  delete memoryFallback[key];
}
function getJSON(key, fallback){
  const raw = safeGet(key, null);
  if (!raw) return fallback;
  try { return JSON.parse(raw); } catch(e){ return fallback; }
}
function setJSON(key, obj){ safeSet(key, JSON.stringify(obj)); }

let dbPromise = null;
function openDB(){
  if (dbPromise) return dbPromise;
  dbPromise = new Promise((resolve) => {
    if (!('indexedDB' in window)) { resolve(null); return; }
    try {
      const req = indexedDB.open(CONFIG.idbName, CONFIG.idbVersion);
      req.onupgradeneeded = () => {
        const db = req.result;
        CONFIG.idbStores.forEach(name => {
          if (!db.objectStoreNames.contains(name)) db.createObjectStore(name);
        });
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => resolve(null);
    } catch(e) { resolve(null); }
  });
  return dbPromise;
}
async function idbGet(store, key){
  const db = await openDB(); if (!db) return null;
  return new Promise(resolve => {
    try {
      const tx = db.transaction(store, 'readonly');
      const r = tx.objectStore(store).get(key);
      r.onsuccess = () => resolve(r.result || null);
      r.onerror = () => resolve(null);
    } catch(e) { resolve(null); }
  });
}
async function idbPut(store, value, key){
  const db = await openDB(); if (!db) return false;
  return new Promise(resolve => {
    try {
      const tx = db.transaction(store, 'readwrite');
      const r = key!==undefined ? tx.objectStore(store).put(value, key) : tx.objectStore(store).put(value);
      r.onsuccess = () => resolve(true);
      r.onerror = () => resolve(false);
    } catch(e) { resolve(false); }
  });
}
async function idbDelete(store, key){
  const db = await openDB(); if (!db) return;
  return new Promise(resolve => {
    try {
      const tx = db.transaction(store, 'readwrite');
      tx.objectStore(store).delete(key);
      tx.oncomplete = () => resolve();
      tx.onerror = () => resolve();
    } catch(e) { resolve(); }
  });
}
async function idbClearAll(){
  const db = await openDB(); if (!db) return;
  await Promise.all(CONFIG.idbStores.map(store => new Promise(resolve => {
    try {
      const tx = db.transaction(store, 'readwrite');
      tx.objectStore(store).clear();
      tx.oncomplete = () => resolve();
      tx.onerror = () => resolve();
    } catch(e) { resolve(); }
  })));
}

function initSpeech(){
  if (!('speechSynthesis' in window)) return;
  const load = () => {
    speechVoices = window.speechSynthesis.getVoices() || [];
    if (speechVoices.length) console.log('[MemoryGarden] Voices:', speechVoices.map(v => ({name:v.name, lang:v.lang, local:v.localService})));
  };
  load();
  window.speechSynthesis.onvoiceschanged = load;
}
function pickVoice(lang){
  if (!speechVoices.length) speechVoices = window.speechSynthesis.getVoices() || [];
  const isZh = lang === 'zh-CN';
  const isCantonese = v => /yue|cantonese|粤|廣東|广东|hong ?kong|香港|zh[-_](hk|mo)/i.test((v.lang || '') + ' ' + (v.name || ''));
  let candidates = speechVoices.filter(v => v.lang && v.lang.toLowerCase().startsWith(isZh ? 'zh' : 'en'));
  if (isZh) {
    candidates = candidates.filter(v => !isCantonese(v));
    const rank = v => { const l = v.lang.toLowerCase().replace('_', '-'); return l === 'zh-cn' ? 0 : l === 'zh-sg' ? 1 : l === 'zh-tw' ? 3 : 2; };
    candidates.sort((a, b) => rank(a) - rank(b));
  }
  if (!candidates.length) return null;
  if (sharedOnline()) return candidates.find(v => v.localService) || candidates[0];
  return candidates.find(v => v.localService) || null;
}
/* Speech end is tracked on the utterance itself. Some Chinese voices keep saying they are
   "still speaking" after they finish, so we also stop waiting once the line should be over. */
let speechState = { done: true, until: 0 };
function speechEstimateMs(text){
  const rate = CONFIG.speechRate || 1;
  const zhChars = (String(text).match(/[㐀-鿿]/g) || []).length;
  const words = String(text).replace(/[㐀-鿿]/g, ' ').split(/\s+/).filter(Boolean).length;
  return Math.max(1200, (zhChars * 250 + words * 380) / rate + 600);
}
function speak(text, opts){
  speechState = { done: true, until: 0 };
  if (!('speechSynthesis' in window)) { showCaption(text); return; }
  const voice = pickVoice(currentLang);
  if (!voice){ showCaption(text); return; }
  try {
    if (currentSpeakUtterance) {
      currentSpeakUtterance.onend = null;
      currentSpeakUtterance.onerror = null;
      window.speechSynthesis.cancel();
    }
    const u = new SpeechSynthesisUtterance(text);
    u.voice = voice;
    u.lang = currentLang === 'zh-CN' ? 'zh-CN' : 'en';
    u.rate = CONFIG.speechRate;
    u.pitch = CONFIG.speechPitch;
    u.volume = speechVolume;
    const state = { done: false, until: Date.now() + speechEstimateMs(text) };
    speechState = state;
    const finish = () => { state.done = true; unduckMusic(); hideCaptionSoon(); };
    u.onstart = () => duckMusic();
    u.onend = finish;
    u.onerror = finish;
    currentSpeakUtterance = u;
    window.speechSynthesis.speak(u);
    showCaption(text);
  } catch(e){ speechState = { done: true, until: 0 }; showCaption(text); }
}
function stopSpeech(){
  speechState = { done: true, until: 0 };
  if ('speechSynthesis' in window) {
    try { window.speechSynthesis.cancel(); } catch(e){}
  }
  unduckMusic();
}
function afterSpeech(cb){
  const state = speechState;
  const check = () => {
    if (state !== speechState || state.done || Date.now() >= state.until) cb();
    else setTimeout(check, 120);
  };
  setTimeout(check, 250);
}

function initAudio(){
  if (audioCtx) return audioCtx;
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    audioCtx = new AC();
    if (navigator.audioSession && 'type' in navigator.audioSession) {
      try { navigator.audioSession.type = 'playback'; } catch(e){}
    }
    musicGain = audioCtx.createGain();
    musicGain.gain.value = 0;
    musicGain.connect(audioCtx.destination);
  } catch(e){ audioCtx = null; }
  return audioCtx;
}
function resumeAudio(){
  if (!audioCtx) initAudio();
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume().catch(()=>{});
}
function setMusicVolume(v){
  musicVolume = Math.max(0, Math.min(1, v));
  if (musicGain) musicGain.gain.value = musicMuted ? 0 : musicVolume;
}
function duckMusic(){
  if (!musicGain || !audioCtx || audioCtx.state === 'closed') return;
  try {
    const now = audioCtx.currentTime;
    musicGain.gain.cancelScheduledValues(now);
    musicGain.gain.setValueAtTime(musicGain.gain.value, now);
    musicGain.gain.linearRampToValueAtTime(Math.max(0.02, musicVolume * 0.25), now + 0.2);
  } catch(e){}
}
function unduckMusic(){
  if (!musicGain || !audioCtx || audioCtx.state === 'closed') return;
  try {
    const now = audioCtx.currentTime;
    musicGain.gain.cancelScheduledValues(now);
    musicGain.gain.setValueAtTime(musicGain.gain.value, now);
    musicGain.gain.linearRampToValueAtTime(musicMuted ? 0 : musicVolume, now + 0.6);
  } catch(e){}
}
function isMusicMuted(){ return musicMuted; }

function playNote(freq, startTime, durSec, gainVal){
  if (!audioCtx || !musicGain) return;
  try {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    const filter = audioCtx.createBiquadFilter();
    osc.type = 'triangle';
    osc.frequency.value = freq;
    filter.type = 'lowpass';
    filter.frequency.value = 2400;
    filter.Q.value = 0.5;
    const peak = (gainVal || 0.6);
    const now = startTime;
    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.linearRampToValueAtTime(peak, now + 0.04);
    gain.gain.exponentialRampToValueAtTime(peak * 0.35, now + 0.5);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + durSec + 0.4);
    osc.connect(filter);
    filter.connect(gain);
    gain.connect(musicGain);
    osc.start(now);
    osc.stop(now + durSec + 0.5);
    return osc;
  } catch(e){}
  return null;
}

const NOTE_FREQ = {
  '1': 293.66, '2': 329.63, '3': 369.99, '4': 392.00,
  '5': 440.00, '6': 493.88, '7': 554.37,
  "1'": 587.33, "2'": 659.25, "3'": 739.99,
  '1,': 146.83, '2,': 164.81, '3,': 185.00, '5,': 220.00, '6,': 246.94
};

function parseJianpuBar(bar, bpm){
  const beatSec = 60 / bpm;
  const tokens = bar.trim().split(/\s+/);
  const out = [];
  let beat = 0;
  for (let i = 0; i < tokens.length; i++){
    const tok = tokens[i];
    if (tok === '-'){
      if (out.length) out[out.length - 1].durBeats += 1;
      beat += 1;
      continue;
    }
    const freq = NOTE_FREQ[tok];
    if (!freq) { beat += 1; continue; }
    let dur = 1;
    let j = i + 1;
    while (j < tokens.length && tokens[j] === '-') { dur++; j++; }
    out.push({freq, startBeat: beat, durBeats: dur});
    beat += dur;
    i = j - 1;
  }
  return { notes: out, totalBeats: beat, beatSec };
}

let melodyCache = null;
function buildMelodyTimeline(melody){
  if (melodyCache && melodyCache.id === melody.id) return melodyCache;
  const bpm = melody.tempo;
  const beatSec = 60 / bpm;
  const bars = melody.jianpu.split('|').map(s => s.trim()).filter(s => s.length);
  const allNotes = [];
  let currentBeat = 0;
  bars.forEach(bar => {
    const parsed = parseJianpuBar(bar, bpm);
    parsed.notes.forEach(n => {
      allNotes.push({freq: n.freq, startSec: (currentBeat + n.startBeat) * beatSec, durSec: n.durBeats * beatSec});
    });
    currentBeat += parsed.totalBeats;
  });
  const totalSec = currentBeat * beatSec;
  melodyCache = { id: melody.id, notes: allNotes, totalSec };
  return melodyCache;
}
/* The theme's queued notes, so a restart can clear them first (two copies must never overlap). */
let musicNodes = [];
function stopScheduledMusic(){ musicNodes.forEach(o => { try { o.stop(); } catch(e){} }); musicNodes = []; }
function scheduleMusicLoop(){
  if (!audioCtx || !musicGain) return;
  if (musicSchedulerTimer){ clearTimeout(musicSchedulerTimer); musicSchedulerTimer = null; }
  const melody = MELODIES.theme;
  const timeline = buildMelodyTimeline(melody);
  const loopGap = 0.6;
  const t0 = audioCtx.currentTime + 0.15;
  musicNodes = musicNodes.filter(o => o.__end > audioCtx.currentTime);
  timeline.notes.forEach(n => {
    const o = playNote(n.freq, t0 + n.startSec, n.durSec, 0.55);
    if (o){ o.__end = t0 + n.startSec + n.durSec + 0.5; musicNodes.push(o); }
  });
  const nextIn = timeline.totalSec + loopGap;
  musicSchedulerTimer = setTimeout(scheduleMusicLoop, Math.max(500, (nextIn - 0.2) * 1000));
}
function startMusic(){
  if (musicRunning) return;
  if (!initAudio()) return;
  resumeAudio();
  if (musicGain) musicGain.gain.value = musicMuted ? 0 : musicVolume;
  musicRunning = true;
  scheduleMusicLoop();
}

async function requestWakeLock(){
  try {
    if ('wakeLock' in navigator && navigator.wakeLock.request){
      wakeLockRef = await navigator.wakeLock.request('screen');
      wakeLockRef.addEventListener('release', () => { wakeLockRef = null; });
    }
  } catch(e){}
}
function reacquireWakeLock(){ if (!wakeLockRef) requestWakeLock(); }

function onVisibilityChange(){
  if (document.hidden){
    stopSpeech();
    if (musicSchedulerTimer){ clearTimeout(musicSchedulerTimer); musicSchedulerTimer = null; }
    stopScheduledMusic();   // nothing left queued to overlap when the page comes back
    if (audioCtx) { try { audioCtx.suspend(); } catch(e){} }
  } else {
    if (audioCtx) { try { audioCtx.resume(); } catch(e){} }
    if (musicRunning){ stopScheduledMusic(); scheduleMusicLoop(); }
    reacquireWakeLock();
  }
}

function startSessionTimer(){
  sessionStartTime = Date.now();
  clearInterval(sessionTimerId);
  const minutes = parseInt(safeGet(gk('sessionLength'), String(CONFIG.defaultSessionMinutes)));
  sessionTimerId = setInterval(() => {
    const elapsed = (Date.now() - sessionStartTime) / 60000;
    if (elapsed >= minutes){
      clearInterval(sessionTimerId);
      sessionTimerId = null;
      if (typeof onSessionTimeout === 'function') onSessionTimeout();
    }
  }, 5000);
}

function openModal(html){
  return new Promise(resolve => {
    modalResolve = resolve;
    const overlay = document.getElementById('modal-overlay');
    const content = document.getElementById('modal-content');
    content.innerHTML = html;
    overlay.classList.add('show');
    modalReturnFocus = document.activeElement;
    const finish = (action) => { closeModal(); resolve(action); };
    content.querySelectorAll('[data-modal-action]').forEach(btn => {
      btn.addEventListener('click', () => finish(btn.getAttribute('data-modal-action')));
    });
    overlay.onclick = (e) => { if (e.target === overlay) finish('cancel'); };
    overlay.onkeydown = (e) => {
      if (e.key === 'Escape') { finish('cancel'); return; }
      if (e.key !== 'Tab') return;
      const f = [...content.querySelectorAll('button,input,select,textarea,[tabindex]:not([tabindex="-1"])')].filter(x => !x.disabled);
      if (!f.length) return;
      const first = f[0], last = f[f.length-1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    };
    const h = content.querySelector('h3'); if (h) { h.id = 'modal-title'; content.setAttribute('aria-labelledby','modal-title'); }
    setTimeout(() => (content.querySelector('input,button') || content).focus(), 50);
  });
}
let modalReturnFocus = null;
function closeModal(){
  const overlay = document.getElementById('modal-overlay');
  overlay.classList.remove('show');
  overlay.onclick = null; overlay.onkeydown = null;
  modalResolve = null;
  if (modalReturnFocus && modalReturnFocus.focus) { try { modalReturnFocus.focus(); } catch(e){} }
}

function showHowToPlayStep(idx){
  htpStepIndex = idx;
  const textEl = document.getElementById('htp-text');
  const illEl = document.getElementById('htp-illustration');
  const ill = getHowToPlayIllustrations();
  if (illEl) illEl.innerHTML = ill[idx] || '';
  const key = HTP_STEPS[idx];
  if (textEl) textEl.textContent = t(key);
  speak(t(key));
  renderChrome();
  const last = idx === HTP_STEPS.length - 1;
  document.getElementById('btn-htp-next').innerHTML = last ? KIT.btn('play', KIT.s('btn_letsplay')) : KIT.btn('next', KIT.s('btn_next'));
  const skip = document.getElementById('btn-htp-skip');
  skip.innerHTML = '<span>' + escapeHtml(KIT.s('btn_skip_howto')) + '</span>';
  skip.hidden = last || previousScreenForHTP === 'game';

function mgCompare(html){
  const E = escapeHtml, li = k => '<li>' + E(t(k)) + '</li>';
  const block = (g, n) => '<h4>' + E(t('cmp.' + g + '.h')) + '</h4><ul>' + Array.from({ length: n }, (_, i) => li('cmp.' + g + '.' + (i + 1))).join('') + '</ul>';
  const sec = '<details class="dgs-section dgs-compare" id="g-compare"><summary>' + KIT.icon('photo') + '<span>' + E(t('cmp.h')) + '</span></summary>' +
    '<div class="dgs-section__body"><p>' + E(t('cmp.intro')) + '</p>' + block('pa', 4) + block('mg', 4) + block('pick', 4) + '</div></details>';
  const at = html.indexOf('<details class="dgs-section" id="g-offer"');
  return at < 0 ? html + sec : html.slice(0, at) + sec + html.slice(at);
}
function mgChecklist(){
  const st = getJSON(gk('setup'), {}) || {};
  const standalone = (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
  return [
    { label: KIT.s('check_lang'), done: safeGet(CONFIG.sharedKeys.lang, null) !== null, jump: 'set-lang' },
    { label: KIT.s('check_level'), done: safeGet(CONFIG.sharedKeys.level, null) !== null, jump: 'levels' },
    { label: t('settings.facts.add'), done: facts.length > 0, jump: 'g-facts' },
    { label: KIT.s('check_home'), done: standalone || !!st.home, jump: 'g-check' },
    { label: KIT.s('check_backup'), done: !!st.backup, jump: 'set-backup' },
    { label: KIT.s('check_guide'), done: !!st.guide, jump: 'g-what' }
  ];
}
function mgSetupMark(k){ const st = getJSON(gk('setup'), {}) || {}; st[k] = true; setJSON(gk('setup'), st); }

function renderSettings(keepScroll){
  renderChrome();
  const container = document.getElementById('settings-content');
  if (!container) return;
  const sc = document.querySelector('#screen-settings .scroll');
  const y = sc ? sc.scrollTop : 0;
  const K = KIT, E = escapeHtml;
  const musicVol = parseFloat(safeGet(gk('musicVolume'), String(CONFIG.defaultMusicVolume)));
  const speechVol = parseFloat(safeGet(gk('speechVolume'), String(CONFIG.defaultSpeechVolume)));
  const sessionLen = parseInt(safeGet(gk('sessionLength'), String(CONFIG.defaultSessionMinutes)));
  const recallN = getRecallLimit(getLevelConfig());
  const simplest = sharedLevel() === 'simplest';
  const sessionLog = getJSON(gk('sessionLog'), []).slice(-20).reverse();
  const items = mgChecklist();
  const homeDone = items[3].done;
  const near = (list, v) => list.reduce((a, b) => Math.abs(b - v) < Math.abs(a - v) ? b : a, list[0]);
  const stepper = (key, val, def, lo, hi) => K.row(null, `<span class="lbl">${E(t('settings.' + key))}</span><p class="note">${E(t('settings.levelDefault', { n: def }))}</p>
      <div class="stepper" role="group" aria-label="${E(t('settings.' + key))}">
        <button type="button" class="step-btn" data-step="${key}:-1:${lo}:${hi}" aria-label="−">−</button>
        <output class="step-val" aria-live="polite">${val}</output>
        <button type="button" class="step-btn" data-step="${key}:1:${lo}:${hi}" aria-label="+">+</button></div>`);

  container.innerHTML = '<div class="col"><h1 class="dgs-screen-title">' + E(K.s('set_title')) + '</h1>' +
    K.group('g-check', 'check', K.s('set_g_checklist'),
      K.row(null, K.checklistHTML(items.map(c => ({ label: c.label, done: c.done, jump: (c.jump === 'levels' || c.jump === 'g-what') ? null : c.jump })))) +
      (homeDone ? '' : K.row(null, '<span class="lbl">' + E(K.s('check_home')) + '</span><p class="note">' + E(K.s('check_home_note')) + '</p>' + K.button('btn-mark-home', 'check', K.s('btn_mark_done'))))) +
    K.group('g-facts', 'leaf', t('mg.g.facts') + ' (' + facts.length + '/' + CONFIG.maxFacts + ')',
      K.row(null, (facts.length === 0 ? '<p class="note">' + E(t('settings.facts.none')) + '</p>' :
        (simplest ? '<p class="note">' + E(t('settings.simplestStatus')) + '</p>' : '') +
        '<div class="fact-list">' + facts.map(f => {
          const paused = f.pausedUntil && f.pausedUntil > Date.now();
          const status = paused ? 'resting' : (f.status || 'needsMoreTime');
          const statusKey = status === 'resting' ? 'factStatus.resting' : status === 'settled' ? 'factStatus.settled' : status === 'gettingThere' ? 'factStatus.gettingThere' : 'factStatus.needsMoreTime';
          // On Simplest the answer comes straight away ("I know" is hidden), so the status can't move: show how often it was seen
          const seen = (f.timesWithHelp || 0) + (f.timesWithoutHelp || 0);
          const statusText = (simplest && status !== 'resting') ? t('factStatus.seen', { n: seen }) : t(statusKey);
          return `<div class="fact-item" data-fact-id="${f.id}">
            <div class="fact-thumb">${factThumb(f)}</div>
            <div class="fact-info"><div class="fact-answer">${E(f.answer)}</div><div class="fact-status status-${simplest && status !== 'resting' ? 'seen' : status}">${E(statusText)}</div></div>
            <div class="fact-actions">
              <button class="fact-btn" type="button" data-fact-action="edit" data-fact-id="${f.id}">${E(t('btn.edit'))}</button>
              <button class="fact-btn" type="button" data-fact-action="${paused ? 'resume' : 'pause'}" data-fact-id="${f.id}">${E(t(paused ? 'btn.resume' : 'btn.pause'))}</button>
              <button class="fact-btn danger" type="button" data-fact-action="delete" data-fact-id="${f.id}">${E(t('btn.delete'))}</button>
            </div></div>`;
        }).join('') + '</div>') +
        (facts.length < CONFIG.maxFacts ? K.button('btn-add-fact', 'leaf', t('settings.facts.add')) : '<p class="note">' + E(t('settings.facts.max')) + '</p>') +
        (facts.length > 0 && facts.length <= 3 ? '<p class="note">' + E(t('notice.recommendedStart')) + '</p>' : ''))) +
    K.group('g-questions', 'book', t('mg.g.questions'),
      stepper('recallCount', recallN, getLevelConfig().maxRecallPerSession, 1, 10) +
      K.row(null, K.button('btn-review-questions', 'list', t('settings.reviewQuestions')))) +
    K.group('g-sound', 'sound', K.s('set_g_sound'),
      K.range('set-musicVolume', K.s('set_music_vol'), musicVol) +
      K.range('set-speechVolume', K.s('set_speech_vol'), speechVol)) +
    K.group('g-voice', 'mic', K.s('set_g_voice'),
      K.toggle('set-onlineVoice', K.s('set_online_voice'), sharedOnline(), K.s('set_online_voice_note')) +
      K.row(null, K.button('btn-test-voice', 'sound', K.s('btn_test_voice')))) +
    K.group('g-screen', 'phone', K.s('set_g_screen'),
      K.seg('set-lang', K.s('set_lang'), [{ v: 'en', label: 'English' }, { v: 'zh-CN', label: '中文' }], currentLang) +
      K.toggle('set-contrast', K.s('set_contrast'), sharedContrast()) +
      K.seg('set-sessionLength', K.s('set_session'), [6, 12, 20, 30].map(n => ({ v: n, label: K.s('minutes', { n: n }) })), near([6, 12, 20, 30], sessionLen), K.s('set_session_note'))) +
    K.group('g-records', 'clock', K.s('set_g_records'),
      K.row(null, '<span class="lbl">' + E(K.s('sessions_h')) + '</span><p class="note">' + E(K.s('sessions_note')) + '</p>' +
        K.sessionsHTML(sessionLog.map(s => ({ date: s.date, mood: s.mood === 'not-great' ? 'notgreat' : s.mood, minutes: s.minutes == null ? null : Math.max(1, Math.round(s.minutes)), endedEarly: s.endedEarly, source: s.source })),
          e => e.source === 'caregiver' ? t('mg.rec.byYou') : ''))) +
    K.group('g-data', 'shield', K.s('set_g_data'),
      K.row('set-backup', K.button('btn-backup', 'backup', K.s('btn_backup')) + '<p class="note">' + E(K.s('backup_note')) + '</p>') +
      K.row(null, K.button('btn-restore', 'restore', K.s('btn_restore')) + '<p class="note">' + E(K.s('restore_note')) + '</p>') +
      K.row(null, K.holdHTML('btn-clear-all', K.s('btn_clear'), K.s('clear_hint'), 'trash'))) +
    '<p class="dgs-footnote"><b>' + E(K.s('stays_local')) + '</b>' + (sharedOnline() ? '<br>' + E(K.s('online_line')) : '') + '</p></div>';

  K.wireSettings(container, {
    onSeg: (id, v) => {
      if (id === 'set-lang') { setLang(v); }
      else if (id === 'set-sessionLength') safeSet(gk('sessionLength'), String(v));
      renderSettings(true);
    },
    onToggle: (id, on) => {
      if (id === 'set-onlineVoice') KIT.sharedWrite(CONFIG.sharedKeys.onlineVoice, on);
      else if (id === 'set-contrast') { KIT.sharedWrite(CONFIG.sharedKeys.contrast, on); applyContrast(); }
      renderSettings(true);
    },
    onRange: (id, v, final) => {
      if (id === 'set-musicVolume') { safeSet(gk('musicVolume'), String(v)); setMusicVolume(v); }
      else if (id === 'set-speechVolume') { safeSet(gk('speechVolume'), String(v)); speechVolume = v; if (final) speak(KIT.s('voice_sample')); }
    }
  });
  container.querySelectorAll('[data-step]').forEach(btn => {
    btn.addEventListener('click', () => {
      const [key, d, lo, hi] = btn.getAttribute('data-step').split(':');
      const base = getRecallLimit(getLevelConfig());
      const nv = Math.max(+lo, Math.min(+hi, base + +d));
      safeSet(gk(key), String(nv));
      btn.closest('.stepper').querySelector('.step-val').textContent = nv;
    });
  });
  container.querySelectorAll('[data-fact-action]').forEach(btn => {
    btn.addEventListener('click', () => {
      const action = btn.getAttribute('data-fact-action');
      const id = btn.getAttribute('data-fact-id');
      const fact = facts.find(f => f.id === id);
      if (!fact) return;
      if (action === 'edit') openFactForm(fact);
      else if (action === 'pause') { fact.pausedUntil = Date.now() + CONFIG.pausedFactDays * 24 * 3600 * 1000; saveFacts(); renderSettings(true); }
      else if (action === 'resume') { fact.pausedUntil = 0; saveFacts(); renderSettings(true); }
      else if (action === 'delete') {
        KIT.dialog({ title: t('btn.delete') + ': ' + fact.answer, html: '<div class="fact-thumb" style="margin:0 auto">' + factThumb(fact) + '</div>',
          buttons: [{ label: KIT.s('btn_cancel'), primary: true }, { label: t('btn.delete'), icon: 'trash', onClick: async () => { await deleteFact(id); renderSettings(true); } }] });
      }
    });
  });
  const on = (id, fn) => { const b = document.getElementById(id); if (b) b.addEventListener('click', fn); };
  on('btn-mark-home', () => { mgSetupMark('home'); renderSettings(true); });
  on('btn-add-fact', () => openFactForm(null));
  on('btn-review-questions', reviewQuestions);
  on('btn-test-voice', () => { if (!audioCtx) initAudio(); speak(KIT.s('voice_sample')); });
  on('btn-backup', backupData);
  on('btn-restore', restoreData);
  KIT.bindHold(document.getElementById('btn-clear-all'), 3000, () => {
    KIT.dialog({ title: t('settings.clearAll.confirmTitle'), html: KIT.p(t('settings.clearAll.confirmBody')),
      buttons: [{ label: KIT.s('btn_keep_all'), primary: true }, { label: KIT.s('btn_delete'), icon: 'trash', onClick: clearAllData }] });
  }, () => KIT.toast(KIT.s('hold_tap_hint')));
  if (keepScroll && sc) sc.scrollTop = y;
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function logSessionEnd(mood, endedEarly){
  const log = getJSON(gk('sessionLog'), []);
  const minutes = getSessionElapsed();
  log.push({ date: new Date().toISOString(), minutes, mood: mood || null, endedEarly: !!endedEarly });
  while (log.length > 50) log.shift();
  setJSON(gk('sessionLog'), log);
}
