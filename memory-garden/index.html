/* Fact photos and voice recordings live in IndexedDB (they are too big for localStorage).
   Facts saved by older builds with the media inside are moved over on first load. */
const MEDIA_KEYS = ['photoDataUri', 'audioDataUri'];
let mediaStoreOK = false;
const SEEDLING_SVG = '<svg viewBox="0 0 64 64" aria-hidden="true"><path d="M32 58V30" stroke="#3f6e3a" stroke-width="4" stroke-linecap="round"/><path d="M32 34q-20 2-22-18q20-2 22 18z" fill="#5f9a4e" stroke="#3a2f2a" stroke-width="2.5" stroke-linejoin="round"/><path d="M32 30q18 0 22-18q-20 0-22 18z" fill="#7fb36a" stroke="#3a2f2a" stroke-width="2.5" stroke-linejoin="round"/><ellipse cx="32" cy="58" rx="16" ry="4" fill="#8a5a3b"/></svg>';
function factThumb(f){ return f && f.photoDataUri ? `<img src="${f.photoDataUri}" alt="">` : SEEDLING_SVG; }
async function loadFacts(){
  const stored = getJSON(gk('facts'), null);
  facts = (Array.isArray(stored) ? stored : []).filter(f => f && !f.isDemo);   // v6 could save a demo fact: drop it
  mediaStoreOK = !!(await openDB());
  let moved = false;
  for (const f of facts){
    for (const k of MEDIA_KEYS){
      if (typeof f[k] === 'string' && f[k]) moved = true;
      else if (f['has_' + k] && mediaStoreOK) f[k] = await idbGet('blobs', k + ':' + f.id);
    }
  }
  if (moved) saveFacts();
}

function saveFacts(){
  try {
    const lite = facts.map(f => {
      const c = Object.assign({}, f);
      if (mediaStoreOK) MEDIA_KEYS.forEach(k => { c['has_' + k] = !!f[k]; delete c[k]; });
      return c;
    });
    setJSON(gk('facts'), lite);
    if (mediaStoreOK) facts.forEach(f => MEDIA_KEYS.forEach(k => {
      const key = k + ':' + f.id;
      if (f[k]) idbPut('blobs', f[k], key); else idbDelete('blobs', key);
    }));
  } catch(e) { showToast(t('notice.storageUnavailable')); }
}

async function addFact(fact){
  if (facts.length >= CONFIG.maxFacts) { showToast(t('notice.factLimit')); return false; }
  fact.id = fact.id || ('f_' + Date.now() + '_' + Math.random().toString(36).slice(2,7));
  fact.createdAt = fact.createdAt || Date.now();
  fact.status = fact.status || 'needsMoreTime';
  fact.intervalIndex = fact.intervalIndex || 0;
  fact.timesWithHelp = fact.timesWithHelp || 0;
  fact.timesWithoutHelp = fact.timesWithoutHelp || 0;
  fact.pausedUntil = fact.pausedUntil || 0;
  fact.lastSeenAt = fact.lastSeenAt || 0;
  facts.push(fact);
  saveFacts();
  return true;
}

async function updateFact(id, patch){
  const f = facts.find(x => x.id === id);
  if (!f) return;
  Object.assign(f, patch);
  saveFacts();
}

async function deleteFact(id){
  facts = facts.filter(f => f.id !== id);
  saveFacts();
  MEDIA_KEYS.forEach(k => idbDelete('blobs', k + ':' + id));
}

function computeNextDue(fact){
  const cfg = getLevelConfig();
  const intervals = CONFIG.intervals;
  const idx = Math.min(fact.intervalIndex || 0, intervals.length - 1);
  let base = intervals[idx];
  const helpRatio = fact.timesWithHelp / Math.max(1, fact.timesWithHelp + fact.timesWithoutHelp);
  let adjusted = base * cfg.intervalMult;
  if (helpRatio > 0.6) adjusted *= 0.6;
  else if (helpRatio < 0.3) adjusted *= 1.3;
  return (fact.lastSeenAt || Date.now()) + adjusted;
}

function updateFactStatus(fact){
  if (fact.pausedUntil && fact.pausedUntil > Date.now()) return 'resting';
  const total = fact.timesWithoutHelp + fact.timesWithHelp;
  if (total < 2) return 'needsMoreTime';
  const ratio = fact.timesWithoutHelp / total;
  if (ratio >= 0.75) return 'settled';
  if (ratio >= 0.4) return 'gettingThere';
  return 'needsMoreTime';
}

function checkDueFacts(){
  const now = Date.now();
  const cfg = getLevelConfig();
  return facts.filter(f => {
    if (f.pausedUntil && f.pausedUntil > now) return false;
    if (!f.lastSeenAt) return true;
    return computeNextDue(f) <= now;
  }).slice(0, cfg.maxActiveFacts);
}

function getEmptySlot(){
  const used = new Set((gameState.flowerSlots || []).map(s => s.slot));
  for (let i = 0; i < GARDEN_SLOTS.length; i++){
    if (!used.has(i)) return i;
  }
  return -1;   // all question spots taken: grow it somewhere on the grass instead
}

function growFlower(slotIdx, type, pos){
  const container = document.getElementById('garden-container');
  if (!container) return;
  if (!pos) pos = slotIdx >= 0 ? GARDEN_SLOTS[slotIdx] : { x: 8 + Math.random() * 84, y: 62 + Math.random() * 28 };
  const el = document.createElement('div');
  el.className = 'flower-slot growing';
  el.style.left = pos.x + '%';
  el.style.top = pos.y + '%';
  el.style.width = (12 + Math.random() * 4).toFixed(1) + '%';
  el.style.aspectRatio = '1';
  el.style.transform = 'translate(-50%, -50%)';
  el.style.zIndex = String(Math.round(pos.y));   // nearer flowers in front
  el.style.setProperty('--sway-delay', (-Math.random() * 6).toFixed(2) + 's');   // flowers sway out of step
  el.innerHTML = getFlowerSVG(type || pickRandomFlowerType());
  container.appendChild(el);
  gameState.flowerSlots = gameState.flowerSlots || [];
  gameState.flowerSlots.push({ slot: slotIdx, type: type || 'orchid', factId: currentRecallFact && currentRecallFact.id });
  // keep the garden from filling up: the oldest flower gently fades
  const all = container.querySelectorAll('.flower-slot:not(.fading)');
  if (all.length > MAX_FLOWERS){
    const old = all[0]; old.classList.add('fading'); old.style.opacity = '0';
    setTimeout(() => old.remove(), 700);
    gameState.flowerSlots.shift();
  }
  saveGameState();
}

function pickRandomFlowerType(){
  const types = ['orchid','hibiscus','jasmine'];
  return types[Math.floor(Math.random() * types.length)];
}

function loadGameState(){
  const state = getJSON(gk('gameState'), null);
  if (state){
    gameState = Object.assign(gameState, state);
  }
  gameState.flowerSlots = gameState.flowerSlots || [];
}

function saveGameState(){
  try { setJSON(gk('gameState'), gameState); } catch(e){}
}

let seriesQueue = [];
function buildSeries(){
  const now = Date.now(), cfg = getLevelConfig(), limit = getRecallLimit(cfg);
  const act = facts.filter(f => !f.pausedUntil || f.pausedUntil < now)
    .sort((a, b) => computeNextDue(a) - computeNextDue(b)).slice(0, Math.max(cfg.maxActiveFacts, 1));
  seriesQueue = act.slice(0, limit).map(f => ({ fact: f }));
  const level = sharedLevel();
  const pool = GARDEN_QUESTIONS.filter(q => !(level === 'simplest' && q.type === 'reminiscence'));
  for (let i = pool.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [pool[i], pool[j]] = [pool[j], pool[i]]; }
  const by = { naming: [], reminiscence: [] }; pool.forEach(q => by[q.type].push(q));
  const types = Object.keys(by).filter(k => by[k].length);
  for (let k = 0; seriesQueue.length < limit && types.some(t2 => by[t2].length); k++){
    const arr = by[types[k % types.length]]; if (arr.length) seriesQueue.push({ q: arr.shift() });
  }
  gameState.seriesTotal = seriesQueue.length;
  gameState.questionsOff = false;
  currentQuestion = null;
  const el = document.getElementById('q-progress'); if (el) el.classList.remove('show');
  updateQuestionsBtn();
}
function showRandomQuestion(q){
  if (gameState.paused || gameState.questionsOff) return;
  currentRecallFact = null;
  currentQuestion = { q: q };
  gameState.recallCount++; updateQProgress(); gameState.lastRecallAt = Date.now(); saveGameState();
  const $ = id => document.getElementById(id);
  const text = qText(q);
  $('recall-img').innerHTML = q.art ? Q_ART[q.art] : SEEDLING_SVG;
  $('recall-lead').textContent = text;
  $('recall-answer').textContent = ''; $('recall-answer').classList.remove('show');
  $('btn-i-know').classList.add('hidden'); $('recall-pause-ring').classList.remove('show');
  $('recall-overlay').classList.add('show');
  speak(text);
  showQNext(() => {
    stopSpeech();
    currentQuestion = null;
    const ans = q.type === 'naming' ? (currentLang === 'zh-CN' ? q.ansZh : q.ansEn) : '';
    if (ans) { $('recall-answer').textContent = ans; $('recall-answer').classList.add('show'); }
    speak((ans ? ans + ' ' : '') + t('q.ack'));
    growFlower(getEmptySlot(), pickRandomFlowerType());
    afterSpeech(() => {
      $('recall-overlay').classList.remove('show');
      if (!facts.length && !factHintDone) {   // for the caregiver: caption only, with time to read it
        factHintDone = true; showCaption(t('game.addFactsHint'));
        scheduledRecallTimer = setTimeout(scheduleNextRecall, 4000);
      } else scheduleNextRecall();
    });
  });
}
function updateQProgress(){
  const n = gameState.recallCount, total = gameState.seriesTotal || n;
  const txt = currentLang === 'zh-CN' ? `第 ${n} / ${total} 题` : `Question ${n} of ${total}`;
  const el = document.getElementById('q-progress');
  if (el){
    el.innerHTML = `<span>${txt}</span><span class="q-dots" aria-hidden="true">${Array.from({length: total}, (_, i) => `<i class="${i < n - 1 ? 'done' : i === n - 1 ? 'cur' : ''}"></i>`).join('')}</span>`;
    el.classList.add('show');
  }
  const rc = document.getElementById('recall-count'); if (rc) rc.textContent = txt;
}

function initGarden(){
  const container = document.getElementById('garden-container');
  if (!container) return;
  if (!container.querySelector('svg.garden-bg')){
    container.insertAdjacentHTML('afterbegin', getGardenSVG());
    container.querySelector('svg').classList.add('garden-bg');
  }
  if (!container.dataset.plant){
    container.dataset.plant = '1';
    container.addEventListener('click', plantAt);
  }
  container.querySelectorAll('.flower-slot').forEach(el => el.remove());
  loadGameState();
  gameState.flowerSlots = [];   // each session starts with an empty garden
  factHintDone = false; ghostShown = 0;
  startSession();
  resetIdleTimer();
}

function startSession(){
  if (scheduledRecallTimer){ clearTimeout(scheduledRecallTimer); scheduledRecallTimer = null; }
  gameState.sessionStart = Date.now();
  gameState.recallCount = 0;
  gameState.lastRecallAt = 0;
  gameState.paused = false;
  saveGameState();
  startSessionTimer();
  buildSeries();
  scheduleNextRecall();
}

function scheduleNextRecall(){
  if (scheduledRecallTimer){ clearTimeout(scheduledRecallTimer); scheduledRecallTimer = null; }
  if (pendingEnd) { onSessionTimeout(); return; }
  if (gameState.paused || gameState.questionsOff) return;
  const next = seriesQueue.shift();
  if (!next){
    if (gameState.recallCount > 0) scheduledRecallTimer = setTimeout(onSessionTimeout, 1800);
    return;
  }
  scheduledRecallTimer = setTimeout(() => (next.q ? showRandomQuestion(next.q) : showRecall(next.fact)), gameState.recallCount === 0 ? 600 : 1000);
}


function showRecall(fact){
  if (gameState.paused) return;
  const cfg = getLevelConfig();
  if (gameState.recallCount >= getRecallLimit(cfg)) return;
  currentRecallFact = fact;
  iKnowTapped = false;
  revealStarted = false;
  gameState.recallCount++;
  updateQProgress();
  gameState.lastRecallAt = Date.now();
  saveGameState();
  const overlay = document.getElementById('recall-overlay');
  const img = document.getElementById('recall-img');
  const lead = document.getElementById('recall-lead');
  const answer = document.getElementById('recall-answer');
  const iKnowBtn = document.getElementById('btn-i-know');
  const pauseRing = document.getElementById('recall-pause-ring');
  const thumb = factThumb(fact);
  img.innerHTML = thumb;
  const leadText = t('game.recallLead');
  const kw = currentLang === 'zh-CN' ? '这是' : 'This is';
  lead.innerHTML = leadText.replace(kw, `<span class="kw">${kw}</span>`);
  answer.textContent = '';
  answer.classList.remove('show');
  iKnowBtn.classList.remove('hidden');
  if (!cfg.showIKnow) iKnowBtn.classList.add('hidden');
  pauseRing.classList.remove('show');
  { const nb = document.getElementById('btn-q-next'); if (nb) nb.classList.add('hidden'); }
  overlay.classList.add('show');
  speak(leadText);
  const announcer = document.getElementById('recall-announcer');
  if (announcer) announcer.textContent = leadText;
  if (cfg.pauseDuration > 0){
    pauseRing.classList.add('show');
    setTimeout(() => {
      if (!revealStarted) revealAnswer(fact);
    }, cfg.pauseDuration);
  } else {
    setTimeout(() => revealAnswer(fact), 800);
  }
}

function handleIKnow(){
  if (!currentRecallFact || revealStarted) return;
  iKnowTapped = true;
  const iKnowBtn = document.getElementById('btn-i-know');
  if (iKnowBtn) iKnowBtn.classList.add('hidden');
  haptic(15);
  revealAnswer(currentRecallFact);
}

function revealAnswer(fact){
  if (revealStarted) return;
  revealStarted = true;
  const answer = document.getElementById('recall-answer');
  const iKnowBtn = document.getElementById('btn-i-know');
  const pauseRing = document.getElementById('recall-pause-ring');
  if (iKnowBtn) iKnowBtn.classList.add('hidden');
  if (pauseRing) pauseRing.classList.remove('show');
  const answerText = t('game.revealPrefix') + ' ' + fact.answer + (currentLang === 'zh-CN' ? '' : t('game.revealSuffix'));
  speak(answerText);
  const announcer = document.getElementById('recall-announcer');
  if (announcer) announcer.textContent = answerText;
  if (fact.audioDataUri){
    try {
      const audio = new Audio(fact.audioDataUri);
      audio.volume = speechVolume;
      audio.play().catch(()=>{});
    } catch(e){}
  }
  if (answer){ answer.textContent = answerText; answer.classList.add('show'); }
  if (iKnowTapped){
    fact.timesWithoutHelp = (fact.timesWithoutHelp || 0) + 1;
  } else {
    fact.timesWithHelp = (fact.timesWithHelp || 0) + 1;
  }
  fact.lastSeenAt = Date.now();
  fact.intervalIndex = Math.min((fact.intervalIndex || 0) + 1, CONFIG.intervals.length - 1);
  fact.status = updateFactStatus(fact);
  saveFacts();
  const slot = getEmptySlot();
  growFlower(slot, pickRandomFlowerType());
  // Nothing moves on until someone taps Next, after the voice has finished.
  afterSpeech(() => { if (gameState.questionsOff) return; showQNext(() => {
    stopSpeech();
    const overlay = document.getElementById('recall-overlay');
    if (overlay) overlay.classList.remove('show');
    currentRecallFact = null;
    scheduleNextRecall();
  }); });
}

function onSessionTimeout(){
  const ov = document.getElementById('recall-overlay');
  if (currentScreen === 'game' && ov && ov.classList.contains('show')) { pendingEnd = true; return; }
  pendingEnd = false;
  stopSpeech();
  gameState.paused = true;
  saveGameState();
  renderSessionEnd();
  showScreen('session-end');
}

function keepPlaying(){
  if (scheduledRecallTimer){ clearTimeout(scheduledRecallTimer); scheduledRecallTimer = null; }
  gameState.paused = false;
  sessionStartTime = Date.now();
  startSessionTimer();
  gameState.recallCount = 0;
  gameState.sessionStart = Date.now();
  saveGameState();
  showScreen('game');
  buildSeries();
  scheduleNextRecall();
}

function restSession(){
  const configured = parseInt(safeGet(gk('sessionLength'), String(CONFIG.defaultSessionMinutes)));
  const elapsed = getSessionElapsed();
  const endedEarly = elapsed < configured - 0.5;
  showMoodTap(endedEarly);
}


function resetIdleTimer(){
  if (idleTimer) clearTimeout(idleTimer);
  hideGhostHand();
  idleTimer = setTimeout(showGhostHand, CONFIG.ghostHandIdleMs);
}

function hideGhostHand(){
  const hand = document.getElementById('ghost-hand');

  if (helpBtn) helpBtn.addEventListener('click', () => {

    if (isMusicMuted()) unmuteMusic(); else muteMusic();
  });

  if (restBtn) restBtn.addEventListener('click', () => {
    gameState.paused = true;

function goHomeFromGarden(){
  KIT.dialog({ title: KIT.s('home_q'), buttons: [
    { label: KIT.s('btn_stay'), primary: true },
    { label: KIT.s('btn_home'), icon: 'home', onClick: () => {
      stopSpeech();
      if (scheduledRecallTimer){ clearTimeout(scheduledRecallTimer); scheduledRecallTimer = null; }
      clearInterval(sessionTimerId); sessionTimerId = null;
      pendingEnd = false;
      gameState.paused = true; saveGameState();
      document.getElementById('recall-overlay').classList.remove('show');
      logSessionEnd(null, true);
      renderStartScreen(); showScreen('start');
    } }
  ] });
}

let currentQuestion = null;   // the question on screen, so it can be asked again later
let pendingEnd = false;       // time ran out during a question: end after it
let factHintDone = false;     // the "add your own facts" caption shows once a session
let ghostShown = 0;           // idle hand: at most 3 times a session

/* Idle hand: after 10 s with no taps, show what to do. On a question card it points at Next
   (only once Next is showing); in the garden it taps the grass. A still arrow if motion is turned off. */
function showGhostHand(){
  if (currentScreen !== 'game' || gameState.paused || ghostShown >= 3) return;
  const hand = document.getElementById('ghost-hand');
  if (!hand) return;
  const ov = document.getElementById('recall-overlay');
  let x, y;
  if (ov && ov.classList.contains('show')) {
    const nb = document.getElementById('btn-q-next');
    if (!nb || nb.classList.contains('hidden')) { resetIdleTimer(); return; }   // still in the pause: wait
    const r = nb.getBoundingClientRect(); x = r.left + r.width / 2; y = r.top + r.height / 2;
  } else {
    const r = document.getElementById('garden-container').getBoundingClientRect();
    x = r.left + r.width * (0.35 + Math.random() * 0.3); y = r.top + r.height * 0.78;
  }
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  hand.innerHTML = reduced ? getStaticArrowSVG() : getGhostHandSVG();
  hand.classList.toggle('static', reduced);
  hand.style.left = (x - 32) + 'px';
  hand.style.top = (y - 20) + 'px';
  hand.classList.add('show');
  ghostShown++;
  clearTimeout(showGhostHand._t);
  showGhostHand._t = setTimeout(() => { hideGhostHand(); resetIdleTimer(); }, 4000);
}
function justGarden(){
  haptic(15);
  stopSpeech();
  if (scheduledRecallTimer){ clearTimeout(scheduledRecallTimer); scheduledRecallTimer = null; }
  // put an unanswered question back at the front, so "Questions" carries on from there
  if (currentRecallFact && !revealStarted) seriesQueue.unshift({ fact: currentRecallFact });
  else if (currentQuestion) seriesQueue.unshift(currentQuestion);
  if (currentRecallFact && !revealStarted) gameState.recallCount = Math.max(0, gameState.recallCount - 1);
  else if (currentQuestion) gameState.recallCount = Math.max(0, gameState.recallCount - 1);
  revealStarted = true;   // stops a pending reveal from firing
  currentRecallFact = null; currentQuestion = null;
  gameState.questionsOff = true;
  saveGameState();
  const nb = document.getElementById('btn-q-next'); if (nb){ nb.classList.add('hidden'); nb.onclick = null; }
  document.getElementById('recall-overlay').classList.remove('show');
  const el = document.getElementById('q-progress'); if (el) el.classList.remove('show');
  updateQuestionsBtn();
  if (pendingEnd) { onSessionTimeout(); return; }
  showCaption(t('game.plantHint'));
  speak(t('game.plantHint'));
}
function resumeQuestions(){
  haptic(15);
  resumeAudio();
  gameState.questionsOff = false;
  saveGameState();
  updateQuestionsBtn();
  if (!seriesQueue.length) buildSeries();
  scheduleNextRecall();
}
function updateQuestionsBtn(){
  const b = document.getElementById('btn-questions');
  if (!b) return;
  b.innerHTML = KIT.btn('book', t('game.questions'));
  b.classList.toggle('hidden', !gameState.questionsOff);
}

/* ---- Tap the ground to plant a flower ---- */
const MAX_FLOWERS = 30;
function plantAt(ev){
  if (currentScreen !== 'game') return;
  const ov = document.getElementById('recall-overlay');
  if (ov && ov.classList.contains('show')) return;
  const box = document.getElementById('garden-container').getBoundingClientRect();
  if (!box.width || !box.height) return;
  resumeAudio();
  let x = (ev.clientX - box.left) / box.width * 100;
  let y = (ev.clientY - box.top) / box.height * 100;
  x = Math.max(7, Math.min(93, x));
  y = Math.max(60, Math.min(92, y));   // a tap on the sky plants at the top of the grass
  growFlower(-1, pickRandomFlowerType(), { x: x, y: y });
  haptic(12);
  chime();
  resetIdleTimer();
}
function chime(){
  if (!audioCtx || isMusicMuted()) return;
  const notes = [523.25, 587.33, 659.25, 783.99, 880.0];
  const f = notes[Math.floor(Math.random() * notes.length)];
  try { playNote(f, audioCtx.currentTime, 0.5, 0.35); playNote(f * 1.5, audioCtx.currentTime + 0.12, 0.6, 0.22); } catch(e){}
}

async function backupData(){
  try {
    const data = {
      app: 'dgs', game: CONFIG.gameId, version: CONFIG.version,
      exportedAt: new Date().toISOString(),
      facts: facts,
      settings: {
        lang: currentLang, level: sharedLevel(), onlineVoice: sharedOnline(), contrast: sharedContrast(),
        musicVolume: safeGet(gk('musicVolume'), null), speechVolume: safeGet(gk('speechVolume'), null),
        sessionLength: safeGet(gk('sessionLength'), null),
        recallCount: safeGet(gk('recallCount'), null),
        sessionLog: getJSON(gk('sessionLog'), [])
      }
    };
    const filename = `memorygarden-backup-${new Date().toISOString().slice(0, 10)}.json`;
    const file = new File([JSON.stringify(data)], filename, { type: 'application/json' });
    const done = () => { mgSetupMark('backup'); KIT.toast(KIT.s('backup_done')); if (currentScreen === 'settings') renderSettings(true); };
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], title: filename }); done(); return; }
      catch(e) { if (e && e.name === 'AbortError') return; }
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(file); a.download = filename;
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    done();
  } catch(e) { KIT.dialog({ title: KIT.s('backup_fail') }); }
}

async function restoreData(){
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'application/json,.json';
  input.onchange = async (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    try {
      const text = await file.text();
      const data = JSON.parse(text);
      if (!data || !Array.isArray(data.facts)) throw new Error('invalid');
      const confirm = await openModal(`
        <h3>${t('settings.restore.preview')}</h3>
        <p><strong>${t('settings.restore.warning')}</strong></p>
        <p>${data.facts.length} facts · ${data.settings && data.settings.sessionLog ? data.settings.sessionLog.length : 0} sessions</p>
        <div class="modal-actions">
          <button class="dgs-btn dgs-btn--primary" data-modal-action="cancel" type="button">${t('btn.cancel')}</button>
          <button class="dgs-btn dgs-btn--secondary" data-modal-action="restore" type="button">${t('settings.restore.confirm')}</button>
        </div>
      `);
      if (confirm !== 'restore') return;
      facts = data.facts.filter(f => f && typeof f.answer === 'string').slice(0, CONFIG.maxFacts).map(f => ({
        ...f,
        id: String(f.id || ('f_' + Date.now() + '_' + Math.random().toString(36).slice(2,7))).replace(/[^\w-]/g,''),
        answer: String(f.answer).slice(0, 80),
        emoji: typeof f.emoji === 'string' ? f.emoji.slice(0, 8).replace(/[<>&"']/g,'') : '🌱',
        photoDataUri: (typeof f.photoDataUri === 'string' && /^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+\/=]+$/.test(f.photoDataUri)) ? f.photoDataUri : null,
        audioDataUri: (typeof f.audioDataUri === 'string' && /^data:audio\/[\w.+-]+(;[\w=.+-]+)*;base64,[A-Za-z0-9+\/=]+$/.test(f.audioDataUri)) ? f.audioDataUri : null
      }));
      saveFacts();
      if (data.settings) {
        if (data.settings.lang) KIT.sharedWrite(CONFIG.sharedKeys.lang, data.settings.lang === 'zh-CN' ? 'zh-CN' : 'en');
        if (data.settings.level && CONFIG.levels[data.settings.level]) KIT.sharedWrite(CONFIG.sharedKeys.level, data.settings.level);
        if (data.settings.onlineVoice != null) KIT.sharedWrite(CONFIG.sharedKeys.onlineVoice, data.settings.onlineVoice === true || data.settings.onlineVoice === 'on' || data.settings.onlineVoice === 'true');
        if (data.settings.contrast != null) { KIT.sharedWrite(CONFIG.sharedKeys.contrast, data.settings.contrast === true || data.settings.contrast === 'high' || data.settings.contrast === 'true'); applyContrast(); }
        if (data.settings.musicVolume !== undefined && data.settings.musicVolume !== null) safeSet(gk('musicVolume'), data.settings.musicVolume);
        if (data.settings.speechVolume !== undefined && data.settings.speechVolume !== null) safeSet(gk('speechVolume'), data.settings.speechVolume);
        if (data.settings.sessionLength !== undefined && data.settings.sessionLength !== null) safeSet(gk('sessionLength'), data.settings.sessionLength);
        if (data.settings.recallCount) safeSet(gk('recallCount'), String(data.settings.recallCount));
        if (data.settings.sessionLog) setJSON(gk('sessionLog'), data.settings.sessionLog);
      }
      renderSettings();
      KIT.toast(KIT.s('restore_done'));
    } catch(err) {
      showToast(t('settings.restore.error'));
    }
  };
  input.click();
}

function openFactForm(existingFact){
  const isEdit = !!existingFact;
  const fact = existingFact ? { ...existingFact } : {
    answer: '', category: 'family', photoDataUri: null, audioDataUri: null, emoji: '🌱'
  };
  const categories = ['family','home','routine','garden'];
  const html = `
    <h3>${t(isEdit ? 'factForm.editTitle' : 'factForm.title')}</h3>
    <div class="form-field">
      <label>${t('factForm.answer')}</label>
      <input type="text" id="fact-answer" placeholder="${t('factForm.answerPlaceholder')}" value="${escapeHtml(fact.answer || '')}">
    </div>
    <div class="form-field">
      <label>${t('factForm.category')}</label>
      <div class="category-selector">
        ${categories.map(c => `<button class="cat-btn ${fact.category === c ? 'active' : ''}" data-cat="${c}" type="button">${t('cat.' + c)}</button>`).join('')}
      </div>
    </div>
    <div class="form-field">
      <label>${t('factForm.photo')}</label>
      <div class="photo-upload-area">
        <div class="photo-preview" id="photo-preview">${fact.photoDataUri ? `<img src="${fact.photoDataUri}" alt="">` : '📷'}</div>
        <button class="dgs-btn dgs-btn--secondary" id="btn-add-photo" type="button" style="min-height:52px;padding:0.5rem 1rem">${fact.photoDataUri ? t('factForm.photoChange') : t('factForm.photoAdd')}</button>
        ${fact.photoDataUri ? `<button class="dgs-btn dgs-btn--quiet" id="btn-remove-photo" type="button" style="font-size:0.85rem;min-height:44px">${t('btn.delete')}</button>` : ''}
        <input type="file" id="photo-input" accept="image/*" style="display:none">
      </div>
    </div>
    <div class="form-field">
      <label>${t('factForm.voice')}</label>
      <div style="display:flex;gap:0.5rem;flex-wrap:wrap">
        <button class="record-btn" id="btn-record" type="button">🎤 ${t('factForm.record')}</button>
        ${fact.audioDataUri ? `<button class="record-btn" id="btn-play-rec" type="button">▶ ${t('factForm.recordPlay')}</button>` : ''}
      </div>
    </div>
    <div class="modal-actions">
      <button class="dgs-btn dgs-btn--primary" id="btn-save-fact" type="button">${t('btn.save')}</button>
      <button class="dgs-btn dgs-btn--quiet" data-modal-action="cancel" type="button">${t('btn.cancel')}</button>
    </div>
  `;
  const overlay = document.getElementById('modal-overlay');
  const content = document.getElementById('modal-content');
  content.innerHTML = html;
  overlay.classList.add('show');

  content.querySelectorAll('.cat-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      content.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      fact.category = btn.getAttribute('data-cat');
    });
  });

  const photoInput = content.querySelector('#photo-input');
  const photoPreview = content.querySelector('#photo-preview');
  content.querySelector('#btn-add-photo').addEventListener('click', () => photoInput.click());
  const removePhotoBtn = content.querySelector('#btn-remove-photo');
  if (removePhotoBtn) removePhotoBtn.addEventListener('click', () => {
    fact.photoDataUri = null;
    photoPreview.innerHTML = '📷';
    removePhotoBtn.remove();
  });
  photoInput.addEventListener('change', async (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    try {
      const dataUri = await resizeImage(file, 400);
      fact.photoDataUri = dataUri;
      photoPreview.innerHTML = `<img src="${dataUri}" alt="">`;
    } catch(err) { showToast(t('notice.storageUnavailable')); }
  });

  const recBtn = content.querySelector('#btn-record');
  let mediaRecorder = null;
  let chunks = [];
  recBtn.addEventListener('click', async () => {
    if (mediaRecorder && mediaRecorder.state === 'recording'){
      mediaRecorder.stop();
      return;
    }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mediaRecorder = new MediaRecorder(stream);
      chunks = [];
      mediaRecorder.ondataavailable = (ev) => { if (ev.data.size > 0) chunks.push(ev.data); };
      mediaRecorder.onstop = () => {
        const blob = new Blob(chunks, {type: mediaRecorder.mimeType || 'audio/webm'});
        const reader = new FileReader();
        reader.onloadend = () => {
          fact.audioDataUri = reader.result;
          const playContainer = recBtn.parentElement;
          let playBtn = playContainer.querySelector('#btn-play-rec');
          if (!playBtn){
            playBtn = document.createElement('button');
            playBtn.className = 'record-btn';
            playBtn.id = 'btn-play-rec';
            playBtn.type = 'button';
            playContainer.appendChild(playBtn);
          }
          playBtn.innerHTML = '▶ ' + t('factForm.recordPlay');
          playBtn.onclick = () => {
            try { new Audio(fact.audioDataUri).play(); } catch(e){}
          };
          recBtn.innerHTML = '🎤 ' + t('factForm.recordAgain');
          recBtn.classList.remove('recording');
        };
        reader.readAsDataURL(blob);
        stream.getTracks().forEach(tr => tr.stop());
      };
      mediaRecorder.start();
      recBtn.classList.add('recording');
      recBtn.innerHTML = '⏹ ' + t('factForm.recordStop');
      setTimeout(() => {
        if (mediaRecorder && mediaRecorder.state === 'recording') mediaRecorder.stop();
      }, 10000);
    } catch(err) {
      showToast(t('notice.micDenied'));
    }
  });

  const playRecBtn = content.querySelector('#btn-play-rec');
  if (playRecBtn) playRecBtn.addEventListener('click', () => {
    try { new Audio(fact.audioDataUri).play(); } catch(e){}
  });

  content.querySelector('#btn-save-fact').addEventListener('click', async () => {
    const answer = content.querySelector('#fact-answer').value.trim();
    if (!answer) { content.querySelector('#fact-answer').focus(); return; }
    fact.answer = answer;
    fact.label = fact.label || {};
    fact.label[currentLang] = answer;
    fact.emoji = fact.emoji || '🌱';
    if (isEdit){
      await updateFact(fact.id, fact);
    } else {
      await addFact(fact);
      showToast(t('notice.addedFact'));
    }
    overlay.classList.remove('show');
    renderSettings();
  });

  content.querySelector('[data-modal-action="cancel"]').addEventListener('click', () => {
    overlay.classList.remove('show');
  });
}

function resizeImage(file, maxDim){
  return new Promise((resolve, reject) => {
    const img = new Image();
    const reader = new FileReader();
    reader.onload = (e) => { img.src = e.target.result; };
    reader.onerror = reject;
    img.onload = () => {
      let {width, height} = img;
      if (width > maxDim || height > maxDim){
        if (width > height){ height = (height * maxDim) / width; width = maxDim; }
        else { width = (width * maxDim) / height; height = maxDim; }
      }
      const canvas = document.createElement('canvas');
      canvas.width = width; canvas.height = height;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, width, height);
      resolve(canvas.toDataURL('image/jpeg', 0.75));
    };
    img.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function boot(){
  KIT.init({ lang: () => currentLang, getState: (k, d) => getJSON(gk(k), d), setState: (k, v) => setJSON(gk(k), v) });
  persistStorage();
  applyContrast();
  const mv = parseFloat(safeGet(gk('musicVolume'), String(CONFIG.defaultMusicVolume)));
  setMusicVolume(mv);
  initSpeech();
  await loadFacts();
  const storedLang = KIT.sharedRead(CONFIG.sharedKeys.lang, null);
  if (storedLang === 'zh-CN' || storedLang === 'en'){
    setLang(storedLang);
    renderStartScreen();
    showScreen('start');
  } else {
    currentLang = CONFIG.defaultLang;   // not saved until they choose
    applyLangToDom();
    initLanguageChoice();
    showScreen('language');
    langChoiceActive = true;
  }
  applyLangToDom();
  document.querySelectorAll('[data-i18n-aria]').forEach(el => { const k = el.getAttribute('data-i18n-aria'); const v = t(k); if (v && v !== k) el.setAttribute('aria-label', v); });
  initLanguageSwitcher();
  initGameButtons();
  document.addEventListener('visibilitychange', onVisibilityChange);
  const startMusicOnce = () => {
    if (!audioCtx) initAudio();
    resumeAudio();
    if (!musicRunning) startMusic();
    document.removeEventListener('pointerdown', startMusicOnce);
  };
  document.addEventListener('pointerdown', startMusicOnce);
  updateMuteBtn();
  requestWakeLock();
}

if (document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', boot);
} else {
  boot();
}
