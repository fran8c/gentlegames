/* ==== SECTION: STYLES ==== */
/* MOO Dementia Games kit v1 (DGS_KIT_VERSION). Part 1 is identical in every game except the palette
   values; part 2 is the shared components (kit bundle.css); part 3 is Radio Days only. */

/* ---------- 1. Tokens: Radio Days palette ---------- */
:root{
  --bg:#e8f6f3; --surface:#ffffff; --surface-sunk:#dcefea; --text:#12302c; --text-muted:#4f605d;
  --primary:#0f766e; --primary-ink:#0e6c65; --primary-strong:#0a524d; --primary-soft:#dbeeea; --on-primary:#ffffff;
  --accent:#e4572e; --accent-soft:#fbe3da; --border:#7f918d; --divider:#cbe2dd; --focus-ring:#0f766e;
  --art-ink:#3a2f2a;
  --space-1:8px; --space-2:12px; --space-3:16px; --space-4:24px; --space-5:32px; --space-6:48px;
  --radius-sm:12px; --radius-md:20px; --radius-lg:28px; --radius-pill:999px;
  --tap-min:72px; --tap-play:104px; --icon:32px; --icon-lg:44px; --content-max:560px;
  --shadow-card:0 1px 2px rgba(0,0,0,.06),0 6px 18px rgba(0,0,0,.07);
  --shadow-lift:0 2px 4px rgba(0,0,0,.08),0 12px 28px rgba(0,0,0,.10);
  --font-sans:"PingFang SC","Noto Sans SC","Microsoft YaHei","Hiragino Sans GB",system-ui,-apple-system,"Segoe UI",sans-serif;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px); --safe-r:env(safe-area-inset-right,0px);
}
@media (min-width:700px) and (min-height:560px){ :root{ --tap-min:88px; } }
html.hc{
  --bg:#ffffff; --surface:#ffffff; --surface-sunk:#f0f0f0; --text:#000000; --text-muted:#2b2b2b;
  --primary:#0a524d; --primary-ink:#0a524d; --primary-strong:#05322f; --primary-soft:#d5ebe7;
  --accent:#b23c1a; --accent-soft:#f6e0d8; --border:#000000; --divider:#5c5c5c; --focus-ring:#000000;
}

/* ==== MOO Dementia Games kit v1: shared components (identical in every game) ==== */
/* ---------- 2. Shared components (kit) ---------- */
*,*::before,*::after{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{
  margin:0; height:100%; background:var(--bg); color:var(--text);
  font-family:var(--font-sans); font-size:22px; line-height:1.55;
  overscroll-behavior:none; overflow:hidden;
  -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
  touch-action:manipulation; -webkit-text-size-adjust:100%;
}
img,svg{ -webkit-user-drag:none; user-select:none; }
[hidden]{ display:none !important; }
h1,h2,h3,h4,p{ margin:0; }
button{ font:inherit; color:inherit; }
.dgs-icon{ width:var(--icon); height:var(--icon); flex:none; display:block; }

.screen{
  position:fixed; inset:0; display:flex; flex-direction:column; gap:var(--space-3);
  background:var(--bg);
  padding:calc(var(--safe-t) + 12px) calc(var(--safe-r) + 16px) calc(var(--safe-b) + 12px) calc(var(--safe-l) + 16px);
}
.screen > .col{ width:100%; max-width:var(--content-max); margin:0 auto; display:flex; flex-direction:column; gap:var(--space-3); min-height:0; flex:1 1 auto; }
.dgs-topbar{ display:flex; align-items:center; justify-content:space-between; gap:var(--space-2); flex:0 0 auto; min-height:60px; }
.dgs-topbar .grow{ flex:1; }
.scroll{ overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain; touch-action:pan-y; flex:1 1 auto; min-height:0; margin:0 -16px; padding:4px 16px 40px; }
.scroll::-webkit-scrollbar{ width:0; }
.scroll > .col{ max-width:var(--content-max); margin:0 auto; display:flex; flex-direction:column; gap:var(--space-3); }

/* Buttons */
.dgs-btn{
  appearance:none; border:0; margin:0; cursor:pointer;
  display:flex; align-items:center; justify-content:center; gap:var(--space-2);
  min-height:var(--tap-min); width:100%; padding:0 var(--space-4);
  border-radius:var(--radius-lg); font-size:26px; line-height:32px; font-weight:700; letter-spacing:.01em; text-align:center;
  transition:transform .12s ease, box-shadow .12s ease; touch-action:manipulation;
}
.dgs-btn:focus-visible,.dgs-guide:focus-visible,.dgs-round:focus-visible,.dgs-lang button:focus-visible,.dgs-hold:focus-visible,.dgs-level:focus-visible,.dgs-mood:focus-visible,.dgs-seg button:focus-visible,.dgs-switch:focus-visible{ outline:3px solid var(--focus-ring); outline-offset:3px; }
.dgs-btn:active{ transform:scale(.96); }
/* Every button gives a smooth, slight press so a tap clearly registers */
.dgs-round,.dgs-guide,.dgs-level,.dgs-hold,.dgs-mood,.dgs-seg button,.dgs-lang button{ transition:transform .12s ease, box-shadow .12s ease, background-color .12s ease; }
.dgs-round:active,.dgs-guide:active,.dgs-level:active,.dgs-hold:active,.dgs-mood:active,.dgs-seg button:active,.dgs-lang button:active{ transform:scale(.96); }
@media (prefers-reduced-motion:reduce){
  .dgs-btn:active,.dgs-round:active,.dgs-guide:active,.dgs-level:active,.dgs-hold:active,.dgs-mood:active,.dgs-seg button:active,.dgs-lang button:active{ transform:none; filter:brightness(.92); }
}
.dgs-btn--primary{ background:var(--primary); color:var(--on-primary); box-shadow:0 4px 0 var(--primary-strong); }
.dgs-btn--primary:active{ box-shadow:0 2px 0 var(--primary-strong); }
.dgs-btn--secondary{ background:var(--surface); color:var(--text); box-shadow:inset 0 0 0 2px var(--border),var(--shadow-card); }
.dgs-btn--quiet{ background:transparent; color:var(--primary-ink); min-height:56px; font-size:20px; font-weight:600; text-decoration:underline; text-underline-offset:5px; }
.dgs-btn--small{ min-height:64px; font-size:21px; }
.dgs-btn--play{ min-height:var(--tap-play); font-size:34px; line-height:40px; font-weight:800; box-shadow:0 5px 0 var(--primary-strong),var(--shadow-lift); }
.dgs-btn__disc{ width:56px; height:56px; border-radius:50%; background:var(--on-primary); color:var(--primary); display:grid; place-items:center; flex:none; }
.dgs-btn__disc .dgs-icon{ width:28px; height:28px; margin-left:4px; }

/* Language switch and round buttons */
.dgs-lang{ display:inline-flex; padding:4px; border-radius:var(--radius-pill); background:var(--surface-sunk); box-shadow:inset 0 0 0 1.5px var(--divider); }
.dgs-lang button{ appearance:none; border:0; cursor:pointer; min-height:52px; min-width:76px; padding:0 18px; border-radius:var(--radius-pill); background:transparent; color:var(--text); font-size:20px; font-weight:600; }
.dgs-lang button[aria-pressed="true"]{ background:var(--surface); color:var(--primary-ink); font-weight:800; box-shadow:inset 0 0 0 2.5px var(--primary),var(--shadow-card); }
.dgs-round{ appearance:none; border:0; cursor:pointer; width:60px; height:60px; flex:none; border-radius:50%; display:grid; place-items:center; background:var(--surface); color:var(--text); box-shadow:inset 0 0 0 2px var(--border),var(--shadow-card); }
.dgs-round .dgs-icon{ width:30px; height:30px; }
.dgs-back{ appearance:none; border:0; cursor:pointer; display:inline-flex; align-items:center; gap:8px; min-height:60px; padding:0 18px 0 12px; border-radius:var(--radius-pill); background:var(--surface); color:var(--text); font-size:20px; font-weight:700; box-shadow:inset 0 0 0 2px var(--border),var(--shadow-card); }
.dgs-back .dgs-icon{ width:26px; height:26px; }
#muteBtn{ position:fixed; z-index:75; top:calc(var(--safe-t) + 12px); right:calc(var(--safe-r) + 16px); }

/* Titles and text */
.dgs-title{ margin:0; text-align:center; font-size:40px; line-height:48px; font-weight:800; color:var(--text); text-wrap:balance; }
.dgs-title small{ display:block; font-size:20px; line-height:28px; font-weight:600; color:var(--text-muted); letter-spacing:.02em; margin-top:2px; }
.dgs-screen-title{ margin:0; text-align:center; font-size:30px; line-height:40px; font-weight:700; text-wrap:balance; }
.dgs-caption{ margin:0; text-align:center; font-size:28px; line-height:40px; font-weight:600; text-wrap:balance; }
.key{ font-style:normal; color:var(--primary); font-weight:800; text-decoration:underline; text-decoration-thickness:3px; text-underline-offset:6px; text-decoration-color:var(--accent); }
.dgs-footnote{ margin:0; text-align:center; font-size:18px; line-height:27px; color:var(--text-muted); }
.note{ font-size:18px; line-height:27px; color:var(--text-muted); margin:0; }

/* Picture frame */
.dgs-art{ border-radius:var(--radius-md); background:var(--surface); box-shadow:var(--shadow-card); overflow:hidden; display:block; }
.dgs-art img,.dgs-art svg{ width:100%; height:100%; display:block; object-fit:cover; }

/* Guide buttons */
.dgs-guides{ display:grid; grid-template-columns:1fr 1fr; gap:var(--space-2); }
.dgs-guide{ appearance:none; border:0; cursor:pointer; min-height:104px; padding:var(--space-2); border-radius:var(--radius-lg); background:var(--surface); color:var(--text); box-shadow:inset 0 0 0 2px var(--border),var(--shadow-card); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; font-size:21px; line-height:26px; font-weight:700; text-align:center; }
.dgs-guide .dgs-icon{ width:var(--icon-lg); height:var(--icon-lg); color:var(--primary); }

/* Dots */
.dgs-dots{ display:flex; justify-content:center; gap:10px; }
.dgs-dots i{ width:12px; height:12px; border-radius:50%; background:var(--divider); display:block; }
.dgs-dots i.on{ background:var(--primary); width:32px; border-radius:var(--radius-pill); }

/* Quote (kit Quote): caregiver page top, and the player's Rest screen */
.dgs-quote{ margin:0; padding:18px 20px 16px; border-radius:var(--radius-md); background:var(--accent-soft); display:flex; flex-direction:column; gap:10px; }
.dgs-quote blockquote{ margin:0; font-size:19px; line-height:30px; font-weight:500; color:var(--text); }
.dgs-quote blockquote::before{ content:"“"; } .dgs-quote blockquote::after{ content:"”"; }
html[lang="zh-CN"] .dgs-quote blockquote::before{ content:"“"; }
.dgs-quote figcaption{ font-size:16px; line-height:22px; color:var(--text-muted); }
.dgs-quote cite{ font-style:italic; }
.dgs-quote.tip small{ font-size:15px; line-height:20px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:var(--primary-ink); }
.dgs-quote.tip p{ margin:0; font-size:19px; line-height:30px; font-weight:600; }
.dgs-quote.player{ background:transparent; padding:0 4px; text-align:center; }
.dgs-quote.player blockquote{ font-size:24px; line-height:34px; }
/* Caregiver page */
.dgs-kind{ display:grid; grid-template-columns:auto 1fr; gap:14px; align-items:center; padding:18px 20px; border-radius:var(--radius-md); background:var(--accent-soft); }
.dgs-kind .dgs-icon{ width:40px; height:40px; color:var(--primary); }
.dgs-kind small{ display:block; font-size:16px; line-height:22px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:var(--primary-ink); }
.dgs-kind b{ display:block; font-size:22px; line-height:31px; font-weight:700; }
.dgs-disclaimer{ margin:0; padding:var(--space-3) var(--space-4); border-radius:var(--radius-md); background:var(--surface-sunk); font-size:19px; line-height:28px; font-weight:600; }
.dgs-quick{ display:grid; grid-template-columns:repeat(3,1fr); gap:var(--space-2); padding:var(--space-3); border-radius:var(--radius-md); background:var(--surface); box-shadow:var(--shadow-card); }
.dgs-quick > div{ display:flex; flex-direction:column; align-items:center; gap:8px; text-align:center; }
.dgs-quick__icon{ width:64px; height:64px; border-radius:50%; background:var(--primary-soft); color:var(--primary); display:grid; place-items:center; }
.dgs-quick b{ font-size:19px; line-height:25px; font-weight:700; }
.dgs-quick span.other{ font-size:16px; line-height:21px; color:var(--text-muted); }
.dgs-section{ border-radius:var(--radius-md); background:var(--surface); box-shadow:var(--shadow-card); overflow:hidden; }
.dgs-section > summary{ list-style:none; cursor:pointer; display:flex; align-items:center; gap:var(--space-2); min-height:var(--tap-min); padding:var(--space-2) var(--space-4); font-size:24px; line-height:32px; font-weight:700; }
.dgs-section > summary::-webkit-details-marker{ display:none; }
.dgs-section > summary .dgs-icon{ color:var(--primary); }
.dgs-section > summary::after{ content:""; margin-left:auto; flex:none; width:14px; height:14px; border-right:3px solid var(--text); border-bottom:3px solid var(--text); transform:rotate(45deg) translate(-3px,-3px); transition:transform .2s; }
.dgs-section[open] > summary::after{ transform:rotate(-135deg) translate(-3px,-3px); }
.dgs-section > summary:focus-visible{ outline:3px solid var(--focus-ring); outline-offset:-3px; }
.dgs-section__body{ padding:0 var(--space-4) var(--space-4); font-size:19px; line-height:30px; display:flex; flex-direction:column; gap:12px; }
.dgs-section__body h4{ margin:8px 0 0; font-size:19px; line-height:26px; color:var(--primary-ink); }
.dgs-section__body ul{ margin:0; padding-left:1.1em; }
.dgs-section__body li{ margin:4px 0; }
.dgs-bda{ display:grid; gap:10px; }
.dgs-bda div{ padding:12px 16px; border-radius:var(--radius-sm); background:var(--surface-sunk); }
.dgs-bda b{ display:block; color:var(--primary-ink); font-size:16px; letter-spacing:.05em; text-transform:uppercase; }
.dgs-part{ display:grid; gap:4px; padding:14px 16px; border-radius:var(--radius-sm); background:var(--surface-sunk); }
.dgs-part b{ font-size:20px; line-height:27px; }
.dgs-part p{ margin:0; font-size:18px; line-height:27px; }
.dgs-part .why{ display:grid; grid-template-columns:auto 1fr; gap:8px; align-items:start; margin-top:4px; padding-top:8px; border-top:1.5px solid var(--divider); }
.dgs-part .why .dgs-icon{ width:22px; height:22px; color:var(--primary); margin-top:3px; }
.dgs-part .why em{ font-style:normal; font-weight:700; color:var(--primary-ink); }
.dgs-sub{ font-size:17px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:var(--primary-ink); margin:6px 4px 0; }
.dgs-card{ padding:18px 20px; border-radius:var(--radius-md); background:var(--surface); box-shadow:var(--shadow-card); display:flex; flex-direction:column; gap:10px; }
.dgs-card h3{ font-size:22px; line-height:30px; }

/* Level picker */
.dgs-levels{ display:grid; gap:var(--space-2); }
.dgs-level{ appearance:none; border:0; cursor:pointer; text-align:left; display:grid; grid-template-columns:36px 1fr; gap:4px 14px; align-items:center; min-height:var(--tap-min); padding:14px 18px; border-radius:var(--radius-md); background:var(--surface); color:var(--text); box-shadow:inset 0 0 0 2px var(--border); }
.dgs-level b{ grid-column:2; font-size:22px; line-height:28px; }
.dgs-level > span:not(.dgs-radio){ grid-column:2; font-size:17px; line-height:24px; color:var(--text-muted); }
.dgs-level .dgs-radio{ grid-column:1; grid-row:1/3; width:30px; height:30px; border-radius:50%; box-shadow:inset 0 0 0 2.5px var(--border); display:grid; place-items:center; }
.dgs-level[aria-checked="true"]{ background:var(--primary-soft); box-shadow:inset 0 0 0 3px var(--primary); }
.dgs-level[aria-checked="true"] b{ color:var(--primary-ink); }
.dgs-level[aria-checked="true"] .dgs-radio{ box-shadow:inset 0 0 0 2.5px var(--primary); }
.dgs-level[aria-checked="true"] .dgs-radio::after{ content:""; width:16px; height:16px; border-radius:50%; background:var(--primary); }

/* Hold button */
.dgs-hold{ appearance:none; border:0; cursor:pointer; width:100%; display:flex; align-items:center; gap:var(--space-3); min-height:88px; padding:12px 20px; border-radius:var(--radius-lg); background:var(--surface); color:var(--text); box-shadow:inset 0 0 0 2px var(--border),var(--shadow-card); text-align:left; touch-action:none; }
.dgs-hold__ring{ --p:0; flex:none; width:60px; height:60px; border-radius:50%; display:grid; place-items:center; background:conic-gradient(var(--accent) calc(var(--p) * 1turn), var(--surface-sunk) 0); }
.dgs-hold__ring > span{ width:46px; height:46px; border-radius:50%; background:var(--surface); display:grid; place-items:center; }
.dgs-hold__ring .dgs-icon{ width:26px; height:26px; }
.dgs-hold b{ display:block; font-size:22px; line-height:28px; }
.dgs-hold small{ display:block; font-size:17px; line-height:22px; color:var(--text-muted); }

/* Settings */
.dgs-group{ display:flex; flex-direction:column; gap:6px; scroll-margin-top:12px; }
.dgs-group > h3{ margin:0 4px 4px; font-size:17px; line-height:22px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:var(--primary-ink); display:flex; align-items:center; gap:8px; }
.dgs-group > h3 .dgs-icon{ width:22px; height:22px; }
.dgs-group__rows{ border-radius:var(--radius-md); background:var(--surface); box-shadow:var(--shadow-card); }
.dgs-row{ display:grid; grid-template-columns:1fr auto; align-items:center; gap:8px 16px; padding:16px 20px; min-height:var(--tap-min); border-top:1.5px solid var(--divider); scroll-margin-top:12px; }
.dgs-row:first-child{ border-top:0; }
.dgs-row > .lbl,.dgs-row > label{ font-size:19px; line-height:26px; font-weight:600; min-width:0; }
.dgs-row > .note,.dgs-row > p{ grid-column:1 / -1; }
.dgs-row--stack{ grid-template-columns:1fr; }
.dgs-row--stack > *{ grid-column:1 / -1; }
.dgs-switch{ appearance:none; margin:0; cursor:pointer; width:68px; height:40px; border-radius:var(--radius-pill); background:var(--surface-sunk); box-shadow:inset 0 0 0 2px var(--border); position:relative; border:0; flex:none; transition:background-color .15s; }
.dgs-switch::after{ content:""; position:absolute; top:5px; left:5px; width:30px; height:30px; border-radius:50%; background:var(--surface); box-shadow:0 0 0 2px var(--border); transition:transform .15s; }

/* Pure function: Spotify playlist → { id, canonicalUrl } or { error }.
   Accepts open.spotify.com/playlist/{id} (with ?si=…), /intl-xx/, /embed/, and spotify:playlist:{id}.
   Rejects album / track / artist / user-profile links. Never fetches anything. */
function parseSpotifyPlaylist(input){
  if (typeof input !== 'string') return { error: 'empty' };
  const s = input.trim();
  if (!s) return { error: 'empty' };
  let id = null;
  if (/^spotify:/i.test(s)) {
    const m = s.match(/^spotify:playlist:([A-Za-z0-9]+)$/i);
    if (!m) return { error: 'spotifyType' };
    id = m[1];
  } else {
    let u = null;
    try { u = new URL(s); } catch(e){ return { error: 'format' }; }
    if (u.protocol !== 'https:' && u.protocol !== 'http:') return { error: 'scheme' };
    if (u.hostname.toLowerCase() !== 'open.spotify.com') return { error: 'format' };
    const parts = u.pathname.split('/').filter(Boolean);
    let i = 0;
    if (parts[i] && /^intl-[a-z-]{2,}$/i.test(parts[i])) i++;
    if (parts[i] === 'embed') i++;
    if (parts[i] !== 'playlist') return { error: 'spotifyType' };
    id = parts[i + 1] || '';
  }
  if (!/^[A-Za-z0-9]{22}$/.test(id)) return { error: 'id' };
  return { id: id, canonicalUrl: 'https://open.spotify.com/playlist/' + id };
}

/* Pure function: any music link → { service, url, embed, outside } or { error }.
   url = the clean link to store and to open; embed = player address for inside the radio
   (null if this service cannot play inside); outside = true when it can only open elsewhere. */
function parseMusicLink(input){
  if (typeof input !== 'string' || !input.trim()) return { error: 'empty' };
  const s = input.trim();
  if (/^spotify:/i.test(s) || /open\.spotify\.com/i.test(s)) {
    const p = parseSpotifyPlaylist(s);
    if (p.error) return p;
    return { service: 'spotify', url: p.canonicalUrl,
             embed: 'https://open.spotify.com/embed/playlist/' + p.id + '?theme=0', outside: false };
  }
  let u;
  try { u = new URL(s); } catch(e){ return { error: 'format' }; }
  if (u.protocol !== 'https:') return { error: 'scheme' };
  const host = u.hostname.toLowerCase().replace(/^www\.|^m\./, '');

  // YouTube and YouTube Music: playlist or single video. YouTube Music becomes the same YouTube list.
  if (host === 'youtube.com' || host === 'music.youtube.com' || host === 'youtu.be') {
    const list = u.searchParams.get('list');
    let vid = u.searchParams.get('v');
    if (host === 'youtu.be') vid = u.pathname.split('/').filter(Boolean)[0] || null;
    const okId = x => !!x && /^[A-Za-z0-9_-]{6,64}$/.test(x);
    if (okId(list)) {
      return { service: 'youtube', url: 'https://www.youtube.com/playlist?list=' + list,
               embed: 'https://www.youtube-nocookie.com/embed/videoseries?list=' + list + '&rel=0&modestbranding=1&playsinline=1',
               outside: false };
    }
    if (okId(vid)) {
      return { service: 'youtube', url: 'https://www.youtube.com/watch?v=' + vid,
               embed: 'https://www.youtube-nocookie.com/embed/' + vid + '?rel=0&modestbranding=1&playsinline=1',
               outside: false };
    }
    return { error: 'format' };
  }
  // Apple Music: playlist or album pages have a matching embed address.
  if (host === 'music.apple.com') {
    const path = u.pathname;
    if (!/\/(playlist|album)\//.test(path)) return { error: 'format' };
    return { service: 'apple', url: 'https://music.apple.com' + path,
             embed: 'https://embed.music.apple.com' + path, outside: false };
  }
  // SoundCloud: any track or set page.
  if (host === 'soundcloud.com' || host === 'on.soundcloud.com') {
    const clean = 'https://soundcloud.com' + u.pathname;
    return { service: 'soundcloud', url: clean,
             embed: 'https://w.soundcloud.com/player/?url=' + encodeURIComponent(clean) + '&auto_play=false&visual=false&show_comments=false',
             outside: false };
  }
  // Anything else: kept as a link that opens outside the game.
  u.hash = '';
  return { service: 'other', url: u.toString(), embed: null, outside: true };
}

function linkKey(station){ return CONFIG.STORAGE.PREFIX + 'link.' + station; }

function linkStarter(station){
  const p = STARTER_PLAYLISTS[station];
  return p ? p.url : null;
}
function linkStored(station){
  let raw = storageGet(linkKey(station), null);
  if (typeof raw !== 'string' || !raw) return null;
  const parsed = parseMusicLink(raw);
  return parsed.error ? null : parsed.url;
}
/* The link a station uses now (caregiver's own, else the starter), parsed. null = no link. */
function linkFor(station){
  if (!station || station === 'own') return null;
  const url = linkStored(station) || linkStarter(station);
  if (!url) return null;
  const p = parseMusicLink(url);
  return p.error ? null : p;
}
function linkIsCustom(station){
  const stored = linkStored(station);
  return !!stored && stored !== linkStarter(station);
}
function linksAllStored(){
  const out = {};
  CONFIG.STATION_ORDER.forEach(st => { const u = linkStored(st); if (u) out[st] = u; });
  return out;
}
function linkSave(station, raw){
  const p = parseMusicLink(raw);
  if (p.error) return p;
  storageSet(linkKey(station), p.url);
  return p;
}
function linkReset(station){
  storageDel(linkKey(station));
}
/* Open a link outside the game (normal user-initiated navigation, never an iframe). */
function linkOpen(url){
  if (!url) return;
  try { window.open(url, '_blank', 'noopener,noreferrer'); } catch(e){}
}
function isOnline(){ return !('onLine' in navigator) || navigator.onLine !== false; }

    { id: 'i30', type: 'ikeda', for: 'care', en: 'Let’s encourage our friends who are dedicating themselves to childrearing, caring for the elderly and nursing the sick.', zh: '让我们鼓励正在养育孩子、照顾长辈、护理病人的朋友。', src: '“To My Friends”, Seikyo Shimbun (World Tribune translation, 28 Dec 2022)', zhFrom: 'ours' },
    { id: 'i44', type: 'ikeda', for: 'care', en: 'Sincere efforts to brighten our surroundings and the lives of others return to illuminate our own final years with dignity.', zh: '真诚地为周围环境和他人的生活带来光明，这份努力会回过来，让我们自己的晚年也充满尊严。', src: JT, zhFrom: 'ours' },
    { id: 'i25', type: 'ikeda', for: 'care', en: 'Individuals who feel needed and strive on behalf of others can keep their youth and energy.', zh: '只要一心怀着急他人所需、为他人尽力的意念，人就可常保朝气，暖和身边之人的心，让社区更显光明。', src: JT, srcZh: JTZ, zhFrom: 'official' },
    { id: 'i23', type: 'ikeda', for: 'care', en: 'Recognizing and treasuring the contributions of older people is essential to the long-term flourishing of any society.', zh: '树立真心尊敬高龄人士的风气，无疑是为社会的持续繁荣打稳基础。', src: JT, srcZh: JTZ, zhFrom: 'official' },
    { id: 'i1', type: 'ikeda', for: 'care', en: 'There is a saying, ‘The foolish regard old age as winter; the wise regard it as a golden time.’ Everything depends upon our attitude, how we approach life.', zh: '有句话说：“愚者视老年为冬天，智者视老年为黄金时期。”一切都取决于我们的心态，取决于我们怎样面对人生。', src: 'The Wisdom for Creating Happiness and Peace, Part 1, 9.1 (from A Discussion on the Third Stage of Life, 1998)', zhFrom: 'ours' },
    { id: 'i11', type: 'ikeda', for: 'player', en: 'I believe youth can last a lifetime.', zh: '我相信青春可以持续一生。', src: JT, srcZh: JTZ, zhFrom: 'ours' },
    { id: 'i12', type: 'ikeda', for: 'player', en: 'Inner youthfulness is not a matter of our physical age.', zh: '其实心境年轻与否是不能以实际年龄来下定论的。', src: JT, srcZh: JTZ, zhFrom: 'official' },
    { id: 'i28', type: 'ikeda', for: 'player', en: 'The wisdom and experience of older people is a resource of inestimable worth.', zh: '高龄人士的智慧与经验，是丰富现在未来的宝贵财产。', src: JT, srcZh: JTZ, zhFrom: 'official' },
    { id: 'i5', type: 'ikeda', for: 'player', en: 'The ideal old age might be likened to a magnificent sunset.', zh: '但愿晚年能如承诺翌日亦是晴天的无限夕阳一般，灿烂尽显，光辉四射，向未来的世代送上希望的光明。', src: JT, srcZh: JTZ, zhFrom: 'official' },
    { id: 's2', type: 'saying', for: 'care', en: 'Dementia changes the map, not the worth of the traveler.', zh: '失智症改变的是地图，不是旅人的价值。' },
    { id: 's6', type: 'saying', for: 'care', en: 'The person is still here, even when the story is scattered.', zh: '即使故事零散了，这个人依然在这里。' },
    { id: 's12', type: 'saying', for: 'care', en: 'A diagnosis explains changes; it does not erase a life.', zh: '诊断解释了变化，但抹不去一个人的一生。' },
    { id: 's20', type: 'saying', for: 'care', en: 'Confusion is not stubbornness.', zh: '糊涂不是固执。' },
    { id: 's30', type: 'saying', for: 'care', en: 'Repetition is not failure; it is a need for reassurance.', zh: '反复问同一件事不是失败，而是需要安心。' },
    { id: 's43', type: 'saying', for: 'care', en: 'Behavior is communication when language falters.', zh: '当语言跟不上时，行为就是在表达。' },
    { id: 's44', type: 'saying', for: 'care', en: 'Look for the need behind the noise.', zh: '留意吵闹背后的需要。' },
    { id: 's54', type: 'saying', for: 'care', en: 'People remember how they were made to feel.', zh: '人们会记得别人带给自己的感受。' },
    { id: 's76', type: 'saying', for: 'care', en: 'Validation is not agreement; it is acknowledgment.', zh: '认同感受不等于同意，而是表示“我明白”。' },
    { id: 's29', type: 'saying', for: 'care', en: 'Familiar rituals are memory’s handrails.', zh: '熟悉的日常习惯，是记忆的扶手。' },
    { id: 's72', type: 'saying', for: 'care', en: 'Dementia is a condition, not an identity.', zh: '失智症是一种病况，不是一个人的身份。' },
    { id: 's28', type: 'saying', for: 'care', en: 'Music can reach where explanation cannot.', zh: '音乐能到达解释到不了的地方。' },
    { id: 'e34', type: 'encourage', for: 'care', en: 'Rest is part of care, not a break from it.', zh: '休息是照顾的一部分，不是中断。' },
    { id: 'e63', type: 'encourage', for: 'care', en: 'You can love someone and still need respite.', zh: '您可以爱一个人，同时也需要喘息。' },
    { id: 'e33', type: 'encourage', for: 'care', en: 'Caregiver guilt is common; it is not a reliable judge.', zh: '照顾者的内疚很常见，但它不是可靠的判官。' },
    { id: 'e86', type: 'encourage', for: 'care', en: 'Burnout is a signal, not a verdict.', zh: '累垮是一个信号，不是一个判决。' },
    { id: 'e97', type: 'encourage', for: 'care', en: 'You do not need a cure to offer care.', zh: '不需要治愈，也能给予照顾。' },
    { id: 'e98', type: 'encourage', for: 'care', en: 'You do not need perfect words to offer presence.', zh: '不需要完美的话语，也能陪伴在旁。' },
    { id: 'e90', type: 'encourage', for: 'care', en: 'No one should have to improvise dementia care alone.', zh: '没有人应该独自摸索怎样照顾失智的家人。' },
    { id: 'e83', type: 'encourage', for: 'care', en: 'Love can be practical: a pill box, a nightlight, a labeled drawer.', zh: '爱可以很实际：一个药盒、一盏小夜灯、一个贴了标签的抽屉。' },
    { id: 'e4', type: 'encourage', for: 'player', en: 'A good day can be small: warm light, familiar music, a hand nearby.', zh: '美好的一天可以很简单：温暖的光、熟悉的音乐、身边有一只手。' },
    { id: 'e95', type: 'encourage', for: 'player', en: 'A good moment is not a small thing.', zh: '美好的片刻，不是小事。' },
    { id: 'e91', type: 'encourage', for: 'player', en: 'Aging can still include wonder.', zh: '年纪大了，依然可以有惊喜。' },
    { id: 'e96', type: 'encourage', for: 'player', en: 'The present is where connection lives.', zh: '当下，就是我们相连的地方。' },
    { id: 't4', type: 'tip', for: 'care', en: 'Communicate face-to-face, one idea at a time, with short sentences and time to respond.', zh: '面对面说话，一次只说一件事，句子简短，给对方时间回应。' },
    { id: 't6', type: 'tip', for: 'care', en: 'Use names and reminders; avoid quizzing with “Do you remember?”', zh: '多叫名字、多提示；不要用“您还记得吗？”来考他们。' },
    { id: 't7', type: 'tip', for: 'care', en: 'Offer two clear choices rather than open-ended questions.', zh: '给两个清楚的选择，而不是开放式的问题。' },
    { id: 't8', type: 'tip', for: 'care', en: 'Reduce noise, clutter and background TV during conversation and meals.', zh: '说话和吃饭时，减少噪音、杂物和开着的电视。' },
    { id: 't20', type: 'tip', for: 'care', en: 'Check hearing and vision; use glasses and hearing aids, because poor senses worsen confusion.', zh: '检查听力和视力；戴好眼镜和助听器，感官不好会让人更糊涂。' },
    { id: 't37', type: 'tip', for: 'care', en: 'Offer familiar music from their youth; use it to calm and connect.', zh: '放他们年轻时熟悉的音乐，用来安抚和交流。' },
    { id: 't48', type: 'tip', for: 'care', en: 'Stop activities when frustration rises; redirect to something easier.', zh: '一开始烦躁，就停下活动，换一件更容易的事。' },
    { id: 't50', type: 'tip', for: 'care', en: 'Respond to emotion first, facts second.', zh: '先回应情绪，再谈事实。' },
    { id: 't52', type: 'tip', for: 'care', en: 'Look for unmet needs behind agitation: pain, hunger, the toilet, noise or tiredness.', zh: '找出烦躁背后没被满足的需要：疼痛、饥饿、要上厕所、太吵或太累。' },
    { id: 't60', type: 'tip', for: 'care', en: 'Plan for late-afternoon restlessness: an earlier dinner, a calm evening, lights on.', zh: '为傍晚的不安做准备：早点吃晚饭，晚上保持安静，把灯打开。' },
    { id: 't72', type: 'tip', for: 'care', en: 'Take scheduled breaks; respite is maintenance, not luxury.', zh: '安排固定的休息时间；喘息是保养，不是奢侈。' },
    { id: 't71', type: 'tip', for: 'care', en: 'Accept help specifically; keep a list of tasks others can do.', zh: '有人说要帮忙时，具体地接受；准备一张别人可以帮忙做的事的清单。' }
  ];

function byId(id){ return document.getElementById(id); }

function storageGet(key, fallback){
  try {
    const raw = localStorage.getItem(key);
    if (raw === null) {
      if (key in memStore) return memStore[key];
      return fallback;
    }
    // Another game may have saved plain text ("en"): read it as it is, never as a storage problem
    try { return JSON.parse(raw); } catch(e){ return raw; }
  } catch(e){
    if (key in memStore) return memStore[key];
    storageOk = false;
    return fallback;
  }
}

function storageSet(key, value){
  memStore[key] = value;
  // Shared keys are read by all six games: text is saved plain ("en"), never JSON-quoted
  const plain = typeof value === 'string' && (key === CONFIG.STORAGE.SHARED_LANG || key === CONFIG.STORAGE.SHARED_LEVEL);
  try { localStorage.setItem(key, plain ? value : JSON.stringify(value)); }
  catch(e){ storageOk = false; }
}

function storageDel(key){
  delete memStore[key];
  try { localStorage.removeItem(key); } catch(e){}
}

function idbOpen(){
  return new Promise((resolve, reject) => {
    if (idb) return resolve(idb);
    if (!('indexedDB' in window)) return reject(new Error('no-indexeddb'));
    let req;
    try { req = indexedDB.open(CONFIG.STORAGE.DB_NAME, CONFIG.STORAGE.DB_VERSION); }
    catch(e){ return reject(e); }
    req.onupgradeneeded = (ev) => {
      const db = ev.target.result;
      if (!db.objectStoreNames.contains(CONFIG.STORAGE.STORE_AUDIO)) {
        db.createObjectStore(CONFIG.STORAGE.STORE_AUDIO, { keyPath: 'id' });
      }
      if (!db.objectStoreNames.contains(CONFIG.STORAGE.STORE_META)) {
        db.createObjectStore(CONFIG.STORAGE.STORE_META, { keyPath: 'id' });
      }
    };
    req.onsuccess = () => { idb = req.result; resolve(idb); };
    req.onerror   = () => reject(req.error || new Error('idb-open-failed'));
    req.onblocked = () => reject(new Error('idb-blocked'));
  });
}

function idbPut(store, value){
  return idbOpen().then(db => new Promise((resolve, reject) => {
    try {
      const tx = db.transaction(store, 'readwrite');
      tx.objectStore(store).put(value);
      tx.oncomplete = () => resolve(true);
      tx.onerror    = () => reject(tx.error);
    } catch(e){ reject(e); }
  }));
}

function idbGet(store, key){
  return idbOpen().then(db => new Promise((resolve, reject) => {
    try {
      const tx = db.transaction(store, 'readonly');
      const req = tx.objectStore(store).get(key);
      req.onsuccess = () => resolve(req.result || null);
      req.onerror   = () => reject(req.error);
    } catch(e){ reject(e); }
  }));
}

function idbDel(store, key){
  return idbOpen().then(db => new Promise((resolve, reject) => {
    try {
      const tx = db.transaction(store, 'readwrite');
      tx.objectStore(store).delete(key);
      tx.oncomplete = () => resolve(true);
      tx.onerror    = () => reject(tx.error);
    } catch(e){ reject(e); }
  }));
}

function idbAll(store){
  return idbOpen().then(db => new Promise((resolve, reject) => {
    try {
      const tx = db.transaction(store, 'readonly');
      const req = tx.objectStore(store).getAll();
      req.onsuccess = () => resolve(req.result || []);
      req.onerror   = () => reject(req.error);
    } catch(e){ reject(e); }
  }));
}

function settingsLoad(){
  const saved = storageGet(CONFIG.STORAGE.SETTINGS, {}) || {};
  settings = Object.assign({}, CONFIG.DEFAULTS, saved);
  const sharedLang = storageGet(CONFIG.STORAGE.SHARED_LANG, null);
  if (sharedLang === 'zh-CN' || sharedLang === 'en') currentLang = sharedLang;
  else currentLang = CONFIG.DEFAULT_LANG;
  const sharedLevel = storageGet(CONFIG.STORAGE.SHARED_LEVEL, null);
  if (sharedLevel && CONFIG.LEVELS[sharedLevel]) settings.level = sharedLevel;
  else if (!CONFIG.LEVELS[settings.level]) settings.level = 'standard';
  const sharedOnline = storageGet(CONFIG.STORAGE.SHARED_ONLINE, null);
  if (sharedOnline !== null) settings.onlineVoice = sharedOnline === true || sharedOnline === 'true';
  const sharedContrast = storageGet(CONFIG.STORAGE.SHARED_CONTRAST, null);
  if (sharedContrast !== null) settings.contrast = sharedContrast === true || sharedContrast === 'true';
  // v4.3/4.4 saved Mute as music volume 0. Mute is now Stop, which is never saved.
  if (settings.muted) {
    settings.musicVol = (typeof settings._lastMusicVol === 'number' && settings._lastMusicVol > 0)
      ? settings._lastMusicVol : CONFIG.DEFAULTS.musicVol;
    delete settings.muted; delete settings._lastMusicVol;
  }
  settings.mode = 'jukebox';
  applyLevelDefaults();
  musicVolume = Math.min(clamp(settings.musicVol, 0, 1), levelCfg().musicVol);
  document.documentElement.lang = currentLang;
  if (document.body) (document.body.classList.toggle('hc', !!settings.contrast), document.documentElement.classList.toggle('hc', !!settings.contrast));
  return settings;
}

function settingsSave(patch){
  if (patch) Object.assign(settings, patch);
  storageSet(CONFIG.STORAGE.SETTINGS, settings);
  storageSet(CONFIG.STORAGE.SHARED_LANG, currentLang);
  storageSet(CONFIG.STORAGE.SHARED_LEVEL, settings.level);
  storageSet(CONFIG.STORAGE.SHARED_ONLINE, !!settings.onlineVoice);
  storageSet(CONFIG.STORAGE.SHARED_CONTRAST, !!settings.contrast);
  audioVolumeSet(settings.musicVol);
  if (document.body) (document.body.classList.toggle('hc', !!settings.contrast), document.documentElement.classList.toggle('hc', !!settings.contrast));
  window.dispatchEvent(new CustomEvent('dgs:settingschange', { detail: settings }));
  return settings;
}

function levelGet(){
  const id = settings.level || 'standard';
  return CONFIG.LEVELS[id] ? id : 'standard';
}

function levelCfg(){ return CONFIG.LEVELS[levelGet()]; }

function levelSet(id){
  if (!CONFIG.LEVELS[id]) return;
  settings.level = id;
  storageSet(CONFIG.STORAGE.SHARED_LEVEL, id);
  applyLevelDefaults();
  settingsSave({});
  window.dispatchEvent(new CustomEvent('dgs:levelchange', { detail: { level: id } }));
}

function applyLevelDefaults(){
  const cfg = levelCfg();
  if (cfg.modes.indexOf(settings.mode) === -1) {
    settings.mode = cfg.defaultMode;
  }
  // Keep the caregiver's full station preferences when changing levels.
  // The current level filters what is shown, without erasing hidden choices.
  if (!Array.isArray(settings.stations) || !settings.stations.length) {
    settings.stations = CONFIG.STATION_ORDER.slice();
  }
  if (!settings.startStation || CONFIG.STATION_ORDER.indexOf(settings.startStation) === -1) {
    settings.startStation = 'opening';
  }
  document.body.classList.toggle('level-simplest', levelGet() === 'simplest');
  if (typeof settings.musicVol !== 'number') settings.musicVol = cfg.musicVol;
  // Preserve the caregiver's chosen volume; playback is capped by the selected level.
  musicVolume = Math.min(clamp(settings.musicVol, 0, 1), cfg.musicVol);
  if (typeof settings.sessionMin !== 'number') settings.sessionMin = cfg.sessionMin;
  // older saves may hold 5, 8 or 10 minutes: move to the nearest current choice
  settings.sessionMin = CONFIG.TIMING.SESSION_CHOICES_MIN.reduce((a, b) => Math.abs(b - settings.sessionMin) < Math.abs(a - settings.sessionMin) ? b : a);
  if (settings.tempo === 'slower') tempoMultValue = 0.85;
  else tempoMultValue = cfg.tempo;
  ghostIdleValue = cfg.ghostIdleMs;
}


function i18nGet(key, vars){
  const dict = currentLang === 'en' ? STRINGS_EN : STRINGS_ZH;
  let s = (dict && dict[key]);
  if (s === undefined) s = STRINGS_EN[key];
  if (s === undefined) s = STRINGS_ZH[key];
  if (s === undefined) return KIT.s(key, vars, currentLang);   // shared wording lives in the kit
  if (vars && typeof s === 'string') {
    s = s.replace(/\{(\w+)\}/g, (m, k) => (k in vars ? vars[k] : m));
  }
  return s;
}

function i18nSet(lang){

function i18nApply(root){

function speechInit(){
  if (!('speechSynthesis' in window)) return;
  const loadVoices = () => {
    try { voices = window.speechSynthesis.getVoices() || []; }
    catch(e){ voices = []; }
  };
  loadVoices();
  try { window.speechSynthesis.onvoiceschanged = loadVoices; } catch(e){}
  setTimeout(() => {
    loadVoices();
    const lines = voices.map(v =>
      `  · ${v.name} [${v.lang}] ${v.localService ? 'local' : 'online'}`
    );
    if (lines.length) {
      console.log('[Radio Days] Speech voices on this phone:\n' + lines.join('\n'));
    } else {
      console.log('[Radio Days] No speech voices reported yet.');
    }
  }, 700);
}

function speechPickVoice(lang){
  if (!voices.length) {
    try { voices = window.speechSynthesis.getVoices() || []; } catch(e){}
  }
  if (!voices.length) return null;
  const want = (lang || currentLang).toLowerCase();
  const base = want.split('-')[0];
  const norm = v => (v.lang || '').toLowerCase().replace('_', '-');
  let matches;
  if (base === 'zh') {
    // Mandarin only. Skip Hong Kong (Cantonese), Taiwan and any 'yue' voice,
    // so the game never speaks a dialect by accident.
    matches = voices.filter(v => {
      const l = norm(v);
      if (/yue|zh-hk|zh-mo|zh-tw|hant/.test(l)) return false;
      return l === 'zh-cn' || l === 'zh' || l.startsWith('zh-cn') || l.startsWith('cmn') || l.indexOf('hans') !== -1 || l === 'zh-sg';
    });
  } else {
    matches = voices.filter(v => norm(v).startsWith(base));
  }
  if (!matches.length) return null;
  const local = matches.filter(v => v.localService);
  const pool = local.length ? local : matches;
  const exact = pool.filter(v => (v.lang || '').toLowerCase() === (lang || currentLang).toLowerCase());
  return (exact.length ? exact : pool)[0];
}



function speechVolumeSet(v){
  settings.speechVol = clamp(v, 0, 1);
  settingsSave({});
}

function speechSpeak(text, opts){
  opts = opts || {};
  if (!text) return;
  const lang = opts.lang || currentLang;
  const voice = ('speechSynthesis' in window) ? speechPickVoice(lang) : null;
  const willSpeak = !!voice && (voice.localService || settings.onlineVoice);
  window.dispatchEvent(new CustomEvent('dgs:speak', {
    detail: { text, lang, willSpeak }
  }));
  if (!voice) return;
  if (!voice.localService && !settings.onlineVoice) {
    window.dispatchEvent(new CustomEvent('dgs:novoicenotice'));
    return;
  }
  try {
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.voice = voice;
    u.lang = voice.lang;
    u.rate = opts.rate || CONFIG.AUDIO.SPEECH_RATE;
    u.pitch = 1.0;
    u.volume = (typeof opts.volume === 'number') ? opts.volume : settings.speechVol;
    u.onend   = () => audioDuck(false);
    u.onerror = () => audioDuck(false);
    audioDuck(true);
    window.speechSynthesis.speak(u);
    currentUtterance = u;
  } catch(e){
    audioDuck(false);
  }
}

function speechStop(){
  try { window.speechSynthesis.cancel(); } catch(e){}
  currentUtterance = null;
  audioDuck(false);
}

function audioInit(){
  if (audioCtx) return audioCtx;
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return null;
    audioCtx = new Ctx();
    if (navigator.audioSession) {
      try { navigator.audioSession.type = 'playback'; } catch(e){}
    }
    masterGain = audioCtx.createGain();
    masterGain.gain.value = 1.0;
    masterGain.connect(audioCtx.destination);
    musicGain = audioCtx.createGain();
    musicGain.gain.value = 0.0001;
    musicGain.connect(masterGain);
  } catch(e){
    audioCtx = null;
  }
  return audioCtx;
}

function audioUnlock(){
  const ctx = audioInit();
  if (!ctx) return Promise.resolve();
  if (ctx.state === 'suspended') return ctx.resume().catch(() => {});
  return Promise.resolve();
}

function audioMelodyPlay(id, opts){
  opts = opts || {};
  const ctx = audioInit();
  if (!ctx) return;
  if (ctx.state === 'suspended') ctx.resume().catch(() => {});
  const melody = (typeof melodyGet === 'function') ? melodyGet(id) : null;
  currentMelody = id;
  if (!melody || !Array.isArray(melody.notes) || !melody.notes.length) {
    musicPlaying = false;
    return;
  }
  clearTimeout(fadeStopTimer); fadeStopTimer = null;   // a new tune cancels any pending fade-stop
  audioMelodyStopInternal();
  musicPlaying = true;
  musicStartTime = ctx.currentTime + 0.06;
  scheduleMelody(melody, musicStartTime);
  fadeGain(musicGain, ducked ? musicVolume * CONFIG.AUDIO.DUCK_LEVEL : musicVolume, 0.4);
  const loopMs = (typeof melodyDuration === 'function')
    ? melodyDuration(id) : (melody.loopMs || 24000);
  clearTimeout(musicLoopTimer);
  musicLoopTimer = setTimeout(() => {
    if (musicPlaying && currentMelody === id) audioMelodyPlay(id);
  }, loopMs + CONFIG.AUDIO.MELODY_LOOP_MS);
}

function audioMelodyStop(fadeMs){
  audioMelodyStopInternal(fadeMs);
  musicPlaying = false;
  currentMelody = null;
  clearTimeout(musicLoopTimer);
  musicLoopTimer = null;
}

function audioMelodyStopInternal(fadeMs){
  fadeMs = fadeMs || 0;
  if (!audioCtx) { activeSources = []; return; }
  const now = audioCtx.currentTime;
  const stopAt = now + Math.max(0, fadeMs) / 1000;
  activeSources.forEach(s => {
    try {
      s.gain.gain.cancelScheduledValues(now);
      s.gain.gain.setValueAtTime(Math.max(s.gain.gain.value, 0.0001), now);
      s.gain.gain.exponentialRampToValueAtTime(0.0001, stopAt + 0.05);
      s.osc.stop(stopAt + 0.1);
    } catch(e){}
  });
  activeSources = [];
}

function scheduleMelody(melody, startTime){
  if (!audioCtx) return;
  const speed = tempoMultValue > 0 ? tempoMultValue : 1;
  melody.notes.forEach(n => {
    if (!n || !n.f || n.f <= 0) return;
    const when = startTime + (n.t / speed);
    const dur  = Math.max(0.06, n.d / speed);
    const vel  = (typeof n.v === 'number') ? n.v : 0.65;
    scheduleNote(n.f, when, dur, vel);
  });
}

function scheduleNote(freq, when, duration, velocity){
  if (!audioCtx || !musicGain) return;
  const ctx = audioCtx;
  const osc  = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = 'triangle';
  osc.frequency.setValueAtTime(freq, when);
  const peak    = Math.max(0.0001, velocity * 0.35);
  const attack  = CONFIG.AUDIO.ATTACK;
  const release = Math.max(CONFIG.AUDIO.RELEASE, duration * 0.6);
  gain.gain.setValueAtTime(0.0001, when);
  gain.gain.exponentialRampToValueAtTime(peak, when + attack);
  gain.gain.exponentialRampToValueAtTime(0.0001, when + duration + release);
  osc.connect(gain);
  gain.connect(musicGain);
  osc.start(when);
  osc.stop(when + duration + release + 0.05);
  const entry = { osc, gain };
  activeSources.push(entry);
  osc.onended = () => {
    activeSources = activeSources.filter(s => s !== entry);
    try { osc.disconnect(); gain.disconnect(); } catch(e){}
  };
}

function audioPercHit(){
  const ctx = audioInit();
  if (!ctx) return;
  let when = ctx.currentTime + 0.01;
  const melody = (currentMelody && typeof melodyGet === 'function')
    ? melodyGet(currentMelody) : null;
  if (melody && melody.bpm && musicStartTime && musicPlaying) {
    const beat = 60 / (melody.bpm * tempoMultValue);
    const slot = beat / 4;
    const elapsed = ctx.currentTime - musicStartTime;
    const nextSlot = Math.ceil(elapsed / slot) * slot;
    when = musicStartTime + nextSlot + 0.005;
    if (when - ctx.currentTime > slot) when = ctx.currentTime + 0.01;
  }
  const osc1  = ctx.createOscillator();
  const gain1 = ctx.createGain();
  osc1.type = 'sine';
  osc1.frequency.setValueAtTime(220, when);
  osc1.frequency.exponentialRampToValueAtTime(80, when + 0.08);
  gain1.gain.setValueAtTime(0.0001, when);
  gain1.gain.exponentialRampToValueAtTime(0.14, when + 0.005);
  gain1.gain.exponentialRampToValueAtTime(0.0001, when + 0.12);
  osc1.connect(gain1); gain1.connect(masterGain);
  osc1.start(when); osc1.stop(when + 0.15);
  const osc2  = ctx.createOscillator();
  const gain2 = ctx.createGain();
  osc2.type = 'triangle';
  osc2.frequency.value = 880;
  gain2.gain.setValueAtTime(0.0001, when);
  gain2.gain.exponentialRampToValueAtTime(0.045, when + 0.003);
  gain2.gain.exponentialRampToValueAtTime(0.0001, when + 0.07);
  osc2.connect(gain2); gain2.connect(masterGain);
  osc2.start(when); osc2.stop(when + 0.1);
}

function audioVolumeSet(v){
  const requested = clamp((typeof v === 'number') ? v : CONFIG.AUDIO.MUSIC_VOL_DEFAULT, 0, 1);
  const levelCap = levelCfg().musicVol;
  musicVolume = Math.min(requested, levelCap);
  if (musicGain && audioCtx && !ducked) fadeGain(musicGain, musicVolume, 0.35);
}


function audioDuck(on){
  ducked = !!on;
  if (!musicGain || !audioCtx) return;
  const target = ducked ? musicVolume * CONFIG.AUDIO.DUCK_LEVEL : musicVolume;
  fadeGain(musicGain, target, 0.28);
}

function audioFade(ms){
  ms = ms || CONFIG.TIMING.REST_FADE_MS;
  if (!musicGain || !audioCtx) { audioMelodyStop(0); return; }
  fadeGain(musicGain, 0.0001, ms / 1000);
  clearTimeout(fadeStopTimer);
  fadeStopTimer = setTimeout(() => { fadeStopTimer = null; audioMelodyStop(0); }, ms + 60);
}

function fadeGain(node, target, seconds){
  if (!audioCtx || !node) return;
  const t = audioCtx.currentTime;
  try {
    node.gain.cancelScheduledValues(t);
    node.gain.setValueAtTime(Math.max(node.gain.value, 0.0001), t);
    node.gain.exponentialRampToValueAtTime(Math.max(target, 0.0001), t + seconds);
  } catch(e){}
}

function audioPauseAll(){
  if (musicPlaying) {
    wasPlayingBeforeHide = true;
    resumeMelodyId = currentMelody;   // remember it BEFORE the fade clears currentMelody
    audioFade(400);
  }
  clearTimeout(musicLoopTimer);
  musicLoopTimer = null;
  try { window.speechSynthesis.pause(); } catch(e){}
}

function audioResumeAll(){
  try { window.speechSynthesis.resume(); } catch(e){}
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
  const id = resumeMelodyId || currentMelody;
  wasPlayingBeforeHide = false;
  resumeMelodyId = null;
  // The GAME section restarts its own tune (it also restarts the timers);
  // the engine only restarts music on other screens (start / end theme).
  const gameHandles = (typeof isGameActive === 'function') && isGameActive();
  if (id && !gameHandles) audioMelodyPlay(id);
}

function audioNowPlaying(){ return currentMelody; }

function sessionStart(){
  sessionStartTime = Date.now();
  sessionActive = true;
  clearInterval(sessionTimer);
  sessionTimer = setInterval(sessionTick, CONFIG.TIMING.SESSION_TICK_MS);
}

function sessionTick(){
  if (!sessionActive) return;
  const elapsed = Date.now() - sessionStartTime;
  const limit = (settings.sessionMin || CONFIG.TIMING.SESSION_DEFAULT_MIN) * 60 * 1000;
  if (elapsed >= limit) {
    sessionActive = false;
    clearInterval(sessionTimer);
    sessionTimer = null;
    window.dispatchEvent(new CustomEvent('dgs:sessionend', {
      detail: {
        startedAt: sessionStartTime,
        minutes: Math.max(1, Math.round(elapsed / 60000)),
        endedEarly: false
      }
    }));
  }
}

function sessionEnd(reason){
  if (!sessionActive) return null;
  sessionActive = false;
  clearInterval(sessionTimer);
  sessionTimer = null;
  const elapsedMs = Date.now() - sessionStartTime;
  return {
    startedAt: sessionStartTime,
    minutes: Math.max(1, Math.round(elapsedMs / 60000)),
    endedEarly: reason === 'exit'
  };
}

function sessionLog(entry){
  if (!entry) return;
  const list = sessionList();
  list.unshift({
    date: entry.date || new Date().toISOString(),
    minutes: entry.minutes == null ? null : entry.minutes,
    mood: entry.mood || null,
    endedEarly: !!entry.endedEarly,
    source: entry.source || undefined
  });
  storageSet(CONFIG.STORAGE.SESSIONS, list.slice(0, 60));
}

function sessionList(){
  const v = storageGet(CONFIG.STORAGE.SESSIONS, []);
  return Array.isArray(v) ? v : [];
}


async function blobToDataUrl(blob){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = () => reject(reader.error || new Error('blob-read-failed'));
    reader.readAsDataURL(blob);
  });
}

function dataUrlToBlob(dataUrl){
  if (typeof dataUrl !== 'string' || !/^data:[^;]+;base64,/.test(dataUrl)) throw new Error('bad-audio-data');
  const parts = dataUrl.split(',');
  const mime = (parts[0].match(/^data:([^;]+)/) || [])[1] || 'application/octet-stream';
  const binary = atob(parts[1]);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return new Blob([bytes], { type: mime });
}

async function backupExport(){
  try {
    const audioItems = await idbAll(CONFIG.STORAGE.STORE_AUDIO);
    const audio = [];
    for (const item of (audioItems || [])) {
      if (!item || !item.id || !item.blob) continue;
      audio.push({
        id: item.id, name: item.name || 'audio', type: item.type || item.blob.type || '',
        addedAt: item.addedAt || Date.now(), dataUrl: await blobToDataUrl(item.blob)
      });
    }
    const data = {
      schema: 'dgs.backup.v2', game: CONFIG.GAME_ID, version: CONFIG.VERSION,
      exportedAt: new Date().toISOString(), settings: settings,
      sessions: sessionList(), audio,
      links: linksAllStored(),
      shared: { lang: currentLang, level: settings.level,
        onlineVoice: !!settings.onlineVoice, contrast: !!settings.contrast }
    };
    const json = JSON.stringify(data, null, 2);
    const filename = `${CONFIG.GAME_ID}-backup-${datestamp()}.json`;
    const blob = new Blob([json], { type: 'application/json' });
    const file = new File([blob], filename, { type: 'application/json' });
    if (navigator.canShare && navigator.canShare({ files: [file] }) && navigator.share) {
      try { await navigator.share({ files: [file], title: 'Radio Days backup' }); return { ok: true, method: 'share', filename }; }
      catch(e){ if (e && e.name === 'AbortError') return { ok: false, reason: 'aborted' }; }
    }
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 10000);
    return { ok: true, method: 'download', filename };
  } catch(e){ return { ok: false, reason: 'backup-failed' }; }
}

function backupImport(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      let data;
      try { data = JSON.parse(reader.result); }
      catch(e){ return reject(new Error('not-json')); }
      if (!data || !data.schema === 'dgs.backup.v2' || data.game !== CONFIG.GAME_ID) return reject(new Error('wrong-backup'));
      if (data.audio && (!Array.isArray(data.audio) || data.audio.length > 500)) return reject(new Error('bad-audio-list'));
      if (file.size > 180 * 1024 * 1024) return reject(new Error('backup-too-large'));
      resolve(data);
    };
    reader.onerror = () => reject(reader.error || new Error('read-failed'));
    reader.readAsText(file);
  });
}

function backupPreview(data){
  if (!data) return null;
  return {
    game: data.game || '',
    exportedAt: data.exportedAt || '',
    sessions: Array.isArray(data.sessions) ? data.sessions.length : 0,
    favourites: Array.isArray(data.favourites) ? data.favourites.length : 0,
    musicFiles: Array.isArray(data.audio) ? data.audio.length : null,
    hasSettings: !!data.settings
  };
}

async function backupApply(data){
  if (!data || !data.schema === 'dgs.backup.v2' || data.game !== CONFIG.GAME_ID) return false;
  let restoredAudio = null;
  try {
    if (Array.isArray(data.audio)) {
      restoredAudio = data.audio.map(item => ({ id: item.id, name: item.name || 'audio', type: item.type || '', addedAt: item.addedAt || Date.now(), blob: dataUrlToBlob(item.dataUrl) }));
    }
  } catch(e){ return false; }
  try {
    if (restoredAudio) {
      const db = await idbOpen();
      await new Promise((resolve, reject) => {
        const tx = db.transaction(CONFIG.STORAGE.STORE_AUDIO, 'readwrite');
        const store = tx.objectStore(CONFIG.STORAGE.STORE_AUDIO);
        store.clear(); restoredAudio.forEach(item => store.put(item));
        tx.oncomplete = () => resolve(true); tx.onerror = () => reject(tx.error); tx.onabort = () => reject(tx.error || new Error('restore-audio-aborted'));
      });
    }
  } catch(e){ return false; }
  if (data.settings && typeof data.settings === 'object') {
    settings = Object.assign({}, CONFIG.DEFAULTS, data.settings);
  }
  storageSet(CONFIG.STORAGE.SETTINGS, settings);
  if (Array.isArray(data.sessions)) storageSet(CONFIG.STORAGE.SESSIONS, data.sessions.slice(0, 60));
  const linkData = (data.links && typeof data.links === 'object') ? data.links : null;
  if (linkData) {
    CONFIG.STATION_ORDER.forEach(st => {
      const v = linkData[st];
      if (typeof v === 'string') linkSave(st, v);
    });
  }
  if (data.shared) {
    if (data.shared.lang === 'zh-CN' || data.shared.lang === 'en') {
      currentLang = data.shared.lang;
      storageSet(CONFIG.STORAGE.SHARED_LANG, currentLang);
    }
    if (data.shared.level && CONFIG.LEVELS[data.shared.level]) {
      settings.level = data.shared.level;
      storageSet(CONFIG.STORAGE.SHARED_LEVEL, settings.level);
    }
    if (typeof data.shared.onlineVoice === 'boolean') {
      settings.onlineVoice = data.shared.onlineVoice;
      storageSet(CONFIG.STORAGE.SHARED_ONLINE, settings.onlineVoice);
    }
    if (typeof data.shared.contrast === 'boolean') {
      settings.contrast = data.shared.contrast;
      storageSet(CONFIG.STORAGE.SHARED_CONTRAST, settings.contrast);
    }
  }
  applyLevelDefaults();
  musicVolume = Math.min(clamp(settings.musicVol, 0, 1), levelCfg().musicVol);
  document.documentElement.lang = currentLang;
  if (document.body) (document.body.classList.toggle('hc', !!settings.contrast), document.documentElement.classList.toggle('hc', !!settings.contrast));
  i18nApply(document);
  window.dispatchEvent(new CustomEvent('dgs:settingschange', { detail: settings }));
  return true;
}

function clearAll(){
  storageDel(CONFIG.STORAGE.SETTINGS);
  storageDel(CONFIG.STORAGE.SESSIONS);
  storageDel(CONFIG.STORAGE.FAVOURITES);
  storageDel(CONFIG.STORAGE.CHECKLIST);
  storageDel(CONFIG.STORAGE.PREFIX + 'setup');
  storageDel(CONFIG.STORAGE.PREFIX + 'lastQuote_care');
  storageDel(CONFIG.STORAGE.PREFIX + 'lastQuote_player');
  // Shared settings (dgs.lang, dgs.level, dgs.onlineVoice, dgs.contrast) are left alone,
  // because other games on the same address use them too.
  CONFIG.STATION_ORDER.forEach(st => linkReset(st));
  if (idb) {
    try {
      const tx = idb.transaction(
        [CONFIG.STORAGE.STORE_AUDIO, CONFIG.STORAGE.STORE_META], 'readwrite'
      );
      tx.objectStore(CONFIG.STORAGE.STORE_AUDIO).clear();
      tx.objectStore(CONFIG.STORAGE.STORE_META).clear();
    } catch(e){}
  }
  memStore = {};
  settingsLoad();   // back to defaults, keeping the shared language / level / voice / contrast
  return true;
}

async function persistRequest(){
  try {
    if (navigator.storage && navigator.storage.persist) await navigator.storage.persist();
  } catch(e){}
}

async function wakeLockRequest(){
  if (!('wakeLock' in navigator)) return;
  if (wakeLock) return;
  try {
    wakeLock = await navigator.wakeLock.request('screen');
    wakeLock.addEventListener('release', () => { wakeLock = null; });
  } catch(e){
    wakeLock = null;
  }
}


function visibilityWatch(){
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      const wasPlaying = musicPlaying || !!(typeof ownAudioEl !== 'undefined' && ownAudioEl && !ownAudioEl.paused);
      audioPauseAll();
      speechStop();
      window.dispatchEvent(new CustomEvent('dgs:hidden', { detail: { wasPlaying } }));
    } else {
      audioResumeAll();
      wakeLockRequest();
      window.dispatchEvent(new CustomEvent('dgs:visible'));
    }
  });
}

function installFirstTapUnlock(){

    if (firstTapDone) return;
    firstTapDone = true;
    audioUnlock();
    window.removeEventListener('pointerdown', unlock, true);
    window.removeEventListener('touchstart', unlock, true);
    window.removeEventListener('keydown', unlock, true);

  window.addEventListener('pointerdown', unlock, true);
  window.addEventListener('touchstart', unlock, true);
  window.addEventListener('keydown', unlock, true);
}

function homeScreenSetup(){
  try {
    const link = byId('manifest-link');
    if (!link || !window.Blob || !window.URL || location.protocol === 'file:') return;
    const here = location.href.split('#')[0].split('?')[0];
    const scope = here.slice(0, here.lastIndexOf('/') + 1);
    const manifest = {
      name: 'Radio Days · 怀旧电台', short_name: 'Radio Days',
      start_url: here, scope: scope, display: 'standalone', orientation: 'portrait',
      background_color: CONFIG.PALETTE.bg, theme_color: CONFIG.PALETTE.primary,
      icons: [
        { src: ICON_PNG_192, sizes: '192x192', type: 'image/png', purpose: 'any maskable' },
        { src: ICON_PNG_512, sizes: '512x512', type: 'image/png', purpose: 'any maskable' }
      ]
    };
    const blob = new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
    link.href = URL.createObjectURL(blob);
  } catch(e){}
}

function engineInit(){
  KIT.init({ lang: () => currentLang, getState: (k, d) => storageGet(CONFIG.STORAGE.PREFIX + k, d), setState: (k, v) => storageSet(CONFIG.STORAGE.PREFIX + k, v) });
  homeScreenSetup();
  settingsLoad();
  document.documentElement.lang = currentLang;
  if (document.body) (document.body.classList.toggle('hc', !!settings.contrast), document.documentElement.classList.toggle('hc', !!settings.contrast));
  speechInit();
  persistRequest();
  visibilityWatch();
  wakeLockRequest();
  installFirstTapUnlock();
  idbOpen().catch(() => {});
  window.dispatchEvent(new CustomEvent('dgs:engineready', { detail: { settings } }));
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', engineInit);
} else {
  engineInit();
}

let screensBooted = false;
let pendingSessionSummary = null;
let ghostIdleTimer = null;
let ghostTargetFn = null;
let howtoStep = 0;
const HOWTO_TOTAL = 4;
let howtoReturnScreen = 'screen-start';
const THEME_MELODY_ID = 'theme';
let startThemeArmed = false;

function screenShow(id){
  document.querySelectorAll('.screen').forEach(el => {
    el.classList.toggle('active', el.id === id);
  });
  const el = byId(id);
  const sc = el && el.querySelector('.scroll');
  if (sc) sc.scrollTop = 0;
  ghostIdleReset(null);
  window.scrollTo(0, 0);
}

function screenLang(){
  const body = byId('lang-body');
  if (body) {
    body.innerHTML = '<div class="dgs-hero" style="--hero-ratio:4/3"><div class="dgs-art start-art" id="lang-art" aria-hidden="true"></div></div>' + KIT.langScreenHTML();
    try { illusMount(illusStart, byId('lang-art')); } catch(e){}
  }
  screenShow('screen-lang');
  i18nApply(document);
}

function screenStart(){
  screenShow('screen-start');
  i18nApply(document);
  const other = currentLang === 'en' ? 'zh-CN' : 'en';
  byId('start-lang').innerHTML = KIT.langSegHTML(currentLang);
  byId('start-title').innerHTML = KIT.esc(i18nGet('app.title')) + '<small lang="' + other + '">' + KIT.esc((other === 'en' ? STRINGS_EN : STRINGS_ZH)['app.title']) + '</small>';
  byId('btn-play').innerHTML = '<span class="dgs-btn__disc">' + KIT.icon('play') + '</span><span>' + KIT.esc(KIT.s('btn_play')) + '</span>';
  byId('btn-howto').innerHTML = KIT.btn('help', KIT.s('btn_howto'));
  byId('btn-care').innerHTML = KIT.btn('care', KIT.s('btn_care'));
  const startArt = byId('start-art');
  if (startArt && typeof illusStart === 'function' && typeof illusMount === 'function') {
    try { illusMount(illusStart, startArt); } catch(e){}
  }
  if (settings.bgm === 'off') {
    audioMelodyStop(0);
  } else if (audioCtx) {
    audioMelodyPlay(THEME_MELODY_ID);
  } else if (!startThemeArmed) {
    // Browsers block sound until the first tap, so the theme starts on that tap.
    startThemeArmed = true;
    const startTheme = () => {
      startThemeArmed = false;
      if (settings.bgm !== 'off' && byId('screen-start') && byId('screen-start').classList.contains('active')) {
        audioMelodyPlay(THEME_MELODY_ID);
      }
    };
    document.addEventListener('pointerdown', startTheme, { once: true });
  }
  ghostIdleReset(() => byId('btn-play'));
}

function screenHowTo(step, returnScreen){
  if (returnScreen) howtoReturnScreen = returnScreen;
  if (howtoReturnScreen === 'screen-game' && typeof gamePause === 'function') gamePause();
  howtoStep = step;
  screenShow('screen-howto');
  const line = i18nGet('howto.step' + (step + 1));
  const lineEl = byId('howto-line');
  if (lineEl) lineEl.textContent = line;
  const art = byId('howto-art');
  if (art) {
    try {
      if (typeof illusRadio === 'function' && typeof illusMount === 'function') illusMount(illusRadio, art);
      else art.innerHTML = '';
    } catch(e){ art.innerHTML = ''; }
  }
  const dots = byId('howto-dots');
  if (dots) {
    dots.innerHTML = '';
    for (let i = 0; i < HOWTO_TOTAL; i++) {
      const d = document.createElement('i');
      if (i === step) d.classList.add('on');
      dots.appendChild(d);
    }
  }
  const last = step === HOWTO_TOTAL - 1;
  byId('btn-howto-close').innerHTML = KIT.btn('back', KIT.s('btn_back'));
  byId('btn-howto-next').innerHTML = last ? KIT.btn('play', KIT.s('btn_letsplay')) : KIT.btn('next', KIT.s('btn_next'));
  const skip = byId('btn-howto-skip');
  skip.innerHTML = '<span>' + KIT.esc(KIT.s('btn_skip_howto')) + '</span>';
  skip.hidden = last || howtoReturnScreen === 'screen-game';
  speechSpeak(line);
  ghostIdleReset(() => byId('btn-howto-next'));
}

function screenCare(){
  rdSetupMark('guide');
  screenShow('screen-care');
  i18nApply(document);
  byId('btn-care-close').innerHTML = KIT.btn('back', KIT.s('btn_back'));
  const notices = [];
  if (!storageOk) notices.push(KIT.s('notice_storage'));
  const body = byId('care-body');
  body.innerHTML = KIT.careHTML({
    why: [i18nGet('cg.why1'), i18nGet('cg.why2')],
    hopes: [1, 2, 3, 4].map(i => i18nGet('cg.hope' + i)),
    before: i18nGet('cg.before'), during: i18nGet('cg.during'), after: i18nGet('cg.after'),
    parts: ['stations', 'radio', 'source', 'stop', 'own', 'open', 'voice', 'exit', 'rest', 'mood', 'level'].map(k => ({ h: i18nGet('cg.p.' + k + '.h'), d: i18nGet('cg.p.' + k + '.d'), p: i18nGet('cg.p.' + k + '.p') })),
    setupLine: i18nGet('cg.setup'),
    checklist: rdChecklist(),
    adviceHTML: rdAdviceHTML(),
    evidence: i18nGet('care.evidence.body'),
    selfLine: i18nGet('cg.self'),
    levelDesc: { standard: i18nGet('cg.level.standard'), gentler: i18nGet('cg.level.gentler'), simplest: i18nGet('cg.level.simplest') },
    level: levelGet(),
    notices: notices,
    online: !!settings.onlineVoice,
    seriesHome: CONFIG.SERIES_HOME_URL,
    extraFooter: i18nGet('rd.stream_line') + ' ' + i18nGet('care.browser')
  });
  KIT.wireCare(body, {
    onLevel: l => { levelSet(l); body.querySelectorAll('[data-kit-level]').forEach(b => b.setAttribute('aria-checked', String(b.getAttribute('data-kit-level') === l))); },
    onJump: id => {
      if (id === 'levels') { body.querySelector('.dgs-levels').scrollIntoView({ block: 'center', behavior: 'smooth' }); return; }
      if (id === 'g-what') { const d = body.querySelector('#g-what'); d.open = true; d.scrollIntoView({ block: 'start', behavior: 'smooth' }); return; }
      byId('kitOpenSettings').scrollIntoView({ block: 'center', behavior: 'smooth' });
    },
    onOpenSettings: () => screenSettings(),
    onMood: m => sessionLog({ date: new Date().toISOString(), minutes: null, mood: m, source: 'caregiver' })
  });
}

function screenEnd(){
  const titleEl = byId('end-title');
  if (titleEl) titleEl.textContent = KIT.s('end_title');
  byId('btn-end-rest').innerHTML = '<span class="dgs-btn__disc">' + KIT.icon('moon') + '</span><span>' + KIT.esc(KIT.s('btn_rest')) + '</span>';
  byId('btn-end-keep').innerHTML = KIT.btn('play', KIT.s('btn_keep'));
  const art = byId('end-art');
  if (art && typeof illusEnd === 'function' && typeof illusMount === 'function') {
    try { illusMount(illusEnd, art); } catch(e){}
  }
  screenShow('screen-end');
  i18nApply(byId('screen-end'));
  if (audioCtx && settings.bgm !== 'off') audioMelodyPlay(THEME_MELODY_ID);
  else audioMelodyStop(0);
  speechSpeak(KIT.s('end_title'));
  ghostIdleReset(() => byId('btn-end-rest'));
}

function screenRest(){
  const titleEl = byId('rest-title');

function holdButton(el, ms, onDone){
  if (!el) return;
  const ring = el.querySelector('.hold-ring');
  let timer = null;
  const setRing = (pct, dur) => {
    if (!ring) return;
    ring.style.transitionDuration = dur + 'ms';
    ring.style.transform = el.classList.contains('hold-round')
      ? 'scale(' + pct + ')' : 'scaleX(' + pct + ')';
  };
  const start = () => {
    if (timer) return;
    el.classList.add('filling');
    setRing(1, ms);
    timer = setTimeout(() => {
      stop();
      if (typeof onDone === 'function') onDone();
    }, ms);
  };
  const stop = () => {
    if (timer) { clearTimeout(timer); timer = null; }
    el.classList.remove('filling');
    setRing(0, 120);
  };
  el.addEventListener('pointerdown', (e) => { e.preventDefault(); start(); });
  el.addEventListener('pointerup', stop);
  el.addEventListener('pointerleave', stop);
  el.addEventListener('pointercancel', stop);
  el.addEventListener('blur', stop);
}

function ghostShow(targetEl){
  const ghost = byId('ghost');
  if (!ghost || !targetEl) return;
  const rect = targetEl.getBoundingClientRect();
  if (!rect || rect.width === 0) return;
  const size = 96;
  // Fingertip (about 50% across, 15% down the hand) lands on the middle of the target.
  const cx = rect.left + rect.width / 2, cy = rect.top + rect.height / 2;
  const left = Math.min(window.innerWidth - size - 8, Math.max(8, cx - size * 0.5));
  const top  = Math.min(window.innerHeight - size - 8, Math.max(8, cy - size * 0.15));
  ghost.style.left = left + 'px';
  ghost.style.top  = top + 'px';
  ghost.classList.add('show');
  if (!prefersReducedMotion()) ghost.classList.add('animating');
}

function ghostHide(){
  const ghost = byId('ghost');
  if (!ghost) return;
  ghost.classList.remove('show', 'animating');
}

function ghostIdleReset(targetFn){
  clearTimeout(ghostIdleTimer);
  ghostHide();
  if (levelGet() === 'simplest') { ghostTargetFn = null; return; }
  ghostTargetFn = targetFn || null;
  if (!ghostTargetFn) return;
  ghostIdleTimer = setTimeout(() => {
    if (!ghostTargetFn) return;
    const target = ghostTargetFn();
    if (target) ghostShow(target);
  }, (typeof ghostIdleValue === 'number') ? ghostIdleValue : CONFIG.A11Y.GHOST_IDLE_FALLBACK);
}

function moodShow(){

    const done = (mood) => {

    const onSkip = () => done(null);
    overlay.querySelectorAll('.dgs-mood').forEach(b => b.addEventListener('click', onMood));
    byId('btn-mood-skip').addEventListener('click', onSkip);
  });
}

function spotifyCardRefresh(st){
  const card = document.querySelector('[data-sp-card="' + st + '"]');
  if (!card) return;
  const link = linkFor(st);
  const custom = linkIsCustom(st);
  const cur = card.querySelector('[data-sp-current]');
  if (cur) {
    cur.textContent = link
      ? spUI(custom ? 'custom' : 'starter') + serviceName(link.service) + ' · ' +
        spUI(link.outside ? 'outside' : 'inside') + '\n' + link.url
      : i18nGet('set.links.none');
    cur.style.whiteSpace = 'pre-line';
  }
  const resetBtn = card.querySelector('[data-sp-reset]');
  if (resetBtn) resetBtn.hidden = !custom;
}

function spotifyCardMessage(st, key, ok){
  const card = document.querySelector('[data-sp-card="' + st + '"]');
  if (!card) return;
  const el = card.querySelector('[data-sp-msg]');
  if (!el) return;
  const m = LINK_MSG[key];
  el.textContent = m ? (currentLang === 'en' ? m.en : m.zh) : '';
  el.classList.toggle('ok', !!ok);
  el.classList.toggle('err', !ok);
}

function spotifyClear(st){
  linkReset(st);
  spotifyCardRefresh(st);
  spotifyCardMessage(st, 'reset', true);
  if (typeof gameUpdateOpenMusic === 'function') gameUpdateOpenMusic();
}

function spotifySave(st, raw){
  const parsed = linkSave(st, raw);
  if (parsed.error) {
    // The previous link stays as it was.
    const key = LINK_MSG[parsed.error] ? parsed.error : 'format';
    spotifyCardMessage(st, key, false);
    return false;
  }
  const card = document.querySelector('[data-sp-card="' + st + '"]');
  const input = card ? card.querySelector('[data-sp-input]') : null;
  if (input) input.value = '';
  spotifyCardRefresh(st);
  spotifyCardMessage(st, 'saved', true);
  if (typeof gameUpdateOpenMusic === 'function') gameUpdateOpenMusic();
  return true;
}

  if (result && result.ok) { rdSetupMark('backup'); rdChecklistRender(); KIT.toast(KIT.s('backup_done')); }

function handleRestoreFile(ev){
  const file = ev.target.files && ev.target.files[0];
  ev.target.value = '';
  if (!file) return;
  backupImport(file).then(data => {
    const preview = backupPreview(data);
    restoreConfirmShow(preview).then(async confirmed => {
      if (!confirmed) return;
      if (await backupApply(data)) {
        ownMusicFiles = []; ownMusicLoaded = false;
        toast('notice.imported', 4000);
        i18nApply(document);
        levelRender();
              stationsRender();
        spotifyCardsRender();
        sessionsRender();
        ownMusicRender();
        syncSettingsInputs();
        muteRender();
      } else {
        toast('set.restore.fail', 4000);
      }
    });
  }).catch(() => toast('set.restore.fail', 4000));
}

function restoreConfirmShow(preview){

    let when = '';
    if (preview) {
      const d = new Date(preview.exportedAt || '');
      if (!isNaN(d.getTime())) {

      buttons: [{ label: KIT.s('btn_cancel'), primary: true, onClick: () => resolve(false) }, { label: KIT.s('btn_restore_yes'), icon: 'restore', onClick: () => resolve(true) }]
    });

}
