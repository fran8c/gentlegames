function wireButtons(){
  document.addEventListener('click', (e) => {
    const pick = e.target.closest('[data-kit-pick]');
    if (pick) {
      i18nSet(pick.getAttribute('data-kit-pick'));
      screenStart();
      return;
    }
    const kl = e.target.closest('[data-kit-lang]');
    if (kl) {
      if (kl.getAttribute('data-kit-lang') !== currentLang) i18nSet(kl.getAttribute('data-kit-lang'));
      return;
    }
    const setBtn = e.target.closest('[data-lang-set]');
    if (setBtn) {
      i18nSet(setBtn.getAttribute('data-lang-set'));
      syncSettingsInputs();
      return;
    }
    const musicDel = e.target.closest('[data-music-del]');
    if (musicDel) {
      const id = musicDel.getAttribute('data-music-del');
      idbDel(CONFIG.STORAGE.STORE_AUDIO, id).then(() => ownMusicRender()).catch(() => {});
      return;
    }
    const stToggle = e.target.closest('[data-station-toggle]');
    if (stToggle) {
      const id = stToggle.getAttribute('data-station-toggle');
      let arr = (settings.stations || []).slice();
      if (arr.indexOf(id) !== -1) {
        if (arr.length > 1) arr = arr.filter(s => s !== id);
      } else {
        arr.push(id);
      }
      settingsSave({ stations: arr });
      stationsRender();
      return;
    }
    const startBtn = e.target.closest('[data-startstation]');
    if (startBtn) {
      settingsSave({ startStation: startBtn.getAttribute('data-startstation') });
      syncSettingsInputs();
      return;
    }
    const bgmBtn = e.target.closest('[data-bgm]');
    if (bgmBtn) { settingsSave({ bgm: bgmBtn.getAttribute('data-bgm') }); syncSettingsInputs(); return; }
    const sessBtn = e.target.closest('[data-session]');
    if (sessBtn) {
      const n = parseInt(sessBtn.getAttribute('data-session'), 10);
      if (n) { settingsSave({ sessionMin: n }); syncSettingsInputs(); }
      return;
    }
  });

  /* Spotify card actions (delegated once; cards are rebuilt on screen open) */
  const spContainer = byId('rows-links');
  if (spContainer) {
    spContainer.addEventListener('click', (e) => {
      const use = e.target.closest('[data-sp-use]');
      if (use) { spotifyClear(use.getAttribute('data-sp-use')); return; }

      const reset = e.target.closest('[data-sp-reset]');
      if (reset) { spotifyClear(reset.getAttribute('data-sp-reset')); return; }

      const save = e.target.closest('[data-sp-save]');
      if (save) {
        const st = save.getAttribute('data-sp-save');
        const card = save.closest('[data-sp-card]');
        const input = card ? card.querySelector('[data-sp-input]') : null;
        spotifySave(st, input ? input.value : '');
        return;
      }

      const test = e.target.closest('[data-sp-test]');
      if (test) {
        const st = test.getAttribute('data-sp-test');
        const link = linkFor(st);
        if (link) linkOpen(link.url);
        else spotifyCardMessage(st, 'notest', false);
        return;
      }
    });

    spContainer.addEventListener('keydown', (e) => {
      if (e.key !== 'Enter') return;
      const input = e.target.closest('[data-sp-input]');
      if (!input) return;
      const card = input.closest('[data-sp-card]');
      const saveBtn = card ? card.querySelector('[data-sp-save]') : null;
      if (saveBtn) { e.preventDefault(); saveBtn.click(); }
    });
  }

  byId('btn-play').addEventListener('click', () => {
    if (typeof gameStart === 'function') gameStart({ fresh: true });
    else screenGame();
  });
  byId('btn-howto').addEventListener('click', () => screenHowTo(0, 'screen-start'));
  byId('btn-care').addEventListener('click', () => screenCare());

  byId('btn-howto-next').addEventListener('click', () => {
    if (howtoStep < HOWTO_TOTAL - 1) {
      screenHowTo(howtoStep + 1, howtoReturnScreen);
    } else if (howtoReturnScreen === 'screen-game') {
      if (typeof gameResume === 'function') gameResume();
      else screenGame();
    } else {
      screenGame();
      if (typeof gameStart === 'function') gameStart({ fresh: true });
    }
  });

  byId('btn-howto-close').addEventListener('click', () => {
    if (howtoReturnScreen === 'screen-game') {
      if (typeof gameResume === 'function') gameResume();
      else screenGame();
    } else {
      screenStart();
    }
  });

  byId('btn-care-close').addEventListener('click', () => screenStart());
  byId('btn-howto-skip').addEventListener('click', () => { screenGame(); if (typeof gameStart === 'function') gameStart({ fresh: true }); });
  byId('btn-rest-home').addEventListener('click', () => screenStart());
  byId('btn-test-voice').addEventListener('click', () => { audioUnlock(); speechSpeak(KIT.s('voice_sample')); });
  byId('btn-settings-close').addEventListener('click', () => screenCare());

  const musicSlider = byId('rng-music');
  if (musicSlider) {
    musicSlider.addEventListener('input', (e) => {
      const max = CONFIG.AUDIO.MUSIC_VOL_MAX || 1;
      const v = (parseInt(e.target.value, 10) / 100) * max;
      settingsSave({ musicVol: v });
      audioVolumeSet(v);
      muteRender();
    });
  }
  const speechSlider = byId('rng-speech');
  if (speechSlider) {
    speechSlider.addEventListener('input', (e) => {
      const v = parseInt(e.target.value, 10) / 100;
      speechVolumeSet(v);
    });
  }
  const ov = byId('sw-onlinevoice');
  if (ov) ov.addEventListener('click', () => {
    settingsSave({ onlineVoice: !settings.onlineVoice });
    ov.setAttribute('aria-checked', settings.onlineVoice ? 'true' : 'false');
  });
  const pv = byId('sw-previews');
  if (pv) pv.addEventListener('click', () => {
    settingsSave({ spotifyPreviews: !settings.spotifyPreviews });
    pv.setAttribute('aria-checked', settings.spotifyPreviews ? 'true' : 'false');
    if (typeof gameUpdateSource === 'function') gameUpdateSource();
  });
  const rh = byId('sw-rhythm');
  if (rh) rh.addEventListener('click', () => {
    settingsSave({ rhythm: !settings.rhythm });
    rh.setAttribute('aria-checked', settings.rhythm ? 'true' : 'false');
  });
  const ct = byId('sw-contrast');
  if (ct) ct.addEventListener('click', () => {
    settingsSave({ contrast: !settings.contrast });
    ct.setAttribute('aria-checked', settings.contrast ? 'true' : 'false');
  });
  const addMusic = byId('btn-music-add');
  if (addMusic) addMusic.addEventListener('click', () => byId('inp-music').click());
  const musicInput = byId('inp-music');
  if (musicInput) musicInput.addEventListener('change', async (e) => {
    const files = e.target.files;
    e.target.value = '';
    if (!files || !files.length) return;
    let ok = 0, fail = 0;
    for (const file of files) {
      try {
        const id = 'own-' + Date.now() + '-' + Math.random().toString(36).slice(2, 8);
        await idbPut(CONFIG.STORAGE.STORE_AUDIO, {
          id, name: file.name, type: file.type, blob: file, addedAt: Date.now()
        });
        ok++;
      } catch(err){ fail++; }
    }
    ownMusicRender();
    if (ok) toast('notice.musicadded', 2600);
    else if (fail) toast('notice.musicfail', 3200);
  });
  const backupBtn = byId('btn-backup');
  if (backupBtn) backupBtn.addEventListener('click', handleBackup);
  const restoreBtn = byId('btn-restore');
  if (restoreBtn) restoreBtn.addEventListener('click', () => byId('inp-backup').click());
  const backupInput = byId('inp-backup');
  if (backupInput) backupInput.addEventListener('change', handleRestoreFile);
  byId('rd-clear').innerHTML = KIT.holdHTML('btn-clear', KIT.s('btn_clear'), KIT.s('clear_hint'), 'trash');
  KIT.bindHold(byId('btn-clear'), CONFIG.A11Y.CLEAR_HOLD_MS, async () => {
    const yes = await clearConfirmShow();
    if (!yes) return;
    clearAll();
    ownMusicFiles = []; ownMusicLoaded = false;
    KIT.toast(KIT.s('clear_done'));
    screenStart();
  }, () => KIT.toast(KIT.s('hold_tap_hint')));
  const seriesBtn = byId('btn-serieshome');
  if (seriesBtn) seriesBtn.addEventListener('click', () => {
    if (CONFIG.SERIES_HOME_URL && CONFIG.SERIES_HOME_URL !== '#') window.location.href = CONFIG.SERIES_HOME_URL;
  });

  byId('btn-help').addEventListener('click', () => screenHowTo(0, 'screen-game'));

  byId('btn-end-rest').addEventListener('click', async () => {
    audioFade(CONFIG.TIMING.REST_FADE_MS);
    if (typeof gameHalt === 'function') gameHalt(CONFIG.TIMING.REST_FADE_MS);
    const mood = await moodShow();
    logPendingSession(mood);
    screenRest();
  });

  byId('btn-end-keep').addEventListener('click', async () => {
    const mood = await moodShow();
    logPendingSession(mood);
    if (typeof gameStart === 'function') gameStart();   // starts a new session too
    else { sessionStart(); screenGame(); }
  });

  byId('btn-rest-again').addEventListener('click', () => {
    screenGame();
    if (typeof gameStart === 'function') gameStart({ fresh: true });
  });

  byId('btn-card-rest').addEventListener('click', async () => {
    if (typeof gameRestCardHide === 'function') gameRestCardHide();
    audioFade(CONFIG.TIMING.REST_FADE_MS);
    if (typeof gameHalt === 'function') gameHalt(CONFIG.TIMING.REST_FADE_MS);
    const mood = await moodShow();
    logPendingSession(mood);
    screenRest();
  });

  byId('btn-game-rest').addEventListener('click', async () => {
    const summary = sessionEnd('exit');   // ended early, logged like any other session
    if (summary) pendingSessionSummary = summary;
    if (typeof gameRestCardHide === 'function') gameRestCardHide();
    audioFade(CONFIG.TIMING.REST_FADE_MS);
    if (typeof gameHalt === 'function') gameHalt(CONFIG.TIMING.REST_FADE_MS);
    const mood = await moodShow();
    logPendingSession(mood);
    screenRest();
  });

  byId('btn-card-keep').addEventListener('click', () => {
    // Music never stopped. Log the session that just finished and start counting again.
    if (typeof gameRestCardHide === 'function') gameRestCardHide();
    logPendingSession(null);
    sessionStart();
  });
}

/* Write the session that just ended to the caregiver's list. mood may be null (skipped). */
function logPendingSession(mood){
  const summary = pendingSessionSummary;
  pendingSessionSummary = null;
  if (!summary) return;
  sessionLog({
    date: new Date(summary.startedAt).toISOString(),
    minutes: summary.minutes,
    mood: mood || null,
    endedEarly: !!summary.endedEarly
  });
}

function wireGlobalEvents(){
  const rep = byId('btn-caption-replay');
  if (rep) rep.addEventListener('click', () => { if (captionLast) speechSpeak(captionLast); });
  setInterval(() => { if (isGameActive()) gameJukeboxPulse(); }, 1500);   // keeps the dial glow in step with the music
  window.addEventListener('dgs:speak', (e) => {
    const text = e.detail && e.detail.text;
    if (!text) return;
    const howtoActive = byId('screen-howto') && byId('screen-howto').classList.contains('active');
    if (howtoActive) {
      const line = byId('howto-line');
      if (line) line.textContent = text;
    } else {
      captionsShow(text);
    }
  });
  window.addEventListener('dgs:sessionend', (e) => {
    pendingSessionSummary = e.detail || null;
    const gameActive = byId('screen-game') && byId('screen-game').classList.contains('active');
    if (gameActive && settings.mode === 'jukebox' && typeof gameRestCardShow === 'function') {
      gameRestCardShow();   // Jukebox is meant to run unattended: never stop the music
    } else {
      if (typeof gameHalt === 'function') gameHalt(400);
      screenEnd();
    }
  });
  window.addEventListener('dgs:settingschange', () => { muteRender(); syncSettingsInputs(); if (typeof gameUpdateOpenMusic === 'function') gameUpdateOpenMusic(); });
  window.addEventListener('dgs:levelchange', () => { levelRender(); stationsRender(); syncSettingsInputs(); if (typeof gameUpdateOpenMusic === 'function') gameUpdateOpenMusic(); });
  window.addEventListener('dgs:langchange', () => {
    i18nApply(document);
    const on = id => byId(id) && byId(id).classList.contains('active');
    if (on('screen-start')) screenStart();
    else if (on('screen-care')) screenCare();
    else if (on('screen-howto')) screenHowTo(howtoStep);
    else if (on('screen-end')) screenEnd();
    else if (on('screen-rest')) screenRest();
    const hb = byId('btn-clear');
    if (hb) { hb.querySelector('b').textContent = KIT.s('btn_clear'); hb.querySelector('small').textContent = KIT.s('clear_hint'); }
    document.querySelectorAll('[data-session]').forEach(b => { b.textContent = KIT.s('minutes', { n: b.getAttribute('data-session') }); });
    if (on('screen-settings')) screenSettings();
    levelRender();
      stationsRender();
    sessionsRender();
    ownMusicRender();
    spotifyCardsRender();
    syncSettingsInputs();
    muteRender();
    if (typeof gameUpdateOpenMusic === 'function') gameUpdateOpenMusic();
  });
  window.addEventListener('dgs:novoicenotice', () => toast('notice.novoice', 5000));
  document.addEventListener('pointerdown', () => ghostHide(), true);
  ['pointerdown','keydown'].forEach(evt => {
    document.addEventListener(evt, () => {
      clearTimeout(ghostIdleTimer);
      if (ghostTargetFn && levelGet() !== 'simplest') {
        ghostIdleTimer = setTimeout(() => {
          const t = ghostTargetFn ? ghostTargetFn() : null;
          if (t) ghostShow(t);
        }, (typeof ghostIdleValue === 'number') ? ghostIdleValue : CONFIG.A11Y.GHOST_IDLE_FALLBACK);
      }
    }, true);
  });
}

function screensBoot(){
  if (screensBooted) return;
  screensBooted = true;
  document.querySelectorAll('[data-kit-icon]').forEach(h => h.insertAdjacentHTML('afterbegin', KIT.icon(h.getAttribute('data-kit-icon'))));
  document.querySelectorAll('[data-session]').forEach(b => { b.textContent = KIT.s('minutes', { n: b.getAttribute('data-session') }); });

  muteRender();

    const k = CONFIG.STORAGE.PREFIX + 'firefoxNoticeShown';

if (document.readyState !== 'loading' && settings && settings.level) screensBoot();

/* ==== END SECTION: SCREENS ==== */

/* ==== SECTION: GAME ==== */
let currentStationId = 'opening';
let currentMelodyId = null;
let gameAdvanceTimer = null;
let gameStopped = false;      // the Stop button was pressed; nothing plays until Play or a station is tapped
let restCardTimer = null;
let gamePaused = false;
let gameWired = false;
let ownMusicFiles = [];
let ownMusicLoaded = false;
let ownMusicIdx = 0;
let ownAudioEl = null;
let ownAudioUrl = null;
let radioGhostDone = false;   // the ghost hand points at the radio at most once per session
let idleDimTimer = null;      // 10 quiet minutes in Jukebox → dim the controls
let idleShiftTimer = null;    // then nudge the radio a little every minute
let hiddenWhilePlaying = false;
let embedActive = false;      // true while the station plays through its own player (Spotify, YouTube…)
let embedUrlLoaded = '';      // what the player frame currently holds, so we don't reload it needlessly
let lastSourceKind = '';

/* Where the current station's music comes from right now.
   embed   = a link that plays inside the radio, and the phone is online
   outside = a link that only opens in another app (the station plays its Radio Days tune)
   tune    = no link, or offline: the station's original Radio Days tune
   own     = the family's uploaded files */
/* Firefox (desktop and Android) plays only previews in Spotify's in-page player, even when
   signed in. There, a Spotify station shows a big "Play in Spotify" button instead.
   (Firefox on iPhone uses Safari's engine, so it is not affected.) */
function isFirefoxEngine(){
  const ua = navigator.userAgent || '';
  return /Firefox\//.test(ua) && !/FxiOS/.test(ua);
}

function stationSource(st){
  if (st === 'own') return { kind: 'own' };
  const link = linkFor(st);
  if (!link) return { kind: 'tune', reason: 'nolink' };
  if (!isOnline()) return { kind: 'tune', reason: 'offline', link };
  if (link.outside) return { kind: 'outside', link };
  if (link.service === 'spotify' && isFirefoxEngine()) return { kind: 'external', link };
  return { kind: 'embed', link };
}

function embedShow(link){
  const wrap = byId('embed-wrap'), frame = byId('embed-frame');
  if (!wrap || !frame || !link || !link.embed) return;
  wrap.setAttribute('data-service', link.service);
  frame.title = serviceName(link.service);
  if (embedUrlLoaded !== link.embed) { frame.src = link.embed; embedUrlLoaded = link.embed; }
  wrap.hidden = false;
  embedActive = true;
  const scr = byId('screen-game'); if (scr) scr.classList.add('source-embed');
}

/* Unloading the frame is the one way to stop every service's player. */
function embedHide(){
  const wrap = byId('embed-wrap'), frame = byId('embed-frame');
  if (frame && embedUrlLoaded) { try { frame.src = 'about:blank'; } catch(e){} }
  embedUrlLoaded = '';
  if (wrap) wrap.hidden = true;
  embedActive = false;
  const scr = byId('screen-game'); if (scr) scr.classList.remove('source-embed');
}

/* The line under the song title that says where the music comes from. */
function gameUpdateSource(src){
  const el = byId('source-label');
  if (!el) return;
  src = src || stationSource(currentStationId);
  el.textContent = '';
  const add = (txt, cls) => { const sp = document.createElement('span'); if (cls) sp.className = cls; sp.textContent = txt; el.appendChild(sp); };
  if (src.kind === 'own') { add('♫ ' + ownStationLabel(), 'svc'); return; }
  if (src.kind === 'tune') { add(i18nGet(src.reason === 'offline' ? 'source.offline' : 'source.tune')); return; }
  if (src.kind === 'outside') { add('♫ ' + i18nGet('source.outside'), 'svc'); return; }
  if (src.kind === 'external') { add('♫ Spotify', 'svc'); add(' · ' + i18nGet('source.inapp')); return; }
  add('♫ ' + serviceName(src.link.service), 'svc');
  if (src.link.service === 'spotify' && settings.spotifyPreviews) { add(' · ' + i18nGet('source.previews')); return; }
  add(' · ' + i18nGet(linkIsCustom(currentStationId) ? 'source.yours' : 'source.starter'));
}

function hintShow(text){
  const el = byId('captions');
  if (!el) return;
  clearTimeout(el._timer);
  el.textContent = text || '';
}

/* Volume for the family's own music files. Mute means 0 (not the default). */
function ownMusicVolume(){
  const v = (typeof settings.musicVol === 'number') ? settings.musicVol : CONFIG.AUDIO.MUSIC_VOL_DEFAULT;
  return clamp(Math.min(levelCfg().musicVol, v), 0, 1);
}

function isGameActive(){
  const el = byId('screen-game');
  return !!(el && el.classList.contains('active'));
}
function clearGameAdvance(){ clearTimeout(gameAdvanceTimer); gameAdvanceTimer = null; }
function ownStationLabel(){
  const s = i18nGet('station.own');
  if (s) return s;
  return currentLang === 'en' ? 'My Music' : '我的音乐';
}
function getAvailableStations(){
  const cfg = levelCfg();
  const enabled = settings.stations || [];
  const list = cfg.stations.filter(s => enabled.indexOf(s) !== -1);
  const safe = list.length ? list : cfg.stations.slice();
  if (ownMusicFiles.length && safe.indexOf('own') === -1) safe.push('own');
  return safe;
}
function getStationTunes(stationId){
  if (typeof melodyList !== 'function') return [];
  let all = [];
  try { all = melodyList() || []; } catch(e){ all = []; }
  return all.filter(m => m && m.station === stationId);
}
function loadOwnMusic(){
  if (ownMusicLoaded) return Promise.resolve(ownMusicFiles);
  return idbAll(CONFIG.STORAGE.STORE_AUDIO).then(items => {
    ownMusicFiles = items || [];
    ownMusicLoaded = true;
    if (isGameActive()) gameRenderStations();
    return ownMusicFiles;
  }).catch(() => { ownMusicFiles = []; ownMusicLoaded = true; return []; });
}

function gameStart(opts){
  opts = opts || {};
  audioMelodyStop(0);
  stopOwnMusic();
  clearGameAdvance();
  screenGame();
  gamePaused = false;
  sessionStart();
  loadOwnMusic();
  const available = getAvailableStations();
  if (!available.length) return;
  if (opts.fresh) {
    const want = settings.startStation;
    if (want && available.indexOf(want) !== -1) currentStationId = want;
  }
  if (available.indexOf(currentStationId) === -1) currentStationId = available[0];
  if (currentStationId === 'own') {
    ownMusicIdx = 0;
    currentMelodyId = null;
  } else {
    const tunes = getStationTunes(currentStationId);
    if (tunes.length) {
      if (!currentMelodyId || !tunes.some(t => t.id === currentMelodyId)) currentMelodyId = tunes[0].id;
    } else {
      currentMelodyId = null;
    }
  }
  radioGhostDone = false;
  gameStopped = false;
  gameWireOnce();
  gameRestCardHide();
  gameRenderStations();
  gameRefreshUI();
  gameUpdateNowPlaying();
  gamePlayCurrent();
  idleDimReset();
}

/* Stop the game's timers and the family's own music, but let the synth fade on its own
   (used by Rest, which fades the music over 3 seconds). */
function gameHalt(fadeMs){
  embedHide();
  clearGameAdvance();
  idleDimClear();
  if (ownAudioEl) {
    const el = ownAudioEl, start = el.volume, steps = 12;
    const ms = Math.max(0, fadeMs || 0);
    ownAudioEl = null;
    if (!ms) { try { el.pause(); } catch(e){} }
    else {
      let i = 0;
      const t = setInterval(() => {
        i++;
        try { el.volume = Math.max(0, start * (1 - i / steps)); } catch(e){}
        if (i >= steps) { clearInterval(t); try { el.pause(); } catch(e){} }
      }, ms / steps);
    }
  }
}

/* "Back to the start?" — two big buttons. Stay is the safe, primary one. */
function exitConfirmShow(){
  return new Promise((resolve) => {
    KIT.dialog({
      title: i18nGet('exit.confirm'),
      buttons: [{ label: i18nGet('exit.stay'), primary: true, onClick: () => resolve(false) }, { label: i18nGet('exit.yes'), icon: 'home', onClick: () => resolve(true) }]
    });
  });
}

/* Caregiver chose Back to start: log the session as ended early, go back to the start. */
function gameExit(){
  const summary = sessionEnd('exit');
  if (summary) pendingSessionSummary = summary;   // else: a rest-card session may still be waiting
  logPendingSession(null);
  gameRestCardHide();
  gameStop();
  speechStop();
  captionsClear();
  screenStart();
}

function gameStop(){
  clearGameAdvance();
  audioMelodyStop(300);
  stopOwnMusic();
  embedHide();
  idleDimClear();
  currentMelodyId = null;
  gamePaused = false;
}

function gamePause(){
  gamePaused = true;
  clearGameAdvance();
  if (ownAudioEl) { try { ownAudioEl.pause(); } catch(e){} }
  else audioMelodyStop(200);
  embedHide();   // How to Play is open: stop the station's player too
}

function gameResume(){
  gamePaused = false;
  screenGame();
  gameRefreshUI();
  gamePlayCurrent();
}

function gamePlayCurrent(){
  if (gameStopped) { gameSilenceAll(); gameUpdateSource(); stopRender(); return; }
  playExtShow(false);
  stopOwnMusic();
  clearGameAdvance();
  if (currentStationId === 'own') {
    if (embedActive) { embedHide(); }
    lastSourceKind = 'own';
    gameUpdateSource({ kind: 'own' });
    if (!ownMusicFiles.length) {
      loadOwnMusic().then(() => {
        if (currentStationId === 'own' && isGameActive() && !gamePaused) playOwnMusic();
      });
    } else {
      playOwnMusic();
    }
    gameUpdateNowPlaying();
    return;
  }
  const src = stationSource(currentStationId);
  lastSourceKind = src.kind;
  gameUpdateSource(src);
  if (src.kind === 'external') {
    // Firefox + Spotify: no in-page player. The person (or caregiver) taps the big button.
    audioMelodyStop(300);
    embedHide();
    playExtShow(true);
    gameUpdateNowPlaying();
    hintShow(i18nGet('game.firefoxhint'));
    gameGhostArm();
    return;
  }
  if (src.kind === 'embed') {
    // Real recordings through the service's own player. The player taps ▶ inside it.
    audioMelodyStop(300);
    embedShow(src.link);
    gameUpdateNowPlaying();
    hintShow(i18nGet('game.tapplay'));
    gameGhostArm();
    return;
  }
  const wasEmbed = embedActive;
  embedHide();
  if (wasEmbed) { gameRefreshUI(); }
  if (src.kind === 'outside') captionsShow(i18nGet('game.outsidehint'));
  else if (byId('captions') && byId('captions').textContent === i18nGet('game.tapplay')) captionsClear();
  const melody = (typeof melodyGet === 'function') ? melodyGet(currentMelodyId) : null;
  if (!melody) { gameUpdateNowPlaying(); return; }
  audioMelodyPlay(currentMelodyId);
  clearTimeout(musicLoopTimer);
  musicLoopTimer = null;
  let nominal = (melody && melody.loopMs) ? melody.loopMs : 24000;
  if (typeof melodyDuration === 'function') {
    try {
      const d = melodyDuration(currentMelodyId);
      if (typeof d === 'number' && d > 0) nominal = d;
    } catch(e){}
  }
  const tempo = tempoMultValue > 0 ? tempoMultValue : 1;
  const realMs = Math.round(nominal / tempo) + 400;
  gameAdvanceTimer = setTimeout(() => {
    if (!isGameActive() || gamePaused) return;
    if (currentStationId === 'own') return;
    gameNextTune();
  }, realMs);
}

function gameNextTune(){
  if (!isGameActive() || gamePaused) return;
  if (currentStationId === 'own') return;
  const tunes = getStationTunes(currentStationId);
  if (!tunes.length) return;
  const idx = tunes.findIndex(t => t.id === currentMelodyId);
  const next = tunes[(idx + 1) % tunes.length];
  currentMelodyId = next.id;
  gameUpdateNowPlaying();
  gamePlayCurrent();
}

function playOwnMusic(){
  stopOwnMusic();
  if (!ownMusicFiles.length) return;
  const item = ownMusicFiles[ownMusicIdx % ownMusicFiles.length];
  if (!item || !item.blob) return;
  try {
    ownAudioUrl = URL.createObjectURL(item.blob);
    const el = new Audio(ownAudioUrl);
    el.volume = ownMusicVolume();
    el.onended = () => {
      try { URL.revokeObjectURL(ownAudioUrl); } catch(e){}
      ownAudioEl = null; ownAudioUrl = null; ownMusicIdx++;
      if (currentStationId === 'own' && isGameActive() && !gamePaused) {
        playOwnMusic();
        gameUpdateNowPlaying();
      }
    };
    el.onerror = () => {
      try { URL.revokeObjectURL(ownAudioUrl); } catch(e){}
      ownAudioEl = null; ownAudioUrl = null; ownMusicIdx++;
      if (currentStationId === 'own' && isGameActive() && !gamePaused) {
        playOwnMusic();
        gameUpdateNowPlaying();
      }
    };
    ownAudioEl = el;
    el.play().catch(() => {});
  } catch(e){}
}

function stopOwnMusic(){
  if (ownAudioEl) {
    try { ownAudioEl.pause(); ownAudioEl.currentTime = 0; } catch(e){}
    ownAudioEl = null;
  }
  if (ownAudioUrl) {
    try { URL.revokeObjectURL(ownAudioUrl); } catch(e){}
    ownAudioUrl = null;
  }
}

function gameStationSet(station){
  const available = getAvailableStations();
  if (available.indexOf(station) === -1) return;
  if (gameStopped) {
    gameStopped = false;
    stopRender();
    if (station === currentStationId) { gamePlayCurrent(); return; }
  }
  if (station === currentStationId) return;
  const prev = currentStationId;
  currentStationId = station;
  if (prev === 'own') stopOwnMusic();
  if (station === 'own') {
    clearGameAdvance();
    audioFade(300);
    setTimeout(() => {
      if (currentStationId === 'own' && isGameActive() && !gamePaused) {
        ownMusicIdx = 0;
        gamePlayCurrent();
      }
    }, 400);
    gameRenderStations();
    gameUpdateNowPlaying();
    return;
  }
  const tunes = getStationTunes(station);
  if (!tunes.length) {
    currentMelodyId = null;
    gameRenderStations();
    gameUpdateNowPlaying();
    return;
  }
  currentMelodyId = tunes[0].id;
  gameRenderStations();
  gameUpdateNowPlaying();
  clearGameAdvance();
  if (audioCtx && musicPlaying) {
    audioFade(300);
    setTimeout(() => {
      if (currentStationId === station && isGameActive() && !gamePaused) gamePlayCurrent();
    }, 400);
  } else {
    gamePlayCurrent();
  }
}

function gameRenderStations(){
  const container = byId('station-row');
  if (!container) return;
  container.innerHTML = '';
  container.hidden = (levelGet() === 'simplest');
  const available = getAvailableStations();
  if (!available.length) return;
  container.classList.remove('cols-1', 'cols-3');
  if (available.length === 1) container.classList.add('cols-1');
  else if (available.length === 3) container.classList.add('cols-3');
  if (available.indexOf(currentStationId) === -1) currentStationId = available[0];
  available.forEach(st => {
    const btn = document.createElement('button');
    btn.className = 'station-btn';
    btn.setAttribute('data-station', st);
    btn.setAttribute('aria-pressed', st === currentStationId ? 'true' : 'false');
    const label = st === 'own' ? ownStationLabel() : i18nGet('station.' + st);
    btn.textContent = label || st;
    container.appendChild(btn);
  });
  gameUpdateOpenMusic();
}

function gameUpdateOpenMusic(){
  const btn = byId('btn-open-music');
  if (!btn) return;
  const link = linkFor(currentStationId);
  const show = !!link && levelGet() !== 'simplest';
  btn.hidden = !show;

function gameRefreshUI(){
  gameJukeboxPulse();
  gameGhostArm();
  idleDimReset();
  stopRender();
}

/* ---- Stop / Play (replaces Mute) ----
   Stop silences everything: the Radio Days tune, the family's own music and the
   station's player (Spotify, YouTube…). It is not saved: the next session plays. */
function gameSilenceAll(){
  clearGameAdvance();
  audioMelodyStop(300);
  stopOwnMusic();
  embedHide();
  playExtShow(false);
}
function gameMusicStop(){
  gameStopped = true;
  gameSilenceAll();
  hintShow(i18nGet('game.stopped'));
  ghostIdleReset(null);
  stopRender();
  gameJukeboxPulse();
}
function gameMusicPlay(){
  gameStopped = false;
  captionsClear();
  stopRender();
  gamePlayCurrent();
  gameJukeboxPulse();
}
function stopRender(){
  const btn = byId('btn-stop');
  if (!btn) return;
  btn.setAttribute('aria-pressed', gameStopped ? 'true' : 'false');
  btn.setAttribute('aria-label', i18nGet(gameStopped ? 'game.play' : 'game.stop'));
  const a = btn.querySelector('.ico-stop'), b = btn.querySelector('.ico-play');
  // SVG icons need the attribute itself (they have no .hidden property).
  if (a) a.toggleAttribute('hidden', gameStopped);
  if (b) b.toggleAttribute('hidden', !gameStopped);
}
function playExtShow(on){
  const btn = byId('btn-play-ext');
  if (!btn) return;
  btn.hidden = !on;
  const lbl = byId('play-ext-label');
  if (lbl) lbl.textContent = i18nGet('game.playinspotify');
}

function gameGhostArm(){
  if (typeof ghostIdleReset !== 'function') return;
  if (radioGhostDone || gameStopped) { ghostIdleReset(null); return; }
  ghostIdleReset(() => {
    if (radioGhostDone || !isGameActive()) return null;
    radioGhostDone = true;        // this is its one appearance this session
    const ext = byId('btn-play-ext');
    if (ext && !ext.hidden) return ext;
    return embedActive ? byId('embed-frame') : byId('radio-visual');   // the player's ▶, or the radio
  });
}

/* ---- OLED care: after 10 quiet minutes in Jukebox, dim the controls and drift the radio ---- */
function idleDimClear(){
  clearTimeout(idleDimTimer); idleDimTimer = null;
  clearInterval(idleShiftTimer); idleShiftTimer = null;
  document.body.classList.remove('idle-dim');
  const rv = byId('radio-visual');
  if (rv) rv.style.translate = '';
}
function idleDimReset(){
  idleDimClear();
  if (!isGameActive() || settings.mode !== 'jukebox') return;
  idleDimTimer = setTimeout(() => {
    if (!isGameActive()) return;
    document.body.classList.add('idle-dim');
    let step = 0;
    idleShiftTimer = setInterval(() => {
      const rv = byId('radio-visual'); if (!rv) return;
      const offs = [[0,0],[1,1],[2,0],[1,-1],[0,-2],[-1,-1],[-2,0],[-1,1]];
      const o = offs[++step % offs.length];
      rv.style.translate = o[0] + 'px ' + o[1] + 'px';
    }, CONFIG.TIMING.DIM_SHIFT_MS);
  }, CONFIG.TIMING.DIM_AFTER_MS);
}

function gameUpdateNowPlaying(){
  const el = byId('now-playing');
  if (!el) return;
  if (currentStationId === 'own') {
    if (!ownMusicFiles.length) { el.textContent = ''; return; }
    const item = ownMusicFiles[ownMusicIdx % ownMusicFiles.length];
    el.textContent = item ? (item.name || '') : '';
    return;
  }
  const extBtn = byId('btn-play-ext');
  if (embedActive || (extBtn && !extBtn.hidden)) {   // the service's player shows the song
    el.textContent = i18nGet('station.' + currentStationId); return;
  }
  const m = (typeof melodyGet === 'function') ? melodyGet(currentMelodyId) : null;
  if (!m) { el.textContent = ''; return; }
  const t = m.title || {};
  el.textContent = t[currentLang === 'en' ? 'en' : 'zh'] || t.zh || '';
}





function gameJukeboxPulse(){
  const g = document.querySelector('.radio-glow');
  if (!g) return;
  const playing = !gameStopped && (!!audioNowPlaying() || embedActive ||
    (currentStationId === 'own' && ownAudioEl && !ownAudioEl.paused));
  g.style.opacity = playing ? '1' : '0.6';
  document.body.classList.toggle('rd-playing', playing);
}

function gameOnRadioTap(){
  radioGhostDone = true;
  if (typeof ghostIdleReset === 'function') ghostIdleReset(null);
  if (settings.rhythm && levelGet() !== 'simplest') audioPercHit();
  const rv = byId('radio-visual');
  if (rv && !prefersReducedMotion()) {
    rv.style.transition = 'transform .1s ease-out';
    rv.style.transform = 'scale(0.98)';
    clearTimeout(rv._tapTimer);
    rv._tapTimer = setTimeout(() => { rv.style.transform = ''; }, 120);
  }
}


function gameRestCardShow(){
  const card = byId('rest-card');
  if (!card) return;
  card.hidden = false;
  requestAnimationFrame(() => {
    requestAnimationFrame(() => card.classList.add('show'));
  });
  clearTimeout(restCardTimer);
  restCardTimer = setTimeout(() => {

    gameRestCardHide();
    logPendingSession(null);
    sessionStart();
  }, CONFIG.TIMING.REST_CARD_MS);
}

function gameRestCardHide(){
  clearTimeout(restCardTimer); restCardTimer = null;
  const card = byId('rest-card');
  if (!card) return;
  card.classList.remove('show');
  setTimeout(() => { if (!card.classList.contains('show')) card.hidden = true; }, 500);
}

function gameWireOnce(){
  if (gameWired) return;
  gameWired = true;
  const rv = byId('radio-visual');
  if (rv && typeof illusMount === 'function' && typeof illusRadio === 'function') {
    illusMount(illusRadio, rv);   // the radio itself (was missing in v4.2)
  }
  const exitBtn = byId('btn-exit');
  if (exitBtn) exitBtn.addEventListener('click', async () => {
    if (await exitConfirmShow()) gameExit();
  });
  holdButton(byId('btn-open-music'), CONFIG.A11Y.MIN_HOLD_MS, () => {
    const link = linkFor(currentStationId);
    if (link) linkOpen(link.url);
  });
  const onNet = () => {
    if (!isGameActive() || gamePaused || currentStationId === 'own') return;
    if (stationSource(currentStationId).kind !== lastSourceKind) gamePlayCurrent();
  };
  window.addEventListener('online', onNet);
  window.addEventListener('offline', onNet);
  document.addEventListener('pointerdown', () => {
    if (!isGameActive()) return;
    idleDimReset();
  }, true);
  window.addEventListener('dgs:hidden', (e) => {
    if (!isGameActive()) return;
    hiddenWhilePlaying = !!(e.detail && e.detail.wasPlaying);
    clearGameAdvance();                 // don't start the next tune while the phone is locked
    if (ownAudioEl) { try { ownAudioEl.pause(); } catch(err){} }
  });
  window.addEventListener('dgs:visible', () => {
    if (!isGameActive() || gamePaused || !hiddenWhilePlaying) return;
    hiddenWhilePlaying = false;
    if (currentStationId === 'own' && ownAudioEl) {
      try { ownAudioEl.play().catch(() => {}); } catch(err){}
    } else {
      gamePlayCurrent();               // restarts the tune and its timers
    }
  });
  if (rv) {
    rv.addEventListener('click', gameOnRadioTap);
    rv.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); gameOnRadioTap(); }
    });
  }
  const row = byId('station-row');
  if (row) {
    row.addEventListener('click', (e) => {
      const btn = e.target.closest('[data-station]');
      if (btn) gameStationSet(btn.getAttribute('data-station'));
    });
  }
  const stopBtn = byId('btn-stop');
  if (stopBtn) stopBtn.addEventListener('click', () => {
    if (gameStopped) gameMusicPlay(); else gameMusicStop();
  });
  const extBtn = byId('btn-play-ext');
  if (extBtn) extBtn.addEventListener('click', () => {
    const link = linkFor(currentStationId);
    if (link) linkOpen(link.url);     // a real tap, so the browser allows opening Spotify
  });
  window.addEventListener('dgs:settingschange', () => {
    if (isGameActive()) { gameRefreshUI(); gameUpdateOpenMusic(); gameUpdateSource(); }
    if (ownAudioEl) ownAudioEl.volume = ownMusicVolume();
  });
  window.addEventListener('dgs:levelchange', () => {
    if (!isGameActive()) return;
    const available = getAvailableStations();
    if (available.indexOf(currentStationId) === -1) {
      currentStationId = available[0] || currentStationId;
      const tunes = getStationTunes(currentStationId);
      currentMelodyId = tunes.length ? tunes[0].id : null;
    }
    if (levelCfg().modes.indexOf(settings.mode) === -1) settings.mode = levelCfg().defaultMode;
    gameRenderStations();
    gameRefreshUI();
    gameUpdateNowPlaying();
    gameUpdateOpenMusic();
    gamePlayCurrent();
  });
  window.addEventListener('dgs:langchange', () => {
    if (!isGameActive()) return;
    gameUpdateSource();
    gameRenderStations();
    gameRefreshUI();
    gameUpdateNowPlaying();
    gameUpdateOpenMusic();
  });
}

function illusMount(fn, el){
  if (!el || typeof fn !== 'function') return;
  try {
    const result = fn();
    if (!result) return;
    if (typeof result === 'string' && result.slice(0, 5) === 'data:') {
      el.innerHTML = '';
      const img = document.createElement('img');
      img.src = result;
      img.alt = '';
      img.setAttribute('aria-hidden', 'true');
      img.style.width = '100%';
      img.style.height = 'auto';
      img.style.display = 'block';
      el.appendChild(img);
      return;
    }
    if (typeof result === 'string') { el.innerHTML = result; return; }
    if (typeof Node !== 'undefined' && result instanceof Node) {
      el.innerHTML = '';
      el.appendChild(result);
    }
  } catch(e){}
}

let melodiesCache = null;

function melodiesBuild(){
  if (melodiesCache) return melodiesCache;
  melodiesCache = MELODIES_RAW.map(m => {
    const notes = melodyParse(m.jianpu, { bpm: m.bpm, keyRoot: m.keyRoot });
    const last = notes.length ? notes[notes.length - 1] : null;
    const loopMs = last ? Math.ceil((last.t + last.d + 0.8) * 1000) : 24000;
    return Object.assign({}, m, { notes, loopMs });
  });
  return melodiesCache;
}

function melodyList(){
  return melodiesBuild().map(m => ({
    id: m.id, station: m.station, title: m.title, bpm: m.bpm
  }));
}

function melodyGet(id){
  if (!id) return null;
  const list = melodiesBuild();
  for (let i = 0; i < list.length; i++) {
    if (list[i].id === id) return list[i];
  }
  return null;
}

function melodyDuration(id){
  const m = melodyGet(id);
  return m && typeof m.loopMs === 'number' ? m.loopMs : 24000;
}

function melodyParse(jianpu, opts){
  opts = opts || {};
  const bpm = opts.bpm || 90;
  const keyRoot = opts.keyRoot || 261.63;
  const beatSec = 60 / bpm;
  const majorSemis = { '1': 0, '2': 2, '3': 4, '4': 5, '5': 7, '6': 9, '7': 11 };
  const tokens = String(jianpu || '').split(/\s+/).filter(t => t && t !== '|');
  const notes = [];
  let t = 0;
  for (let i = 0; i < tokens.length; i++) {
    const tok = tokens[i];
    if (tok === '-') {
      if (notes.length) notes[notes.length - 1].d += beatSec;
      t += beatSec;
      continue;
    }
    const m = tok.match(/^(_*)([0-7])([',]*)(-*)(\.?)$/);
    if (!m) continue;
    const underscores = m[1].length;
    const digit       = m[2];
    const octaveMark  = m[3] || '';
    const holds       = m[4].length;
    const dotted      = m[5] === '.';
    let dur = beatSec;
    if (underscores === 1)      dur = beatSec / 2;
    else if (underscores >= 2)  dur = beatSec / 4;
    dur += holds * beatSec;
    if (dotted) dur *= 1.5;
    let octShift = 0;
    if (octaveMark === "'")        octShift = 1;
    else if (octaveMark === "''")  octShift = 2;
    else if (octaveMark === ',')   octShift = -1;
    else if (octaveMark === ',,')  octShift = -2;
    if (digit === '0') {
      t += dur;
      continue;
    }
    const semis = majorSemis[digit] + octShift * 12;
    const freq = keyRoot * Math.pow(2, semis / 12);
    notes.push({ t: t, f: freq, d: dur, v: 0.65 });
    t += dur;
  }
  return notes;
}
/* ==== END SECTION: CONTENT_MELODIES ==== */
